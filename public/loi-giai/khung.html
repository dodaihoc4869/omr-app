trộn acid trong nước đá, dùng bông. Tách cồn: chưng cất."},"k5":{"ten":"Dây chuyền mol","rule":"Quy về mắt xích, nhân hệ số: {C6H10O5} 162 → glucose 180 → <b>2</b>{C2H5OH}; glucose → <b>2</b>Ag, 2 lactic acid; saccharose 342 → <b>4</b>Ag, 4{C2H5OH}; mắt xích → trinitrate 297 (3{HNO3}), triacetate 288. Ra sản phẩm <b>× H</b>, tìm nguyên liệu <b>÷ H</b>; nhiều giai đoạn nhân các H. Rượu a°: V ethanol = V·a/100; m = D·V; lớp bạc V = S·dày. %N = 14x : (162 + 45x), x = số –{ONO2}."},"k6":{"ten":"Năng lượng & quang hợp","rule":"ΔrH = Σ ΔfH(sản phẩm) − Σ ΔfH(chất đầu), nhân hệ số. Quang hợp <b>thu nhiệt</b>, hút {CO2} (chu trình carbon); oxi hoá glucose toả nhiệt. Năng lượng = mức/cm<sup>2</sup>/phút × diện tích × phút × % hữu ích; 1 m<sup>2</sup> = 10<sup>4</sup> cm<sup>2</sup>. n = năng lượng : |ΔH|; <b>1 mắt xích ↔ 1 glucose ↔ 6{CO2} ↔ 6{O2}</b>. Cháy, nổ: cân bằng nguyên tố trước, rồi tính ΔH, mol khí."},"k7":{"ten":"Vật lí & ứng dụng","rule":"Độ ngọt tăng dần: <b>maltose, glucose, saccharose, fructose</b>. Glucose, fructose, saccharose: rắn, tan tốt. Tinh bột không tan nước lạnh, nước nóng thành hồ (keo); cellulose không tan, tan trong nước Schweizer. Cellulose trinitrate: rắn trắng, không tan, cháy không khói (thuốc súng); triacetate: tơ acetate. Saccharose: mía, củ cải đường, thốt nốt; mạch nha: maltose; gạo, ngô, sắn, bánh mì: tinh bột; ethanol: xăng E5."}},"TRAPS_THEM":{"tinhkhu":{"ten":"Nhầm tính khử","hoi":"Chất có –CHO tự do không? Saccharose, tinh bột, cellulose không tráng bạc; fructose tráng bạc nhưng không làm mất màu nước bromine."},"hieusuat":{"ten":"Nhầm chiều hiệu suất","hoi":"Đang tính sản phẩm thu được (nhân H) hay nguyên liệu cần dùng (chia H)? Có nhân, chia H hai lần không?"}},"DANG_KEY":{"CARBOHYDRATE.CAU_TAO.CHON_PHAT_BIEU":"k1","CARBOHYDRATE.CAU_TAO.DEM_DONG_PHAN":"k6","CARBOHYDRATE.CAU_TAO.GOI_TEN":"k3","CARBOHYDRATE.CAU_TAO.NHAN_DANG":"k1","CARBOHYDRATE.CAU_TAO.TINH_KHOI_LUONG":"k6","CARBOHYDRATE.CAU_TAO.TINH_NANG_LUONG":"k6","CARBOHYDRATE.CAU_TAO.TINH_PHAN_TRAM":"k5","CARBOHYDRATE.CAU_TAO.VIET_CTCT":"k1","CARBOHYDRATE.CAU_TAO.XAC_DINH_CTPT":"k3","CARBOHYDRATE.LEN_MEN.CHON_PHAT_BIEU":"k3","CARBOHYDRATE.LEN_MEN.NHAN_DANG":"k3","CARBOHYDRATE.LEN_MEN.SO_SANH":"k3","CARBOHYDRATE.LEN_MEN.TINH_KHOI_LUONG":"k5","CARBOHYDRATE.LEN_MEN.TINH_PHAN_TRAM":"k5","CARBOHYDRATE.LEN_MEN.TINH_THE_TICH":"k5","CARBOHYDRATE.LEN_MEN.XAC_DINH_CHAT":"k3","CARBOHYDRATE.PHAN_UNG_MAU.CHON_PHAT_BIEU":"k4","CARBOHYDRATE.PHAN_UNG_MAU.NHAN_DANG":"k2","CARBOHYDRATE.PHAN_UNG_TRANG_BAC.CHON_PHAT_BIEU":"k2","CARBOHYDRATE.PHAN_UNG_TRANG_BAC.DEM_DONG_PHAN":"k2","CARBOHYDRATE.PHAN_UNG_TRANG_BAC.NHAN_DANG":"k2","CARBOHYDRATE.PHAN_UNG_TRANG_BAC.SO_SANH":"k2","CARBOHYDRATE.PHAN_UNG_TRANG_BAC.TINH_KHOI_LUONG":"k5","CARBOHYDRATE.PHAN_UNG_TRANG_BAC.TINH_PHAN_TRAM":"k5","CARBOHYDRATE.PHAN_UNG_TRANG_BAC.TINH_SO_MOL":"k5","CARBOHYDRATE.THUY_PHAN.CHON_PHAT_BIEU":"k1","CARBOHYDRATE.THUY_PHAN.SO_SANH":"k3","CARBOHYDRATE.THUY_PHAN.TINH_KHOI_LUONG":"k6","CARBOHYDRATE.THUY_PHAN.TINH_NANG_LUONG":"k6","CARBOHYDRATE.THUY_PHAN.XAC_DINH_CHAT":"k3","CARBOHYDRATE.TINH_CHAT_VAT_LI.SO_SANH":"k7","CARBOHYDRATE.UNG_DUNG.CHON_PHAT_BIEU":"k4","CARBOHYDRATE.UNG_DUNG.NHAN_DANG":"k5","CARBOHYDRATE.UNG_DUNG.TINH_KHOI_LUONG":"k5","CARBOHYDRATE.UNG_DUNG.TINH_THE_TICH":"k5"},"daDuyet":"Máy chốt 29/09/2026 (thầy giao máy tự chốt mọi điểm \"cần thầy chốt\")"},"DIEN_PHAN":{"ma":"DIEN_PHAN","chuong":"Pin điện và điện phân","lop":"12","KEYS":{"k1":{"ten":"So E°, đoán chiều","rule":"Phản ứng tự xảy ra khi <b>E° cặp chứa chất oxi hoá > E° cặp chứa chất khử</b> (quy tắc α), sinh ra chất oxi hoá và chất khử yếu hơn. Đếm phản ứng: mỗi phản ứng tìm đúng hai cặp rồi so. Dãy E° tăng: Mg, Al, Zn, Fe, Ni, Sn, Pb, {H2} (0), Cu (0,340), Fe³⁺/Fe²⁺ (0,771), Ag (0,799), {O2}/{H2O}. E° < 0 mới đẩy {H2} khỏi acid loãng."},"k2":{"ten":"Suy dãy từ phản ứng","rule":"Không cho số E°: mỗi phản ứng xảy ra cho <b>hai bất đẳng thức</b>: chất khử vế trái mạnh hơn chất khử vế phải; chất oxi hoá vế trái mạnh hơn chất oxi hoá vế phải. \"Không phản ứng\" thì đảo lại. Ghép thành một dãy. Kim loại khử càng mạnh, ion của nó oxi hoá càng yếu. Kim loại đẩy được {H2} khỏi HCl ⇒ E° âm."},"k3":{"ten":"Pin Galvani","rule":"Cặp E° nhỏ là <b>anode (cực âm)</b>: kim loại bị oxi hoá, tan dần. Cặp E° lớn là <b>cathode (cực dương)</b>: ion bị khử; điện cực Pt không đổi khối lượng. E°pin = E°(cathode) − E°(anode) > 0, vôn kế chỉ số dương. Cầu muối: <b>cation về cathode, anion về anode</b>. Chỉ phản ứng oxi hoá – khử <b>tự xảy ra</b> mới lập được pin; không tự xảy ra thì phải điện phân."},"k4":{"ten":"Phóng điện – nạp điện","rule":"<b>Phóng điện</b> = pin: hoá năng → điện năng, cực âm là anode, bị oxi hoá. <b>Nạp điện</b> = điện phân: điện năng → hoá năng, mọi quá trình đảo chiều. Acquy chì phóng: Pb và {PbO2} đều thành {PbSO4} bám cực ⇒ hai cực cùng nặng thêm (+96 và +64 g/mol), {H2SO4} giảm; chì độc. Li-ion phóng: Li⁺ sang cực dương. Pin nhiên liệu: điện năng ≈ |ΔrH|, nhiên liệu thật = lí thuyết : H."},"k5":{"ten":"Thứ tự điện phân","rule":"Anode nối cực (+), oxi hoá; cathode nối cực (−), khử. <b>Cathode</b>: E° lớn bị khử trước: Ag⁺ > Fe³⁺ (→ Fe²⁺) > Cu²⁺ > H⁺ (acid) > Fe²⁺, Ni²⁺, Zn²⁺ (vẫn trước nước). K⁺, Na⁺, Mg²⁺, Al³⁺ không bị khử, nước bị khử thay: {H2} + OH⁻, pH tăng. <b>Anode trơ</b>: Cl⁻, Br⁻ trước nước; {SO4}²⁻, {NO3}⁻ không bị oxi hoá, nước bị oxi hoá: {O2} + H⁺, pH giảm. Anode bằng Cu thì Cu tan."},"k6":{"ten":"Điện phân sản xuất","rule":"Na, Al chỉ điều chế được bằng <b>điện phân nóng chảy</b>. {Al2O3} (từ bauxite) trộn cryolite: <b>hạ nhiệt độ nóng chảy, tăng dẫn điện</b>; Al ra ở cathode, {O2} ở anode đốt mòn than; không dùng {AlCl3} (thăng hoa). {NaCl} dung dịch <b>có màng ngăn</b> → {NaOH} (cô đặc, kết tinh) + {H2} + {Cl2}; <b>không màng ngăn</b> → {Cl2} gặp {NaOH} ra nước Javel (tẩy màu, diệt khuẩn), gộp: {NaCl} + {H2O} → {NaClO} + {H2}."},"k7":{"ten":"Định luật Faraday","rule":"q = I·t = n(e)·F ⇒ <b>n(chất) = It : (zF)</b>, F = 96500 C/mol (đề cho số khác thì theo đề). t tính bằng <b>giây</b>; 1 A·h = 3600 C. z = số electron một ion, phân tử trao đổi: Ag⁺ 1, Cu²⁺ 2, Al³⁺ 3, {Cl2} 2, {H2} 2, {O2} 4; hợp chất thì lấy độ đổi số oxi hoá. Hiệu suất: sản phẩm thực = lí thuyết × H; điện lượng, thời gian cần = lí thuyết : H."}},"TRAPS_THEM":{"doicuc":{"ten":"Đảo cực","hoi":"Đang là pin hay bình điện phân? Anode luôn oxi hoá; pin: anode là cực âm, điện phân: anode nối cực dương."},"soe":{"ten":"Sai số electron","hoi":"Một ion, phân tử trao đổi mấy electron? Thời gian đã đổi ra giây chưa? Hiệu suất nhân hay chia?"}},"DANG_KEY":{"DIEN_PHAN.THE_DIEN_CUC.CHON_PHAT_BIEU":"k2","DIEN_PHAN.THE_DIEN_CUC.DEM_DONG_PHAN":"k1","DIEN_PHAN.THE_DIEN_CUC.SO_SANH":"k2","DIEN_PHAN.THE_DIEN_CUC.XAC_DINH_CHAT":"k1","DIEN_PHAN.PIN_GALVANI.CHON_PHAT_BIEU":"k3","DIEN_PHAN.PIN_GALVANI.DEM_DONG_PHAN":"k3","DIEN_PHAN.PIN_GALVANI.TINH_KHOI_LUONG":"k7","DIEN_PHAN.PIN_GALVANI.TINH_THE_TICH":"k7","DIEN_PHAN.NGUON_DIEN.CHON_PHAT_BIEU":"k4","DIEN_PHAN.NGUON_DIEN.NHAN_DANG":"k4","DIEN_PHAN.NGUON_DIEN.TINH_KHOI_LUONG":"k4","DIEN_PHAN.DIEN_PHAN_DD.CHON_PHAT_BIEU":"k5","DIEN_PHAN.DIEN_PHAN_DD.SO_SANH":"k5","DIEN_PHAN.DIEN_PHAN_DD.DEM_DONG_PHAN":"k5","DIEN_PHAN.DIEN_PHAN_DD.NHAN_DANG":"k5","DIEN_PHAN.DIEN_PHAN_DD.XAC_DINH_SO_OXI_HOA":"k7","DIEN_PHAN.DIEN_PHAN_DD.TINH_THE_TICH":"k6","DIEN_PHAN.DIEN_PHAN_NC.CHON_PHAT_BIEU":"k6","DIEN_PHAN.MA_TINH_LUYEN.XAC_DINH_DIEN_TICH":"k7"},"daDuyet":"Máy chốt 29/09/2026 (thầy giao máy tự chốt mọi điểm \"cần thầy chốt\")"},"ESTER":{"ma":"ESTER","chuong":"Ester – lipid","lop":"12","KEYS":{"k1":{"ten":"Tách chất","rule":"Hai lớp → <b>chiết</b> (chất có D nhỏ nằm trên). Một lớp → so nhiệt độ sôi: chênh nhiều thì <b>chưng cất thường</b>, chênh ít thì <b>chưng cất phân đoạn</b>, gần trùng thì phải đổi cách. Chất rắn lẫn tạp → <b>kết tinh lại</b>."},"k2":{"ten":"An toàn & dụng cụ","rule":"Chất dễ cháy, sôi thấp: <b>không lửa trần</b>, dùng nước nóng. Nguồn nhiệt phải <b>nóng hơn nhiệt độ sôi</b>. Sinh hàn: <b>nước vào thấp, ra cao</b>. Đá bọt chống sôi bùng. Đun lâu mà không mất chất: <b>hồi lưu</b>."},"k3":{"ten":"Vai trò hoá chất","rule":"Với mỗi chất, hỏi: <b>thêm vào để làm gì</b>, và <b>thay bằng chất khác có phá sản phẩm không</b>. {H2SO4} đặc: xúc tác + hút nước. {Na2CO3}: trung hoà acid. {NaOH} dư: thuỷ phân mất ester. {NaCl} bão hoà: tách lớp gọn. Chất làm khan: hút nước."},"k4":{"ten":"Con số","rule":"Hiệu suất: <b>V → m → n → chất thiếu → lí thuyết → × H → × (1 − hao hụt)</b>. Bảng số liệu: \"tăng nhiều nhất\" là <b>hiệu số lớn nhất</b>, \"tối ưu\" là <b>đỉnh</b>, \"càng… càng\" phải đúng trên <b>cả dãy</b>."},"k5":{"ten":"Soi phân tử","rule":"Đếm từng nhóm rồi cộng. {NaOH}: ester thường 1, ester của phenol 2, –COOH 1, –OH phenol 1. {Br2}: C=C 1, vòng phenol thế vào vị trí o/p còn trống. {H2}: C=C 1, vòng 3, C=O của –COO– không cộng. Ester hoá: <b>acid mất –OH, alcohol mất H</b>."},"k6":{"ten":"Tính chất vật lí","rule":"Nổi hay chìm do <b>khối lượng riêng</b>; tan hay không do <b>phân cực, liên kết hydrogen</b>. Mạch dài → nóng chảy cao; thêm C=C cis → gấp khúc → nóng chảy thấp. Ester không có liên kết hydrogen giữa các phân tử nên sôi thấp hơn acid."}},"TRAPS_THEM":{},"LAB_PRESETS":{"k1":["q1","q6","q7","aspirin","etoh","dcm"],"k2":["q1c","q1d","q6d","hoiluu","sai3"],"k3":["naoh","kettinh","h3po4"],"k4":["iaac","aspirin","cin","etac","bang-q7","bang-p3"],"k5":["msal-naoh","sal-br","msal-h2","sal-pi","msal-chuc","cin-geo","cin-naoh","phac-naoh","builder-cin","builder-acr","gh","ir"],"k6":["tan","fat-18","fat-ol-li","fat-16","fat-pal"]},"DANG_KEY":{},"daDuyet":"thầy dùng từ 28/09 (Phòng thí nghiệm Ester)"},"HOP_CHAT_N":{"ma":"HOP_CHAT_N","chuong":"Hợp chất chứa nitrogen","lop":"12","KEYS":{"k1":{"ten":"Bậc, tên, phổ IR","rule":"Bậc amine = <b>số gốc hydrocarbon gắn vào N</b>, không xét bậc carbon: {RNH2} bậc I, {R2NH} bậc II, {R3N} bậc III. Tên thay thế: mạch chính chứa C gắn N + vị trí + amine, gốc trên N ghi <i>N-</i>: {CH3CH2CH2NHCH3} là N-methylpropan-1-amine. Amino acid: thường alanine, bán hệ thống α-aminopropionic acid, thay thế 2-aminopropanoic acid. IR: N–H ở <b>3500–3300 cm<sup>−1</sup></b>; bậc III không có."},"k2":{"ten":"Sôi, tan, trạng thái","rule":"Sôi giảm dần khi M xấp xỉ: <b>acid, alcohol, amine</b> (liên kết hydrogen O–H mạnh hơn N–H); cùng loại, M lớn sôi cao; bậc III không có N–H nên sôi thấp. <b>Khí</b> ở điều kiện thường: methylamine, dimethylamine, trimethylamine, ethylamine. Aniline lỏng, <b>hầu như không tan</b>, nặng hơn nước (vẩn đục, lắng đáy). Amino acid rắn, nóng chảy cao, dễ tan trong nước (ion lưỡng cực)."},"k3":{"ten":"Amine gặp thuốc thử","rule":"Base yếu (⇌), mạnh dần: <b>{C6H5NH2}, {NH3}, {CH3NH2}, {(CH3)2NH}</b>; trimethylamine trong nước yếu hơn hai amine no này (vẫn mạnh hơn {NH3}). Amine no: quỳ hoá xanh, {FeCl3} → {Fe(OH)3} nâu đỏ; aniline không đổi màu quỳ. {HCl}: tạo muối tan; muối + {NaOH} → amine tách ra (aniline vẩn đục lại); {RNH3}<sup>+</sup> là acid Brønsted. {NaOH}: không phản ứng. {Br2}: chỉ aniline, kết tủa trắng. {HNO2}: bậc I no → alcohol + {N2}; aniline (0–5 °C) → muối diazonium; bậc II không ra {N2}."},"k4":{"ten":"Điều chế & con số","rule":"{NH3} + {CH3Br} thế <b>lần lượt từng H</b> → bậc I, II, III (không nối dài mạch). Nitrobenzene + {Fe/HCl} → {C6H5NH3Cl}, thêm {NaOH} → aniline. Số oxi hoá N: –{NO2} +3, {HNO2} +3, {N2} 0, amine −3 ⇒ nitrobenzene là <b>chất oxi hoá</b>; amine gặp {HNO2} là <b>chất khử</b>. Hiệu suất: V × D → m → n (bảo toàn N); tìm nguyên liệu <b>÷ H</b>. pH: x<sup>2</sup> : (C − x) = K<sub>b</sub>, x = [OH<sup>−</sup>], pH = 14 − pOH."},"k5":{"ten":"Amino acid lưỡng tính","rule":"Có –{NH2} và –{COOH} → phản ứng cả acid lẫn base. <b>{HCl} dư</b>: –{NH2} → –{NH3Cl}, –{COONa} → –{COOH}. <b>{NaOH} dư</b>: –{NH3Cl} → –{NH2}; –{COOH} → –{COONa} (M + 22 mỗi nhóm); –{COOR} → –{COONa} + ROH. Alcohol/{HCl} → muối ester. Dư –{COOH} hay có –{NH3Cl}: acid; dư –{NH2}: base. Điện di: pH thấp, cation về <b>cực âm</b>; pH cao, anion về <b>cực dương</b>; pH ≈ pI đứng yên. M: Gly 75, Ala 89, Glu 147 (hai –{COOH})."},"k6":{"ten":"Peptide: đếm & tính","rule":"n gốc → <b>n − 1</b> liên kết peptide, mất n − 1 {H2O}; gốc kiểu Gly, Ala thì có n N, <b>n + 1</b> O. Số trật tự = số hoán vị (3 Gly + 1 Ala → 4). Trong {NaOH}: n({NaOH}) = tổng –{COOH} các gốc (Glu tính 2); n({H2O}) = n(peptide), +1 mỗi Glu; rồi bảo toàn khối lượng. Thuỷ phân một phần: ghép các đoạn chồng khớp. Màu biuret <b>từ tripeptide</b>; dipeptide không."},"k7":{"ten":"Protein & tên phản ứng","rule":"Vai trò: cấu trúc (collagen, keratin), xúc tác (enzyme: chọn lọc cao, tăng tốc độ phản ứng sinh hoá), vận chuyển (hemoglobin), điều hoà (insulin), bảo vệ (kháng thể). <b>Đông tụ</b> khi đun, gặp acid, base, muối kim loại nặng; {HNO3} đặc → vàng. Tên phản ứng: cắt –CO–NH– là <b>thuỷ phân</b>; + alcohol/{HCl} là <b>ester hoá</b>; amino acid nối mạch, tách {H2O} là <b>trùng ngưng</b>; {Cu(OH)2}/kiềm → tím là <b>màu biuret</b>."}},"TRAPS_THEM":{"bacamine":{"ten":"Nhầm bậc amine","hoi":"Đếm số gốc hydrocarbon gắn vào N. Carbon mang nhóm –NH2 bậc mấy không quyết định bậc amine."},"nhomnhanh":{"ten":"Sót nhóm mạch nhánh","hoi":"Glu có hai –COOH, Lys có hai –NH2. Khi đếm NaOH, HCl, số O, đã tính nhóm ở mạch nhánh chưa?"}},"DANG_KEY":{"HOP_CHAT_N.AMINE_CAU_TAO.CHON_PHAT_BIEU":"k1","HOP_CHAT_N.AMINE_CAU_TAO.SO_SANH":"k2","HOP_CHAT_N.AMINE_CAU_TAO.TINH_HANG_SO":"k4","HOP_CHAT_N.AMINE_CAU_TAO.TINH_HIEU_SUAT":"k4","HOP_CHAT_N.AMINE_DIEU_CHE.CHON_PHAT_BIEU":"k4","HOP_CHAT_N.AMINE_TINH_BASE.NHAN_DANG":"k3","HOP_CHAT_N.AMINE_TINH_BASE.SO_SANH":"k3","HOP_CHAT_N.AMINE_TINH_BASE.VIET_CTCT":"k5","HOP_CHAT_N.AMINO_ACID.CHON_PHAT_BIEU":"k5","HOP_CHAT_N.AMINO_ACID.SO_SANH":"k1","HOP_CHAT_N.AMINO_ACID.VIET_CTCT":"k5","HOP_CHAT_N.AMINO_ACID.XAC_DINH_CHAT":"k5","HOP_CHAT_N.AMINO_ACID.XAC_DINH_CTPT":"k5","HOP_CHAT_N.PEPTIDE.CHON_PHAT_BIEU":"k6","HOP_CHAT_N.PEPTIDE.TINH_KHOI_LUONG":"k6","HOP_CHAT_N.PEPTIDE.TINH_NONG_DO":"k6","HOP_CHAT_N.PROTEIN.CHON_PHAT_BIEU":"k7","HOP_CHAT_N.PROTEIN.DEM_DONG_PHAN":"k7","HOP_CHAT_N.PROTEIN.SO_SANH":"k7"},"daDuyet":"Máy chốt 29/09/2026 (thầy giao máy tự chốt mọi điểm \"cần thầy chốt\")"},"KIM_LOAI":{"ma":"KIM_LOAI","chuong":"Đại cương kim loại","lop":"12","KEYS":{"k1":{"ten":"Liên kết kim loại","rule":"Nút mạng là <b>cation kim loại</b>, giữa là <b>electron hoá trị tự do</b>, hút nhau bằng lực tĩnh điện. So với liên kết ion ({NaCl}): giống ở tĩnh điện và cation kim loại, khác ở phần âm (electron tự do ↔ anion cố định). Electron tự do gây dẫn điện, dẫn nhiệt, ánh kim, dẻo. Kim loại có 1–3 electron lớp ngoài: Na 1, Mg 2, Al 3 (3s²3p¹)."},"k2":{"ten":"Dãy thế điện cực","rule":"E° càng nhỏ, kim loại <b>khử càng mạnh</b>, ion oxi hoá càng yếu. Dãy E° tăng: K, Na, Mg, Al, Zn, Fe, Ni, Sn, Pb, {H2}, Cu, Fe²⁺ (cặp Fe³⁺/Fe²⁺), Ag, Au. Chất khử cặp trước + chất oxi hoá cặp sau → phản ứng. E° < 0 khử được H⁺ acid loãng; E° < −0,41 V khử được nước (xét theo thế); Cu chỉ tan trong acid loãng khi có {O2}."},"k3":{"ten":"Sản phẩm kim loại","rule":"Kim loại luôn <b>bị oxi hoá</b> (số oxi hoá tăng từ 0); chất có số oxi hoá giảm mới là chất oxi hoá. Fe gặp H⁺, Cu²⁺, Fe³⁺ chỉ lên <b>Fe²⁺</b>; Fe³⁺ gặp Cu chỉ về Fe²⁺, không ra Fe. {H2SO4} đặc, {HNO3} hoà tan cả Cu, sinh {SO2}, NO…, không sinh {H2}. Kim loại mạnh đẩy kim loại yếu khỏi muối (trừ Na, K, Ca, Ba: gặp nước trước)."},"k4":{"ten":"Ăn mòn điện hoá","rule":"<b>Đủ ba điều kiện</b>: hai điện cực khác chất (Fe – Cu, Fe – C, kim loại bám lên), tiếp xúc nhau, cùng chạm hơi ẩm hay chất điện li. Thiếu một: <b>ăn mòn hoá học</b>. Kim loại E° nhỏ hơn là anode, bị ăn mòn. Cực kia: acid ra {H2}; trung tính chỉ {O2} bị khử. Gỉ: {Fe2O3}·n{H2O}. Chống: Zn, Mg hi sinh; phủ dầu, sơn. Al có màng oxide bền."},"k5":{"ten":"Chọn cách điều chế","rule":"K … Al: <b>điện phân nóng chảy</b>. <b>Nhiệt luyện</b> = C, CO, {H2}, Al, Si khử oxide ở nhiệt độ cao (Zn … Cu; cả Mg bằng Si). <b>Thuỷ luyện</b> = hoà tan rồi cho kim loại mạnh hơn đẩy ra (Zn đẩy Au). Quặng sulfide đốt thành oxide trước, sinh {SO2} độc. Chỉ bước biến ion thành kim loại là oxi hoá – khử. Tái chế tốn ít năng lượng hơn."},"k6":{"ten":"Tính theo chuỗi","rule":"Chất chính = m × %, đổi mol (tấn → tấn·mol). <b>Bảo toàn nguyên tố</b> hoặc cộng các phương trình: {Fe2O3} → 2Fe, {Cu2S} → 2Cu, 2{KCN} → Au. Sản phẩm <b>× H</b>, nguyên liệu <b>: H</b>, rồi chia % kim loại trong sản phẩm. Rắn đổi khối lượng: độ chênh : Δm của 1 mol. Có dòng điện: It : F = n(e) = z·n(kim loại), F = 96500. ΔrH° = ΣΔfH°(sản phẩm) − ΣΔfH°(chất đầu), âm là toả nhiệt, tính theo mol."},"k7":{"ten":"Hợp kim","rule":"Hợp kim thường cứng hơn, nóng chảy thấp hơn, dẫn điện kém hơn kim loại thành phần. Đo hàm lượng: chọn thuốc thử <b>hoà tan hết một kim loại, không đụng kim loại kia</b> (Al tan trong kiềm; Cu tan trong {HNO3}, Fe³⁺, {H2SO4} đặc, Au thì không) và <b>không đẩy kim loại mới bám vào</b> (loại Ag⁺, Au³⁺). % = m rắn còn lại : m mẫu."}},"TRAPS_THEM":{"nacoxihoa":{"ten":"Nhầm nấc oxi hoá","hoi":"Chất oxi hoá này đủ mạnh đưa Fe lên Fe³⁺ không? Fe³⁺ gặp Cu chỉ về Fe²⁺, không ra Fe."},"haidiencuc":{"ten":"Nhầm kiểu ăn mòn","hoi":"Đủ hai điện cực khác chất, tiếp xúc nhau, cùng trong dung dịch điện li chưa? Thiếu một là ăn mòn hoá học."}},"DANG_KEY":{"KIM_LOAI.LIEN_KET_KIM_LOAI.NHAN_DANG":"k1","KIM_LOAI.TINH_KHU.NHAN_DANG":"k2","KIM_LOAI.TINH_KHU.CHON_PHAT_BIEU":"k2","KIM_LOAI.AN_MON.CHON_PHAT_BIEU":"k4","KIM_LOAI.AN_MON.NHAN_DANG":"k4","KIM_LOAI.AN_MON.SO_SANH":"k4","KIM_LOAI.DIEU_CHE.CHON_PHAT_BIEU":"k5","KIM_LOAI.DIEU_CHE.TINH_KHOI_LUONG":"k6","KIM_LOAI.UNG_DUNG.TINH_KHOI_LUONG":"k6","KIM_LOAI.HOP_KIM.CHON_PHAT_BIEU":"k7","KIM_LOAI.HOP_KIM.TINH_PHAN_TRAM":"k7","KIM_LOAI.HOP_KIM.DEM_DONG_PHAN":"k7"},"daDuyet":"Máy chốt 29/09/2026 (thầy giao máy tự chốt mọi điểm \"cần thầy chốt\")"},"KIM_LOAI_IA_IIA":{"ma":"KIM_LOAI_IA_IIA","chuong":"Kim loại nhóm IA, IIA","lop":"12","KEYS":{"k1":{"ten":"Độ mạnh kim loại","rule":"Tính khử tăng <b>xuống dưới nhóm</b> (Li → Cs, Be → Ba). Ở nhiệt độ thường chỉ <b>nhóm IA và Ca, Sr, Ba</b> tác dụng mạnh với nước → hydroxide + {H2}, phenolphthalein hoá hồng, là dấu hiệu kim loại mạnh; <b>Mg</b> chỉ phản ứng chậm với nước nóng, <b>Be</b> không phản ứng. Kim loại kiềm mềm, nhẹ, nóng chảy thấp (giảm Li → Cs), bảo quản trong <b>dầu hoả, khí hiếm, chân không</b>."},"k2":{"ten":"Màu ngọn lửa","rule":"Đốt hợp chất trên ngọn lửa đèn khí: màu do <b>ion kim loại</b>, gốc acid không ảnh hưởng. <b>Li đỏ tía, Na vàng, K tím nhạt, Ca đỏ cam, Sr đỏ son, Ba lục ánh vàng</b>; Be, Mg không có màu đặc trưng. Chốt kim loại bằng màu trước, rồi chốt hợp chất bằng phản ứng đi kèm (nhiệt phân, tác dụng acid hay base)."},"k3":{"ten":"Vòng carbonate","rule":"Trục {CO3}<sup>2−</sup> ⇌ {HCO3}<sup>−</sup>: thêm {CO2} + {H2O} → hydrogencarbonate (tan); thêm OH<sup>−</sup> hoặc đun nóng → carbonate; thêm acid → {CO2}. Nhiệt phân: {NaHCO3} → {Na2CO3} (rắn giảm 62/168 = 36,9%); {Na2CO3}, {K2CO3} bền nhiệt; carbonate, nitrate nhóm IIA → oxide, bền dần từ Mg → Ba; nitrate nhóm IA → nitrite + {O2}. Sơ đồ chuyển hoá: điền chất rồi <b>viết từng mũi tên</b>; một mũi tên không có phản ứng thật là loại."},"k4":{"ten":"Độ tan nhóm IIA","rule":"Đi xuống nhóm IIA: hydroxide <b>tan tăng</b> ({Mg(OH)2} không tan, {Ca(OH)2} ít tan, {Ba(OH)2} tan tốt), sulfate <b>tan giảm</b> ({MgSO4} tan, {CaSO4} ít tan, {BaSO4} không tan, dùng cản quang). Carbonate IIA không tan. Đục hay trong: so <b>lượng tạo ra với độ tan</b>. Thạch cao: sống {CaSO4.2H2O}, nung {CaSO4.0,5H2O} (bó bột, đúc tượng), khan {CaSO4}."},"k5":{"ten":"Nước cứng","rule":"Ca<sup>2+</sup>, Mg<sup>2+</sup> đi với {HCO3}<sup>−</sup> → <b>tạm thời</b>; với Cl<sup>−</sup>, {SO4}<sup>2−</sup> → <b>vĩnh cửu</b>. Đun sôi, {Ca(OH)2} vừa đủ chỉ trị tạm thời; carbonate, phosphate tan, nhựa trao đổi ion trị mọi loại; {NaCl}, {HCl} không trị được. Tác hại: tốn xà phòng, đóng cặn ống, nồi hơi, thức ăn lâu chín. Tính: <b>2 × n(M<sup>2+</sup>) = tổng điện tích âm</b>; đun sôi 2{HCO3}<sup>−</sup> kéo 1 M<sup>2+</sup>; nhựa: 1 M<sup>2+</sup> đổi 2 gốc {SO3X}."},"k6":{"ten":"Nhiệt phản ứng","rule":"Δ<sub>r</sub>H° = ΣΔ<sub>f</sub>H°(sản phẩm) − ΣΔ<sub>f</sub>H°(chất đầu), <b>nhân đủ hệ số</b>, đơn chất bền bằng 0. Δ<sub>r</sub>H° <b>dương</b> là thu nhiệt: nhiệt phân carbonate, nitrate, nung thạch cao, Pidgeon. Δ<sub>r</sub>H° <b>âm</b> là toả nhiệt: kim loại + nước hoặc phi kim, tôi vôi {CaO} + {H2O}. Nhiệt cho m gam: <b>Q = (n chất : hệ số của nó) × Δ<sub>r</sub>H°</b>; đổi kg → g, dùng M của cả tinh thể ngậm nước."},"k7":{"ten":"Sản xuất & tách","rule":"IA, IIA khử mạnh → điều chế bằng <b>điện phân nóng chảy</b> muối chloride; điện phân dung dịch {NaCl} (màng ngăn) chỉ ra {NaOH}, {H2}, {Cl2}. Ngoại lệ Pidgeon: Si khử {MgO} (không khử {CaO}), là <b>nhiệt luyện</b>. Solvay: {NaHCO3} kết tủa vì <b>ít tan</b>, không vì acid mạnh; nung ra soda; thu hồi {NH3}, {CO2}. Tách KCl khỏi NaCl: <b>kết tinh</b>. Bảo toàn kim loại từ quặng, × H."}},"TRAPS_THEM":{"ngoaile":{"ten":"Ngoại lệ trong nhóm","hoi":"Chất nêu ra có phải Be, Mg, Li hoặc hợp chất của chúng không? Quy luật chung của nhóm có áp được cho nó không?"},"luongdu":{"ten":"Vừa đủ hay dư","hoi":"Chất thêm vào vừa đủ hay dư? Tính lượng tạo ra, so với độ tan hoặc lượng ion còn lại rồi mới kết luận."}},"DANG_KEY":{"KIM_LOAI_IA_IIA.TINH_CHAT_KIM_LOAI.SO_SANH":"k1","KIM_LOAI_IA_IIA.TINH_CHAT_KIM_LOAI.NHAN_DANG":"k1","KIM_LOAI_IA_IIA.MAU_NGON_LUA.NHAN_DANG":"k2","KIM_LOAI_IA_IIA.HOP_CHAT.NHAN_DANG":"k3","KIM_LOAI_IA_IIA.HOP_CHAT.VIET_CTCT":"k3","KIM_LOAI_IA_IIA.HOP_CHAT.CHON_PHAT_BIEU":"k4","KIM_LOAI_IA_IIA.NUOC_CUNG.CHON_PHAT_BIEU":"k5","KIM_LOAI_IA_IIA.NUOC_CUNG.NHAN_DANG":"k5","KIM_LOAI_IA_IIA.NUOC_CUNG.TINH_SO_MOL":"k5","KIM_LOAI_IA_IIA.NUOC_CUNG.TINH_KHOI_LUONG":"k5","KIM_LOAI_IA_IIA.HOP_CHAT.TINH_NANG_LUONG":"k6","KIM_LOAI_IA_IIA.HOP_CHAT.DEM_DONG_PHAN":"k6","KIM_LOAI_IA_IIA.SAN_XUAT.CHON_PHAT_BIEU":"k7"},"daDuyet":"Máy chốt 29/09/2026 (thầy giao máy tự chốt mọi điểm \"cần thầy chốt\")"},"PHUC_CHAT":{"ma":"PHUC_CHAT","chuong":"Sơ lược dãy kim loại chuyển tiếp thứ nhất và phức chất","lop":"12","KEYS":{"k1":{"ten":"Kim loại chuyển tiếp","rule":"Dãy thứ nhất Sc → Cu: [Ar]3d<sup>n</sup>4s<sup>2</sup>, ngoại lệ <b>Cr 3d<sup>5</sup>4s<sup>1</sup>, Cu 3d<sup>10</sup>4s<sup>1</sup></b>. Tạo ion: bỏ electron <b>4s trước</b> (Fe<sup>2+</sup> 3d<sup>6</sup>, Fe<sup>3+</sup> 3d<sup>5</sup>). Nhiều electron hoá trị → liên kết kim loại mạnh: <b>cứng, khó nóng chảy, khối lượng riêng lớn</b> (Sc, Ti nhẹ), dẫn điện, dẫn nhiệt tốt. Nhiều số oxi hoá: Fe +2, +3; Cu +1, +2; Cr +3, +6; Mn +2 đến +7."},"k2":{"ten":"Màu & nhận biết ion","rule":"Ion có 3d chưa đầy thường có màu: Fe<sup>2+</sup> lục nhạt, Fe<sup>3+</sup> vàng nâu, Cu<sup>2+</sup> xanh lam, Co<sup>2+</sup> hồng, Ni<sup>2+</sup> xanh lục; 3d<sup>0</sup>, 3d<sup>10</sup> (Sc<sup>3+</sup>, Zn<sup>2+</sup>) không màu. {MnO4}<sup>−</sup> tím, {Cr2O7}<sup>2−</sup> da cam, {CrO4}<sup>2−</sup> vàng. Nhận biết bằng OH<sup>−</sup>: {Fe(OH)3} <b>nâu đỏ</b>; {Fe(OH)2} <b>trắng xanh</b>, để ngoài không khí hoá nâu đỏ; {Cu(OH)2} <b>xanh lam</b>."},"k3":{"ten":"Chuẩn độ oxi hoá – khử","rule":"Chuẩn độ Fe<sup>2+</sup>: acid hoá bằng <b>{H2SO4}</b>, không dùng {HCl}, {HNO3}. {KMnO4} tự chỉ thị: dư một giọt là <b>hồng nhạt bền</b>. Tỉ lệ lấy từ electron: <b>1 {MnO4}<sup>−</sup> : 5 Fe<sup>2+</sup></b>; <b>1 {Cr2O7}<sup>2−</sup> : 6 Fe<sup>2+</sup></b>. Tổng electron nhường = nhận ({NO3}<sup>−</sup> → {NH3} nhận 8). Hai thí nghiệm song song: lượng chất chuẩn <b>chênh lệch</b> chính là phần chất cần tìm đã tiêu thụ."},"k4":{"ten":"Con số quy trình","rule":"Đổi đơn vị trước: mg/L × L = mg; 1 m<sup>3</sup> = 1000 L. Chuẩn độ một phần mẫu thì <b>nhân ngược</b> theo tỉ lệ (15 mL trong 60 mL → × 4). <b>Bảo toàn nguyên tố</b> xuyên chuỗi: {FeCr2O4} có 2 Cr → 1 {K2Cr2O7}; Ca của vôi đi hết vào {CaSO4} → n({Ca(OH)2}) = n({SO4}<sup>2−</sup>). Độ tinh khiết = m chất : m mẫu; hiệu suất = thực tế (đã nhân độ tinh khiết) : lí thuyết."},"k5":{"ten":"Mổ phức chất","rule":"Trong [ ]: <b>nguyên tử trung tâm</b> nhận cặp electron, <b>phối tử</b> ({H2O}, {NH3}, Cl<sup>−</sup>, OH<sup>−</sup>, CN<sup>−</sup>) cho cặp electron: liên kết cho – nhận, mỗi phối tử một liên kết σ. <b>Điện tích phức = số oxi hoá trung tâm + tổng điện tích phối tử</b> (phân tử 0, anion −1). 6 phối tử → bát diện; 4 → tứ diện hoặc vuông phẳng; 2 → thẳng. Al<sup>3+</sup> (không chuyển tiếp) cũng tạo phức aqua."},"k6":{"ten":"Thế phối tử & màu","rule":"Phối tử mới đẩy {H2O} ra → đổi màu, có thể đổi hình học. {[Cu(OH2)6]}<sup>2+</sup> xanh + {NH3} → {[Cu(NH3)4(OH2)2]}<sup>2+</sup> <b>xanh lam đậm</b> ({Cu(OH)2} cũng tan trong {NH3} dư). {[Co(OH2)6]}<sup>2+</sup> hồng + 4Cl<sup>−</sup> ⇌ {[CoCl4]}<sup>2−</sup> xanh. Phản ứng đi về phía <b>phức bền hơn</b>. Thêm phối tử mới → chiều thuận; pha loãng (thêm nước) hoặc kéo phối tử ra ({AgNO3} tạo AgCl trắng) → chiều nghịch."},"k7":{"ten":"Phức aqua là acid","rule":"Hoà tan muối: ion kim loại phân li rồi tạo <b>phức aqua</b> {[M(OH2)6]}<sup>n+</sup>. Phức aqua của Fe<sup>3+</sup>, Al<sup>3+</sup> nhường H<sup>+</sup>: {[M(OH2)6]}<sup>3+</sup> ⇌ {[M(OH)(OH2)5]}<sup>2+</sup> + H<sup>+</sup>, nên là <b>acid Brønsted</b>, dung dịch có môi trường acid. Số oxi hoá M <b>không đổi</b>, vẫn 6 phối tử. Thêm acid → chiều nghịch; thêm base → chiều thuận, đến hydroxide kết tủa keo (phèn làm trong nước)."}},"TRAPS_THEM":{"chieucb":{"ten":"Chiều cân bằng","hoi":"Chất thêm vào hay bị lấy đi nằm ở vế nào? Pha loãng là thêm nước; nước nằm ở vế nào?"},"phanmau":{"ten":"Quên phần mẫu","hoi":"Số liệu chuẩn độ là của phần mẫu nào? Đã nhân lại theo toàn bộ dung dịch và toàn bộ chất rắn chưa?"}},"DANG_KEY":{"PHUC_CHAT.KIM_LOAI_CHUYEN_TIEP.NHAN_DANG":"k1","PHUC_CHAT.KIM_LOAI_CHUYEN_TIEP.TINH_KHOI_LUONG":"k4","PHUC_CHAT.CHUAN_DO.TINH_KHOI_LUONG":"k3","PHUC_CHAT.CHUAN_DO.TINH_HIEU_SUAT":"k3","PHUC_CHAT.CAU_TAO_PHUC.CHON_PHAT_BIEU":"k5","PHUC_CHAT.MAU_SAC.CHON_PHAT_BIEU":"k6"},"daDuyet":"Máy chốt 29/09/2026 (thầy giao máy tự chốt mọi điểm \"cần thầy chốt\")"},"POLYMER":{"ma":"POLYMER","chuong":"Polymer","lop":"12","KEYS":{"k1":{"ten":"Gọi tên polymer","rule":"Tên = <b>poly + tên monomer</b>, tên nhiều chữ đặt trong ngoặc: poly(vinyl chloride). Nylon-n: đếm <b>tổng C trong mắt xích</b>, kể cả C của –CO–: –NH–{(CH2)5}–CO– có 6 C → nylon-6 (capron); nylon-6,6 đi từ hai monomer 6 C. Tên riêng: nitron (olon) = poly(acrylonitrile), PVA = poly(vinyl acetate), PMMA = poly(methyl methacrylate), PS = polystyrene, cao su buna = polybuta-1,3-diene."},"k2":{"ten":"Monomer & cách trùng","rule":"Bỏ ngoặc mắt xích, nối lại C=C → ra monomer. Monomer có <b>C=C</b> hoặc vòng kém bền (caprolactam) → <b>trùng hợp</b>, không tách phân tử nhỏ. Monomer có <b>từ 2 nhóm chức</b> (–{NH2}, –{COOH}, –OH) → <b>trùng ngưng</b>, tách {H2O}: nylon-6,6 từ hexamethylenediamine + adipic acid. PVA từ vinyl acetate {CH3COOCH=CH2}, không phải {CH2=CHCOOCH3}. Cao su thiên nhiên là polyisoprene, khác buna (từ buta-1,3-diene) ở nhóm –{CH3}."},"k3":{"ten":"Nguồn gốc & loại","rule":"<b>Thiên nhiên</b>: có sẵn (bông, đay là cellulose; tơ tằm, len là protein; cao su thiên nhiên). <b>Bán tổng hợp</b>: chế hoá từ polymer thiên nhiên (tơ visco, cellulose acetate từ cellulose). <b>Tổng hợp</b>: đi từ monomer (capron, nylon-6,6, nitron, PE, PVC, cao su buna). \"Nguồn gốc cellulose\" = bông, đay, visco, cellulose acetate. Theo công dụng: chất dẻo, tơ, cao su, keo dán; <b>chỉ cao su có tính đàn hồi</b>."},"k4":{"ten":"Phản ứng của polymer","rule":"So mạch trước và sau. Nối các mạch bằng cầu (lưu hoá cao su bằng S) → <b>tăng mạch</b>. Mạch ngắn lại: giải trùng hợp (polystyrene → styrene), thuỷ phân tinh bột, cellulose, polyamide → <b>cắt mạch</b>. Chỉ đổi nhóm thế (poly(vinyl acetate) + {NaOH} → poly(vinyl alcohol)) → <b>giữ nguyên mạch</b>. Thành chất đơn giản (tinh bột + {H2SO4} đặc → C + {H2O}) → <b>phân huỷ</b>. Polymer không có nhiệt độ nóng chảy xác định, không bay hơi."},"k5":{"ten":"Tính theo mắt xích","rule":"Trùng hợp: 1 mắt xích = 1 monomer, n = m : M(mắt xích). Mắt xích hay gặp: {C2H3Cl} 62,5; {C4H6} 54; {C4H5Cl} 88,5; {C8H8} 104. Nhiều giai đoạn: <b>H chung = H<sub>1</sub> × H<sub>2</sub> × …</b>; tính sản phẩm thì × H, tìm nguyên liệu thì <b>÷ H</b>. Soi hệ số: 2 {C2H5OH} → 1 {C4H6}; 2 {C2H2} → 1 {C4H4}. Khí ở 25 °C, 1 bar: <b>24,79 L/mol</b>. Hệ số polymer hoá = M(polymer) : M(mắt xích)."},"k6":{"ten":"Mắt xích cellulose","rule":"Cellulose [{C6H7O2(OH)3}]<sub>n</sub>: mỗi mắt xích <b>3 nhóm –OH</b>. Thay x nhóm –OH bằng –{OCOCH3}: <b>M = 162 + 42x</b>, số C = 6 + 2x; triacetate (x = 3) là [{C6H7O2(OOCCH3)3}]<sub>n</sub>, diacetate x = 2. Thay bằng –{ONO2}: M = 162 + 45x, trinitrate [{C6H7O2(ONO2)3}]<sub>n</sub>. Đề cho %C hoặc %N → lập phương trình theo x; x lẻ nghĩa là hỗn hợp di- và triacetate."}},"TRAPS_THEM":{"daoester":{"ten":"Đảo chiều ester","hoi":"Gốc vinyl gắn phía O hay phía C=O? Vinyl acetate và methyl acrylate cùng công thức phân tử nhưng cho hai polymer khác nhau."},"nguongoc":{"ten":"Nhầm nguồn gốc tơ","hoi":"Polymer có sẵn, chế hoá từ polymer thiên nhiên, hay tổng hợp từ monomer? Visco, cellulose acetate là bán tổng hợp."}},"DANG_KEY":{"POLYMER.CAU_TAO.TINH_HIEU_SUAT":"k5","POLYMER.DANH_PHAP.GOI_TEN":"k1","POLYMER.PHAN_LOAI.DEM_NGUYEN_TU":"k6","POLYMER.PHAN_LOAI.NHAN_DANG":"k3","POLYMER.PHAN_LOAI.SO_SANH":"k3","POLYMER.PHAN_LOAI.TINH_HIEU_SUAT":"k5","POLYMER.PHAN_LOAI.VIET_CTCT":"k6","POLYMER.TINH_CHAT.DEM_DONG_PHAN":"k3","POLYMER.TRUNG_HOP.TINH_KHOI_LUONG":"k5","POLYMER.TRUNG_NGUNG.CHON_PHAT_BIEU":"k2","POLYMER.UNG_DUNG.GOI_TEN":"k4"},"daDuyet":"Máy chốt 29/09/2026 (thầy giao máy tự chốt mọi điểm \"cần thầy chốt\")"}};

const KEYS_ESTER = Object.fromEntries(Object.entries(KEYS).map(([k, v]) => [k, { ...v, q: [] }]));
const TRAPS_GOC = { ...TRAPS };
const MAU_KHOA = ['--k1', '--k2', '--k3', '--k4', '--k5', '--k6'];
const HINH_KHOA = ['i-key', 'i-hex', 'i-calc', 'i-flask', 'i-bolt', 'i-chart', 'i-lens'];
const openLabEster = openLab;
let daKhoiDong = false;

function datBo(ma) {
  const bo = BO_CAC_CHUONG[ma];
  Object.keys(KEYS).forEach(k => delete KEYS[k]);
  if (ma === 'ESTER' || !bo) Object.assign(KEYS, KEYS_ESTER);
  else Object.entries(bo.KEYS).forEach(([k, v], i) => { KEYS[k] = { ten: v.ten, rule: v.rule, ic: HINH_KHOA[i % HINH_KHOA.length], cv: MAU_KHOA[i % 6], short: '', q: [] }; });
  Object.keys(TRAPS).forEach(k => delete TRAPS[k]);
  Object.assign(TRAPS, TRAPS_GOC);
  Object.entries((bo && bo.TRAPS_THEM) || {}).forEach(([k, v]) => { TRAPS[k] = { ten: v.ten, hoi: v.hoi, g: '!', cv: '--k2', kw: [] }; });
  Object.keys(KEYS).forEach(k => { if (typeof S.xp[k] !== 'number') S.xp[k] = 0; });
  const la = ma === 'ESTER';
  // Chương không có phòng thí nghiệm ảo: bấm chìa khoá thì hiện quy tắc của chìa ấy.
  openLab = la ? openLabEster : (k) => {
    const K = KEYS[k] || KEYS[Object.keys(KEYS)[0]];
    $$('.key').forEach(b => b.classList.toggle('on', b.dataset.k === k));
    $('#lab').innerHTML = `<div style="padding:18px 20px"><h3 style="margin:0 0 8px;--kc:var(${K.cv})">${icon(K.ic)} ${K.ten}</h3><p style="margin:0;line-height:1.65">${fx(K.rule)}</p></div>`;
  };
  $('#nhanChuong').textContent = (bo && bo.chuong) || 'Hoá 12';
  $('#tieuDeKhoa').textContent = `${Object.keys(KEYS).length} chìa khoá chương ${(bo && bo.chuong) || ''}`.trim();
}

function ghep(hoSo, cau) {
  const q = Object.assign({}, hoSo, { id: cau.qid, so: cau.so, nguon: cau.nguon, chuong: cau.chuong, de: cau.de });
  q.y = (hoSo.y || []).map(y => Object.assign({}, y, { t: (cau.y || {})[y.id] || '' }));
  // Khuôn 1.2 chỉ lưu { d }; hồ sơ khuôn cũ (câu đếm / tìm phát biểu sai) mang sẵn câu hỏi chốt + lựa chọn riêng thì giữ.
  if (hoSo.mc) q.mc = hoSo.mc.o ? hoSo.mc : { hoi: 'Chọn đáp án', o: Object.entries(cau.y || {}), d: hoSo.mc.d };
  // Cờ đáp án chưa chốt ⇒ "Chờ máy chốt"; cờ đã có quyết định (`chot`) hoặc cờ sửa đề ⇒ "Máy đã chốt" (chỉ màn thầy hiện).
  q.canThayChot = (hoSo.co || []).filter(c => c.loai === 'dapAn' && !c.chot).map(c => c.ghi);
  q.daChot = (hoSo.daChot || []).map(c => ({ daXoa: true, ghi: c.ghi, chot: c.chot })).concat((hoSo.co || []).filter(c => !(c.loai === 'dapAn' && !c.chot)).map(c => ({ loai: c.loai, ghi: c.ghi, chot: c.chot || (c.sua ? `Sửa kho: “${c.sua.truoc}” → “${c.sua.sau}”` : c.ghi) })));
  q.tuongTu = hoSo.tuongTu || [];
  return q;
}

window.addEventListener('message', e => {
  if (e.source !== window.parent) return;
  const m = e.data;
  if (!m || m.loai !== 'loi-giai' || !m.hoSo || !m.cau) return;
  datBo(m.hoSo.bo || 'ESTER');
  QUESTIONS.splice(0, QUESTIONS.length, ghep(m.hoSo, m.cau));
  curQ.q = QUESTIONS[0].id;
  window.XEM_THU = m.thay === true;
  $('#choTai').hidden = true;
  if (!daKhoiDong) { daKhoiDong = true; init(); } else { renderKeys(); renderBar('q'); renderQ('q'); paintXP(); }
  window.scrollTo(0, 0);
});
parent.postMessage({ loai: 'khung-san-sang' }, '*');

</script>
</body>
</html>
