<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Google Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#ffffff" filter="url(#shadow)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#e2e8f0" stroke-width="3" />

  <!-- Outer 4-Color Google Segment Ring -->
  <g transform="translate(256, 256) rotate(-45)">
    <!-- Blue Arc -->
    <circle cx="0" cy="0" r="216" fill="none" stroke="#1a73e8" stroke-width="9" stroke-dasharray="320 1050" stroke-linecap="round" />
    <!-- Red Arc -->
    <circle cx="0" cy="0" r="216" fill="none" stroke="#ea4335" stroke-width="9" stroke-dasharray="320 1050" stroke-dashoffset="-340" stroke-linecap="round" />
    <!-- Yellow Arc -->
    <circle cx="0" cy="0" r="216" fill="none" stroke="#fbbc04" stroke-width="9" stroke-dasharray="320 1050" stroke-dashoffset="-680" stroke-linecap="round" />
    <!-- Green Arc -->
    <circle cx="0" cy="0" r="216" fill="none" stroke="#34a853" stroke-width="9" stroke-dasharray="320 1050" stroke-dashoffset="-1020" stroke-linecap="round" />
  </g>

  <!-- BRAND CORE: BOLD STYLIZED NUMERAL '4' -->
  <!-- 1. Diagonal Arm: Google Red -->
  <path d="M336 92 L336 142 L198 280 L154 240 Z" fill="#ea4335" />

  <!-- 2. Slanted Crossbar: Google Yellow -->
  <path d="M154 240 L198 280 L300 326 L300 274 Z" fill="#fbbc04" />
  <path d="M198 280 L154 240" stroke="#000000" stroke-width="2" stroke-opacity="0.12" />

  <!-- 3. Vertical Stem: Google Blue -->
  <path d="M300 128 L336 92 L344 92 L344 456 L300 440 Z" fill="#1a73e8" />

  <!-- Vertical Text: 'Đ Ỗ Đ Ạ I H Ọ C' -->
  <g fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16.5" text-anchor="middle">
    <text x="322" y="156">Đ</text>
    <text x="322" y="186">Ỗ</text>
    <text x="322" y="224">Đ</text>
    <text x="322" y="254">Ạ</text>
    <text x="322" y="282">I</text>
    <text x="322" y="320">H</text>
    <text x="322" y="350">Ọ</text>
    <text x="322" y="378">C</text>
  </g>

  <!-- 4. Avogadro Constant: 6,022 · 10²³ -->
  <g transform="translate(68, 252) rotate(20.5)">
    <text x="22" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" fill="#1a73e8" letter-spacing="0.5">
      6,022 · 10<tspan dy="-10" font-size="16" font-weight="900">23</tspan>
    </text>
  </g>

  <!-- 5. Lower-Left Accent Slash '/': Google Green -->
  <path d="M106 324 L126 344 L80 390 L60 370 Z" fill="#34a853" rx="5" />

  <!-- 6. Academic Mortarboard Cap (Teacher) -->
  <g transform="translate(336, 74)">
    <path d="M-44 -14 L0 -28 L44 -14 L0 0 Z" fill="#ea4335" />
    <path d="M-26 -6 L-26 16 C-26 24 26 24 26 16 L26 -6" fill="none" stroke="#1a73e8" stroke-width="5" stroke-linecap="round" />
    <circle cx="0" cy="-14" r="4.5" fill="#fbbc04" />
    <path d="M0 -14 C18 -10 32 4 32 20" fill="none" stroke="#fbbc04" stroke-width="3.5" stroke-linecap="round" />
    <rect x="28" y="19" width="8" height="11" rx="2.5" fill="#fbbc04" />
  </g>
</svg>
