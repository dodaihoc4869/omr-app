<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="bong" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#1a2332" flood-opacity="0.14" />
    </filter>
  </defs>
  <!-- Nền Squircle trắng tinh khiết Google Surface -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="#ffffff" filter="url(#bong)" />
  <rect x="24" y="24" width="464" height="464" rx="116" fill="none" stroke="#e8eaed" stroke-width="6" />

  <!-- Biểu tượng 4 màu Google: Trang sách tri thức & Bong bóng OMR chuẩn xác -->
  <g transform="translate(48, 48) scale(0.8125)">
    <!-- Bong bóng xanh dương (Google Blue): OMR chấm thi -->
    <circle cx="150" cy="150" r="54" fill="#1a73e8" />
    <!-- Bong bóng đỏ (Google Red) -->
    <circle cx="362" cy="150" r="54" fill="#ea4335" />
    <!-- Bong bóng vàng (Google Amber) -->
    <circle cx="150" cy="362" r="54" fill="#fbbc04" />
    <!-- Bong bóng xanh lục (Google Green) -->
    <circle cx="362" cy="362" r="54" fill="#34a853" />

    <!-- Chữ A Avogadro & Con đường đỗ đại học cách điệu ở tâm -->
    <path d="M 256 110 L 320 280 L 290 280 L 256 186 L 222 280 L 192 280 Z" fill="#1a2332" />
    <!-- Thanh ngang liên kết 4 màu Google tạo thành chiếc mũ cử nhân / nhịp tiến bộ -->
    <rect x="180" y="296" width="152" height="24" rx="12" fill="#1a73e8" />
    <circle cx="256" cy="370" r="28" fill="#34a853" />
  </g>
</svg>
