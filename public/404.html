<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ĐỖ ĐẠI HỌC</title>
    <style>
      body { margin: 0; background: #f7f8fa; color: #1a2332; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
      @media (prefers-color-scheme: dark) { body { background: #0f1419; color: #e8eaed; } }
      p { text-align: center; padding: 24px; line-height: 1.6; }
      a { color: inherit; }
    </style>
    <script>
      // LINK NGẮN CHO HỌC SINH: https://<host>/omr-app/t/<mã ca>
      // GitHub Pages không có server route nên đường dẫn này rơi vào 404.html;
      // trang này chỉ chuyển hướng về trang chính kèm ?examCode=<mã ca>.
      // Link Apps Script app tự lấy từ cau-hinh.json cùng thư mục (exam-db.ts).
      // /gv → app giáo viên (vẫn phải có mã bí mật trong máy).
      // Link riêng /hs/<token> và /ph/<token> đã gỡ: hai app đó tách sang repo
      // riêng (TACHAPPHSPH.md). Link cũ đã phát ra Zalo rồi nên vẫn phải đón:
      // đưa về ?vai=hs|ph để app hiện màn "Link này đã ngừng dùng", KHÔNG để
      // em và phụ huynh rơi vào app quản lý của thầy.
      ;(function () {
        var p = location.pathname
        var m = p.match(/^(.*?\/)t\/(\d{4,8})\/?$/)
        if (m) return location.replace(m[1] + '?examCode=' + m[2])
        var g = p.match(/^(.*?\/)gv\/?$/)
        if (g) return location.replace(g[1] + '?vai=gv')
        // PHIẾU KẾT QUẢ: /p#<dữ liệu>. Phải bê nguyên location.hash sang, cả
        // phiếu nằm trong đó; bỏ hash là phụ huynh mở ra trang trống.
        var ph = p.match(/^(.*?\/)p\/?$/)
        if (ph) return location.replace(ph[1] + '?vai=phieu' + location.hash)
        var c = p.match(/^(.*?\/)(hs|ph)\/[0-9a-zA-Z]{8,}\/?$/)
        if (c) return location.replace(c[1] + '?vai=' + c[2])
      })()
    </script>
  </head>
  <body>
    <p>
      Không tìm thấy trang.<br />
      <a href="../">Về trang chính</a>
    </p>
  </body>
</html>
