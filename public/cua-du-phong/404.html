<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>ĐỖ ĐẠI HỌC</title>
<!-- GitHub Pages không có máy chủ định tuyến: /omr-app/hs rơi vào đây.
     Giữ nguyên đường em đã mở (hs · ph · t/<mã ca>…) rồi đưa về trang cửa. -->
<script>
(function () {
  var p = location.pathname.replace(/^\/omr-app/, '') || '/hs'
  location.replace('/omr-app/?den=' + encodeURIComponent(p + location.search))
})()
</script></head><body></body></html>
