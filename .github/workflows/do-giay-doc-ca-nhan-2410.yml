# SOÁT MỨC LÀM 1–4 CÓ CÁ NHÂN HOÁ GIÂY ĐỌC ĐỀ CHƯA (CHỈ ĐỌC, 24/10). Chỉ in SỐ ĐẾM GỘP: không mã em, không tên, không mã câu (repo công khai).
# Lượt đo = su_kien_hoc có raw_json.doc.dh = 1, 14 ngày gần nhất, không phải lượt xem lời giải/lướt; bỏ lượt treo (Mức 5).
# T_đọc chung (muc-lam.ts) = 8 + 0,35 × số từ + 10 nếu có hình. r = giây / T_đọc. «Đã gặp» = em đã có lượt cùng câu trước đó.
name: Đo giây đọc đề cá nhân (chỉ đọc)
on:
  workflow_dispatch:
  push:
    branches: [claude/stoic-einstein-7jkysb]
    paths: ['.github/workflows/do-giay-doc-ca-nhan-2410.yml']
permissions:
  contents: read
concurrency:
  group: do-giay-doc-ca-nhan
  cancel-in-progress: true
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Đếm (chỉ SELECT gộp)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          q() { echo "== $1"; npx -y wrangler@4 d1 execute omr --remote --json --command "$2" | jq -c '.[0].results'; }
          J() { echo "json_extract(s.raw_json,'\$.doc.$1')"; }
          TD="(8 + 0.35*COALESCE($(J t),0) + 10*COALESCE($(J h),0))"
          TREO="(COALESCE($(J l),0)>=300 OR COALESCE($(J a),0)>=600 OR ($(J w)=1 AND COALESCE($(J a),0)>=180) OR COALESCE($(J n),0)>=3)"
          GAP="EXISTS (SELECT 1 FROM su_kien_hoc s2 WHERE s2.sbd=s.sbd AND s2.qid=s.qid AND s2.luc < s.luc)"
          B="SELECT s.sbd, s.qid, s.giay g, s.ket_qua kq, $(J p) phan, $(J t) tu, COALESCE($(J h),0) hinh, $TD td, s.giay*1.0/$TD r, CASE WHEN $GAP THEN 1 ELSE 0 END gap FROM su_kien_hoc s WHERE s.ngay_vn >= date('now','+7 hours','-14 days') AND COALESCE(s.purpose,'') NOT IN ('xem_loi_giai','luot','chan_doan','chua_buoc') AND $(J dh)=1 AND s.giay IS NOT NULL AND NOT $TREO"
          q "1 Lượt đo theo đã gặp · phần: số lượt, đúng, giây TB, T_đọc TB, số lượt dưới T_đọc" "WITH x AS ($B) SELECT gap, phan, COUNT(*) n, SUM(kq=1) dung, ROUND(AVG(g),1) giay_tb, ROUND(AVG(td),1) td_tb, SUM(r<1) duoi_td FROM x GROUP BY 1,2 ORDER BY 1,2"
          q "2 Phần I, lượt ĐÚNG: phân bố r theo đã gặp" "WITH x AS ($B) SELECT gap, COUNT(*) n, SUM(r<0.25) a025, SUM(r>=0.25 AND r<0.5) a05, SUM(r>=0.5 AND r<0.75) a075, SUM(r>=0.75 AND r<1) a1, SUM(r>=1 AND r<1.5) a15, SUM(r>=1.5 AND r<2) a2, SUM(r>=2) tu2 FROM x WHERE phan='I' AND kq=1 GROUP BY 1"
          q "3 Phần I, lượt SAI: phân bố r theo đã gặp" "WITH x AS ($B) SELECT gap, COUNT(*) n, SUM(r<0.25) a025, SUM(r>=0.25 AND r<0.5) a05, SUM(r>=0.5 AND r<0.75) a075, SUM(r>=0.75 AND r<1) a1, SUM(r>=1 AND r<1.5) a15, SUM(r>=1.5) tu15 FROM x WHERE phan='I' AND kq=0 GROUP BY 1"
          q "4 Câu LẦN ĐẦU, Phần I đúng: giây TB theo số từ (ước giây/từ)" "WITH x AS ($B) SELECT CASE WHEN tu<25 THEN 'a<25' WHEN tu<50 THEN 'b25-49' WHEN tu<80 THEN 'c50-79' WHEN tu<120 THEN 'd80-119' ELSE 'e120+' END nhom, hinh, COUNT(*) n, ROUND(AVG(tu),1) tu_tb, ROUND(AVG(g),1) giay_tb, ROUND(AVG(td),1) td_tb FROM x WHERE gap=0 AND phan='I' AND kq=1 GROUP BY 1,2 ORDER BY 1,2"
          q "5 Mỗi em (≥ 8 lượt lần đầu Phần I đúng): số em theo r trung bình riêng" "WITH x AS ($B), e AS (SELECT sbd, COUNT(*) n, AVG(r) rr FROM x WHERE gap=0 AND phan='I' AND kq=1 GROUP BY sbd HAVING COUNT(*)>=8) SELECT COUNT(*) so_em, SUM(rr<0.5) duoi05, SUM(rr>=0.5 AND rr<0.75) r05_075, SUM(rr>=0.75 AND rr<1) r075_1, SUM(rr>=1 AND rr<1.5) r1_15, SUM(rr>=1.5 AND rr<2) r15_2, SUM(rr>=2) tu2 FROM e"
          q "6 Mỗi em (≥ 8 lượt ĐÃ GẶP Phần I đúng): số em theo r trung bình riêng" "WITH x AS ($B), e AS (SELECT sbd, COUNT(*) n, AVG(r) rr FROM x WHERE gap=1 AND phan='I' AND kq=1 GROUP BY sbd HAVING COUNT(*)>=8) SELECT COUNT(*) so_em, SUM(rr<0.25) duoi025, SUM(rr>=0.25 AND rr<0.5) r025_05, SUM(rr>=0.5 AND rr<0.75) r05_075, SUM(rr>=0.75 AND rr<1) r075_1, SUM(rr>=1 AND rr<1.5) r1_15, SUM(rr>=1.5) tu15 FROM e"
          q "7 Em có đủ cả hai loại: tỉ số r(đã gặp)/r(lần đầu) theo em" "WITH x AS ($B), a AS (SELECT sbd, AVG(r) r0 FROM x WHERE gap=0 AND phan='I' AND kq=1 GROUP BY sbd HAVING COUNT(*)>=8), b AS (SELECT sbd, AVG(r) r1 FROM x WHERE gap=1 AND phan='I' AND kq=1 GROUP BY sbd HAVING COUNT(*)>=8) SELECT COUNT(*) so_em, SUM(r1/r0<0.4) duoi04, SUM(r1/r0>=0.4 AND r1/r0<0.6) t04_06, SUM(r1/r0>=0.6 AND r1/r0<0.8) t06_08, SUM(r1/r0>=0.8 AND r1/r0<1) t08_1, SUM(r1/r0>=1) tu1 FROM a JOIN b USING(sbd)"
          q "8 Độ ổn định: mỗi em chia đôi lượt lần đầu (chẵn/lẻ theo thời gian) — số em có r hai nửa lệch < 25%" "WITH x AS ($B), y AS (SELECT sbd, r, ROW_NUMBER() OVER (PARTITION BY sbd ORDER BY qid) k FROM x WHERE gap=0 AND phan='I' AND kq=1), e AS (SELECT sbd, AVG(CASE WHEN k%2=0 THEN r END) ra, AVG(CASE WHEN k%2=1 THEN r END) rb, COUNT(*) n FROM y GROUP BY sbd HAVING COUNT(*)>=12) SELECT COUNT(*) so_em, SUM(ABS(ra-rb)/((ra+rb)/2)<0.25) on_dinh, SUM(ABS(ra-rb)/((ra+rb)/2)>=0.5) lech_nhieu FROM e"
          q "9 OMNI τ: số em có τ (n_tau ≥ 5) và phân bố" "SELECT COUNT(*) co_tau, SUM(tau<-0.3) tau_cham, SUM(tau>=-0.3 AND tau<0.3) tau_vua, SUM(tau>=0.3) tau_nhanh FROM omni_em WHERE n_tau>=5"
          q "10 Câu có β thật (omni_beta_cau n ≥ 8) trong các câu đã đo" "WITH x AS ($B) SELECT COUNT(DISTINCT x.qid) so_cau, COUNT(DISTINCT CASE WHEN b.n>=8 THEN x.qid END) co_beta FROM x LEFT JOIN omni_beta_cau b ON b.qid=x.qid"
