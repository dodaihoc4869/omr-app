# LẤY TỆP NHẬT KÝ BÀI DẠY ĐỂ THỬ MÀN XEM (CHỈ ĐỌC, 13/11): tải nhat-ky.json + buoi.json + net.bin của MỘT buổi từ R2 về TỆP ĐÍNH KÈM của lượt chạy (giữ 1 ngày)
# — không in nội dung ra nhật ký công khai. Phiên Claude dùng để chạy bộ thử trình duyệt màn học sinh với bài văn phòng đã soạn.
name: Lấy tệp nhật ký bài dạy (chỉ đọc)
on:
  workflow_dispatch:
    inputs:
      buoi:
        description: 'Mã buổi (BH-…)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  lay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Tải ba tệp (chỉ đọc)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          B=$(jq -r '.inputs.buoi' "$GITHUB_EVENT_PATH" | tr -cd 'A-Za-z0-9_-')
          mkdir -p ../tep
          for t in nhat-ky.json buoi.json net.bin; do npx -y wrangler@4 r2 object get "omr-de/live/$B/$t" --remote --file "../tep/$t" > /dev/null 2>&1 && echo "có $t ($(stat -c %s ../tep/$t) B)" || echo "không có $t"; done
      - uses: actions/upload-artifact@v4
        with:
          name: tep-nhat-ky
          path: tep/
          retention-days: 1
