# THEO DÕI «ĐỀ 28 THEO SUẤT» (CHỈ ĐỌC — thầy 10/11 «ok» với bảng theo dõi bốn chỉ số trước khi nói tới thương mại hoá):
#   1. tỉ lệ em-ngày ĐÚNG 18 · 4 · 6 trong 28 câu đầu của ngày;   2. tỉ lệ em làm ĐỦ 28 câu;
#   3. lỗi tồn (câu mà lần làm gần nhất là sai);                   4. điểm Kiểm tra ôn tập.
# Mỗi lượt in đủ 14 ngày gần nhất ⇒ một lượt bất kỳ đã thấy xu hướng, không cần lưu trạng thái. CHỈ SELECT đếm gộp — không in mã em, tên em. KHÔNG `d1 export`.
# Tự chạy 00:20 giờ VN mỗi ngày (ngoài giờ học); mỗi câu cách nhau 4 giây (D1 từng 429 khi dồn lệnh). Đặc tả: docs/de-xuat-28-cau-v6-1011.md.
name: Theo dõi đề 28 câu (chỉ đọc)
on:
  workflow_dispatch:
  schedule:
    - cron: '20 17 * * *'
permissions:
  contents: read
concurrency:
  group: theo-doi-de-28
  cancel-in-progress: true
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Đo (chỉ SELECT)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          q() { echo "## $1"; npx -y wrangler@4 d1 execute omr --remote --json --command "$2" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const r=(Array.isArray(j)?j[0]:j).results||[];for(const x of r)console.log(JSON.stringify(x));console.log('('+r.length+' dòng)')}catch(e){console.log('LỖI: '+s.slice(0,400))}})"; sleep 4; }
          GOC="CASE WHEN instr(qid,'~')>0 THEN substr(qid,1,instr(qid,'~')-1) ELSE qid END"
          LAM="ket_qua IS NOT NULL AND COALESCE(purpose,'') NOT IN ('xem_loi_giai','luot','chan_doan','chua_buoc')"
          PHAN="(SELECT json_extract(q.json,'\$.phan') FROM game_v2_question q WHERE q.qid=x.goc LIMIT 1)"
          TU="date('now','+7 hours','-14 days')"

          q "1+2 cấu trúc 28 câu đầu của ngày và số em đủ 28 câu — theo ngày, loại ngày" "WITH s AS (SELECT sbd, ngay_vn, $GOC goc, MIN(luc) luc FROM su_kien_hoc WHERE ngay_vn >= $TU AND $LAM AND ma_nguon NOT LIKE 'ktcn:%' AND nguon NOT IN ('thi','chua_loi','tu_luyen') GROUP BY sbd, ngay_vn, goc), r AS (SELECT sbd, ngay_vn, goc, ROW_NUMBER() OVER (PARTITION BY sbd, ngay_vn ORDER BY luc, goc) k, COUNT(*) OVER (PARTITION BY sbd, ngay_vn) n FROM s), m AS (SELECT x.goc, $PHAN phan FROM (SELECT DISTINCT goc FROM s) x), e AS (SELECT r.sbd, r.ngay_vn, MAX(r.n) n, SUM(r.k<=28 AND m.phan='I') i, SUM(r.k<=28 AND m.phan='II') ii, SUM(r.k<=28 AND m.phan='III') iii FROM r JOIN m ON m.goc=r.goc GROUP BY r.sbd, r.ngay_vn) SELECT e.ngay_vn ngay, COALESCE(l.loai,'-') loai, COUNT(*) em_co_lam, SUM(n>=28) em_du_28, SUM(n>=28 AND i=18 AND ii=4 AND iii=6) dung_18_4_6, SUM(n>=28 AND ABS(i-18)<=1 AND ABS(ii-4)<=1 AND ABS(iii-6)<=1) sat_18_4_6, ROUND(AVG(CASE WHEN n>=28 THEN i END),1) tb_I, ROUND(AVG(CASE WHEN n>=28 THEN ii END),1) tb_II, ROUND(AVG(CASE WHEN n>=28 THEN iii END),1) tb_III, SUM(n>=28 AND ii=0) khong_co_DS, SUM(n>=28 AND iii=0) khong_co_TLN FROM e LEFT JOIN goi_bai_7_loai_ngay l ON l.sbd=e.sbd AND l.ngay=e.ngay_vn GROUP BY 1,2 ORDER BY 1,2"

          # 12/11: «1+2» lấy MỌI câu trong ngày (lẫn câu game ngoài đề, luyện đề) ⇒ không đo được đề Gói 7. Hai dòng dưới đo ĐÚNG đề Gói 7 (phiên game_v2_session có goi7=1):
          #   1g = 28 câu Gói 7 em ĐÃ LÀM đầu tiên trong ngày; 1d = 28 câu Gói 7 máy ĐÃ GIAO (theo thứ tự chặng) — đề lệch ma trận ở 1d là do kho thiếu câu đúng ô.
          q "1g cấu trúc 28 câu Gói 7 em đã làm (chỉ câu của đề Gói 7) — theo ngày, loại ngày" "WITH s AS (SELECT sbd, ngay_vn, $GOC goc, MIN(luc) luc FROM su_kien_hoc WHERE ngay_vn >= $TU AND $LAM AND nguon='game' AND ma_nguon IN (SELECT id FROM game_v2_session WHERE created_at >= date('now','-16 days') AND json_extract(json,'\$.goi7')=1) GROUP BY sbd, ngay_vn, goc), r AS (SELECT sbd, ngay_vn, goc, ROW_NUMBER() OVER (PARTITION BY sbd, ngay_vn ORDER BY luc, goc) k, COUNT(*) OVER (PARTITION BY sbd, ngay_vn) n FROM s), m AS (SELECT x.goc, $PHAN phan FROM (SELECT DISTINCT goc FROM s) x), e AS (SELECT r.sbd, r.ngay_vn, MAX(r.n) n, SUM(r.k<=28 AND m.phan='I') i, SUM(r.k<=28 AND m.phan='II') ii, SUM(r.k<=28 AND m.phan='III') iii FROM r JOIN m ON m.goc=r.goc GROUP BY r.sbd, r.ngay_vn) SELECT e.ngay_vn ngay, COALESCE(l.loai,'-') loai, COUNT(*) em_co_lam, SUM(n>=28) em_du_28, SUM(n>=28 AND i=18 AND ii=4 AND iii=6) dung_18_4_6, SUM(n>=28 AND ABS(i-18)<=1 AND ABS(ii-4)<=1 AND ABS(iii-6)<=1) sat_18_4_6, ROUND(AVG(CASE WHEN n>=28 THEN i END),1) tb_I, ROUND(AVG(CASE WHEN n>=28 THEN ii END),1) tb_II, ROUND(AVG(CASE WHEN n>=28 THEN iii END),1) tb_III FROM e LEFT JOIN goi_bai_7_loai_ngay l ON l.sbd=e.sbd AND l.ngay=e.ngay_vn WHERE e.ngay_vn >= '2026-11-11' GROUP BY 1,2 ORDER BY 1,2"

          q "1d cấu trúc 28 câu Gói 7 máy đã giao (đề lệch ⇒ kho thiếu câu đúng ô) — theo ngày, loại ngày" "WITH g AS (SELECT sbd, created_at c, json FROM game_v2_session WHERE created_at >= date('now','-16 days') AND json_extract(json,'\$.goi7')=1), q AS (SELECT g.sbd, date(g.c,'+7 hours') ngay, g.c || printf('%05d', j.key) th, json_extract(j.value,'\$.qid') qid FROM g, json_each(g.json,'\$.questions') j), d AS (SELECT sbd, ngay, CASE WHEN instr(qid,'~')>0 THEN substr(qid,1,instr(qid,'~')-1) ELSE qid END goc, MIN(th) th FROM q WHERE qid IS NOT NULL GROUP BY 1,2,3), r AS (SELECT d.*, ROW_NUMBER() OVER (PARTITION BY sbd, ngay ORDER BY th) k, COUNT(*) OVER (PARTITION BY sbd, ngay) n FROM d), m AS (SELECT x.goc, $PHAN phan FROM (SELECT DISTINCT goc FROM d) x), e AS (SELECT r.sbd, r.ngay, MAX(r.n) n, SUM(r.k<=28 AND m.phan='I') i, SUM(r.k<=28 AND m.phan='II') ii, SUM(r.k<=28 AND m.phan='III') iii FROM r JOIN m ON m.goc=r.goc GROUP BY 1,2) SELECT e.ngay, COALESCE(l.loai,'-') loai, COUNT(*) em_duoc_giao, SUM(n>=28) de_du_28, SUM(n>=28 AND i=18 AND ii=4 AND iii=6) de_dung_18_4_6, SUM(n>=28 AND ABS(i-18)<=1 AND ABS(ii-4)<=1 AND ABS(iii-6)<=1) de_sat, SUM(n>=28 AND ii<4) thieu_DS, SUM(n>=28 AND iii<6) thieu_TLN, SUM(n>=28 AND i>18) du_phan_I, ROUND(AVG(CASE WHEN n>=28 THEN i END),1) tb_I, ROUND(AVG(CASE WHEN n>=28 THEN ii END),1) tb_II, ROUND(AVG(CASE WHEN n>=28 THEN iii END),1) tb_III FROM e LEFT JOIN goi_bai_7_loai_ngay l ON l.sbd=e.sbd AND l.ngay=e.ngay WHERE e.ngay >= '2026-11-11' GROUP BY 1,2 ORDER BY 1,2"

          q "2b số em đang có bài (mẫu số)" "SELECT COUNT(DISTINCT e.sbd) em_co_bai FROM goi_bai_7_em e JOIN hoc_sinh h ON h.sbd=e.sbd WHERE COALESCE(h.trang_thai,'') NOT IN ('khoa','da_nghi')"

          q "3 lỗi tồn hôm nay (lần làm gần nhất của câu là sai) — gộp theo cỡ" "WITH s AS (SELECT sbd, $GOC goc, ket_qua, ROW_NUMBER() OVER (PARTITION BY sbd, $GOC ORDER BY luc DESC) r FROM su_kien_hoc WHERE $LAM), e AS (SELECT sbd, COUNT(*) n FROM s WHERE r=1 AND ket_qua=0 GROUP BY sbd) SELECT CASE WHEN n<12 THEN 'a 1-11' WHEN n<28 THEN 'b 12-27' WHEN n<56 THEN 'c 28-55' WHEN n<112 THEN 'd 56-111' ELSE 'e 112+' END co, COUNT(*) em, SUM(n) cau_sai FROM e GROUP BY 1 ORDER BY 1"

          q "3b câu sai và câu sửa đúng (12/11: sửa đúng = câu lần trước sai, lần này đúng — mọi kênh; cột kênh cũ chua_loi để đối chiếu) — theo ngày" "WITH s AS (SELECT sbd, ngay_vn, nguon, ket_qua, LAG(ket_qua) OVER (PARTITION BY sbd, $GOC ORDER BY luc) truoc FROM su_kien_hoc WHERE $LAM) SELECT ngay_vn ngay, SUM(ket_qua=0) luot_sai, SUM(ket_qua=1 AND truoc=0) luot_sua_dung, COUNT(DISTINCT CASE WHEN ket_qua=1 AND truoc=0 THEN sbd END) em_sua_dung, SUM(ket_qua=1 AND nguon='chua_loi') sua_dung_kenh_cu, SUM(ket_qua=1) luot_dung, COUNT(DISTINCT sbd) em FROM s WHERE ngay_vn >= $TU GROUP BY 1 ORDER BY 1"

          q "4 Kiểm tra ôn tập — theo ngày" "SELECT k.ngay, SUM(k.trang_thai='da_nop') da_nop, SUM(k.trang_thai='het_han') het_han, SUM(k.trang_thai IN ('hen','can_lam')) chua_lam, SUM(k.trang_thai='cho_nguon') cho_nguon, ROUND(AVG(CASE WHEN k.trang_thai='da_nop' THEN k.diem END),2) diem_tb, SUM(CASE WHEN k.trang_thai='da_nop' AND k.diem>=8 THEN 1 ELSE 0 END) tu_8_diem FROM kiem_tra_ca_nhan k WHERE k.ngay >= $TU AND k.ngay <= date('now','+7 hours') GROUP BY 1 ORDER BY 1"

          q "4b ngày Kiểm tra ôn tập: em đã nộp bài còn làm thêm bao nhiêu câu bài tập (từ 11/11 phải là 0)" "SELECT k.ngay, COUNT(*) em_nop, SUM(CASE WHEN EXISTS(SELECT 1 FROM su_kien_hoc s WHERE s.sbd=k.sbd AND s.ngay_vn=k.ngay AND s.ket_qua IS NOT NULL AND s.ma_nguon NOT LIKE 'ktcn:%' AND s.nguon NOT IN ('thi','chua_loi','tu_luyen') AND COALESCE(s.purpose,'') NOT IN ('xem_loi_giai','luot','chan_doan','chua_buoc')) THEN 1 ELSE 0 END) em_lam_them_bai FROM kiem_tra_ca_nhan k WHERE k.ngay >= $TU AND k.trang_thai='da_nop' GROUP BY 1 ORDER BY 1"

          # NỢ CÂU (11/11, server/src/no-cau.ts): sổ nợ gộp theo cỡ + lựa chọn trả nợ theo ngày — chỉ đếm gộp.
          q "5 nợ câu: sổ nợ đầu ngày gần nhất — gộp theo cỡ" "SELECT CASE WHEN no=0 THEN 'a 0' WHEN no<12 THEN 'b 1-11' WHEN no<28 THEN 'c 12-27' WHEN no<56 THEN 'd 28-55' WHEN no<84 THEN 'e 56-83' ELSE 'f 84 (trần)' END co, COUNT(*) em, SUM(no) cau_no, SUM(COALESCE(json_extract(loai_json,'\$.lai'),0)) cau_lai, SUM(lan>=3) em_het_lan_toi_thieu, MAX(den_ngay) chot_den FROM goi_bai_7_no_em GROUP BY 1 ORDER BY 1"

          q "5b nợ câu: lựa chọn trả nợ — theo ngày" "SELECT ngay, kieu, COUNT(*) em, SUM(so) cau_tra_da_chon, ROUND(AVG(so),1) tb_cau FROM goi_bai_7_no_chon WHERE ngay >= $TU GROUP BY 1,2 ORDER BY 1,2"

          # LÀM BÙ CỨU CHUỖI (11/11, docs/ban-ve-lam-bu-1111/CUU-CHUOI.md): ước lượng số em lỡ ngày từ 09/11 (có dòng mức mà số câu bài tập < mức) và tổng câu thiếu — chỉ đếm gộp.
          q "6 ngày lỡ từ 09/11 (ước lượng theo dòng mức): em thiếu mức + tổng câu thiếu — theo ngày" "WITH d AS (SELECT m.sbd, m.ngay, m.muc - COALESCE((SELECT c.so FROM goi_bai_7_no_chon c WHERE c.sbd=m.sbd AND c.ngay=m.ngay),0) goc, (SELECT COUNT(DISTINCT s.qid) FROM su_kien_hoc s WHERE s.sbd=m.sbd AND s.ngay_vn=m.ngay AND s.ket_qua IS NOT NULL AND s.ma_nguon NOT LIKE 'ktcn:%' AND COALESCE(s.nguon,'') NOT IN ('chua_loi','tu_luyen','thi') AND COALESCE(s.purpose,'') NOT IN ('xem_loi_giai','chan_doan','chua_buoc')) lam FROM goi_bai_7_muc_ngay m WHERE m.ngay >= '2026-11-09' AND m.ngay < date('now','+7 hours')) SELECT ngay, COUNT(*) em_co_muc, SUM(lam < goc) em_thieu, SUM(CASE WHEN lam < goc THEN goc - lam ELSE 0 END) cau_thieu, SUM(lam < goc AND goc - lam <= 12) em_thieu_den_12_cau FROM d GROUP BY 1 ORDER BY 1"
