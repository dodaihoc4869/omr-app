# ĐO ĐỘ PHỦ GIÂY TOÀN BỘ LỊCH SỬ (CHỈ ĐỌC) — thầy 21/10: "Phải đo hết tất cả lượt hs đã làm" (docs/dac-ta-muc-lam-bai-2010.md mục 12).
# Đếm TOÀN BỘ sổ `su_kien_hoc` (không chỉ 24 giờ): theo nguồn · có giây · giây từ đâu (cột `giay`, `raw_json.ms`) · có kích thước đề · phân bố giây
# (để biết lượt cũ nào xếp Mức làm được khi tính kích thước đề LÚC ĐỌC từ nội dung câu, và lượt nào hoàn toàn không có số đo để xếp).
# CHỈ SELECT gộp: không mã em, không tên em, không mã câu (repo công khai). Bấm tay (workflow_dispatch).
name: Đo độ phủ giây toàn bộ lịch sử (chỉ đọc)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: do-phu-giay-lich-su-${{ github.ref }}
  cancel-in-progress: true
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Đếm (chỉ SELECT gộp)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          q() { echo "== $1"; npx -y wrangler@4 d1 execute omr --remote --json --command "$2" | jq -c '.[0].results'; }
          q "1 toàn bộ sổ theo nguồn: tổng · có kết quả · có giây (cột) · có ms trong raw · có kích thước đề · đồng hồ mới" "SELECT nguon, COUNT(*) luot, SUM(ket_qua IS NOT NULL) co_ket_qua, SUM(giay IS NOT NULL) co_giay, SUM(json_extract(raw_json,'\$.ms') IS NOT NULL) co_ms, SUM(json_extract(raw_json,'\$.doc.t') IS NOT NULL) co_doc, SUM(json_extract(raw_json,'\$.doc.dh')=1) dong_ho_moi FROM su_kien_hoc GROUP BY nguon ORDER BY luot DESC"
          q "2 phân bố giây của lượt có giây, theo nguồn (xô: <5 · 5-14 · 15-29 · 30-59 · 60-119 · 120-299 · 300-599 · 600+)" "SELECT nguon, SUM(giay<5) x0, SUM(giay>=5 AND giay<15) x1, SUM(giay>=15 AND giay<30) x2, SUM(giay>=30 AND giay<60) x3, SUM(giay>=60 AND giay<120) x4, SUM(giay>=120 AND giay<300) x5, SUM(giay>=300 AND giay<600) x6, SUM(giay>=600) x7, MAX(giay) lon FROM su_kien_hoc WHERE giay IS NOT NULL GROUP BY nguon ORDER BY nguon"
          q "3 lượt KHÔNG có giây theo nguồn: có ms trong raw · có thời điểm bắt đầu/kết thúc trong raw" "SELECT nguon, COUNT(*) n, SUM(json_extract(raw_json,'\$.ms') IS NOT NULL) co_ms, SUM(json_extract(raw_json,'\$.batDau') IS NOT NULL OR json_extract(raw_json,'\$.start') IS NOT NULL) co_bat_dau FROM su_kien_hoc WHERE giay IS NULL AND ket_qua IS NOT NULL GROUP BY nguon ORDER BY n DESC"
          q "4 lượt có kết quả theo tháng: tổng · có giây" "SELECT substr(ngay_vn,1,7) thang, COUNT(*) n, SUM(giay IS NOT NULL) co_giay FROM su_kien_hoc WHERE ket_qua IS NOT NULL GROUP BY 1 ORDER BY 1"
          q "5 các bảng có thể chứa thời gian làm của game (chỉ tên bảng)" "SELECT name FROM sqlite_master WHERE type='table' AND (name LIKE '%attempt%' OR name LIKE '%luot%' OR name LIKE '%game%') ORDER BY name"
          q "6 TỪ KHI ĐỢT 1 PHÁT HÀNH (21/10 01:33 VN = 20/10 18:33Z) theo nguồn: lượt có kết quả · có giây · có kích thước đề · đồng hồ mới" "SELECT nguon, COUNT(*) luot, SUM(ket_qua IS NOT NULL) co_ket_qua, SUM(ket_qua IS NOT NULL AND giay IS NOT NULL) ket_qua_co_giay, SUM(json_extract(raw_json,'\$.doc.t') IS NOT NULL) co_doc, SUM(json_extract(raw_json,'\$.doc.dh')=1) dong_ho_moi FROM su_kien_hoc WHERE luc >= '2026-10-20T18:33:00Z' GROUP BY nguon ORDER BY luot DESC"
          q "7 TỪ KHI PR 4 PHÁT HÀNH (06:44 VN = 20/10 23:44Z) theo nguồn: lượt có kết quả · có giây · đồng hồ mới" "SELECT nguon, SUM(ket_qua IS NOT NULL) co_ket_qua, SUM(ket_qua IS NOT NULL AND giay IS NOT NULL) ket_qua_co_giay, SUM(json_extract(raw_json,'\$.doc.dh')=1) dong_ho_moi FROM su_kien_hoc WHERE luc >= '2026-10-20T23:44:00Z' GROUP BY nguon ORDER BY co_ket_qua DESC"
          q "8 game: lượt trả lời của kho game_v2_attempt (tổng · có mốc at) so với dòng sổ game" "SELECT COUNT(*) n, SUM(COALESCE(json_extract(json,'\$.attempt.at'), json_extract(json,'\$.at')) IS NOT NULL) co_at FROM game_v2_attempt"
          q "9 các cột của su_kien_hoc (tên cột)" "SELECT name FROM pragma_table_info('su_kien_hoc') ORDER BY cid"
          q "10 mỗi nguồn: lượt có kết quả · có dòng câu trong kho game_v2_question (khớp mã câu GỐC) — để biết lượt cũ nào TÍNH ĐƯỢC kích thước đề lúc đọc" "SELECT s.nguon, COUNT(*) n, SUM(q.qid IS NOT NULL) co_cau FROM su_kien_hoc s LEFT JOIN game_v2_question q ON q.qid = CASE WHEN instr(s.qid,'~')>0 THEN substr(s.qid,1,instr(s.qid,'~')-1) WHEN instr(s.qid,'#')>0 THEN substr(s.qid,1,instr(s.qid,'#')-1) ELSE s.qid END WHERE s.ket_qua IS NOT NULL GROUP BY s.nguon ORDER BY n DESC"
          q "11 game: lượt có kết quả mà PHIÊN có ít nhất một lần trả lời trong game_v2_attempt (căn cứ ước tính giây từ mốc trả lời)" "SELECT COUNT(*) n, SUM(giay IS NOT NULL OR json_extract(raw_json,'\$.ms') IS NOT NULL) co_giay_hoac_ms, SUM(EXISTS(SELECT 1 FROM game_v2_attempt a WHERE a.session = s.ma_nguon)) co_phien_trong_attempt, SUM(giay IS NULL AND json_extract(raw_json,'\$.ms') IS NULL AND EXISTS(SELECT 1 FROM game_v2_attempt a WHERE a.session = s.ma_nguon)) chi_uoc_tinh_duoc FROM su_kien_hoc s WHERE s.nguon='game' AND s.ket_qua IS NOT NULL"
          q "12 ƯỚC TÍNH GIÂY TỪ KHOẢNG CÁCH GIỮA HAI LẦN TRẢ LỜI liên tiếp của cùng em, cùng phiên/nguồn: mỗi nguồn — lượt có kết quả · có lượt liền trước · khoảng cách 1–900 giây · khoảng cách 0 (nộp cả lô cùng lúc, không ước tính được) · khoảng cách > 900 giây (nghỉ giữa chừng)" "WITH x AS (SELECT nguon, luc, LAG(luc) OVER (PARTITION BY sbd, ma_nguon ORDER BY luc) AS truoc FROM su_kien_hoc WHERE ket_qua IS NOT NULL), y AS (SELECT nguon, CASE WHEN truoc IS NULL THEN NULL ELSE ROUND((julianday(luc)-julianday(truoc))*86400) END AS g FROM x) SELECT nguon, COUNT(*) n, SUM(g IS NOT NULL) co_truoc, SUM(g>=1 AND g<=900) gap_1_900, SUM(g=0) gap_0, SUM(g>900) gap_tren_900 FROM y GROUP BY nguon ORDER BY n DESC"
          q "13 phân bố khoảng cách 1–900 giây theo nguồn (xô: 1-4 · 5-14 · 15-29 · 30-59 · 60-119 · 120-299 · 300-900)" "WITH x AS (SELECT nguon, luc, LAG(luc) OVER (PARTITION BY sbd, ma_nguon ORDER BY luc) AS truoc FROM su_kien_hoc WHERE ket_qua IS NOT NULL), y AS (SELECT nguon, ROUND((julianday(luc)-julianday(truoc))*86400) AS g FROM x WHERE truoc IS NOT NULL) SELECT nguon, SUM(g>=1 AND g<5) a, SUM(g>=5 AND g<15) b, SUM(g>=15 AND g<30) c, SUM(g>=30 AND g<60) d, SUM(g>=60 AND g<120) e, SUM(g>=120 AND g<300) f, SUM(g>=300 AND g<=900) h FROM y GROUP BY nguon ORDER BY nguon"
