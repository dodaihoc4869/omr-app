# LỖI 14/10 (thầy: "học sinh còn 1 câu nhưng app ko cho làm, sửa triệt để nhé") — em còn thiếu mức Gói 7 mà mở chặng rỗng: kế hoạch rỗng hay câu kế hoạch
# bị lọc lúc phát? Chạy ĐÚNG mã máy chủ trên D1 thật, CHỈ ĐỌC (lớp mỏng chỉ gửi SELECT), CHỈ IN SỐ ĐẾM (repo công khai: không số báo danh / tên / mã câu).
name: Gói 7 — chặng rỗng khi còn thiếu mức (chỉ đọc, chỉ đếm)
# 30/10 21h (thầy: «app hs không bấm được, đơ luôn»): BỎ tự chạy khi đẩy nhánh sửa goi-bai-7.ts — mỗi lượt chạy mã kế hoạch cho rất nhiều em trên D1 THẬT
# ~10 phút ⇒ D1 nghẽn giữa giờ cao điểm (lệnh đọc D1 3–4,5 s). Chỉ chạy BẤM TAY, ngoài khung 19–23h.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: do-goi7-chang-rong-${{ github.ref }}
  cancel-in-progress: true
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cài gói (để gói bộ đo bằng esbuild)
        run: npm ci --ignore-scripts
      - name: "Đo: em còn thiếu mức — kế hoạch có câu không, câu nào bị lọc lúc mở chặng (chỉ đọc)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          export OMR_D1_ID=$(grep -m1 '^database_id' server/wrangler.toml | sed -E 's/.*"([^"]+)".*/\1/')
          # TRƯỚC = mã máy chủ của main (đang chạy thật) · SAU = mã nhánh này. Cùng bộ đo, chạy nối tiếp cách nhau ~2 phút.
          git fetch -q --depth=1 origin main && git worktree add -q --detach /tmp/main FETCH_HEAD
          cp scripts/do-goi7-chang-rong-1410.ts /tmp/main/scripts/ && ln -s "$PWD/node_modules" /tmp/main/node_modules
          (cd /tmp/main && npx esbuild scripts/do-goi7-chang-rong-1410.ts --bundle --platform=node --format=esm --target=node22 --external:node:sqlite --outfile=/tmp/do-g7-truoc.mjs --log-level=warning)
          npx esbuild scripts/do-goi7-chang-rong-1410.ts --bundle --platform=node --format=esm --target=node22 --external:node:sqlite --outfile=/tmp/do-g7-sau.mjs --log-level=warning
          echo '=== TRƯỚC (main) ==='
          OMR_SONG_SONG=3 OMR_GIOI_HAN_MS=700000 timeout 760 node --no-warnings /tmp/do-g7-truoc.mjs | grep -v '^\[chan-khac-khoi\]' || echo "(thoát mã $?)"
          echo '=== SAU (nhánh sửa) ==='
          OMR_SONG_SONG=3 OMR_GIOI_HAN_MS=700000 timeout 760 node --no-warnings /tmp/do-g7-sau.mjs | grep -v '^\[chan-khac-khoi\]' || echo "(thoát mã $?)"
