# SOI VÒNG CHẶNG LỆCH (thầy 30/10 ảnh Lộ trình «4/8 chặng», chặng 5 đã đầy nửa vòng dù chưa làm) — CHỈ ĐỌC, chỉ tài khoản THỬ của thầy (SBD thử ghi ở
# docs). Không in mã em: kết quả chỉ có mã câu, nguồn, giờ.
name: Soi vòng chặng lệch (chỉ đọc)
on:
  workflow_dispatch:
  push:
    branches: [claude/do-vong-chang-3010]
    paths: ['.github/workflows/do-vong-chang-3010.yml']
permissions:
  contents: read
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Đọc (chỉ SELECT)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
          S: '12121212'
        run: |
          q() { echo "== $1"; npx -y wrangler@4 d1 execute omr --remote --json --command "$2" | jq -c ".[0].results[]" || echo "(lỗi)"; }
          N=$(TZ=Asia/Ho_Chi_Minh date +%F); echo "Ngày VN $N · giờ $(TZ=Asia/Ho_Chi_Minh date +%H:%M)"
          q "phiên 2 ngày qua có câu mang dấu làm lại cuối chặng: đuôi phiên · giờ · gói · câu có dấu" \
            "SELECT substr(s.id,-6) id, substr(s.created_at,6,14) luc, COALESCE(json_extract(s.json,'\$.goiNgay'),0) goi, group_concat(json_extract(q.value,'\$.qid'), ',') cau_ll FROM game_v2_session s, json_each(s.json,'\$.questions') q WHERE s.sbd='$S' AND s.created_at >= datetime('$N','-31 hours') AND COALESCE(json_extract(q.value,'\$.lamLaiCuoi'),0)=1 GROUP BY s.id ORDER BY s.created_at"
          q "câu I-26 / I-42 / I-45 trong các phiên: đuôi phiên · giờ · gói · lamLaiCuoi · lamLaiCua" \
            "SELECT substr(s.id,-6) id, substr(s.created_at,6,14) luc, COALESCE(json_extract(s.json,'\$.goiNgay'),0) goi, json_extract(q.value,'\$.qid') qid, json_extract(q.value,'\$.lamLaiCuoi') llc, json_extract(q.value,'\$.lamLaiCua') llcua FROM game_v2_session s, json_each(s.json,'\$.questions') q WHERE s.sbd='$S' AND s.created_at >= datetime('$N','-31 hours') AND json_extract(q.value,'\$.qid') IN ('DH-12-C3-B9-P1-I-26','DH-12-C3-B9-P1-I-42','DH-12-C3-B9-P1-I-45') ORDER BY s.created_at"
          q "toàn trung tâm hôm nay: dòng sổ mang ll=1 · trong đó câu KHÔNG phải câu làm lại của phiên ghi (dấu chép nhầm)" \
            "SELECT COUNT(*) ll, SUM(NOT EXISTS(SELECT 1 FROM game_v2_session s, json_each(s.json,'\$.questions') q WHERE s.id=k.ma_nguon AND json_extract(q.value,'\$.qid')=k.qid AND json_extract(q.value,'\$.lamLaiCua') IS NOT NULL)) nham, COUNT(DISTINCT sbd) so_em FROM su_kien_hoc k WHERE ngay_vn='$N' AND COALESCE(json_extract(raw_json,'\$.ll'),0)=1"
