# HÔM NAY · 4 BẢNG — SOÁT TRÊN DỮ LIỆU THẬT (CHỈ ĐỌC, 01/11): một câu SELECT số đếm gộp trên bon_chi_so_em; không SBD, không tên.
# Chạy sau khi cron đã tính dần bon_chi_so_em (12 em/phút ngoài giờ 18:00–23:30). Đẩy lại nhánh claude/do-bon-bang-0111 (đổi tệp SQL / tệp này) để đo lại.
name: Soát 4 bảng trên dữ liệu thật (chỉ đọc)
on:
  workflow_dispatch:
  push:
    branches: [claude/do-bon-bang-0111]
    paths: ['.github/workflows/do-bon-bang-0111.yml', 'scripts/do-bon-bang-0111.sql']
permissions:
  contents: read
concurrency:
  group: do-bon-bang-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kiem:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tệp SQL chỉ có SELECT
        run: |
          if grep -v '^\s*--' scripts/do-bon-bang-0111.sql | grep -iqE '\b(INSERT|UPDATE|DELETE|DROP|ALTER|CREATE|REPLACE|TRUNCATE|PRAGMA)\b'; then echo "Tệp có lệnh không chỉ-đọc — dừng."; exit 1; fi
          echo "OK: chỉ SELECT"
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Đếm gộp 4 bảng (chỉ đọc)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          # Chế độ --file của wrangler chỉ in tóm tắt, không in hàng kết quả ⇒ dùng --command (đúng câu SELECT trong tệp) + --json để thấy hai con số.
          SQL=$(grep -v '^\s*--' ../scripts/do-bon-bang-0111.sql | tr '\n' ' ')
          npx -y wrangler@4 d1 execute omr --remote --json --command "$SQL"
