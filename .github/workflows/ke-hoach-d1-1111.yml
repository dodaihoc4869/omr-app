# KẾ HOẠCH TRUY VẤN TRÊN D1 THẬT (CHỈ ĐỌC, 11/11 — hoá đơn Cloudflare): EXPLAIN QUERY PLAN hai câu kho sai vừa viết lại + danh sách chỉ mục liên quan.
# Không chạy câu thật, không ghi, không export.
name: Kế hoạch truy vấn D1 (chỉ đọc)
on:
  workflow_dispatch:
  push:
    branches: [claude/trusting-ritchie-xo0ipg]
    paths: ['.github/workflows/ke-hoach-d1-1111.yml', 'scripts/ke-hoach-d1-1111/**']
permissions:
  contents: read
concurrency:
  group: ke-hoach-d1
  cancel-in-progress: true
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Kế hoạch (chỉ đọc)
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          q() { echo "## $1"; npx -y wrangler@4 d1 execute omr --remote --json --command "$2" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const r=(Array.isArray(j)?j[0]:j).results||[];for(const x of r)console.log(x.detail??JSON.stringify(x))}catch(e){console.log('LỖI: '+s.slice(0,400))}})"; sleep 3; }
          # 12/11 tối (đợt 2 giảm chi phí): cỡ bảng (MAX(rowid) — đọc 1 hàng) + chỉ mục hiện có, để biết dựng chỉ mục mới tốn bao lâu / bao nhiêu hàng.
          # 14/11 00:20: kiểm lần chạy THẬT đầu tiên ảnh chụp đêm OMNI sau bản chỉ-ghi-đổi (2139cc3f7) — chỉ đọc.
          q "Con trỏ đêm" "SELECT gia_tri,cap_nhat_luc FROM cau_hinh WHERE khoa='omni_dem_con_tro'"
          q "omni_em theo mốc" "SELECT cap_nhat_luc,COUNT(*) n FROM omni_em GROUP BY cap_nhat_luc ORDER BY cap_nhat_luc DESC LIMIT 3"
          q "omni_p_vkn tổng + theo mốc đổi" "SELECT COUNT(*) tong,SUM(cap_nhat_luc='2026-11-13T17:00:00.000Z') moc_14,COUNT(DISTINCT sbd) so_em FROM omni_p_vkn"
          q "Bản gọn khớp mốc" "SELECT COUNT(*) n,SUM(g.moc=e.cap_nhat_luc) khop FROM omni_em e LEFT JOIN omni_p_gon g ON g.sbd=e.sbd"
          q "Lỗi máy omni_dem gần đây" "SELECT * FROM loi_may WHERE ma LIKE 'omni%' ORDER BY rowid DESC LIMIT 5"