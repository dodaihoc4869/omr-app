name: Cập nhật siêu vòng lặp theo chiến dịch

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
  workflow_run:
    workflows: ['Phát hành lên Cloudflare Pages']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cap-nhat-vong-chua
  cancel-in-progress: false

jobs:
  cap-nhat:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Làm sạch khóa Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Kiểm công cụ cập nhật trước khi dùng dữ liệu thật
        run: |
          npx vitest run tests/chua-d1-van-hanh.test.ts tests/chua-giao-van-hanh.test.ts --reporter=dot
          npx esbuild scripts/cap-nhat-vong-chua.ts --bundle --platform=node --format=esm --target=node24 --outfile=/tmp/chua-cap-nhat.mjs --log-level=warning
      - name: Bù câu sai mới và mở vòng đã đủ học liệu
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: node /tmp/chua-cap-nhat.mjs
      - name: Dọn Worker giao tạm kể cả khi job dừng
        if: ${{ always() && env.CF_TOKEN_SACH != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: node scripts/don-worker-giao-tam.mjs
