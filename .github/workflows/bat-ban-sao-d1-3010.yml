# BẬT BẢN SAO ĐỌC D1 (thầy 30/10 21:45 «tất cả hs đang ko làm đc bài vì quá lag»). Đo 19:00–21:30 VN: D1 chính bận 2938 giây / 2,5 giờ, lệnh nhỏ của em chờ
# 1,5–7 giây. Mã đã đọc qua `DB.withSession('first-unconstrained')` cho các đường chỉ-đọc (bảng tin thầy 1,3 s/lần, hồ sơ PH, nhịp học …) nhưng
# cơ sở dữ liệu CHƯA bật bản sao ⇒ mọi lệnh vẫn dồn về bản chính. Bật chế độ «auto»: lệnh chỉ-đọc đó sang bản sao, bản chính dành cho em làm bài.
# Đường ghi / đọc-sau-ghi (env.DB thường) vẫn đi bản chính như cũ. Không đổi dữ liệu, không in khoá.
name: Bật bản sao đọc D1
on:
  workflow_dispatch:
  push:
    branches: [claude/bat-ban-sao-d1-3010]
    paths: ['.github/workflows/bat-ban-sao-d1-3010.yml']
permissions:
  contents: read
jobs:
  bat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Xem và bật
        env:
          TOKEN: ${{ env.CF_TOKEN_SACH }}
          ACC: ${{ env.CF_ACC_SACH }}
        run: |
          DB=$(grep -A3 '\[\[d1_databases\]\]' server/wrangler.toml | grep database_id | cut -d'"' -f2)
          API="https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database/$DB"
          curl -sS -H "Authorization: Bearer $TOKEN" "$API" | jq -c '{success, loi: .errors, ten: .result.name, vung: .result.running_in_region, banSao: .result.read_replication, coMb: ((.result.file_size // 0)/1048576|round)}'
          curl -sS -X PATCH -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data '{"read_replication":{"mode":"auto"}}' "$API" | jq -c '{success, loi: .errors, banSao: .result.read_replication}'
          sleep 3
          curl -sS -H "Authorization: Bearer $TOKEN" "$API" | jq -c '{sau: .result.read_replication}'
