# KIỂM CÂU NỐI THÊM CỦA CA 269409 (CHỈ ĐỌC) — tờ đáp án R2 thiếu 217 câu mà đề công khai có; bảng `kho_ca_them` có giữ đáp án của chúng không?
# Chỉ in SỐ ĐẾM (repo công khai). Cùng khung với kiem-ca-mo.yml: chỉ SELECT, khoá Cloudflare làm sạch trước khi dùng.
name: Kiểm câu nối thêm của ca (chỉ đọc)
on:
  workflow_dispatch:
  push:
    branches: [claude/gracious-heisenberg-hoe97n]
    paths: ['.github/workflows/kiem-kho-ca-them-0610.yml', 'scripts/kiem-kho-ca-them-0610.sql']
permissions:
  contents: read
concurrency:
  group: kiem-kho-ca-them-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kiem:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tệp SQL chỉ có SELECT
        run: |
          if grep -v '^\s*--' scripts/kiem-kho-ca-them-0610.sql | grep -iqE '\b(INSERT|UPDATE|DELETE|DROP|ALTER|CREATE|REPLACE|TRUNCATE|PRAGMA)\b'; then echo "Tệp có lệnh không chỉ-đọc — dừng."; exit 1; fi
          echo "OK: chỉ SELECT"
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Đếm câu nối thêm (chỉ đọc)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          # Chế độ --file của wrangler chỉ in tóm tắt, không in hàng kết quả ⇒ dùng --command (đúng câu SELECT trong tệp) + --json để thấy hai con số.
          SQL=$(grep -v '^\s*--' ../scripts/kiem-kho-ca-them-0610.sql | tr '\n' ' ')
          npx -y wrangler@4 d1 execute omr --remote --json --command "$SQL"
