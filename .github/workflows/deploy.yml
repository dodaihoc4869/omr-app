# PHÁT HÀNH APP LÊN CLOUDFLARE PAGES — https://omr-app-b3u.pages.dev/
#
# Thầy chốt 14/09: chỉ còn MỘT nơi phát hành. GitHub Pages bị bỏ hẳn, không còn
# job nào đẩy lên đó nữa — để hai nơi cùng sống thì mỗi lần đẩy mã lại sinh một
# bản app song song, và em nào giữ link cũ sẽ làm bài trên bản khác với bản Thầy
# đang chấm.
#
# CẦN ĐẶT MỘT LẦN, trong repo → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   (quyền: Cloudflare Pages — Edit)
#   CLOUDFLARE_ACCOUNT_ID  (mã tài khoản Cloudflare)
# Đặt xong thì mọi lần đẩy mã lên main đều tự phát hành, không ai phải bấm gì.
name: Phát hành lên Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phat-hanh
  cancel-in-progress: true

jobs:
  phat-hanh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # CỔNG KIỂM CHẠY TRƯỚC, và hỏng là DỪNG — không phát hành bản lỗi.
      - run: npm run check:mau
      - run: npm test -- --run

      # KHÔNG đặt GITHUB_PAGES: cờ đó đổi địa chỉ gốc thành /omr-app/, chỉ đúng
      # cho GitHub Pages. Đặt nhầm thì pages.dev tải tài nguyên sai đường và mở
      # ra trang trắng.
      - run: npm run build

      - name: Đẩy lên Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=omr-app --branch=main
