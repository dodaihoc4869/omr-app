# CÔNG TẮC MÁY SOẠN «LỜI GIẢI KIỂU SƠ ĐỒ» CHẠY BẰNG CRON (27/10; mã server/src/may-soan-cron.ts). Thầy: «Tự làm hết đi», «tôi ko làm gì cả».
# Ghi MỘT dòng cấu hình `cau_hinh.may_soan_so_do` = {"bat":bool,"gioCaoDiem":bool,"tuSuaDapAn":bool} (UPSERT theo khoá) — không đụng dữ liệu học sinh.
#   bat        ⇒ cron mỗi phút của Worker soạn tiếp một lô nhỏ (quét hết kho ⇒ vòng sửa câu lệch ⇒ xong) · false ⇒ dừng ngay.
#   gioCaoDiem ⇒ cho chạy cả 19–24h giờ VN (khi ấy chỉ 1 câu song song).
#   tuSuaDapAn ⇒ cho máy tự đổi đáp án kho khi 2 lần giải mù cùng ra số khác (MẶC ĐỊNH TẮT: lời giải chữ trong gói vẫn ghi đáp án cũ).
# Máy chủ đọc cờ qua đệm 15 giây. Sau khi ghi, in lại cờ + trạng thái máy soạn: CHỈ vòng / số đếm / lý do — KHÔNG in đáp án hay nội dung câu (repo công khai).
name: Công tắc máy soạn lời giải sơ đồ (27/10)
on:
  workflow_dispatch:
    inputs:
      bat:
        description: 'Bật máy soạn chạy bằng cron'
        required: true
        default: true
        type: boolean
      gioCaoDiem:
        description: 'Cho chạy cả giờ cao điểm 19–24h (chậm lại: 1 câu song song)'
        required: true
        default: true
        type: boolean
      tuSuaDapAn:
        description: 'Cho tự sửa đáp án kho (mặc định TẮT)'
        required: true
        default: false
        type: boolean
      vongSuaLai:
        description: 'Máy đã «xong» ⇒ chạy THÊM một vòng sửa các câu còn lộ / lệch / thiếu sơ đồ / thừa số không đọc được (chỉ đổi trạng thái máy soạn)'
        required: false
        default: false
        type: boolean
      trinhBayLai:
        description: 'Câu ĐẠT trình bày chưa chuẩn (thiếu «?», có H mà không nhân H/100, thừa số thiếu nghĩa) ⇒ đánh dấu để vòng sửa soạn lại (bản cũ vẫn hiện tới khi có bản đạt mới)'
        required: false
        default: false
        type: boolean
      anDuSoanLai:
        description: 'Câu ĐẠT còn dính ẩn dụ tiền / nhà (thầy 26/10 đã bỏ) ⇒ ẩn khỏi học sinh và để vòng sửa soạn lại'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: bat-may-soan-so-do-2710
  cancel-in-progress: false
jobs:
  bat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Dựng giá trị cờ (lọc ký tự, không chèn chuỗi thô vào SQL)
        env:
          BAT: ${{ inputs.bat }}
          GIO_CAO_DIEM: ${{ inputs.gioCaoDiem }}
          TU_SUA: ${{ inputs.tuSuaDapAn }}
        run: |
          python3 - <<'PY'
          import json, os
          la = lambda k: os.environ.get(k, '').strip().lower() == 'true'
          v = json.dumps({'bat': la('BAT'), 'gioCaoDiem': la('GIO_CAO_DIEM'), 'tuSuaDapAn': la('TU_SUA')})
          open('/tmp/lenh.sql', 'w').write(f"INSERT INTO cau_hinh (khoa, gia_tri, cap_nhat_luc) VALUES ('may_soan_so_do', '{v}', strftime('%Y-%m-%dT%H:%M:%fZ','now')) ON CONFLICT(khoa) DO UPDATE SET gia_tri = excluded.gia_tri, cap_nhat_luc = excluded.cap_nhat_luc;")
          print('sẽ ghi:', v)
          PY
      - name: Ghi cờ rồi đọc lại + trạng thái máy soạn (chỉ số đếm)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          set -o pipefail
          # --file chạy xong in rỗng (27/10 lượt 40414388537) ⇒ ghi bằng --command; câu SQL chỉ chứa 3 giá trị true/false đã lọc.
          npx -y wrangler@4 d1 execute omr --remote --json --command "$(cat /tmp/lenh.sql)" | jq -c '[.[] | .success]' | sed 's/^/ghi: /'
          npx -y wrangler@4 d1 execute omr --remote --json --command "SELECT khoa, gia_tri, cap_nhat_luc FROM cau_hinh WHERE khoa = 'may_soan_so_do'" | jq -c '.[0].results'
          # Bảng trạng thái do cron tự tạo ở lượt đầu ⇒ lần đầu bật có thể chưa có (báo «chưa chạy lượt nào»).
          NOW=$(date +%s%3N)
          npx -y wrangler@4 d1 execute omr --remote --json --command "SELECT vong, so_loi_lien_tiep, CASE WHEN nghi_den > $NOW THEN ROUND((nghi_den - $NOW) / 60000.0, 1) ELSE 0 END AS con_nghi_phut, CASE WHEN dang_chay_den > $NOW THEN 1 ELSE 0 END AS dang_chay, ly_do, dem_json, cap_nhat_luc FROM may_soan_trang_thai WHERE id = 1" 2>/dev/null | jq -c '.[0].results' || echo 'chưa chạy lượt nào (bảng trạng thái chưa có)'
          npx -y wrangler@4 d1 execute omr --remote --json --command "SELECT cong, COUNT(*) AS so_cau, SUM(nghi_dap_an) AS nghi_dap_an FROM loi_giai_so_do GROUP BY cong ORDER BY cong" 2>/dev/null | jq -c '.[0].results' || echo 'chưa có lời giải sơ đồ nào'
          # Lý do cổng (27/10): chỉ 40 ký tự đầu, MỌI chữ số thay bằng # (repo công khai: không lộ đáp án / số liệu câu).
          npx -y wrangler@4 d1 execute omr --remote --json --command "SELECT cong, substr(COALESCE(ly_do, ''), 1, 40) AS ly_do, COUNT(*) AS so_cau FROM loi_giai_so_do WHERE cong = 'khong_kiem_duoc' GROUP BY 1, 2 ORDER BY 3 DESC LIMIT 15" 2>/dev/null | jq -c '.[0].results[] | .ly_do |= gsub("[0-9]"; "#")' || echo 'chưa đọc được lý do'
          # Theo model (27/10: có Workers AI khi Gemini hết hạn mức) — để thầy chê chữ của model nào thì lọc được đúng các dòng ấy.
          npx -y wrangler@4 d1 execute omr --remote --json --command "SELECT model, cong, COUNT(*) AS so_cau FROM loi_giai_so_do GROUP BY 1, 2 ORDER BY 1, 2" 2>/dev/null | jq -c '.[0].results' || echo 'chưa đọc được theo model'
          # trinhBayLai: chỉ ghi ly_do = 'trinh_bay_lai' trên dòng đạt (cong giữ 'dat' ⇒ em vẫn thấy bản cũ); cần vongSuaLai nếu máy đã «xong».
          if [ "${{ inputs.trinhBayLai }}" = "true" ]; then
            npx -y wrangler@4 d1 execute omr --remote --json --command "UPDATE loi_giai_so_do SET ly_do = 'trinh_bay_lai' WHERE cong = 'dat' AND ((NOT EXISTS (SELECT 1 FROM json_each(ban_json, '\$.soDo.nut') n, json_each(n.value, '\$.soLieu') s WHERE s.value LIKE '%?%') AND NOT EXISTS (SELECT 1 FROM json_each(ban_json, '\$.soDo.nut') n WHERE json_extract(n.value, '\$.tong') LIKE '%?%')) OR (EXISTS (SELECT 1 FROM json_each(ban_json, '\$.soDo.muiTen') m WHERE json_extract(m.value, '\$.H') IS NOT NULL AND json_extract(m.value, '\$.H') <> 100) AND ban_json NOT LIKE '%/100%' AND ban_json NOT LIKE '%100/%') OR EXISTS (SELECT 1 FROM json_each(ban_json, '\$.buoc') b, json_each(b.value, '\$.thuaSo') t WHERE json_extract(t.value, '\$.nghia') IS NULL OR length(trim(json_extract(t.value, '\$.nghia'))) < 3))" | jq -c '[.[] | .meta.changes]' | sed 's/^/đánh dấu trình bày lại: /'
          fi
          # vongSuaLai: chỉ đặt lại trạng thái máy soạn (vòng 'sua', con trỏ đầu) — không đụng bảng lời giải.
          if [ "${{ inputs.vongSuaLai }}" = "true" ]; then
            npx -y wrangler@4 d1 execute omr --remote --json --command "UPDATE may_soan_trang_thai SET vong = 'sua', con_tro = '', ly_do = 'thêm một vòng sửa' WHERE id = 1 AND vong = 'xong'" | jq -c '[.[] | .meta.changes]' | sed 's/^/mở thêm vòng sửa: /'
          fi
          # anDuSoanLai: chỉ đổi cong 'dat' ⇒ 'lech' (bảng lời giải máy tự sinh, chỉ-thêm) để vòng sửa soạn lại; không xoá dòng nào.
          if [ "${{ inputs.anDuSoanLai }}" = "true" ]; then
            npx -y wrangler@4 d1 execute omr --remote --json --command "UPDATE loi_giai_so_do SET cong = 'lech', ly_do = 'Bản dùng ẩn dụ tiền / nhà / giàu / thuế (thầy đã bỏ).' WHERE cong = 'dat' AND (ban_json LIKE '%tiền%' OR ban_json LIKE '%giàu%' OR ban_json LIKE '%nghèo%' OR ban_json LIKE '%thuế%')" | jq -c '[.[] | .meta.changes]' | sed 's/^/đưa về soạn lại: /'
          fi
          # Thầy 26/10 bỏ ẩn dụ tiền nhà: đếm câu ĐẠT còn dính chữ tiền / giàu / nghèo / thuế (chỉ số đếm, không in nội dung).
          npx -y wrangler@4 d1 execute omr --remote --json --command "SELECT COUNT(*) AS dat_con_an_du FROM loi_giai_so_do WHERE cong = 'dat' AND (ban_json LIKE '%tiền%' OR ban_json LIKE '%giàu%' OR ban_json LIKE '%nghèo%' OR ban_json LIKE '%thuế%')" 2>/dev/null | jq -c '.[0].results' || echo 'chưa đếm được ẩn dụ'
          # Còn bao nhiêu (27/10): tổng câu trong kho (như máy soạn quét) và số câu SAU con trỏ vòng chính (mọi loại câu; máy chỉ soạn câu tính trong đó).
          npx -y wrangler@4 d1 execute omr --remote --json --command "SELECT COUNT(*) AS tong_kho, SUM(CASE WHEN q.ma_de > substr(t.con_tro, 1, instr(t.con_tro, '|') - 1) OR (q.ma_de = substr(t.con_tro, 1, instr(t.con_tro, '|') - 1) AND q.qid > substr(t.con_tro, instr(t.con_tro, '|') + 1)) THEN 1 ELSE 0 END) AS con_sau_con_tro FROM game_v2_question q JOIN de_kho d ON d.ma_de = q.ma_de JOIN game_v2_index g ON g.ma_de = d.ma_de AND g.source_version = d.cap_nhat_luc JOIN may_soan_trang_thai t ON t.id = 1 WHERE COALESCE(d.da_xoa, 0) = 0" 2>/dev/null | jq -c '.[0].results' || echo 'chưa đếm được phần còn lại'
          # Soát chữ hiển thị (27/10, thầy hỏi «giao diện công thức sơ đồ mọi câu chuẩn chỉ đẹp mắt chưa»): đếm câu ĐẠT có dấu vết dễ vỡ hiển thị — CHỈ số đếm.
          npx -y wrangler@4 d1 execute omr --remote --json --command "SELECT SUM(ban_json LIKE '%\$%') AS dola, SUM(ban_json LIKE '%\\\\frac%' OR ban_json LIKE '%\\\\cdot%' OR ban_json LIKE '%\\\\times%' OR ban_json LIKE '%\\\\text%') AS latex, SUM(ban_json LIKE '%**%') AS markdown, SUM(ban_json LIKE '%<%') AS the_html, SUM(ban_json LIKE '% per %' OR ban_json LIKE '% of %' OR ban_json LIKE '% the %' OR ban_json LIKE '% and %') AS tieng_anh, SUM(ban_json LIKE '%\\n%') AS xuong_dong, SUM(ban_json LIKE '%sqrt%' OR ban_json LIKE '%√%') AS can, SUM(ban_json LIKE '%^{%' OR ban_json LIKE '%_{%') AS ngoac_nhon, COUNT(*) AS tong_dat FROM loi_giai_so_do WHERE cong = 'dat'" 2>/dev/null | jq -c '.[0].results' || echo 'chưa soát được chữ hiển thị'
          # Soát CẤU TRÚC câu đạt (27/10, thầy «Kiểm kĩ vào»): sơ đồ / bước / độ dài chữ / dấu hỏi / hiệu suất — CHỈ số đếm.
          npx -y wrangler@4 d1 execute omr --remote --json --command "WITH d AS (SELECT ban_json AS j FROM loi_giai_so_do WHERE cong = 'dat') SELECT COUNT(*) AS tong, SUM(json_type(j, '$.soDo') IS NULL OR json_array_length(j, '$.soDo.nut') < 2) AS khong_so_do, SUM(json_array_length(j, '$.soDo.nut') > 3) AS nut_qua_3, SUM(json_array_length(j, '$.buoc') > 3) AS buoc_qua_3, SUM(length(json_extract(j, '$.deNoiGi')) > 220) AS de_noi_dai, SUM(EXISTS (SELECT 1 FROM json_each(j, '$.buoc') b WHERE json_array_length(b.value, '$.thuaSo') > 8)) AS thua_so_qua_8, SUM(EXISTS (SELECT 1 FROM json_each(j, '$.buoc') b, json_each(b.value, '$.thuaSo') t WHERE length(json_extract(t.value, '$.so')) > 14)) AS so_dai, SUM(EXISTS (SELECT 1 FROM json_each(j, '$.buoc') b, json_each(b.value, '$.thuaSo') t WHERE length(json_extract(t.value, '$.nghia')) > 70)) AS nghia_dai, SUM(EXISTS (SELECT 1 FROM json_each(j, '$.buoc') b WHERE length(json_extract(b.value, '$.ten')) > 16)) AS ten_buoc_dai, SUM(EXISTS (SELECT 1 FROM json_each(j, '$.soDo.nut') n WHERE length(json_extract(n.value, '$.chat')) > 14 OR json_extract(n.value, '$.chat') GLOB '* *')) AS chat_dai, SUM(EXISTS (SELECT 1 FROM json_each(j, '$.soDo.nut') n WHERE length(json_extract(n.value, '$.tong')) > 22)) AS tong_dai, SUM(EXISTS (SELECT 1 FROM json_each(j, '$.soDo.nut') n, json_each(n.value, '$.soLieu') s WHERE length(s.value) > 22)) AS so_lieu_dai, SUM(EXISTS (SELECT 1 FROM json_each(j, '$.soDo.nut') n WHERE json_array_length(n.value, '$.soLieu') > 4)) AS so_lieu_qua_4, SUM(NOT EXISTS (SELECT 1 FROM json_each(j, '$.soDo.nut') n, json_each(n.value, '$.soLieu') s WHERE s.value LIKE '%?%') AND NOT EXISTS (SELECT 1 FROM json_each(j, '$.soDo.nut') n WHERE json_extract(n.value, '$.tong') LIKE '%?%')) AS thieu_dau_hoi, SUM(EXISTS (SELECT 1 FROM json_each(j, '$.soDo.muiTen') m WHERE json_extract(m.value, '$.H') IS NOT NULL) AND j NOT LIKE '%/100%' AND j NOT LIKE '%100/%') AS co_H_khong_dung, SUM(EXISTS (SELECT 1 FROM json_each(j, '$.buoc') b, json_each(b.value, '$.thuaSo') t WHERE json_extract(t.value, '$.nghia') IS NULL OR length(trim(json_extract(t.value, '$.nghia'))) < 3)) AS thieu_nghia, SUM(EXISTS (SELECT 1 FROM json_each(j, '$.buoc') b, json_each(b.value, '$.thuaSo') t WHERE json_extract(t.value, '$.so') GLOB '*[a-zA-Z]*' AND json_extract(t.value, '$.so') NOT GLOB '*_*')) AS so_co_chu, ROUND(AVG((SELECT SUM(json_array_length(b.value, '$.thuaSo')) FROM json_each(j, '$.buoc') b)), 1) AS tb_thua_so FROM d" 2>/dev/null | jq -c '.[0].results' || echo 'chưa soát được cấu trúc'
