# ĐO ĐỀ THIẾU CÂU TRÊN APP THẦY (CHỈ ĐỌC) — thầy 14/11: «đề hiển thị trên app gv nhiều câu bị thiếu, app hs thì đủ … kiểm tra kĩ khắc phục triệt để».
# Máy em lấy câu từ kho máy chủ (game_v2_question); bảng Dạy học / Live của thầy dựng từ kho trên máy thầy qua `khoDayHoc`
# (src/lib/day-hoc-len-bang.ts), có bước KHỬ TRÙNG câu giữa các đề cùng nhánh (`khuTrungNguon`, «cùng hạng thì bản tới trước giữ»,
# IndexedDB trả đề theo thứ tự mã đề). Bước này mô phỏng ĐÚNG thuật toán đó trên kho máy chủ và in: đề nào mất bao nhiêu câu, câu bị giữ ở đề nào.
# Chỉ SELECT; chỉ in mã đề / thư mục / số câu / 60 kí tự đầu đề — không đáp án, không học sinh.
name: Đo đề thiếu câu trên app thầy (chỉ đọc)
on:
  workflow_dispatch:
  push:
    branches: [claude/live-streaming-classroom-e4juo5]
    paths: ['.github/workflows/do-de-thieu-cau-1411.yml']
permissions:
  contents: read
jobs:
  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Kho đề + câu nhánh DẠY HỌC (chỉ SELECT)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          npx -y wrangler@4 d1 execute omr --remote --json --command "SELECT d.ma_de, d.ten_de, d.lop, d.so_cau, t.thu_muc FROM de_kho d LEFT JOIN de_kho_thu_muc t ON t.ma_de = d.ma_de WHERE COALESCE(d.da_xoa,0) = 0 ORDER BY d.ma_de" > /tmp/de.json
          npx -y wrangler@4 d1 execute omr --remote --json --command "SELECT q.ma_de, q.qid, json_extract(q.json,'$.phan') AS p, json_extract(q.json,'$.text') AS t, json_extract(q.json,'$.choices') AS c, json_extract(q.json,'$.ideas') AS i, (json_extract(q.json,'$.thanCauImg') IS NOT NULL) AS anh, (json_extract(q.json,'$.table') IS NOT NULL) AS bang, json_array_length(COALESCE(json_extract(q.json,'$.hinhAnh'),'[]')) AS hinh FROM game_v2_question q JOIN de_kho d ON d.ma_de = q.ma_de JOIN game_v2_index g ON g.ma_de = d.ma_de AND g.source_version = d.cap_nhat_luc LEFT JOIN de_kho_thu_muc t ON t.ma_de = d.ma_de WHERE COALESCE(d.da_xoa,0) = 0 AND (q.ma_de LIKE 'DH-%' OR q.ma_de LIKE 'DB-%' OR t.thu_muc LIKE '%DẠY HỌC%' OR t.thu_muc LIKE '%Dạy học%' OR t.thu_muc LIKE '%dạy học%')" > /tmp/cau.json
          ls -la /tmp/de.json /tmp/cau.json
      - name: Mô phỏng khoDayHoc của máy thầy
        run: |
          node - <<'EOF'
          const fs = require('fs')
          const rows = (f) => { const j = JSON.parse(fs.readFileSync(f, 'utf8')); return (Array.isArray(j) ? j[0] : j).results || [] }
          const de = rows('/tmp/de.json'), cau = rows('/tmp/cau.json')
          const thuMuc = new Map(de.map((d) => [d.ma_de, d.thu_muc || '']))
          // Thư mục của các đề DB-* / DH-* (để biết DB-* có nằm trong nhánh DẠY HỌC của máy thầy không)
          const dem = {}; for (const d of de) if (/^(DB|DH)-/.test(d.ma_de)) { const k = d.ma_de.slice(0, 2) + ' | ' + (d.thu_muc || '(không thư mục)'); dem[k] = (dem[k] || 0) + 1 }
          console.log('THƯ MỤC CỦA ĐỀ DB-/DH-:'); for (const [k, v] of Object.entries(dem).sort()) console.log('  ', k, ':', v)
          const laDayHoc = (ma) => /D[ẠA]Y H[ỌO]C/i.test((thuMuc.get(ma) || '').normalize('NFC').toUpperCase()) || ma.toUpperCase().startsWith('DH-')
          const dacBiet = (ma) => /(?:^|-)(?:VD|VDMH|DT|DTTT)(?:-|$)/i.test(ma)
          const rut = (s) => String(s ?? '').replace(/\s+/g, ' ').trim()
          const arr = (x) => { try { const a = JSON.parse(x); return Array.isArray(a) ? a : null } catch { return null } }
          const khoa = (q) => { const c = arr(q.c), i = arr(q.i); const phu = c && c.length ? c.map(rut).join('|') : i && i.length ? i.map(rut).join('|') : ''; return rut(q.t) + '⟂' + phu }
          // Gom câu theo đề, trong đề theo phần I → II → III (như phanI/phanII/phanIII)
          const theoDe = new Map()
          for (const q of cau) { if (!laDayHoc(q.ma_de)) continue; (theoDe.get(q.ma_de) || theoDe.set(q.ma_de, []).get(q.ma_de)).push(q) }
          const ord = { I: 0, II: 1, III: 2 }
          const ma = [...theoDe.keys()].sort() // IndexedDB getAll theo khoá maDe
          const phoThong = ma.filter((m) => !dacBiet(m))
          const daCo = new Map(), mat = new Map()
          for (const m of phoThong) {
            const ds = theoDe.get(m).slice().sort((a, b) => (ord[a.p] ?? 9) - (ord[b.p] ?? 9))
            for (const q of ds) { const k = khoa(q); if (daCo.has(k)) { (mat.get(m) || mat.set(m, []).get(m)).push({ q, giu: daCo.get(k) }) } else daCo.set(k, m) }
          }
          let tong = 0, soDe = 0
          console.log('\nĐỀ NHÁNH DẠY HỌC:', ma.length, '(phổ thông', phoThong.length + ', đặc biệt', ma.length - phoThong.length + ')', '· câu', [...theoDe.values()].reduce((s, x) => s + x.length, 0))
          console.log('\nĐỀ BỊ MẤT CÂU TRÊN MÁY THẦY (mã đề · thư mục · còn / có · mất · câu bị giữ ở đề nào):')
          for (const m of phoThong) {
            const l = mat.get(m); if (!l) continue
            tong += l.length; soDe++
            const giu = {}; for (const x of l) giu[x.giu] = (giu[x.giu] || 0) + 1
            console.log(`  ${m} · ${thuMuc.get(m) || ''} · còn ${theoDe.get(m).length - l.length}/${theoDe.get(m).length} · mất ${l.length} · giữ ở ${Object.entries(giu).map(([k, v]) => k + '×' + v).join(', ')}`)
          }
          console.log(`\nTỔNG: ${soDe} đề mất ${tong} câu`)
          const ma12 = ['DH-12-C3-B9-P2', 'DB-12-B9-P2-D2']
          for (const m of ma12) console.log('\nMẪU', m, ':', (theoDe.get(m) || []).length, 'câu; mất', (mat.get(m) || []).length, (mat.get(m) || []).slice(0, 40).map((x) => `${x.q.p}:${x.q.qid.split('-').pop()}→${x.giu}`).join(' '))
          const en = cau.filter((q) => /Enkephalin/.test(q.t || ''))
          for (const q of en) console.log('ENKEPHALIN', q.ma_de, q.qid, 'dài', (q.t || '').length, 'ảnh', q.anh, 'bảng', q.bang, 'hình', q.hinh, '|', (q.t || '').slice(-70))
          EOF
