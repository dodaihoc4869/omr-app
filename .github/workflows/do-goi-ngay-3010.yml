# ĐO GÓI BÀI CẢ NGÀY TRÊN BẢN SỐNG (CHỈ ĐỌC) — thầy 29/10 «app hs … tốc độ tức thì ở mọi khung giờ». Chỉ SELECT gộp: không mã em, không tên.
# Chạy lại 30/10 19:05 VN (soi «Máy chủ chưa trả được đề» ở Câu đã làm: mã sổ có hậu tố #n / ~ss|bt|yd).
# Chạy lại 30/10 17:55 VN (kiểm trước giờ cao điểm, sau #627–#629).
# Phiên mở từ gói (`goiNgay: 1`, lệnh hoc-tap-mo-goi) so với phiên đường cũ (hoc-tap-start / bản sẵn), theo giờ VN; câu đã nộp trong từng loại phiên.
name: Đo gói bài cả ngày (chỉ đọc)
on:
  workflow_dispatch:
  push:
    branches: [claude/do-goi-ngay-3010]
    paths: ['.github/workflows/do-goi-ngay-3010.yml']
permissions:
  contents: read
concurrency:
  group: do-goi-ngay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Đếm (chỉ SELECT)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          q() { echo "== $1"; npx -y wrangler@4 d1 execute omr --remote --json --command "$2" | jq -c ".[0].results" || echo "(lỗi)"; }
          echo "Giờ VN: $(TZ=Asia/Ho_Chi_Minh date '+%d/%m %H:%M')"
          q "phiên học 3 giờ qua theo giờ VN: tổng · từ gói · đường cũ · số em dùng gói" \
            "SELECT strftime('%H', created_at, '+7 hours') gio, COUNT(*) tong, SUM(json_extract(json,'\$.goiNgay')=1) tu_goi, SUM(COALESCE(json_extract(json,'\$.goiNgay'),0)<>1) duong_cu, COUNT(DISTINCT CASE WHEN json_extract(json,'\$.goiNgay')=1 THEN sbd END) em_goi FROM game_v2_session WHERE created_at >= strftime('%Y-%m-%dT%H:%M:%fZ','now','-3 hours') AND json_extract(json,'\$.hocTap')=1 GROUP BY 1 ORDER BY 1"
          q "câu đã nộp 3 giờ qua: trong phiên từ gói · phiên đường cũ" \
            "SELECT SUM(json_extract(s.json,'\$.goiNgay')=1) tu_goi, SUM(COALESCE(json_extract(s.json,'\$.goiNgay'),0)<>1) duong_cu FROM game_v2_attempt a JOIN game_v2_session s ON s.id=a.session WHERE s.created_at >= strftime('%Y-%m-%dT%H:%M:%fZ','now','-3 hours') AND json_extract(s.json,'\$.hocTap')=1"
          q "phiên từ gói 3 giờ qua: số câu trong phiên (câu: số phiên)" \
            "SELECT json_array_length(json,'\$.questions') so_cau, COUNT(*) n FROM game_v2_session WHERE created_at >= strftime('%Y-%m-%dT%H:%M:%fZ','now','-3 hours') AND json_extract(json,'\$.goiNgay')=1 GROUP BY 1 ORDER BY 1"
          q "phiên học hôm nay KHÔNG có câu nào (phiên rỗng): từ gói · đường cũ" \
            "SELECT SUM(json_extract(json,'\$.goiNgay')=1) tu_goi, SUM(COALESCE(json_extract(json,'\$.goiNgay'),0)<>1) duong_cu FROM game_v2_session WHERE created_at >= strftime('%Y-%m-%dT%H:%M:%fZ','now','-6 hours') AND json_extract(json,'\$.hocTap')=1 AND COALESCE(json_array_length(json,'\$.questions'),0)=0"
          q "sổ học hôm nay theo nguồn (số dòng · số em): kiểm #629 câu Tự luyện" \
            "SELECT nguon, COUNT(*) dong, COUNT(DISTINCT sbd) em FROM su_kien_hoc WHERE ngay_vn=strftime('%Y-%m-%d','now','+7 hours') GROUP BY nguon ORDER BY dong DESC"
          q "sổ học hôm nay: dòng mã có hậu tố lượt lặp #n · bản ảo ~ss|~bt|~yd · tổng" \
            "SELECT SUM(qid GLOB '*#[0-9]*') lap, SUM(qid GLOB '*~ss[0-9]*' OR qid GLOB '*~bt[0-9]*' OR qid GLOB '*~yd[0-9]*') ao, COUNT(*) tong FROM su_kien_hoc WHERE ngay_vn=strftime('%Y-%m-%d','now','+7 hours')"
          q "cặp (em, câu gốc) hôm nay có bản ảo ~ss|~bt|~yd mà KHÔNG có dòng mã gốc nào (mọi ngày): số cặp · số em" \
            "WITH a AS (SELECT DISTINCT sbd, substr(qid,1,instr(qid,'~')-1) goc FROM su_kien_hoc WHERE (qid GLOB '*~ss[0-9]*' OR qid GLOB '*~bt[0-9]*' OR qid GLOB '*~yd[0-9]*') AND ngay_vn=strftime('%Y-%m-%d','now','+7 hours')) SELECT COUNT(*) cap, COUNT(DISTINCT sbd) em FROM a WHERE NOT EXISTS (SELECT 1 FROM su_kien_hoc s WHERE s.sbd=a.sbd AND s.qid=a.goc)"
          q "câu gốc của bản ảo hôm nay KHÔNG có trong kho (cau_meta / game_v2_question): số câu" \
            "WITH a AS (SELECT DISTINCT substr(qid,1,instr(qid,'~')-1) goc FROM su_kien_hoc WHERE instr(qid,'~')>0 AND ngay_vn=strftime('%Y-%m-%d','now','+7 hours')) SELECT COUNT(*) n FROM a WHERE NOT EXISTS (SELECT 1 FROM game_v2_question g WHERE g.qid=a.goc)"
          q "cặp (em, câu gốc) 7 ngày qua chỉ có mã lượt lặp #n, KHÔNG có dòng mã gốc (Câu đã làm xin chi tiết theo mã gốc ⇒ rỗng): số cặp · số em" \
            "WITH l AS (SELECT DISTINCT sbd, substr(qid,1,instr(qid,'#')-1) goc FROM su_kien_hoc WHERE qid GLOB '*#[0-9]*' AND ngay_vn>=date('now','+7 hours','-7 days')) SELECT COUNT(*) cap, COUNT(DISTINCT sbd) em FROM l WHERE NOT EXISTS (SELECT 1 FROM su_kien_hoc s WHERE s.sbd=l.sbd AND s.qid=l.goc)"
          q "hành trình đang chạy (bước kiểm phát hành «ba hành trình»): mã · trạng thái · tạo lúc" \
            "SELECT id, trang_thai, substr(COALESCE(tao_luc,''),1,16) tao FROM chien_dich WHERE trang_thai='dang_chay' ORDER BY id"
          q "kho theo khối + biên nhận gộp" "SELECT khoa, length(gia_tri) dai FROM cau_hinh WHERE khoa IN ('hanh_trinh_v3_kho_10','hanh_trinh_v3_kho_11','hanh_trinh_v3_kho_12','hanh_trinh_3_0910_v1')"
