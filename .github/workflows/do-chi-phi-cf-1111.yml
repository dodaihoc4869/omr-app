# ĐO CHI PHÍ CLOUDFLARE (CHỈ ĐỌC, 11/11 — thầy: «Tôi chỉ đk gói 5 đô tại sao lại trừ [127,61 USD]. Tìm hiểu kĩ nguyên nhân»). Kịch bản: scripts/do-chi-phi-cf-1111.mjs.
# Chỉ gọi ĐỌC (REST gói / hoá đơn, GraphQL Analytics); không SELECT trên D1, không ghi, không in khoá / mã tài khoản / thông tin cá nhân.
name: Đo chi phí Cloudflare (chỉ đọc)
on:
  workflow_dispatch:
  push:
    branches: [claude/trusting-ritchie-xo0ipg]
    paths: ['.github/workflows/do-chi-phi-cf-1111.yml', 'scripts/do-chi-phi-cf-1111.mjs']
permissions:
  contents: read
concurrency:
  group: do-chi-phi-cf
  cancel-in-progress: true
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_ID: d2e6d322-374a-45d7-83a3-9fac486b23f1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Đo (chỉ đọc)
        run: node scripts/do-chi-phi-cf-1111.mjs
      - name: Bảng giá chính thức (đọc trang công khai của Cloudflare)
        run: |
          for u in workers/platform/pricing d1/platform/pricing durable-objects/platform/pricing workers/observability/logs/workers-logs workers-ai/platform/pricing r2/pricing realtime/sfu/pricing realtime/turn/pricing; do
            echo "=================== https://developers.cloudflare.com/$u/"
            curl -sL "https://developers.cloudflare.com/$u/" | sed -e 's/<\/t[dh]>/ | /g' -e 's/<\/tr>/\n/g' -e 's/<\/p>/\n/g' -e 's/<\/li>/\n/g' -e 's/<[^>]*>//g' -e 's/&nbsp;/ /g' -e 's/&#x27;/'"'"'/g' \
              | tr -s ' \t' ' ' | grep -iE '\$[0-9]|included|per million|per GB|GB-s|million|first [0-9]|free|per month|billed|neurons' | grep -v '^ *$' | awk 'length($0) < 400' | head -n 45
          done

