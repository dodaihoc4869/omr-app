# ĐO MỘT EM (CHỈ ĐỌC) — thầy hỏi «em X được phân bao nhiêu câu». Số báo danh nhập tay lúc chạy, CHE trong nhật ký (::add-mask::), không ghi vào mã.
# Chỉ SELECT: mức hôm nay (chặng học), hạn ngạch từng bài, đã làm hôm nay theo nguồn, Sửa lỗi hôm nay, phiên học hôm nay (số câu mỗi phiên). Không in mã em.
name: Đo một em (chỉ đọc)
on:
  workflow_dispatch:
    inputs:
      sbd:
        description: 'Số báo danh (che trong nhật ký)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Che số báo danh
        run: |
          S=$(jq -r '.inputs.sbd' "$GITHUB_EVENT_PATH" | tr -cd '0-9A-Za-z')
          echo "::add-mask::$S"
          echo "SBD_EM=$S" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Đếm (chỉ SELECT)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          S="'${SBD_EM}'"
          HOM=$(TZ=Asia/Ho_Chi_Minh date +%F)
          q() { echo "== $1"; npx -y wrangler@4 d1 execute omr --remote --json --command "$2" | jq -c ".[0].results" || echo "(lỗi)"; }
          echo "Giờ VN: $(TZ=Asia/Ho_Chi_Minh date '+%d/%m %H:%M') · hôm nay $HOM"
          q "mức hôm nay (chặng học): tầng · tối thiểu tầng · hạn ngạch · mức" "SELECT tang, toi_thieu_tang, quota, muc FROM goi_bai_7_muc_ngay WHERE sbd=$S AND ngay='$HOM'"
          q "hạn ngạch từng bài hôm nay" "SELECT g.goi_id, substr(COALESCE(b.ten,''),1,40) ten, g.quota FROM goi_bai_7_ngay g LEFT JOIN goi_bai_7 b ON b.id=g.goi_id WHERE g.sbd=$S AND g.ngay='$HOM'"
          q "sổ học hôm nay theo nguồn: số câu khác nhau · số dòng" "SELECT nguon, COUNT(DISTINCT qid) cau, COUNT(*) dong FROM su_kien_hoc WHERE sbd=$S AND ngay_vn='$HOM' GROUP BY nguon"
          q "Sửa lỗi hôm nay: mục tiêu · số việc · đã xong · thêm" "SELECT (SELECT muc_tieu FROM tu_sua_muc_tieu_ngay WHERE sbd=$S AND ngay_vn='$HOM') muc_tieu, json_array_length(muc_json) viec, json_array_length(xong_json) xong, them FROM tu_sua_viec_ngay WHERE sbd=$S AND ngay_vn='$HOM'"
          q "phiên học hôm nay: giờ VN · số câu · từ gói · đã trả lời" "SELECT strftime('%H:%M', s.created_at, '+7 hours') gio, json_array_length(s.json,'\$.questions') so_cau, COALESCE(json_extract(s.json,'\$.goiNgay'),0) tu_goi, (SELECT COUNT(*) FROM game_v2_attempt a WHERE a.session=s.id) tra_loi FROM game_v2_session s WHERE s.sbd=$S AND s.created_at >= '$(date -u -d "$HOM 00:00:00 +07:00" +%Y-%m-%dT%H:%M:%S)' ORDER BY s.created_at"
          q "kế hoạch gói 7 đã lưu hôm nay (nếu có): số việc" "SELECT COUNT(*) n FROM ke_hoach_ngay WHERE sbd=$S AND ngay='$HOM'"
          # 31/10 (thầy «load lại nhưng vẫn chưa thấy đồng bộ»): bản Sảnh lập sẵn của em (san-sang.ts) — giờ lập, số đã làm trong bản, dấu so với mốc RIÊNG hiện tại.
          q "bản Sảnh lập sẵn: ngày · giờ VN lập · đã làm trong bản · mức" "SELECT ngay, strftime('%H:%M:%S', luc/1000, 'unixepoch', '+7 hours') lap, json_extract(sanh_json,'\$.goi7.daLamHomNay') da_lam, json_extract(sanh_json,'\$.goi7.toiThieu') muc FROM hoc_tap_san_sang WHERE sbd=$S"
          q "dấu bản lập sẵn (a § s § g § lg § cl § kt § …)" "SELECT substr(dau,1,400) dau FROM hoc_tap_san_sang WHERE sbd=$S"
          # Kiểm tra ôn tập từ hôm nay trở đi (bài Sảnh gửi kèm): máy em đọc CHẶT (src/lib/kiem-tra-ca-nhan.ts `docKiemTra`) — hạn − mở phải đúng 24 giờ, đã trả ≤ tổng…
          q "Kiểm tra ôn tập từ hôm nay: ngày · trạng thái · hạn−mở (giờ) · đã nộp · điểm · số câu · bài ngày · số chặng" "SELECT k.ngay, k.trang_thai, (k.han_luc - k.mo_luc)/3600000.0 han_mo_gio, k.nop_luc IS NOT NULL da_nop, k.diem, json_array_length(k.json,'\$.cau') tong, json_extract(k.json,'\$.baiNgayToiThieu') bai_ngay, json_array_length(k.json,'\$.chang') so_chang FROM kiem_tra_ca_nhan k WHERE k.sbd=$S AND k.ngay>='$HOM' ORDER BY (k.trang_thai='cho_nguon'), k.ngay LIMIT 3"
          q "mốc riêng HIỆN TẠI: a (câu trả lời cuối) · s (sổ học cuối) · g · lg · cl" "SELECT (SELECT created_at FROM game_v2_attempt WHERE sbd=$S ORDER BY created_at DESC LIMIT 1) a, (SELECT received_at FROM su_kien_hoc WHERE sbd=$S ORDER BY received_at DESC LIMIT 1) s, (SELECT luc FROM goi_bai_7_gap WHERE sbd=$S ORDER BY luc DESC LIMIT 1) g, (SELECT luc FROM loi_giai_hoi WHERE sbd=$S ORDER BY luc DESC LIMIT 1) lg, (SELECT cap_nhat_luc FROM chua_loi_dot WHERE sbd=$S ORDER BY cap_nhat_luc DESC LIMIT 1) cl"
      # 31/10 (truy «load lại vẫn chưa đồng bộ»): NHẬT KÝ MÁY CHỦ (Workers Logs, observability bật trong wrangler.toml) quanh 17:00–17:45 VN cho các lệnh
      # Sảnh / Tự sửa lỗi / kênh: giờ · đường · mã trả · kết quả · loại máy (Edge / điện thoại). KHÔNG in IP, thân, token, mã em.
      - name: Nhật ký máy chủ quanh lúc thầy tải lại (chỉ đọc)
        continue-on-error: true
        env:
          T: ${{ env.CF_TOKEN_SACH }}
          A: ${{ env.CF_ACC_SACH }}
        run: |
          node - <<'JS'
          const from = Date.parse('2026-10-31T10:00:00Z'), to = Date.parse('2026-10-31T10:45:00Z')
          const may = (h) => { const u = String(h?.['user-agent'] ?? h?.['User-Agent'] ?? ''); return /Edg\//.test(u) ? 'Edge' : /iPhone|iPad/.test(u) ? 'iPhone' : /Android/.test(u) ? 'Android' : /Windows/.test(u) ? 'Windows' : /Mac OS/.test(u) ? 'Mac' : u ? 'khac' : '-' }
          const hoi = async (loc) => {
            const r = await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.A}/workers/observability/telemetry/query`, { method: 'POST',
              headers: { authorization: `Bearer ${process.env.T}`, 'content-type': 'application/json' },
              body: JSON.stringify({ queryId: 'tai-lai-3110', timeframe: { from, to }, view: 'events', limit: 300,
                parameters: { datasets: ['cloudflare-workers'], filters: [{ key: '$workers.scriptName', operation: 'eq', type: 'string', value: 'omr' }, { key: '$workers.event.request.url', operation: 'includes', type: 'string', value: loc }] } }) })
            const j = await r.json().catch(() => null)
            if (!j?.success) { console.log('lỗi truy vấn', loc, r.status, JSON.stringify(j?.errors ?? j)?.slice(0, 400)); return }
            const ev = j.result?.events?.events ?? []
            console.log(`== ${loc}: ${ev.length} sự kiện`)
            for (const e of ev.sort((a, b) => (a.timestamp ?? 0) - (b.timestamp ?? 0))) {
              const w = e.$workers ?? {}, rq = w.event?.request ?? {}, rs = w.event?.response ?? {}
              let p = '-'; try { p = new URL(rq.url).pathname } catch {}
              const gio = new Date((e.timestamp ?? 0) + 7 * 3600e3).toISOString().slice(11, 19)
              console.log(`${gio} ${w.entrypoint ?? ''} ${rq.method ?? ''} ${p} -> ${rs.status ?? '-'} ${w.outcome ?? ''} ${may(rq.headers)} ${w.wallTimeMs ?? ''}ms`)
            }
            if (ev[0]) console.log('khoá $workers mẫu:', Object.keys(ev[0].$workers ?? {}).join(','), '· khoá request:', Object.keys(ev[0].$workers?.event?.request ?? {}).join(','))
          }
          for (const loc of ['hoc-tap-sanh', 'chua-cau-sai/danh-sach', 'kenh']) await hoi(loc)
          JS
