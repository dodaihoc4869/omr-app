# ĐẾM «ĐÃ TẢI SẴN CHO TỪNG EM CHƯA» (CHỈ ĐỌC) — thầy 29/10: «Đã tải sẵn hết lộ trình ngày hôm nay cho từng hs chưa?». Chỉ SELECT gộp: không mã em, không tên.
name: Đếm bộ nạp sẵn Sảnh + chặng (chỉ đọc)
on:
  workflow_dispatch:
  push:
    branches: [claude/do-san-sang-2910]
    paths: ['.github/workflows/do-san-sang-2910.yml']
permissions:
  contents: read
concurrency:
  group: do-san-sang-${{ github.ref }}
  cancel-in-progress: true
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Đếm (chỉ SELECT)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          q() { echo "== $1"; npx -y wrangler@4 d1 execute omr --remote --json --command "$2" | jq -c ".[0].results" || echo "(lỗi)"; }
          echo "Giờ VN: $(TZ=Asia/Ho_Chi_Minh date '+%d/%m %H:%M')"
          HOM="date('now','+7 hours')"
          q "tổng em có tài khoản / em có lớp" "SELECT COUNT(*) tong, SUM(COALESCE(lop,'')<>'') co_lop FROM hoc_sinh"
          q "bộ nạp sẵn: tổng dòng · của hôm nay · có phần Sảnh · có phần chặng" "SELECT COUNT(*) tong, SUM(ngay=$HOM) hom_nay, SUM(ngay=$HOM AND sanh_json IS NOT NULL) co_sanh, SUM(ngay=$HOM AND chang_json IS NOT NULL) co_chang FROM hoc_tap_san_sang"
          q "bộ nạp sẵn hôm nay theo giờ VN lúc ghi (giờ: số em)" "SELECT strftime('%H', luc/1000, 'unixepoch', '+7 hours') gio, COUNT(*) n FROM hoc_tap_san_sang WHERE ngay=$HOM GROUP BY 1 ORDER BY 1"
          q "em có làm câu hôm nay: số em · số em có bộ nạp sẵn hôm nay GHI SAU lần làm cuối (còn mới) · ghi TRƯỚC lần làm cuối (cũ ⇒ Sảnh chậm)" \
            "WITH a AS (SELECT sbd, MAX(CAST(strftime('%s', received_at) AS INTEGER)*1000) cuoi FROM su_kien_hoc WHERE ngay_vn=$HOM GROUP BY sbd) SELECT COUNT(*) em_lam, SUM(s.sbd IS NOT NULL AND s.luc>=a.cuoi) con_moi, SUM(s.sbd IS NOT NULL AND s.luc<a.cuoi) cu, SUM(s.sbd IS NULL OR s.ngay<>$HOM) chua_co FROM a LEFT JOIN hoc_tap_san_sang s ON s.sbd=a.sbd"
          q "em đang học (có làm câu trong 7 ngày): số em · có bộ nạp sẵn HÔM NAY" \
            "WITH a AS (SELECT DISTINCT sbd FROM su_kien_hoc WHERE ngay_vn>=date('now','+7 hours','-6 days')) SELECT COUNT(*) em_hoc, SUM(s.ngay=$HOM) co_hom_nay FROM a LEFT JOIN hoc_tap_san_sang s ON s.sbd=a.sbd"
          q "em CÓ GÓI (goi_bai_7_em còn hạn, không khoá): số em · đã có bộ nạp sẵn HÔM NAY đúng bản · chưa có (cron chiều/đêm sẽ lo)" \
            "SELECT COUNT(*) em_co_goi, SUM(s.sbd IS NOT NULL AND s.ngay=$HOM AND s.dau LIKE 'v4§%') da_co, SUM(NOT (s.sbd IS NOT NULL AND s.ngay=$HOM AND s.dau LIKE 'v4§%')) chua_co FROM (SELECT DISTINCT e.sbd FROM goi_bai_7_em e JOIN hoc_sinh h ON h.sbd=e.sbd WHERE e.han>=$HOM AND COALESCE(h.trang_thai,'')<>'khoa') g LEFT JOIN hoc_tap_san_sang s ON s.sbd=g.sbd"
          q "ĐỘ PHỦ 100% (định nghĩa mới 29/10): em đang nhận gói (lớp hiệu lực + tick còn hoạt động + không khoá/đã nghỉ, KHÔNG xét hạn) · đã có bộ nạp sẵn HÔM NAY đúng bản · chưa có" \
            "SELECT COUNT(*) em_dang_nhan, SUM(s.sbd IS NOT NULL AND s.ngay=$HOM AND s.dau LIKE 'v4§%') da_co, SUM(NOT (s.sbd IS NOT NULL AND s.ngay=$HOM AND s.dau LIKE 'v4§%')) chua_co FROM (SELECT DISTINCT e.sbd FROM goi_bai_7_em e JOIN goi_bai_7 g ON g.id=e.goi_id JOIN hoc_sinh h ON h.sbd=e.sbd AND COALESCE(NULLIF(TRIM(h.ten_lop),''),CASE TRIM(COALESCE(h.lop,'')) WHEN '12' THEN '12 - Lớp Thường' WHEN '' THEN 'Chưa xếp lớp' ELSE TRIM(h.lop) END)=g.lop JOIN bai_da_day b ON b.id=g.tick_id AND b.bo_tick_luc IS NULL WHERE COALESCE(h.trang_thai,'') NOT IN ('khoa','da_nghi')) x LEFT JOIN hoc_tap_san_sang s ON s.sbd=x.sbd"
          q "bản sẵn còn MỚI: ghi sau phiên học mới nhất của em (còn mới) · ghi trước (cũ)" \
            "SELECT SUM(COALESCE((SELECT g.created_at FROM game_v2_session g WHERE g.sbd=s.sbd ORDER BY g.created_at DESC LIMIT 1),'') <= strftime('%Y-%m-%dT%H:%M:%fZ', s.luc/1000.0, 'unixepoch')) con_moi, SUM(COALESCE((SELECT g.created_at FROM game_v2_session g WHERE g.sbd=s.sbd ORDER BY g.created_at DESC LIMIT 1),'') > strftime('%Y-%m-%dT%H:%M:%fZ', s.luc/1000.0, 'unixepoch')) cu FROM hoc_tap_san_sang s WHERE s.ngay=$HOM"
          q "dòng bộ nạp sẵn hôm nay theo bản dấu (đầu chuỗi dấu)" "SELECT substr(dau,1,2) ban, COUNT(*) n FROM hoc_tap_san_sang WHERE ngay=$HOM GROUP BY 1"
          q "phiên game hôm nay theo loại (goi7 / hocTap / hoa2): số phiên · số em" "SELECT COALESCE(json_extract(json,'\$.goi7'),0) goi7, COALESCE(json_extract(json,'\$.hocTap'),0) hoc_tap, COALESCE(json_extract(json,'\$.hoa2'),0) hoa2, COALESCE(json_extract(json,'\$.mode'),'') mode, COUNT(*) phien, COUNT(DISTINCT sbd) em FROM game_v2_session WHERE substr(datetime(created_at,'+7 hours'),1,10)=$HOM GROUP BY 1,2,3,4 ORDER BY 5 DESC"
          q "goi_bai_7_em: tổng em từng có gói · còn hạn hôm nay · hạn gần nhất" "SELECT COUNT(DISTINCT sbd) tong_em, COUNT(DISTINCT CASE WHEN han>=$HOM THEN sbd END) con_han, MAX(han) han_moi_nhat FROM goi_bai_7_em"
          q "gói Gói 7 theo lớp: lớp · bài · khoá bài · hạn · số em · tạo lúc (UTC)" "SELECT g.lop, g.ten, g.khoa_bai, g.han, COUNT(e.sbd) so_em, substr(g.tao_luc,1,16) tao FROM goi_bai_7 g LEFT JOIN goi_bai_7_em e ON e.goi_id=g.id GROUP BY g.id ORDER BY g.han DESC, g.tao_luc DESC LIMIT 25"
          q "bài đã dạy (tick) gần nhất: lớp · bài · tick lúc · bỏ tick" "SELECT lop, ten_bai, khoa_bai, substr(tick_luc,1,16) tick, substr(COALESCE(bo_tick_luc,''),1,16) bo_tick FROM bai_da_day ORDER BY tick_luc DESC LIMIT 20"
          q "số em theo lớp hiệu lực (ten_lop hoặc lop) và có gói còn hạn hôm nay" "SELECT COALESCE(NULLIF(h.ten_lop,''),h.lop) lop_hl, COUNT(*) so_em, SUM(EXISTS(SELECT 1 FROM goi_bai_7_em e WHERE e.sbd=h.sbd AND e.han>=$HOM)) co_goi_hom_nay FROM hoc_sinh h WHERE COALESCE(h.trang_thai,'')<>'khoa' GROUP BY 1 ORDER BY 2 DESC LIMIT 20"
          q "cấu hình nạp đêm / bật Gói 7" "SELECT khoa, substr(gia_tri,1,80) v FROM cau_hinh WHERE khoa IN ('goi_bai_7_v1','san_sang_dem','tat_san_sang')"
# đo lại 16:34
