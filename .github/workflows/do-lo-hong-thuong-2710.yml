# ĐO LỖ HỔNG THƯỞNG PHẠT (thầy 27/10) — CHỈ ĐỌC, chỉ in số đếm (không sbd / tên). Bấm tay.
name: Đo lỗ hổng thưởng phạt (chỉ đọc)
on:
  workflow_dispatch:
    inputs:
      tu:
        description: 'Từ ngày VN (YYYY-MM-DD)'
        required: false
        default: '2026-10-20'
permissions:
  contents: read
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tệp đo chỉ có SELECT
        run: |
          if grep -v '^\s*//' scripts/do-lo-hong-thuong-2710.mjs | grep -E '`' | grep -iqE '\b(INSERT|UPDATE|DELETE|DROP|ALTER|CREATE|REPLACE)\b'; then echo "Có lệnh ghi — dừng."; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Đo
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
          TU: ${{ inputs.tu }}
        run: node scripts/do-lo-hong-thuong-2710.mjs
