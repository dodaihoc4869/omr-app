# ĐẶT LẠI BÌNH GIỮ CHUỖI VỀ 0 CHO MỌI HỌC SINH (thầy DUYỆT 27/10: chọn «Chỉ bình giữ chuỗi»). Bấm tay (workflow_dispatch), KHÔNG chạy từ máy local.
# Chỉ THÊM dòng `chuoi_binh_mua` nguồn 'tt-binh-reset-2710' (một dòng mỗi em đang có bình, so = −số bình để truy vết) — không xoá / sửa dòng nào,
# không đụng tinh thể (vang_so), nguyên tử (exp_so), chuỗi ngày, giải, nhiệm vụ. Máy chủ (luật 27/10) gặp dòng này ⇒ bình về 0; bình mua sau mốc vẫn cộng.
# Cổng: có ca thi mở ⇒ DỪNG; Worker sống chưa có commit luật mới (`moc`) ⇒ DỪNG. In SỐ ĐẾM trước / sau (không sbd, không tên); đối chiếu tổng tinh thể
# / nguyên tử của các dòng cũ không đổi. Chạy lại an toàn (INSERT OR IGNORE theo id). `che_do: dem` ⇒ chỉ đếm, không ghi.
# 28/10 (thầy: «00h01 đêm nay reset bình về 0 hết nhé»): nhiều lần đặt lại ⇒ input `nguon` (mặc định tt-binh-reset-<DDMM của mốc>) + `luc` (mốc cố định,
# chạy trễ vẫn ghi đúng mốc). Lượt HẸN GIỜ: cron 17:01 UTC ngày 27/10 = 00:01 VN 28/10 (GitHub có thể trễ vài–vài chục phút; mốc luc vẫn 00:01) ⇒ chế độ
# ghi, chỉ chạy khi ngày VN = 28/10/2026, Worker sống có luật đặt lại nhiều lần; có ca thi mở ⇒ thử lại mỗi 10 phút tới 01:30 VN rồi DỪNG (lượt đỏ, log ghi rõ).
name: Đặt lại bình giữ chuỗi về 0
on:
  schedule:
    - cron: '1 17 27 10 *'
  workflow_dispatch:
    inputs:
      moc:
        description: 'Commit luật bình mới (tuỳ chọn — luôn kiểm thêm: Worker sống có luật đặt lại nhiều lần)'
        required: false
        default: ''
      che_do:
        description: 'dem = chỉ đếm · ghi = đặt lại'
        required: true
        default: 'dem'
        type: choice
        options: [dem, ghi]
      nguon:
        description: 'Nguồn dòng đặt lại (tt-binh-reset-DDMM); trống = theo ngày VN của mốc'
        required: false
        default: ''
      luc:
        description: 'Mốc đặt lại (ISO UTC, vd 2026-10-27T17:01:00Z); trống = lúc chạy'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: dat-lai-binh-2710
  cancel-in-progress: false
jobs:
  dat-lai:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Đóng gói lệnh (dùng đúng hàm thuần chuỗi ngày của máy chủ)
        run: npx -y esbuild@0.24.0 scripts/dat-lai-binh-2710.ts --bundle --platform=node --format=esm --outfile=/tmp/dat-lai-binh.mjs --log-level=warning
      - name: Đếm / đặt lại bình
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
          MOC_LUAT: ${{ github.event_name == 'schedule' && '' || inputs.moc }}
          GHI: ${{ github.event_name == 'schedule' && 'ghi' || inputs.che_do }}
          NGUON: ${{ github.event_name == 'schedule' && 'tt-binh-reset-2810' || inputs.nguon }}
          LUC: ${{ github.event_name == 'schedule' && '2026-10-27T17:01:00Z' || inputs.luc }}
          CHI_NGAY: ${{ github.event_name == 'schedule' && '2026-10-28' || '' }}
          CHO_CA_TOI: ${{ github.event_name == 'schedule' && '2026-10-27T18:30:00Z' || '' }}
        run: node /tmp/dat-lai-binh.mjs
