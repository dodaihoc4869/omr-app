# Deploy Worker nhanh (không chạy test, không Pages) — dùng cho tính năng pilot
# chưa merge vào main. Chỉ chạy khi thầy bấm tay (workflow_dispatch).
name: Deploy Worker nhanh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_TOKEN_SACH }}
          accountId: ${{ env.CF_ACC_SACH }}
          command: deploy
          workingDirectory: server
