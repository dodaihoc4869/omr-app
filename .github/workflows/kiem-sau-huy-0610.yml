# EM CÒN LÀM CÂU CỦA CHIẾN DỊCH SAU KHI THẦY HUỶ? (CHỈ ĐỌC, chỉ in SỐ ĐẾM) — thầy 06/10: "Tôi hủy một chiến dịch amine. Nhưng học sinh vẫn làm câu của chiến dịch".
# Đọc D1 thật (scripts/kiem-sau-huy-0610.sql): mỗi chiến dịch đã huỷ từ 29/09 một hàng số đếm — lần làm sau lúc huỷ, tách theo lượt mở TRƯỚC / SAU lúc huỷ và theo loại lượt (Đảo / Đoàn / Bi-a).
# KHÔNG in mã chiến dịch / tên em / mã em / mã câu: repo công khai, nhật ký chạy ai cũng đọc được. Bấm tay (workflow_dispatch) hoặc tự chạy khi đẩy nhánh có sửa hai tệp này.
name: Em còn làm câu của chiến dịch sau khi huỷ? (chỉ đọc, chỉ đếm)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/kiem-sau-huy-0610.yml', 'scripts/kiem-sau-huy-0610.sql']
    branches-ignore: [main]
permissions:
  contents: read
concurrency:
  group: kiem-sau-huy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kiem:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tệp SQL chỉ có SELECT
        run: |
          if grep -v '^\s*--' scripts/kiem-sau-huy-0610.sql | grep -iqE '\b(INSERT|UPDATE|DELETE|DROP|ALTER|CREATE|REPLACE|TRUNCATE|PRAGMA)\b'; then echo "Tệp có lệnh không chỉ-đọc — dừng."; exit 1; fi
          echo "OK: chỉ SELECT"
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Chạy câu đọc tương đương trên D1 thật (chỉ đọc)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          SQL=$(grep -v '^\s*--' ../scripts/kiem-sau-huy-0610.sql | tr '\n' ' ')
          npx -y wrangler@4 d1 execute omr --remote --json --command "$SQL"
