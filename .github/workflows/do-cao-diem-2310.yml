# ĐO GIỜ CAO ĐIỂM TỐI 23/10 (CHỈ ĐỌC) — kiểm bản sửa tràn bộ nhớ #358 (0cd79a26) + lệnh Mức làm theo lô song song của PR #360 (69291726).
# In: exceededMemory theo giờ 13→23/10 · Worker omr theo 5 phút 12:00–16:40Z 23/10 (yêu cầu / lỗi / p50–p99) · D1 nhóm truy vấn nặng nhất khung đó
# + riêng câu đọc /gv/muc-lam-lo (su_kien_hoc theo lô em). Chỉ số đếm + SQL rút gọn, không tham số, không tên / SBD.
name: Đo giờ cao điểm tối 23/10 (chỉ đọc)
on:
  workflow_dispatch:
  push:
    branches: [claude/stoic-einstein-7jkysb]
    paths: ['.github/workflows/do-cao-diem-2310.yml']
permissions:
  contents: read
concurrency:
  group: do-cao-diem-2310-${{ github.ref }}
  cancel-in-progress: true
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_ID: d2e6d322-374a-45d7-83a3-9fac486b23f1
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Tràn bộ nhớ + Worker 5 phút + D1 (chỉ đọc)
        env:
          TOKEN: ${{ env.CF_TOKEN_SACH }}
          ACC: ${{ env.CF_ACC_SACH }}
        run: |
          node - <<'JS'
          const { TOKEN, ACC, DB_ID } = process.env
          const H = { authorization: `Bearer ${TOKEN}`, 'content-type': 'application/json' }
          const hoi = async (query, variables) => {
            const r = await fetch('https://api.cloudflare.com/client/v4/graphql', { method: 'POST', headers: H, body: JSON.stringify({ query, variables }) })
            const j = await r.json(); if (j.errors?.length) console.log('LỖI GraphQL:', JSON.stringify(j.errors).slice(0, 600)); return j.data
          }
          console.log('=== exceededMemory / exceededCpu theo giờ VN (chỉ in giờ có lỗi) ===')
          for (let d = 13; d <= 23; d++) {
            const tu = new Date(Date.UTC(2026, 9, d - 1, 17)).toISOString(), den = new Date(Date.UTC(2026, 9, d, 17)).toISOString()
            const x = await hoi(`query($acc:String!,$tu:Time!,$den:Time!){viewer{accounts(filter:{accountTag:$acc}){
              workersInvocationsAdaptive(limit:200,filter:{scriptName:"omr",datetime_geq:$tu,datetime_leq:$den,status_in:["exceededMemory","exceededCpu","exceededResources"]}){dimensions{status datetimeHour} sum{requests}}}}}`, { acc: ACC, tu, den })
            const ds = x?.viewer?.accounts?.[0]?.workersInvocationsAdaptive ?? []
            const tong = ds.reduce((n, r) => n + r.sum.requests, 0)
            const gio = ds.map((r) => `${String((new Date(r.dimensions.datetimeHour).getUTCHours() + 7) % 24).padStart(2, '0')}h:${r.dimensions.status.replace('exceeded', '')}=${r.sum.requests}`).sort()
            console.log(`${d}/10 tổng=${tong} ${gio.join(' ')}`)
          }
          const v = { acc: ACC, db: DB_ID, tu: '2026-10-23T12:00:00Z', den: '2026-10-23T16:40:00Z' }
          console.log(`=== Worker omr theo 5 phút ${v.tu} → ${v.den} (giờ UTC; VN = +7) ===`)
          let tongYc = 0, tongLoi = 0, p99Max = 0
          for (const [a, b] of [['12:00', '14:20'], ['14:20', '16:40']]) {
            const w5 = await hoi(`query($acc:String!,$tu:Time!,$den:Time!){viewer{accounts(filter:{accountTag:$acc}){
              workersInvocationsAdaptive(limit:40,filter:{scriptName:"omr",datetime_geq:$tu,datetime_leq:$den},orderBy:[datetimeFiveMinutes_ASC]){
              dimensions{datetimeFiveMinutes} sum{requests errors} quantiles{durationP50 durationP90 durationP99 cpuTimeP99}}}}}`, { acc: ACC, tu: `2026-10-23T${a}:00Z`, den: `2026-10-23T${b}:00Z` })
            for (const x of w5?.viewer?.accounts?.[0]?.workersInvocationsAdaptive ?? []) {
              tongYc += x.sum.requests; tongLoi += x.sum.errors; p99Max = Math.max(p99Max, x.quantiles.durationP99)
              console.log([x.dimensions.datetimeFiveMinutes.slice(11, 16), `yc=${x.sum.requests}`, `loi=${x.sum.errors}`, `p50=${Math.round(x.quantiles.durationP50)}`, `p90=${Math.round(x.quantiles.durationP90)}`, `p99=${Math.round(x.quantiles.durationP99)}`, `cpu99=${Math.round(x.quantiles.cpuTimeP99)}`].join(' '))
            }
          }
          console.log(`TỔNG khung: yc=${tongYc} loi=${tongLoi} p99 lớn nhất=${Math.round(p99Max)} ms`)
          const d1 = await hoi(`query($acc:String!,$db:String!,$tu:Time!,$den:Time!){viewer{accounts(filter:{accountTag:$acc}){
            d1QueriesAdaptiveGroups(limit:60,filter:{databaseId:$db,datetime_geq:$tu,datetime_leq:$den},orderBy:[sum_queryDurationMs_DESC]){
              count sum{queryDurationMs rowsRead rowsWritten} dimensions{query}}}}}`, v)
          const ds = d1?.viewer?.accounts?.[0]?.d1QueriesAdaptiveGroups ?? []
          const dong = (x) => [`lan=${x.count}`, `tongS=${(x.sum.queryDurationMs / 1000).toFixed(1)}`, `tbMs=${(x.sum.queryDurationMs / Math.max(1, x.count)).toFixed(1)}`, `docTB=${Math.round(x.sum.rowsRead / Math.max(1, x.count))}`, `ghi=${x.sum.rowsWritten}`, '|', String(x.dimensions.query).replace(/\s+/g, ' ').slice(0, 300)].join(' ')
          console.log(`=== D1: ${ds.length} nhóm nặng nhất · tổng ${Math.round(ds.reduce((n, x) => n + x.sum.queryDurationMs, 0) / 1000)} s ===`)
          for (const x of ds.slice(0, 12)) console.log(dong(x))
          console.log('=== D1: câu đọc /gv/muc-lam-lo (su_kien_hoc theo lô em, có ma_nguon + $.doc) ===')
          const ml = ds.filter((x) => /FROM su_kien_hoc s/.test(x.dimensions.query) && /\$\.doc/.test(x.dimensions.query))
          for (const x of ml) console.log(dong(x))
          if (!ml.length) console.log('(không thấy trong 60 nhóm nặng nhất ⇒ nhẹ hơn các nhóm trên)')
          JS
