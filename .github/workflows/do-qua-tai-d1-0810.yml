name: Bổ sung bảng phụ và kiểm tra hồ sơ khi D1 quá tải
on:
  push:
    branches: [codex/do-qua-tai-d1-0810]
permissions:
  contents: read
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx esbuild scripts/do-ho-so-d1-0810.ts --bundle --platform=node --format=esm --outfile=/tmp/do-ho-so.mjs
      - name: Khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Bổ sung bảng phụ trống nếu thiếu
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: node scripts/bo-sung-bang-bat-dau-0810.mjs
      - name: Kiểm đăng nhập và Sảnh, không làm bài
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: node scripts/do-sanh-song-0810.mjs
