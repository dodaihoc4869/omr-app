# ĐO TRÀN BỘ NHỚ WORKER 28/10 tối (CHỈ ĐỌC): exceededMemory / exceededCpu theo 5 phút, hôm nay 11:00–nay UTC và hôm qua cùng khung (so sánh).
name: Đo tràn bộ nhớ Worker (chỉ đọc)
on:
  push:
    branches: [claude/do-kiem-tra-cham-2810]
    paths: ['.github/workflows/do-bo-nho-2810.yml']
permissions:
  contents: read
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Trạng thái theo 5 phút
        env:
          TOKEN: ${{ env.CF_TOKEN_SACH }}
          ACC: ${{ env.CF_ACC_SACH }}
        run: |
          node - <<'JS'
          const { TOKEN, ACC } = process.env
          const hoi = async (query, variables) => {
            const r = await fetch('https://api.cloudflare.com/client/v4/graphql', { method: 'POST', headers: { authorization: `Bearer ${TOKEN}`, 'content-type': 'application/json' }, body: JSON.stringify({ query, variables }), signal: AbortSignal.timeout(30000) })
            const j = await r.json(); if (j.errors?.length) console.log('LỖI GraphQL:', JSON.stringify(j.errors).slice(0, 400)); return j.data
          }
          const khung = async (tu, den, nhan) => {
            const x = await hoi(`query($acc:String!,$tu:Time!,$den:Time!){viewer{accounts(filter:{accountTag:$acc}){
              workersInvocationsAdaptive(limit:500,filter:{scriptName:"omr",datetime_geq:$tu,datetime_leq:$den},orderBy:[datetimeFiveMinutes_ASC]){dimensions{datetimeFiveMinutes status} sum{requests}}}}}`, { acc: ACC, tu, den })
            const m = new Map()
            for (const r of x?.viewer?.accounts?.[0]?.workersInvocationsAdaptive ?? []) {
              const k = r.dimensions.datetimeFiveMinutes.slice(11, 16); const o = m.get(k) ?? {}; o[r.dimensions.status] = (o[r.dimensions.status] ?? 0) + r.sum.requests; m.set(k, o)
            }
            console.log(`=== ${nhan} (UTC; VN = +7) — tổng · exceededMemory · exceededCpu · clientDisconnected ===`)
            for (const [k, o] of [...m].sort()) { const t = Object.values(o).reduce((a, b) => a + b, 0); console.log(`${k} ${t} · mem=${o.exceededMemory ?? 0} · cpu=${o.exceededCpu ?? 0} · ngat=${o.clientDisconnected ?? 0}${Object.keys(o).filter((s) => !['success','exceededMemory','exceededCpu','clientDisconnected'].includes(s)).map((s) => ` · ${s}=${o[s]}`).join('')}`) }
          }
          const q = async (sql) => {
            const r = await fetch(`https://api.cloudflare.com/client/v4/accounts/${ACC}/d1/database/d2e6d322-374a-45d7-83a3-9fac486b23f1/query`, { method: 'POST', headers: { authorization: `Bearer ${TOKEN}`, 'content-type': 'application/json' }, body: JSON.stringify({ sql }), signal: AbortSignal.timeout(30000) })
            const j = await r.json(); return j.success ? JSON.stringify(j.result?.[0]?.results) : `LỖI ${JSON.stringify(j.errors).slice(0, 300)}`
          }
          console.log('CỠ game_v2_question.json:', await q("SELECT COUNT(*) n, CAST(AVG(length(json)) AS INT) tb, MAX(length(json)) lon_nhat, SUM(length(json)>100000) tren_100k, SUM(length(json)>20000) tren_20k FROM game_v2_question"))
          console.log('CỠ câu trong phiên mở 2 giờ qua (đúng câu đệm chấm nhanh giữ):', await q("SELECT COUNT(*) n, CAST(AVG(length(q.json)) AS INT) tb, MAX(length(q.json)) lon FROM game_v2_question q WHERE q.qid IN (SELECT json_extract(j.value,'$.qid') FROM game_v2_session s, json_each(s.json,'$.questions') j WHERE s.created_at >= datetime('now','-2 hours'))"))
          console.log('CỠ game_v2_session.json (2 giờ):', await q("SELECT COUNT(*) n, CAST(AVG(length(json)) AS INT) tb, MAX(length(json)) lon FROM game_v2_session WHERE created_at >= datetime('now','-2 hours')"))
          console.log('kho_chup:', await q("SELECT khoa, COUNT(*) phan, SUM(length(json)) co FROM kho_chup GROUP BY khoa"))
          console.log('cau_meta / omni_q dòng:', await q("SELECT (SELECT COUNT(*) FROM cau_meta) cm, (SELECT COUNT(*) FROM omni_q) oq, (SELECT SUM(length(vkn_json)) FROM omni_q) oq_vkn"))
          const nay = new Date()
          await khung('2026-10-28T13:40:00Z', nay.toISOString(), 'HÔM NAY 28/10')
          
          JS
