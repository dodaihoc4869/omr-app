# SOI NHẬT KÝ LƯỢT GỌI «Nhật ký bài dạy» (CHỈ ĐỌC, 14/11) — thầy báo «Nhật ký của bài live K12 chưa có». Đọc Workers Logs: máy em / máy thầy có gọi
# nhat-ky.json không, máy chủ trả mã gì. Chỉ in giờ · phương thức · đường dẫn (bỏ vé) · mã trả (repo công khai).
name: Soi lượt gọi nhật ký bài dạy (chỉ đọc)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  soi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Workers Logs (chỉ đọc)
        env:
          CF_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CF_ACC: ${{ env.CF_ACC_SACH }}
        run: timeout 120 node scripts/soi-log-nhat-ky-1411.mjs 14
