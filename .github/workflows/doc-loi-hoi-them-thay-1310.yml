# HỎI THÊM THẦY (13/10): đọc LỖI gọi Gemini trong sổ `hoi_tro_ly` (CHỈ ĐỌC). Repo công khai ⇒ chỉ in giờ, model, thời gian, chữ lỗi —
# KHÔNG in sbd, câu hỏi hay câu trả lời của em. Bấm tay hoặc tự chạy khi đẩy nhánh KHÁC main có sửa tệp này.
name: Hỏi thêm Thầy — đọc lỗi Gemini (chỉ đọc)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/doc-loi-hoi-them-thay-1310.yml']
    branches-ignore: [main]
permissions:
  contents: read
concurrency:
  group: doc-loi-hoi-them-thay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Đọc 10 lỗi gần nhất + số lượt (chỉ SELECT)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          npx -y wrangler@4 d1 execute omr --remote --json --command "SELECT COUNT(*) AS tong, SUM(CASE WHEN loi IS NULL THEN 1 ELSE 0 END) AS tra_loi_duoc, SUM(CASE WHEN loi IS NOT NULL THEN 1 ELSE 0 END) AS loi FROM hoi_tro_ly" | jq -c ".[0].results"
          npx -y wrangler@4 d1 execute omr --remote --json --command "SELECT luc, model, ms, loi FROM hoi_tro_ly WHERE loi IS NOT NULL ORDER BY id DESC LIMIT 10" | jq -c ".[0].results"
          # 13/10 tối: mô hình nào THẬT SỰ trả lời trong 24 giờ (thầy chọn gemini-3.1-flash-lite; dự phòng 404/410 ⇒ 3.5-flash-lite…) — chỉ đếm, không sbd/câu hỏi.
          npx -y wrangler@4 d1 execute omr --remote --json --command "SELECT model, COUNT(*) AS so_luot, CAST(AVG(ms) AS INTEGER) AS ms_tb, MAX(luc) AS gan_nhat FROM hoi_tro_ly WHERE loi IS NULL AND luc >= strftime('%Y-%m-%dT%H:%M:%S', 'now', '-1 day') GROUP BY model ORDER BY gan_nhat DESC" | jq -c ".[0].results"
          # 13/10 tối (thầy gửi ảnh "Thầy trả lời chưa kịp"): 15 lượt gần nhất — CHỈ giờ, model, ms, số token, cờ phạm vi, có lỗi không.
          npx -y wrangler@4 d1 execute omr --remote --json --command "SELECT luc, model, ms, token_vao, token_ra, lien_quan, (loi IS NOT NULL) AS co_loi FROM hoi_tro_ly ORDER BY id DESC LIMIT 15" | jq -c ".[0].results[]"
          # 13/10 khuya (thầy: "đã có bao nhiêu lượt hỏi rồi"): CHỈ SỐ ĐẾM — tổng, số em, số câu, theo ngày, theo nguồn, mỗi em hỏi mấy lượt. Không in SBD, không in câu hỏi.
          npx -y wrangler@4 d1 execute omr --remote --json --command "SELECT COUNT(*) AS tong, SUM(CASE WHEN loi IS NULL THEN 1 ELSE 0 END) AS tra_loi, SUM(CASE WHEN loi IS NULL AND lien_quan = 0 THEN 1 ELSE 0 END) AS ngoai_pham_vi, COUNT(DISTINCT sbd) AS so_em, COUNT(DISTINCT qid) AS so_cau, MIN(luc) AS dau, MAX(luc) AS cuoi FROM hoi_tro_ly" | jq -c ".[0].results"
          npx -y wrangler@4 d1 execute omr --remote --json --command "SELECT ngay_vn, COUNT(*) AS so_luot, COUNT(DISTINCT sbd) AS so_em FROM hoi_tro_ly WHERE loi IS NULL GROUP BY ngay_vn ORDER BY ngay_vn" | jq -c ".[0].results[]"
          npx -y wrangler@4 d1 execute omr --remote --json --command "SELECT nguon, COUNT(*) AS so_luot FROM hoi_tro_ly WHERE loi IS NULL GROUP BY nguon ORDER BY so_luot DESC" | jq -c ".[0].results"
          npx -y wrangler@4 d1 execute omr --remote --json --command "SELECT n AS so_luot_moi_em, COUNT(*) AS so_em FROM (SELECT COUNT(*) AS n FROM hoi_tro_ly WHERE loi IS NULL GROUP BY sbd) GROUP BY n ORDER BY n" | jq -c ".[0].results"
          # 14/10 tối (Hỏi Thầy v2): câu trả lời nào có khối hình — CHỈ SỐ ĐẾM theo tiền tố của chữ phẳng (chuPhang), không in nội dung, chia theo GIỜ VN
          # để so trước/sau khi sửa chỉ dẫn. "Phương trình:", "Tính:", "Nhận biết:" chỉ có từ bản v2.1 (trước đó các khối này không có tiền tố).
          npx -y wrangler@4 d1 execute omr --remote --json --command "SELECT substr(datetime(luc, '+7 hours'), 1, 13) AS gio_vn, COUNT(*) AS so_luot, SUM(tra_loi LIKE '%Bẫy hay nhầm: %' OR tra_loi LIKE '%Chỗ em nhầm: %') AS bay, SUM(tra_loi LIKE '%Thí nghiệm: %') AS thi_nghiem, SUM(tra_loi LIKE '%Sơ đồ: %') AS so_do, SUM(tra_loi LIKE '%Phương trình: %') AS phuong_trinh, SUM(tra_loi LIKE '%Tính: %' OR tra_loi LIKE '%Đáp số: %') AS tinh, SUM(tra_loi LIKE '%Nhận biết: %') AS nhan_biet, CAST(AVG(ms) AS INTEGER) AS ms_tb, CAST(AVG(token_ra) AS INTEGER) AS token_ra_tb FROM hoi_tro_ly WHERE loi IS NULL AND lien_quan = 1 AND luc >= '2026-10-14T03:04:20Z' GROUP BY gio_vn ORDER BY gio_vn" | jq -c ".[0].results[]"
