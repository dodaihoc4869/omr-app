# ĐO ĐỘ PHỦ HỌC LIỆU CHO VÒNG CHỮA CÂU GỌN (CHỈ ĐỌC) — thầy 25/10 "đề xuất lại việc chữa câu đơn giản và hiệu quả nhất".
# Câu hỏi: với các đợt tự sửa còn mở (nhất là sai trong 14 ngày), bao nhiêu câu có lời giải trong kho, có câu song sinh (~ss / ~bt),
# có đáp án để máy chấm; mỗi em có bao nhiêu câu sai gần đây. CHỈ SELECT gộp — không mã em, tên em, mã câu (repo công khai).
name: Đo độ phủ chữa câu gọn (chỉ đọc)
on:
  workflow_dispatch:
  push:
    branches: [claude/gifted-mendel-m8etj0]
    paths: ['.github/workflows/do-phu-chua-cau-2510.yml']
permissions:
  contents: read
concurrency:
  group: do-phu-chua-cau-${{ github.ref }}
  cancel-in-progress: true
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Đếm (chỉ SELECT gộp)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          q() { echo "== $1"; npx -y wrangler@4 d1 execute omr --remote --json --command "$2" | jq -c '.[0] | {kq: .results, ms: .meta.timings.sql_duration_ms}' || echo "LOI"; }
          # 25/10: BỎ các truy vấn quét cả trung tâm có câu con lồng (Q21 chạy ~37 giây, Q13 ~8 giây trên D1 thật — D1 chạy tuần tự, em đang học sẽ phải chờ). Chỉ giữ truy vấn nhẹ (< 0,3 giây).
          MO="dong_luc IS NULL AND trang_thai_day<>'da_tu_sua'"
          GAN="COALESCE(sai_cuoi_luc,mo_luc) >= (strftime('%s','now')-14*86400)*1000"
          SS="EXISTS (SELECT 1 FROM game_v2_question s WHERE s.qid > d.qid_chuan||'~' AND s.qid < d.qid_chuan||'~~' AND (substr(s.qid,length(d.qid_chuan)+1,3) IN ('~ss','~bt')))"
          LG="EXISTS (SELECT 1 FROM game_v2_question g WHERE g.qid=d.qid_chuan AND length(trim(COALESCE(json_extract(g.json,'\$.solution'),'')))>0)"
          DA="EXISTS (SELECT 1 FROM game_v2_question g WHERE g.qid=d.qid_chuan AND length(trim(COALESCE(json_extract(g.json,'\$.correct'),'')))>0)"
          q "1 đợt mở: tổng · sai trong 14 ngày · số em" "SELECT COUNT(*) mo, SUM($GAN) mo_14_ngay, COUNT(DISTINCT sbd) so_em FROM chua_loi_dot d WHERE $MO"
          q "5 mỗi em: số câu sai 14 ngày còn mở (phân bố)" "WITH e AS (SELECT sbd, SUM($GAN) gan FROM chua_loi_dot d WHERE $MO GROUP BY sbd) SELECT COUNT(*) so_em, SUM(gan=0) em_0, SUM(gan BETWEEN 1 AND 3) em_1_3, SUM(gan BETWEEN 4 AND 11) em_4_11, SUM(gan BETWEEN 12 AND 30) em_12_30, SUM(gan>30) em_tren_30 FROM e"
          q "6 đợt mở 14 ngày theo kênh sai" "SELECT nguon_sai, COUNT(*) n FROM chua_loi_dot d WHERE $MO AND $GAN GROUP BY nguon_sai ORDER BY n DESC LIMIT 12"
          q "11 đợt mới mở mỗi ngày (7 ngày, giờ VN)" "SELECT date(mo_luc/1000,'unixepoch','+7 hours') ngay, COUNT(*) n, COUNT(DISTINCT sbd) em FROM chua_loi_dot WHERE mo_luc >= (strftime('%s','now')-7*86400)*1000 GROUP BY ngay ORDER BY ngay"
          q "17 đợt mở 14 ngày: SAU lần sai cuối em đã làm ĐÚNG lại chính câu gốc (sổ su_kien_hoc, ket_qua=1) · đúng ở ngày khác" "SELECT COUNT(*) n, SUM(EXISTS (SELECT 1 FROM su_kien_hoc s WHERE s.sbd=d.sbd AND s.qid=d.qid_chuan AND s.ket_qua=1 AND s.luc > strftime('%Y-%m-%dT%H:%M:%S', COALESCE(d.sai_cuoi_luc,d.mo_luc)/1000,'unixepoch'))) dung_lai, SUM(EXISTS (SELECT 1 FROM su_kien_hoc s WHERE s.sbd=d.sbd AND s.qid=d.qid_chuan AND s.ket_qua=1 AND s.luc > strftime('%Y-%m-%dT%H:%M:%S', COALESCE(d.sai_cuoi_luc,d.mo_luc)/1000,'unixepoch') AND s.ngay_vn > date(COALESCE(d.sai_cuoi_luc,d.mo_luc)/1000,'unixepoch','+7 hours'))) dung_ngay_khac FROM chua_loi_dot d WHERE dong_luc IS NULL AND trang_thai_day<>'da_tu_sua' AND COALESCE(sai_cuoi_luc,mo_luc) >= (strftime('%s','now')-14*86400)*1000"
          q "19 NGHIỆM THU 7 ngày: đợt sai trong 14 ngày — đã tự sửa · còn mở · tỉ lệ đã tự sửa (%)" "SELECT COUNT(*) n, SUM(trang_thai_day='da_tu_sua') da_tu_sua, SUM(dong_luc IS NULL) con_mo, ROUND(100.0*SUM(trang_thai_day='da_tu_sua')/COUNT(*),1) pt FROM chua_loi_dot WHERE COALESCE(sai_cuoi_luc,mo_luc) >= (strftime('%s','now')-14*86400)*1000"
          q "20 NGHIỆM THU kiểm lại: câu đã tự sửa 3–30 ngày trước · trong đó em lại SAI câu ấy sau lúc tự sửa (sổ, ket_qua=0)" "SELECT COUNT(*) n, SUM(CASE WHEN EXISTS (SELECT 1 FROM su_kien_hoc s WHERE s.sbd=d.sbd AND s.qid=d.qid_chuan AND s.ket_qua=0 AND s.luc > strftime('%Y-%m-%dT%H:%M:%S', d.dong_luc/1000, 'unixepoch')) THEN 1 ELSE 0 END) sai_lai FROM chua_loi_dot d WHERE d.trang_thai_day='da_tu_sua' AND d.dong_luc IS NOT NULL AND d.dong_luc >= (strftime('%s','now')-30*86400)*1000 AND d.dong_luc <= (strftime('%s','now')-3*86400)*1000"
          # THỬ TRƯỚC KHI PHÁT HÀNH (chữa câu gọn 25/10): ĐÚNG điều kiện đóng tự động của server/src/chua-gon.ts (sqlDaTuSuaDungLai, ?2 = d.sbd), CHỈ ĐẾM — không ghi.
          q "22 em nhiều đợt mở nhất (không in SBD): đợt mở 14 ngày · sẽ đóng · thời gian SQL" "SELECT COUNT(*) n, SUM(EXISTS (SELECT 1 FROM su_kien_hoc c WHERE c.sbd=d.sbd AND (c.qid=d.qid_chuan OR (c.qid>d.qid_chuan||'~' AND c.qid<d.qid_chuan||'~~') OR (c.qid>d.qid_chuan||'#' AND c.qid<d.qid_chuan||'#~')) AND c.ket_qua=1 AND COALESCE(c.purpose,'') NOT IN ('xem_loi_giai','luot','chan_doan','chua_buoc') AND COALESCE(c.assistance,'none') IN ('none','') AND COALESCE(c.visibility,'released')<>'embargoed' AND c.luc > (SELECT w.luc FROM su_kien_hoc w WHERE w.sbd=d.sbd AND (w.qid=d.qid_chuan OR (w.qid>d.qid_chuan||'~' AND w.qid<d.qid_chuan||'~~') OR (w.qid>d.qid_chuan||'#' AND w.qid<d.qid_chuan||'#~')) AND COALESCE(w.ket_qua,0)=0 AND COALESCE(w.purpose,'') NOT IN ('xem_loi_giai','luot','chan_doan','chua_buoc') AND COALESCE(w.assistance,'none') IN ('none','') AND COALESCE(w.visibility,'released')<>'embargoed' ORDER BY w.luc DESC LIMIT 1) AND (c.qid<>d.qid_chuan OR c.ngay_vn > (SELECT w.ngay_vn FROM su_kien_hoc w WHERE w.sbd=d.sbd AND (w.qid=d.qid_chuan OR (w.qid>d.qid_chuan||'~' AND w.qid<d.qid_chuan||'~~') OR (w.qid>d.qid_chuan||'#' AND w.qid<d.qid_chuan||'#~')) AND COALESCE(w.ket_qua,0)=0 AND COALESCE(w.purpose,'') NOT IN ('xem_loi_giai','luot','chan_doan','chua_buoc') AND COALESCE(w.assistance,'none') IN ('none','') AND COALESCE(w.visibility,'released')<>'embargoed' ORDER BY w.luc DESC LIMIT 1)) AND NOT EXISTS (SELECT 1 FROM loi_giai_hoi g WHERE g.sbd=d.sbd AND (g.qid=d.qid_chuan OR (g.qid>d.qid_chuan||'~' AND g.qid<d.qid_chuan||'~~') OR (g.qid>d.qid_chuan||'#' AND g.qid<d.qid_chuan||'#~')) AND g.luc<=c.luc AND g.luc>=strftime('%Y-%m-%dT%H:%M:%fZ',c.luc,'-12 hours')) AND NOT EXISTS (SELECT 1 FROM su_kien_hoc x WHERE x.sbd=d.sbd AND (x.qid=d.qid_chuan OR (x.qid>d.qid_chuan||'~' AND x.qid<d.qid_chuan||'~~') OR (x.qid>d.qid_chuan||'#' AND x.qid<d.qid_chuan||'#~')) AND x.purpose='xem_loi_giai' AND x.luc<=c.luc AND x.luc>=strftime('%Y-%m-%dT%H:%M:%fZ',c.luc,'-12 hours')))) se_dong FROM chua_loi_dot d WHERE d.dong_luc IS NULL AND d.trang_thai_day<>'da_tu_sua' AND COALESCE(d.sai_cuoi_luc,d.mo_luc) >= (strftime('%s','now')-14*86400)*1000 AND d.sbd=(SELECT x.sbd FROM chua_loi_dot x WHERE x.dong_luc IS NULL GROUP BY x.sbd ORDER BY COUNT(*) DESC LIMIT 1)"
          q "25 sau phát hành: lượt nộp ở màn sửa câu gọn theo kết quả" "SELECT json_extract(ket,'\$.ket') ket, COUNT(*) n, COUNT(DISTINCT sbd) so_em FROM chua_gon_lan GROUP BY 1"
          q "26 sau phát hành (từ 09:20Z 25/10): đợt Đã tự sửa — do màn sửa câu · do đóng tự động khi mở danh sách" "SELECT SUM(EXISTS(SELECT 1 FROM chua_gon_lan g WHERE g.dot_id=d.id AND json_extract(g.ket,'\$.ket')='tu_sua')) man_sua, SUM(NOT EXISTS(SELECT 1 FROM chua_gon_lan g WHERE g.dot_id=d.id AND json_extract(g.ket,'\$.ket')='tu_sua')) dong_tu_dong FROM chua_loi_dot d WHERE d.trang_thai_day='da_tu_sua' AND d.dong_luc >= strftime('%s','2026-10-25T09:20:00')*1000"
