# ĐO ĐỘ PHỦ HỌC LIỆU CHO VÒNG CHỮA CÂU GỌN (CHỈ ĐỌC) — thầy 25/10 "đề xuất lại việc chữa câu đơn giản và hiệu quả nhất".
# Câu hỏi: với các đợt tự sửa còn mở (nhất là sai trong 14 ngày), bao nhiêu câu có lời giải trong kho, có câu song sinh (~ss / ~bt),
# có đáp án để máy chấm; mỗi em có bao nhiêu câu sai gần đây. CHỈ SELECT gộp — không mã em, tên em, mã câu (repo công khai).
name: Đo độ phủ chữa câu gọn (chỉ đọc)
on:
  workflow_dispatch:
  push:
    branches: [claude/gifted-mendel-m8etj0]
    paths: ['.github/workflows/do-phu-chua-cau-2510.yml']
permissions:
  contents: read
concurrency:
  group: do-phu-chua-cau-${{ github.ref }}
  cancel-in-progress: true
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Đếm (chỉ SELECT gộp)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          q() { echo "== $1"; npx -y wrangler@4 d1 execute omr --remote --json --command "$2" | jq -c '.[0].results' || echo "LOI"; }
          MO="dong_luc IS NULL AND trang_thai_day<>'da_tu_sua'"
          GAN="COALESCE(sai_cuoi_luc,mo_luc) >= (strftime('%s','now')-14*86400)*1000"
          SS="EXISTS (SELECT 1 FROM game_v2_question s WHERE s.qid > d.qid_chuan||'~' AND s.qid < d.qid_chuan||'~~' AND (substr(s.qid,length(d.qid_chuan)+1,3) IN ('~ss','~bt')))"
          LG="EXISTS (SELECT 1 FROM game_v2_question g WHERE g.qid=d.qid_chuan AND length(trim(COALESCE(json_extract(g.json,'\$.solution'),'')))>0)"
          DA="EXISTS (SELECT 1 FROM game_v2_question g WHERE g.qid=d.qid_chuan AND length(trim(COALESCE(json_extract(g.json,'\$.correct'),'')))>0)"
          q "1 đợt mở: tổng · sai trong 14 ngày · số em" "SELECT COUNT(*) mo, SUM($GAN) mo_14_ngay, COUNT(DISTINCT sbd) so_em FROM chua_loi_dot d WHERE $MO"
          q "2 đợt mở 14 ngày: có lời giải · có song sinh · có đáp án · cả lời giải lẫn song sinh · không có cả hai" "SELECT COUNT(*) n, SUM($LG) co_loi_giai, SUM($SS) co_song_sinh, SUM($DA) co_dap_an, SUM(($LG) AND ($SS)) ca_hai, SUM(NOT($LG) AND NOT($SS)) khong_co_gi FROM chua_loi_dot d WHERE $MO AND $GAN"
          q "3 mọi đợt mở: có lời giải · có song sinh · có đáp án" "SELECT COUNT(*) n, SUM($LG) co_loi_giai, SUM($SS) co_song_sinh, SUM($DA) co_dap_an FROM chua_loi_dot d WHERE $MO"
          q "4 đợt mở 14 ngày theo loại câu" "SELECT COALESCE((SELECT json_extract(g.json,'\$.type') FROM game_v2_question g WHERE g.qid=d.qid_chuan LIMIT 1),'?') loai, COUNT(*) n FROM chua_loi_dot d WHERE $MO AND $GAN GROUP BY loai ORDER BY n DESC"
          q "5 mỗi em: số câu sai 14 ngày còn mở (phân bố)" "WITH e AS (SELECT sbd, SUM($GAN) gan FROM chua_loi_dot d WHERE $MO GROUP BY sbd) SELECT COUNT(*) so_em, SUM(gan=0) em_0, SUM(gan BETWEEN 1 AND 3) em_1_3, SUM(gan BETWEEN 4 AND 11) em_4_11, SUM(gan BETWEEN 12 AND 30) em_12_30, SUM(gan>30) em_tren_30 FROM e"
          q "6 đợt mở 14 ngày theo kênh sai" "SELECT nguon_sai, COUNT(*) n FROM chua_loi_dot d WHERE $MO AND $GAN GROUP BY nguon_sai ORDER BY n DESC LIMIT 12"
          q "7 nhóm nội dung: đợt mở 14 ngày mà ≥5 em cùng sai (số câu, số đợt)" "SELECT COUNT(*) so_cau, SUM(n) so_dot FROM (SELECT qid_chuan, COUNT(DISTINCT sbd) n FROM chua_loi_dot d WHERE $MO AND $GAN GROUP BY qid_chuan HAVING n>=5)"
          q "8 câu song sinh trong kho: mã có ~ss · có ~bt · tổng câu" "SELECT SUM(instr(qid,'~ss')>0) co_ss, SUM(instr(qid,'~bt')>0) co_bt, SUM(instr(qid,'~')>0) co_nga, COUNT(*) tong FROM game_v2_question"
          q "10 đợt mở 14 ngày: câu gốc có song sinh theo nhóm nội dung (cùng content_group, khác qid)" "SELECT COUNT(*) n, SUM(EXISTS (SELECT 1 FROM game_v2_question g WHERE d.content_group<>'' AND g.content_group=d.content_group AND g.qid<>d.qid_chuan)) co_cung_nhom FROM chua_loi_dot d WHERE dong_luc IS NULL AND trang_thai_day<>'da_tu_sua' AND COALESCE(sai_cuoi_luc,mo_luc) >= (strftime('%s','now')-14*86400)*1000"
          q "11 đợt mới mở mỗi ngày (7 ngày, giờ VN)" "SELECT date(mo_luc/1000,'unixepoch','+7 hours') ngay, COUNT(*) n, COUNT(DISTINCT sbd) em FROM chua_loi_dot WHERE mo_luc >= (strftime('%s','now')-7*86400)*1000 GROUP BY ngay ORDER BY ngay"
          q "12 đợt mở 14 ngày theo dạng câu (cột dang)" "SELECT COALESCE((SELECT g.dang FROM game_v2_question g WHERE g.qid=d.qid_chuan LIMIT 1),'?') dang, COUNT(*) n FROM chua_loi_dot d WHERE dong_luc IS NULL AND trang_thai_day<>'da_tu_sua' AND COALESCE(sai_cuoi_luc,mo_luc) >= (strftime('%s','now')-14*86400)*1000 GROUP BY dang ORDER BY n DESC LIMIT 8"
          q "13 đợt mở 14 ngày: câu gốc có song sinh soạn sẵn (cau_bo_tro.qid_mau, song_sinh_json không rỗng)" "SELECT COUNT(*) n, SUM(EXISTS (SELECT 1 FROM cau_bo_tro b WHERE b.qid_mau=d.qid_chuan AND json_array_length(COALESCE(b.song_sinh_json,'[]'))>0)) co_ss FROM chua_loi_dot d WHERE dong_luc IS NULL AND trang_thai_day<>'da_tu_sua' AND COALESCE(sai_cuoi_luc,mo_luc) >= (strftime('%s','now')-14*86400)*1000"
          q "14 đợt mở 14 ngày: có câu anh em (cùng dạng, khác nhóm nội dung) trong kho" "SELECT COUNT(*) n, SUM(EXISTS (SELECT 1 FROM game_v2_question a WHERE a.dang=(SELECT g.dang FROM game_v2_question g WHERE g.qid=d.qid_chuan LIMIT 1) AND a.content_group<>d.content_group)) co_anh_em FROM chua_loi_dot d WHERE dong_luc IS NULL AND trang_thai_day<>'da_tu_sua' AND COALESCE(sai_cuoi_luc,mo_luc) >= (strftime('%s','now')-14*86400)*1000"
          q "15 đợt mở 14 ngày: số câu gốc khác nhau · số đợt của 50 câu nhiều em sai nhất" "SELECT (SELECT COUNT(DISTINCT qid_chuan) FROM chua_loi_dot WHERE dong_luc IS NULL AND trang_thai_day<>'da_tu_sua' AND COALESCE(sai_cuoi_luc,mo_luc) >= (strftime('%s','now')-14*86400)*1000) so_cau, (SELECT SUM(n) FROM (SELECT COUNT(*) n FROM chua_loi_dot WHERE dong_luc IS NULL AND trang_thai_day<>'da_tu_sua' AND COALESCE(sai_cuoi_luc,mo_luc) >= (strftime('%s','now')-14*86400)*1000 GROUP BY qid_chuan ORDER BY n DESC LIMIT 50)) dot_top50"
          q "16 cau_bo_tro: tổng dòng · dòng có song sinh" "SELECT COUNT(*) tong, SUM(json_array_length(COALESCE(song_sinh_json,'[]'))>0) co_ss FROM cau_bo_tro"
          q "17 đợt mở 14 ngày: SAU lần sai cuối em đã làm ĐÚNG lại chính câu gốc (sổ su_kien_hoc, ket_qua=1) · đúng ở ngày khác" "SELECT COUNT(*) n, SUM(EXISTS (SELECT 1 FROM su_kien_hoc s WHERE s.sbd=d.sbd AND s.qid=d.qid_chuan AND s.ket_qua=1 AND s.luc > strftime('%Y-%m-%dT%H:%M:%S', COALESCE(d.sai_cuoi_luc,d.mo_luc)/1000,'unixepoch'))) dung_lai, SUM(EXISTS (SELECT 1 FROM su_kien_hoc s WHERE s.sbd=d.sbd AND s.qid=d.qid_chuan AND s.ket_qua=1 AND s.luc > strftime('%Y-%m-%dT%H:%M:%S', COALESCE(d.sai_cuoi_luc,d.mo_luc)/1000,'unixepoch') AND s.ngay_vn > date(COALESCE(d.sai_cuoi_luc,d.mo_luc)/1000,'unixepoch','+7 hours'))) dung_ngay_khac FROM chua_loi_dot d WHERE dong_luc IS NULL AND trang_thai_day<>'da_tu_sua' AND COALESCE(sai_cuoi_luc,mo_luc) >= (strftime('%s','now')-14*86400)*1000"
          q "18 sổ: giá trị ket_qua (để chắc 1 = đúng)" "SELECT ket_qua, COUNT(*) n FROM su_kien_hoc WHERE ngay_vn >= date('now','-3 days') GROUP BY ket_qua"
          q "19 NGHIỆM THU 7 ngày: đợt sai trong 14 ngày — đã tự sửa · còn mở · tỉ lệ đã tự sửa (%)" "SELECT COUNT(*) n, SUM(trang_thai_day='da_tu_sua') da_tu_sua, SUM(dong_luc IS NULL) con_mo, ROUND(100.0*SUM(trang_thai_day='da_tu_sua')/COUNT(*),1) pt FROM chua_loi_dot WHERE COALESCE(sai_cuoi_luc,mo_luc) >= (strftime('%s','now')-14*86400)*1000"
          q "20 NGHIỆM THU kiểm lại: câu đã tự sửa 3–30 ngày trước mà em lại SAI câu ấy sau lúc tự sửa (sổ, ket_qua=0) · tỉ lệ (%)" "SELECT COUNT(*) n, SUM(EXISTS (SELECT 1 FROM su_kien_hoc s WHERE s.sbd=d.sbd AND s.qid=d.qid_chuan AND s.ket_qua=0 AND s.luc > strftime('%Y-%m-%dT%H:%M:%S', d.dong_luc/1000,'unixepoch'))) sai_lai, ROUND(100.0*SUM(EXISTS (SELECT 1 FROM su_kien_hoc s WHERE s.sbd=d.sbd AND s.qid=d.qid_chuan AND s.ket_qua=0 AND s.luc > strftime('%Y-%m-%dT%H:%M:%S', d.dong_luc/1000,'unixepoch'))))/MAX(COUNT(*),1),1) pt FROM chua_loi_dot d WHERE d.trang_thai_day='da_tu_sua' AND d.dong_luc BETWEEN (strftime('%s','now')-30*86400)*1000 AND (strftime('%s','now')-3*86400)*1000"
