# Bảng / cột mà lượt đọc Sảnh cần có trên D1 thật không (CHỈ ĐỌC: sqlite_master, pragma) — 27/10 tối, tối ưu Sảnh / Mở chặng.
name: Đo bảng Sảnh (chỉ đọc)
on:
  workflow_dispatch:
  push:
    branches: [claude/do-nop-2710]
    paths: [.github/workflows/do-bang-sanh-2710.yml]
permissions:
  contents: read
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Đo
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          q() { echo "== $1"; npx -y wrangler@4 d1 execute omr --remote --json --command "$2" | jq -c ".[0].results[]" || echo "(lỗi)"; }
          q "chỉ mục bảng nóng" "SELECT tbl_name,name,sql FROM sqlite_master WHERE type='index' AND tbl_name IN ('su_kien_hoc','chua_loi_dot','hanh_trinh_v4_canh','exp_so','loi_giai_hoi','kiem_tra_ca_nhan','game_v2_question','cau_meta','omni_q','chua_gon_lan') ORDER BY tbl_name"
          q "kế hoạch truy vấn sổ theo em + luc" "EXPLAIN QUERY PLAN SELECT qid, ngay_vn, luc FROM su_kien_hoc WHERE sbd = 'x' AND luc >= '2026-10-01'"
          q "kế hoạch truy vấn đóng đợt" "EXPLAIN QUERY PLAN SELECT id FROM chua_loi_dot WHERE sbd='x' AND dong_luc IS NULL AND trang_thai_day<>'da_tu_sua' AND COALESCE(sai_cuoi_luc,mo_luc)>=0"
          q "số dòng bảng phụ" "SELECT (SELECT COUNT(*) FROM hanh_trinh_v4_canh) canh,(SELECT COUNT(*) FROM exp_so) exp,(SELECT COUNT(*) FROM omni_q) oq,(SELECT COUNT(*) FROM chua_gon_lan) cgl"
