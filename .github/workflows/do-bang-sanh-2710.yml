# Bảng / cột mà lượt đọc Sảnh cần có trên D1 thật không (CHỈ ĐỌC: sqlite_master, pragma) — 27/10 tối, tối ưu Sảnh / Mở chặng.
name: Đo bảng Sảnh (chỉ đọc)
on:
  workflow_dispatch:
  push:
    branches: [claude/do-nop-2710]
    paths: [.github/workflows/do-bang-sanh-2710.yml]
permissions:
  contents: read
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Đo
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          q() { echo "== $1"; npx -y wrangler@4 d1 execute omr --remote --json --command "$2" | jq -c ".[0].results[]" || echo "(lỗi)"; }
          for n in 1 2 3 4; do q "tem kho lần $n" "SELECT COUNT(*) n, MAX(indexed_at) m, (SELECT COUNT(*) FROM game_v2_index gi LEFT JOIN cau_meta_to mt ON mt.ma_de=gi.ma_de WHERE mt.indexed_at IS NOT gi.indexed_at) lech, (SELECT COUNT(*) FROM cau_meta_to WHERE ma_de='*') sao FROM game_v2_index"; sleep 50; done
          q "tờ lập chỉ mục gần nhất" "SELECT substr(indexed_at,1,16) t, COUNT(*) n FROM game_v2_index GROUP BY 1 ORDER BY 1 DESC LIMIT 8"
          q "hàng đợi đồng bộ hôm nay (cron)" "SELECT (SELECT COUNT(*) FROM game_v2_index WHERE indexed_at >= '2026-10-27') hom_nay, (SELECT COUNT(*) FROM game_v2_index WHERE indexed_at >= '2026-10-27T12:00') toi_nay"
