# SOI VÌ SAO 11/11 ÍT EM ĐÚNG 18/4/6 (CHỈ ĐỌC, 12/11): nguồn của 28 câu đầu + đo lại chỉ trên câu Gói 7 (ma_nguon g7:%). Chỉ SELECT đếm gộp, không in mã/tên em.
#   1. tỉ lệ em-ngày ĐÚNG 18 · 4 · 6 trong 28 câu đầu của ngày;   2. tỉ lệ em làm ĐỦ 28 câu;
#   3. lỗi tồn (câu mà lần làm gần nhất là sai);                   4. điểm Kiểm tra ôn tập.
# Mỗi lượt in đủ 14 ngày gần nhất ⇒ một lượt bất kỳ đã thấy xu hướng, không cần lưu trạng thái. CHỈ SELECT đếm gộp — không in mã em, tên em. KHÔNG `d1 export`.
# Tự chạy 00:20 giờ VN mỗi ngày (ngoài giờ học); mỗi câu cách nhau 4 giây (D1 từng 429 khi dồn lệnh). Đặc tả: docs/de-xuat-28-cau-v6-1011.md.
name: Soi 18/4/6 ngày 11/11 (chỉ đọc)
on:
  # 12/11: chỉ chạy tay NGOÀI GIỜ HỌC (câu K/K2 đọc ~3 triệu hàng; 07:23 VN đã gặp D1 7429 quá tải).
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soi-18-4-6
  cancel-in-progress: true
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Đo (chỉ SELECT)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          q() { echo "## $1"; npx -y wrangler@4 d1 execute omr --remote --json --command "$2" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const r=(Array.isArray(j)?j[0]:j).results||[];for(const x of r)console.log(JSON.stringify(x));console.log('('+r.length+' dòng)')}catch(e){console.log('LỖI: '+s.slice(0,400))}})"; sleep 4; }
          r() { echo "## $1"; npx -y wrangler@4 d1 execute omr --remote --json --command "$2" 2>&1 | tail -c 1500; echo; sleep 4; }
          r "K8 lô 1 (30 em ngày Sửa 11/11, đi chỉ mục theo em)" "WITH em AS (SELECT sbd FROM goi_bai_7_loai_ngay WHERE ngay='2026-11-11' AND loai='sua' ORDER BY sbd LIMIT 30 OFFSET 0), g AS (SELECT gs.sbd, gs.created_at c, gs.json FROM game_v2_session gs WHERE gs.sbd IN (SELECT sbd FROM em) AND gs.created_at >= '2026-11-10T17:00:00' AND gs.created_at < '2026-11-11T17:00:00' AND json_extract(gs.json,'\$.goi7')=1), q AS (SELECT g.sbd, g.c || printf('%05d', j.key) th, json_extract(j.value,'\$.qid') qid FROM g, json_each(g.json,'\$.questions') j WHERE COALESCE(json_extract(j.value,'\$.lamLaiCuoi'),0)<>1), d AS (SELECT sbd, CASE WHEN instr(qid,'~')>0 THEN substr(qid,1,instr(qid,'~')-1) ELSE qid END goc, MIN(th) th FROM q WHERE qid IS NOT NULL GROUP BY 1,2), r AS (SELECT d.*, ROW_NUMBER() OVER (PARTITION BY sbd ORDER BY th) k, COUNT(*) OVER (PARTITION BY sbd) n FROM d), e AS (SELECT sbd, MAX(n) n, SUM(k<=28 AND p='I') i, SUM(k<=28 AND p='II') ii, SUM(k<=28 AND p='III') iii FROM (SELECT r.*, (SELECT json_extract(gq.json,'\$.phan') FROM game_v2_question gq WHERE gq.qid=r.goc LIMIT 1) p FROM r) GROUP BY 1), dl AS (SELECT s.sbd, COUNT(DISTINCT CASE WHEN (SELECT json_extract(gq.json,'\$.phan') FROM game_v2_question gq WHERE gq.qid=CASE WHEN instr(s.qid,'~')>0 THEN substr(s.qid,1,instr(s.qid,'~')-1) ELSE s.qid END LIMIT 1)='I' THEN CASE WHEN instr(s.qid,'~')>0 THEN substr(s.qid,1,instr(s.qid,'~')-1) ELSE s.qid END END) i_lam, COUNT(DISTINCT CASE WHEN (SELECT json_extract(gq.json,'\$.phan') FROM game_v2_question gq WHERE gq.qid=CASE WHEN instr(s.qid,'~')>0 THEN substr(s.qid,1,instr(s.qid,'~')-1) ELSE s.qid END LIMIT 1)='II' THEN CASE WHEN instr(s.qid,'~')>0 THEN substr(s.qid,1,instr(s.qid,'~')-1) ELSE s.qid END END) ii_lam, COUNT(DISTINCT CASE WHEN COALESCE(json_extract(s.raw_json,'\$.ll'),0)=1 OR s.nguon='tu_luyen' THEN s.qid END) ll_tl FROM su_kien_hoc s WHERE s.sbd IN (SELECT sbd FROM em) AND s.ngay_vn='2026-11-11' AND s.ket_qua IS NOT NULL AND +s.nguon IN ('game','tu_luyen') GROUP BY 1), h AS (SELECT s.sbd, CASE WHEN instr(s.qid,'~')>0 THEN substr(s.qid,1,instr(s.qid,'~')-1) ELSE s.qid END goc, s.ket_qua, ROW_NUMBER() OVER (PARTITION BY s.sbd, CASE WHEN instr(s.qid,'~')>0 THEN substr(s.qid,1,instr(s.qid,'~')-1) ELSE s.qid END ORDER BY s.luc DESC) rn FROM su_kien_hoc s WHERE s.sbd IN (SELECT sbd FROM em) AND s.ngay_vn < '2026-11-11' AND s.ket_qua IS NOT NULL AND COALESCE(s.purpose,'') NOT IN ('xem_loi_giai','luot','chan_doan','chua_buoc')), ca AS (SELECT x.sbd, SUM(x.k<=28 AND (SELECT json_extract(gq.json,'\$.phan') FROM game_v2_question gq WHERE gq.qid=x.goc LIMIT 1)='III') iii_ca, SUM(x.k<=28 AND x.khac=1) khac28, MAX(x.n) n_ca FROM (SELECT y.*, ROW_NUMBER() OVER (PARTITION BY y.sbd ORDER BY y.luc) k, COUNT(*) OVER (PARTITION BY y.sbd) n FROM (SELECT s.sbd, CASE WHEN instr(s.qid,'~')>0 THEN substr(s.qid,1,instr(s.qid,'~')-1) ELSE s.qid END goc, MIN(s.luc) luc, MAX(CASE WHEN s.nguon<>'game' THEN 1 ELSE 0 END) khac FROM su_kien_hoc s WHERE s.sbd IN (SELECT sbd FROM em) AND s.ngay_vn='2026-11-11' AND s.ket_qua IS NOT NULL AND s.ma_nguon NOT LIKE 'ktcn:%' AND COALESCE(s.nguon,'') NOT IN ('chua_loi','tu_luyen') AND COALESCE(json_extract(s.raw_json,'\$.ll'),0)<>1 AND COALESCE(s.purpose,'') NOT IN ('xem_loi_giai','chan_doan','chua_buoc') GROUP BY 1,2) y) x GROUP BY 1), t AS (SELECT h.sbd, SUM(h.ket_qua=0 AND COALESCE((SELECT json_extract(gq.json,'\$.tuLuan') FROM game_v2_question gq WHERE gq.qid=h.goc LIMIT 1),0)<>1) sai_tln, SUM(h.ket_qua=0 AND COALESCE((SELECT json_extract(gq.json,'\$.tuLuan') FROM game_v2_question gq WHERE gq.qid=h.goc LIMIT 1),0)=1) sai_tln_tu_luan, SUM(h.ket_qua=1 AND COALESCE((SELECT json_extract(gq.json,'\$.tuLuan') FROM game_v2_question gq WHERE gq.qid=h.goc LIMIT 1),0)<>1) dung_tln FROM h WHERE h.rn=1 AND (SELECT json_extract(gq.json,'\$.phan') FROM game_v2_question gq WHERE gq.qid=h.goc LIMIT 1)='III' GROUP BY 1) SELECT CASE WHEN dl.ll_tl=0 THEN 'khong_lam_lai_tu_luyen' ELSE 'co_lam_lai_tu_luyen' END nhom, SUM(e.iii<6 AND ca.iii_ca>=6) thieu_goi7_nhung_ca_ngay_du_TLN, SUM(e.iii<6 AND ca.khac28>0) thieu_va_co_kenh_khac_trong_28, COUNT(*) em, SUM(e.iii<6) de_thieu_TLN, SUM(e.i=18 AND e.ii=4 AND e.iii=6) de_dung, ROUND(AVG(dl.ll_tl),1) tb_lam_lai, ROUND(AVG(e.iii),1) tb_III, SUM(e.iii<6 AND COALESCE(t.sai_tln,0)>0) thieu_ma_con_sai_TLN, ROUND(AVG(CASE WHEN e.iii<6 THEN t.sai_tln END),1) tb_sai_TLN_rut_duoc, ROUND(AVG(CASE WHEN e.iii<6 THEN t.sai_tln_tu_luan END),1) tb_sai_TLN_tu_luan, ROUND(AVG(CASE WHEN e.iii<6 THEN t.dung_tln END),1) tb_dung_TLN FROM e JOIN dl ON dl.sbd=e.sbd LEFT JOIN t ON t.sbd=e.sbd LEFT JOIN ca ON ca.sbd=e.sbd WHERE e.n>=28 GROUP BY 1"
          r "K8 lô 2 (30 em ngày Sửa 11/11, đi chỉ mục theo em)" "WITH em AS (SELECT sbd FROM goi_bai_7_loai_ngay WHERE ngay='2026-11-11' AND loai='sua' ORDER BY sbd LIMIT 30 OFFSET 30), g AS (SELECT gs.sbd, gs.created_at c, gs.json FROM game_v2_session gs WHERE gs.sbd IN (SELECT sbd FROM em) AND gs.created_at >= '2026-11-10T17:00:00' AND gs.created_at < '2026-11-11T17:00:00' AND json_extract(gs.json,'\$.goi7')=1), q AS (SELECT g.sbd, g.c || printf('%05d', j.key) th, json_extract(j.value,'\$.qid') qid FROM g, json_each(g.json,'\$.questions') j WHERE COALESCE(json_extract(j.value,'\$.lamLaiCuoi'),0)<>1), d AS (SELECT sbd, CASE WHEN instr(qid,'~')>0 THEN substr(qid,1,instr(qid,'~')-1) ELSE qid END goc, MIN(th) th FROM q WHERE qid IS NOT NULL GROUP BY 1,2), r AS (SELECT d.*, ROW_NUMBER() OVER (PARTITION BY sbd ORDER BY th) k, COUNT(*) OVER (PARTITION BY sbd) n FROM d), e AS (SELECT sbd, MAX(n) n, SUM(k<=28 AND p='I') i, SUM(k<=28 AND p='II') ii, SUM(k<=28 AND p='III') iii FROM (SELECT r.*, (SELECT json_extract(gq.json,'\$.phan') FROM game_v2_question gq WHERE gq.qid=r.goc LIMIT 1) p FROM r) GROUP BY 1), dl AS (SELECT s.sbd, COUNT(DISTINCT CASE WHEN (SELECT json_extract(gq.json,'\$.phan') FROM game_v2_question gq WHERE gq.qid=CASE WHEN instr(s.qid,'~')>0 THEN substr(s.qid,1,instr(s.qid,'~')-1) ELSE s.qid END LIMIT 1)='I' THEN CASE WHEN instr(s.qid,'~')>0 THEN substr(s.qid,1,instr(s.qid,'~')-1) ELSE s.qid END END) i_lam, COUNT(DISTINCT CASE WHEN (SELECT json_extract(gq.json,'\$.phan') FROM game_v2_question gq WHERE gq.qid=CASE WHEN instr(s.qid,'~')>0 THEN substr(s.qid,1,instr(s.qid,'~')-1) ELSE s.qid END LIMIT 1)='II' THEN CASE WHEN instr(s.qid,'~')>0 THEN substr(s.qid,1,instr(s.qid,'~')-1) ELSE s.qid END END) ii_lam, COUNT(DISTINCT CASE WHEN COALESCE(json_extract(s.raw_json,'\$.ll'),0)=1 OR s.nguon='tu_luyen' THEN s.qid END) ll_tl FROM su_kien_hoc s WHERE s.sbd IN (SELECT sbd FROM em) AND s.ngay_vn='2026-11-11' AND s.ket_qua IS NOT NULL AND +s.nguon IN ('game','tu_luyen') GROUP BY 1), h AS (SELECT s.sbd, CASE WHEN instr(s.qid,'~')>0 THEN substr(s.qid,1,instr(s.qid,'~')-1) ELSE s.qid END goc, s.ket_qua, ROW_NUMBER() OVER (PARTITION BY s.sbd, CASE WHEN instr(s.qid,'~')>0 THEN substr(s.qid,1,instr(s.qid,'~')-1) ELSE s.qid END ORDER BY s.luc DESC) rn FROM su_kien_hoc s WHERE s.sbd IN (SELECT sbd FROM em) AND s.ngay_vn < '2026-11-11' AND s.ket_qua IS NOT NULL AND COALESCE(s.purpose,'') NOT IN ('xem_loi_giai','luot','chan_doan','chua_buoc')), ca AS (SELECT x.sbd, SUM(x.k<=28 AND (SELECT json_extract(gq.json,'\$.phan') FROM game_v2_question gq WHERE gq.qid=x.goc LIMIT 1)='III') iii_ca, SUM(x.k<=28 AND x.khac=1) khac28, MAX(x.n) n_ca FROM (SELECT y.*, ROW_NUMBER() OVER (PARTITION BY y.sbd ORDER BY y.luc) k, COUNT(*) OVER (PARTITION BY y.sbd) n FROM (SELECT s.sbd, CASE WHEN instr(s.qid,'~')>0 THEN substr(s.qid,1,instr(s.qid,'~')-1) ELSE s.qid END goc, MIN(s.luc) luc, MAX(CASE WHEN s.nguon<>'game' THEN 1 ELSE 0 END) khac FROM su_kien_hoc s WHERE s.sbd IN (SELECT sbd FROM em) AND s.ngay_vn='2026-11-11' AND s.ket_qua IS NOT NULL AND s.ma_nguon NOT LIKE 'ktcn:%' AND COALESCE(s.nguon,'') NOT IN ('chua_loi','tu_luyen') AND COALESCE(json_extract(s.raw_json,'\$.ll'),0)<>1 AND COALESCE(s.purpose,'') NOT IN ('xem_loi_giai','chan_doan','chua_buoc') GROUP BY 1,2) y) x GROUP BY 1), t AS (SELECT h.sbd, SUM(h.ket_qua=0 AND COALESCE((SELECT json_extract(gq.json,'\$.tuLuan') FROM game_v2_question gq WHERE gq.qid=h.goc LIMIT 1),0)<>1) sai_tln, SUM(h.ket_qua=0 AND COALESCE((SELECT json_extract(gq.json,'\$.tuLuan') FROM game_v2_question gq WHERE gq.qid=h.goc LIMIT 1),0)=1) sai_tln_tu_luan, SUM(h.ket_qua=1 AND COALESCE((SELECT json_extract(gq.json,'\$.tuLuan') FROM game_v2_question gq WHERE gq.qid=h.goc LIMIT 1),0)<>1) dung_tln FROM h WHERE h.rn=1 AND (SELECT json_extract(gq.json,'\$.phan') FROM game_v2_question gq WHERE gq.qid=h.goc LIMIT 1)='III' GROUP BY 1) SELECT CASE WHEN dl.ll_tl=0 THEN 'khong_lam_lai_tu_luyen' ELSE 'co_lam_lai_tu_luyen' END nhom, SUM(e.