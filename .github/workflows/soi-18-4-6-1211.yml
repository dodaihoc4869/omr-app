# SOI VÌ SAO 11/11 ÍT EM ĐÚNG 18/4/6 (CHỈ ĐỌC, 12/11): nguồn của 28 câu đầu + đo lại chỉ trên câu Gói 7 (ma_nguon g7:%). Chỉ SELECT đếm gộp, không in mã/tên em.
#   1. tỉ lệ em-ngày ĐÚNG 18 · 4 · 6 trong 28 câu đầu của ngày;   2. tỉ lệ em làm ĐỦ 28 câu;
#   3. lỗi tồn (câu mà lần làm gần nhất là sai);                   4. điểm Kiểm tra ôn tập.
# Mỗi lượt in đủ 14 ngày gần nhất ⇒ một lượt bất kỳ đã thấy xu hướng, không cần lưu trạng thái. CHỈ SELECT đếm gộp — không in mã em, tên em. KHÔNG `d1 export`.
# Tự chạy 00:20 giờ VN mỗi ngày (ngoài giờ học); mỗi câu cách nhau 4 giây (D1 từng 429 khi dồn lệnh). Đặc tả: docs/de-xuat-28-cau-v6-1011.md.
name: Soi 18/4/6 ngày 11/11 (chỉ đọc)
on:
  workflow_dispatch:
  push:
    branches: [claude/trusting-ritchie-xo0ipg]
    paths: ['.github/workflows/soi-18-4-6-1211.yml']
permissions:
  contents: read
concurrency:
  group: soi-18-4-6
  cancel-in-progress: true
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Đo (chỉ SELECT)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          q() { echo "## $1"; npx -y wrangler@4 d1 execute omr --remote --json --command "$2" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const r=(Array.isArray(j)?j[0]:j).results||[];for(const x of r)console.log(JSON.stringify(x));console.log('('+r.length+' dòng)')}catch(e){console.log('LỖI: '+s.slice(0,400))}})"; sleep 4; }
          r() { echo "## $1"; npx -y wrangler@4 d1 execute omr --remote --json --command "$2" 2>&1 | tail -c 1500; echo; sleep 4; }
          r "D0 số phiên goi7 từ 11/11 + mẫu khoá json" "SELECT COUNT(*) n, MIN(created_at) tu, MAX(created_at) den, substr(MAX(json),1,300) mau FROM game_v2_session WHERE created_at >= '2026-11-10T17:00:00' AND json_extract(json,'\$.goi7')=1"
          r "D1 đề đã giao (thô)" "WITH g AS (SELECT sbd, created_at c, json FROM game_v2_session WHERE created_at >= date('now','-16 days') AND json_extract(json,'\$.goi7')=1), q AS (SELECT g.sbd, date(g.c,'+7 hours') ngay, g.c || printf('%05d', j.key) th, json_extract(j.value,'\$.qid') qid FROM g, json_each(g.json,'\$.questions') j), d AS (SELECT sbd, ngay, CASE WHEN instr(qid,'~')>0 THEN substr(qid,1,instr(qid,'~')-1) ELSE qid END goc, MIN(th) th FROM q WHERE qid IS NOT NULL GROUP BY 1,2,3), r AS (SELECT d.*, ROW_NUMBER() OVER (PARTITION BY sbd, ngay ORDER BY th) k, COUNT(*) OVER (PARTITION BY sbd, ngay) n FROM d), m AS (SELECT x.goc, (SELECT json_extract(q.json,'\$.phan') FROM game_v2_question q WHERE q.qid=x.goc LIMIT 1) phan FROM (SELECT DISTINCT goc FROM d) x), e AS (SELECT r.sbd, r.ngay, MAX(r.n) n, SUM(r.k<=28 AND m.phan='I') i, SUM(r.k<=28 AND m.phan='II') ii, SUM(r.k<=28 AND m.phan='III') iii FROM r JOIN m ON m.goc=r.goc GROUP BY 1,2) SELECT e.ngay, COALESCE(l.loai,'-') loai, COUNT(*) em_duoc_giao, SUM(n>=28) de_du_28, SUM(n>=28 AND i=18 AND ii=4 AND iii=6) de_dung_18_4_6, SUM(n>=28 AND ABS(i-18)<=1 AND ABS(ii-4)<=1 AND ABS(iii-6)<=1) de_sat, SUM(n>=28 AND ii<4) thieu_DS, SUM(n>=28 AND iii<6) thieu_TLN, SUM(n>=28 AND i>18) du_phan_I, ROUND(AVG(CASE WHEN n>=28 THEN i END),1) tb_I, ROUND(AVG(CASE WHEN n>=28 THEN ii END),1) tb_II, ROUND(AVG(CASE WHEN n>=28 THEN iii END),1) tb_III FROM e LEFT JOIN goi_bai_7_loai_ngay l ON l.sbd=e.sbd AND l.ngay=e.ngay WHERE e.ngay >= '2026-11-11' GROUP BY 1,2 ORDER BY 1,2"
