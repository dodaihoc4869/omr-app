# SOI VÌ SAO 11/11 ÍT EM ĐÚNG 18/4/6 (CHỈ ĐỌC, 12/11): nguồn của 28 câu đầu + đo lại chỉ trên câu Gói 7 (ma_nguon g7:%). Chỉ SELECT đếm gộp, không in mã/tên em.
#   1. tỉ lệ em-ngày ĐÚNG 18 · 4 · 6 trong 28 câu đầu của ngày;   2. tỉ lệ em làm ĐỦ 28 câu;
#   3. lỗi tồn (câu mà lần làm gần nhất là sai);                   4. điểm Kiểm tra ôn tập.
# Mỗi lượt in đủ 14 ngày gần nhất ⇒ một lượt bất kỳ đã thấy xu hướng, không cần lưu trạng thái. CHỈ SELECT đếm gộp — không in mã em, tên em. KHÔNG `d1 export`.
# Tự chạy 00:20 giờ VN mỗi ngày (ngoài giờ học); mỗi câu cách nhau 4 giây (D1 từng 429 khi dồn lệnh). Đặc tả: docs/de-xuat-28-cau-v6-1011.md.
name: Soi 18/4/6 ngày 11/11 (chỉ đọc)
on:
  workflow_dispatch:
  push:
    branches: [claude/trusting-ritchie-xo0ipg]
    paths: ['.github/workflows/soi-18-4-6-1211.yml']
permissions:
  contents: read
concurrency:
  group: soi-18-4-6
  cancel-in-progress: true
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Đo (chỉ SELECT)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          q() { echo "## $1"; npx -y wrangler@4 d1 execute omr --remote --json --command "$2" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const r=(Array.isArray(j)?j[0]:j).results||[];for(const x of r)console.log(JSON.stringify(x));console.log('('+r.length+' dòng)')}catch(e){console.log('LỖI: '+s.slice(0,400))}})"; sleep 4; }
          r() { echo "## $1"; npx -y wrangler@4 d1 execute omr --remote --json --command "$2" 2>&1 | tail -c 1500; echo; sleep 4; }
          r "K em có đề 11/11 thiếu câu trả lời ngắn: kho còn câu trả lời ngắn không" "WITH g AS (SELECT sbd, created_at c, json FROM game_v2_session WHERE created_at >= date('now','-16 days') AND json_extract(json,'\$.goi7')=1), q AS (SELECT g.sbd, date(g.c,'+7 hours') ngay, g.c || printf('%05d', j.key) th, json_extract(j.value,'\$.qid') qid FROM g, json_each(g.json,'\$.questions') j), d AS (SELECT sbd, ngay, CASE WHEN instr(qid,'~')>0 THEN substr(qid,1,instr(qid,'~')-1) ELSE qid END goc, MIN(th) th FROM q WHERE qid IS NOT NULL GROUP BY 1,2,3), r AS (SELECT d.*, ROW_NUMBER() OVER (PARTITION BY sbd, ngay ORDER BY th) k, COUNT(*) OVER (PARTITION BY sbd, ngay) n FROM d), m AS (SELECT x.goc, (SELECT json_extract(q.json,'\$.phan') FROM game_v2_question q WHERE q.qid=x.goc LIMIT 1) phan FROM (SELECT DISTINCT goc FROM d) x), e AS (SELECT r.sbd, r.ngay, MAX(r.n) n, SUM(r.k<=28 AND m.phan='I') i, SUM(r.k<=28 AND m.phan='II') ii, SUM(r.k<=28 AND m.phan='III') iii FROM r JOIN m ON m.goc=r.goc GROUP BY 1,2), t0 AS (SELECT e.sbd, e.iii, COALESCE(l.loai,'-') loai FROM e LEFT JOIN goi_bai_7_loai_ngay l ON l.sbd=e.sbd AND l.ngay=e.ngay WHERE e.ngay='2026-11-11' AND e.n>=28 AND e.iii<6), moi AS (SELECT t0.sbd, COUNT(DISTINCT c.qid) n FROM t0 JOIN goi_bai_7_em ge ON ge.sbd=t0.sbd AND substr(ge.bat_dau,1,10)<='2026-11-11' AND substr(ge.han,1,10)>='2026-11-11' JOIN goi_bai_7_cau c ON c.goi_id=ge.goi_id WHERE COALESCE(json_extract(c.meta_json,'\$.hopLe'),1)<>0 AND (SELECT json_extract(gq.json,'\$.phan') FROM game_v2_question gq WHERE gq.qid=CASE WHEN instr(c.qid,'~')>0 THEN substr(c.qid,1,instr(c.qid,'~')-1) ELSE c.qid END LIMIT 1)='III' AND NOT EXISTS (SELECT 1 FROM su_kien_hoc s WHERE s.sbd=t0.sbd AND s.qid=c.qid AND s.ngay_vn<'2026-11-11') GROUP BY 1), sai AS (SELECT x.sbd, COUNT(*) n FROM (SELECT s.sbd, CASE WHEN instr(s.qid,'~')>0 THEN substr(s.qid,1,instr(s.qid,'~')-1) ELSE s.qid END goc, s.ket_qua, ROW_NUMBER() OVER (PARTITION BY s.sbd, CASE WHEN instr(s.qid,'~')>0 THEN substr(s.qid,1,instr(s.qid,'~')-1) ELSE s.qid END ORDER BY s.luc DESC) rn FROM su_kien_hoc s WHERE s.sbd IN (SELECT sbd FROM t0) AND s.ngay_vn<'2026-11-11' AND s.ket_qua IS NOT NULL) t JOIN t0 x ON x.sbd=t.sbd WHERE t.rn=1 AND t.ket_qua=0 AND (SELECT json_extract(gq.json,'\$.phan') FROM game_v2_question gq WHERE gq.qid=t.goc LIMIT 1)='III' GROUP BY 1) SELECT t0.loai, COUNT(*) em_de_thieu_TLN, ROUND(AVG(6-t0.iii),1) tb_thieu, SUM(COALESCE(moi.n,0)=0 AND COALESCE(sai.n,0)=0) kho_het_TLN, SUM(COALESCE(moi.n,0)>0) con_TLN_moi, SUM(COALESCE(sai.n,0)>0) con_TLN_sai, ROUND(AVG(COALESCE(moi.n,0)),1) tb_TLN_moi_con, ROUND(AVG(COALESCE(sai.n,0)),1) tb_TLN_sai_con FROM t0 LEFT JOIN moi ON moi.sbd=t0.sbd LEFT JOIN sai ON sai.sbd=t0.sbd GROUP BY 1"
          r "K2 em đề thiếu câu trả lời ngắn: câu trả lời ngắn của em — sai/đúng, tự luận hay rút được" "WITH g AS (SELECT sbd, created_at c, json FROM game_v2_session WHERE created_at >= date('now','-16 days') AND json_extract(json,'\$.goi7')=1), q AS (SELECT g.sbd, date(g.c,'+7 hours') ngay, g.c || printf('%05d', j.key) th, json_extract(j.value,'\$.qid') qid FROM g, json_each(g.json,'\$.questions') j), d AS (SELECT sbd, ngay, CASE WHEN instr(qid,'~')>0 THEN substr(qid,1,instr(qid,'~')-1) ELSE qid END goc, MIN(th) th FROM q WHERE qid IS NOT NULL GROUP BY 1,2,3), r AS (SELECT d.*, ROW_NUMBER() OVER (PARTITION BY sbd, ngay ORDER BY th) k, COUNT(*) OVER (PARTITION BY sbd, ngay) n FROM d), m AS (SELECT x.goc, (SELECT json_extract(q.json,'\$.phan') FROM game_v2_question q WHERE q.qid=x.goc LIMIT 1) phan FROM (SELECT DISTINCT goc FROM d) x), e AS (SELECT r.sbd, r.ngay, MAX(r.n) n, SUM(r.k<=28 AND m.phan='I') i, SUM(r.k<=28 AND m.phan='II') ii, SUM(r.k<=28 AND m.phan='III') iii FROM r JOIN m ON m.goc=r.goc GROUP BY 1,2), t0 AS (SELECT e.sbd, e.iii, COALESCE(l.loai,'-') loai FROM e LEFT JOIN goi_bai_7_loai_ngay l ON l.sbd=e.sbd AND l.ngay=e.ngay WHERE e.ngay='2026-11-11' AND e.n>=28 AND e.iii<6), h AS (SELECT s.sbd, CASE WHEN instr(s.qid,'~')>0 THEN substr(s.qid,1,instr(s.qid,'~')-1) ELSE s.qid END goc, s.ket_qua, ROW_NUMBER() OVER (PARTITION BY s.sbd, CASE WHEN instr(s.qid,'~')>0 THEN substr(s.qid,1,instr(s.qid,'~')-1) ELSE s.qid END ORDER BY s.luc DESC) rn FROM su_kien_hoc s WHERE s.sbd IN (SELECT sbd FROM t0) AND s.ngay_vn<'2026-11-11' AND s.ket_qua IS NOT NULL AND COALESCE(s.purpose,'') NOT IN ('xem_loi_giai','luot','chan_doan','chua_buoc')), c AS (SELECT h.sbd, h.ket_qua, COALESCE((SELECT json_extract(gq.json,'\$.tuLuan') FROM game_v2_question gq WHERE gq.qid=h.goc LIMIT 1),0) tl FROM h WHERE h.rn=1 AND (SELECT json_extract(gq.json,'\$.phan') FROM game_v2_question gq WHERE gq.qid=h.goc LIMIT 1)='III'), p AS (SELECT t0.sbd, t0.loai, SUM(c.ket_qua=0 AND c.tl=1) sai_tu_luan, SUM(c.ket_qua=0 AND c.tl<>1) sai_rut_duoc, SUM(c.ket_qua=1 AND c.tl<>1) dung_rut_duoc FROM t0 LEFT JOIN c ON c.sbd=t0.sbd GROUP BY 1,2) SELECT loai, COUNT(*) em, ROUND(AVG(sai_tu_luan),1) tb_sai_tu_luan, ROUND(AVG(sai_rut_duoc),1) tb_sai_rut_duoc, ROUND(AVG(dung_rut_duoc),1) tb_dung_rut_duoc, SUM(COALESCE(sai_rut_duoc,0)=0) em_khong_con_sai_rut_duoc, SUM(COALESCE(sai_rut_duoc,0)=0 AND COALESCE(dung_rut_duoc,0)=0) em_khong_con_TLN_rut_duoc FROM p GROUP BY 1"
