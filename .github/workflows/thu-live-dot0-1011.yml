# NHÁNH claude/tach-giong-yt-1111 — tệp này THAY NỘI DUNG bản trên main (main giữ nguyên bộ thử Live Đợt 0).
# LUYỆN MÔ HÌNH «CHỈ GIỌNG THẦY» BẰNG BÀI GIẢNG YOUTUBE CỦA THẦY (11/11, thầy: «lấy thêm giọng ở các bài giảng youtube của tôi nhé để huấn luyện đỉnh nhất»).
# Repo CÔNG KHAI ⇒ mọi tiếng (YouTube, giọng khác, ồn) CHỈ nằm ở $RUNNER_TEMP: không vào kho, không artifact, không cache.
# Chỉ đưa về qua git: trọng số .tgt + số chấm JSON / MD ở scripts/thu-live-1011/tach-giong/ckpt-yt/.
#   kieu = thu-yt : dò YouTube (yt-dlp, nhiều player_client, không cookie / tài khoản) + kiểm các nguồn tải.
name: Thử khả thi Live — Đợt 0 (10/11)
on:
  workflow_dispatch:
    inputs:
      kieu:
        description: thu-yt (dò YouTube) · luyen (lấy giọng + luyện)
        default: 'thu-yt'
permissions:
  contents: read
concurrency:
  group: tach-giong-yt-1111
  cancel-in-progress: false
jobs:
  thu-yt:
    if: ${{ inputs.kieu == 'thu-yt' }}
    strategy:
      fail-fast: false
      matrix:
        may: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.may }}
    timeout-minutes: 25
    name: dò YouTube (${{ matrix.may }}, PO-token bgutil)
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cài yt-dlp + plugin PO-token bgutil (chế độ script, không docker, không tài khoản)
        run: |
          python3 -m pip install -q -U --break-system-packages "yt-dlp[default]" bgutil-ytdlp-pot-provider 2>&1 | tail -1 || python3 -m pip install -q -U "yt-dlp[default]" bgutil-ytdlp-pot-provider 2>&1 | tail -1
          git clone -q --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git "$HOME/bgutil-ytdlp-pot-provider"
          (cd "$HOME/bgutil-ytdlp-pot-provider/server" && npm ci --silent > /dev/null 2>&1 && npx tsc > /dev/null 2>&1; ls build/generate_once.js)
          yt-dlp --version
      - name: Client có PO-token (web_safari / mweb / web), 4 video, giãn 15 s
        run: |
          cd "$RUNNER_TEMP"
          for id in kY0NUO7-fCc lMa-IohYrs4 2zcCycq9EYc PfhFCRGNLKM; do
            for c in web_safari mweb web default; do
              ea=""; [ "$c" != default ] && ea="--extractor-args youtube:player_client=$c"
              if yt-dlp -v --no-warnings $ea -f bestaudio --test -o "t-$id.%(ext)s" "https://www.youtube.com/watch?v=$id" > v.txt 2>&1; then
                echo "TẢI ĐƯỢC $id $c $(grep -o 'https://[a-z0-9.-]*googlevideo.com' v.txt | sort -u | head -3 | tr '\n' ' ')"; rm -f t-$id.*; break
              else echo "LỖI $id $c: $(grep -m1 -o 'ERROR.*' v.txt | cut -c1-110) · pot: $(grep -c 'Retrieved a gvs PO Token' v.txt)"; fi
              sleep 15
            done
          done
      - name: Kiểm nguồn tải (HEAD) + tìm kho giọng Việt trên HF (chỉ in tên, giấy phép)
        run: |
          for u in \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/wespeaker_en_voxceleb_CAM++.onnx" \
            "https://huggingface.co/datasets/google/fleurs/resolve/main/data/vi_vn/audio/test.tar.gz" \
            "https://huggingface.co/datasets/google/fleurs/resolve/main/data/vi_vn/audio/dev.tar.gz" \
            "https://huggingface.co/datasets/google/fleurs/resolve/main/data/vi_vn/test.tsv" \
            "https://www.openslr.org/resources/141/dev_clean.tar.gz" \
            "https://us.openslr.org/resources/141/dev_clean.tar.gz" \
            "https://zenodo.org/records/1227121/files/SCAFE_48k.zip?download=1" \
            "https://zenodo.org/records/1227121/files/PCAFETER_48k.zip?download=1" \
            "https://raw.githubusercontent.com/soerenab/AudioMNIST/master/data/01/0_01_0.wav"; do
            echo "$(curl -sIL -o /dev/null -w '%{http_code} %{size_download} ' "$u") $(curl -sIL "$u" | grep -i '^content-length' | tail -1 | tr -d '\r') $u"
          done
          curl -s "https://huggingface.co/api/datasets?search=vietnamese&limit=60&full=true" | python3 -c "
          import json,sys
          for d in json.load(sys.stdin):
              t=d.get('tags',[]); lic=[x for x in t if x.startswith('license:')]; tc=[x for x in t if 'speech' in x or 'audio' in x]
              if tc: print(d['id'], lic, d.get('gated'), d.get('downloads'))"
