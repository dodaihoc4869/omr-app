# NHÁNH claude/tach-giong-yt-1111 — tệp này THAY NỘI DUNG bản trên main (main giữ nguyên bộ thử Live Đợt 0).
# LUYỆN MÔ HÌNH «CHỈ GIỌNG THẦY» BẰNG BÀI GIẢNG YOUTUBE CỦA THẦY (11/11, thầy: «lấy thêm giọng ở các bài giảng youtube của tôi nhé để huấn luyện đỉnh nhất»).
# Repo CÔNG KHAI ⇒ mọi tiếng (YouTube, giọng khác, ồn) CHỈ nằm ở $RUNNER_TEMP: không vào kho, không artifact, không cache.
# Chỉ đưa về qua git: trọng số .tgt + số chấm JSON / MD ở scripts/thu-live-1011/tach-giong/ckpt-yt/.
#   kieu = thu-yt : dò YouTube (yt-dlp, nhiều player_client, không cookie / tài khoản) + kiểm các nguồn tải.
name: Thử khả thi Live — Đợt 0 (10/11)
on:
  workflow_dispatch:
    inputs:
      kieu:
        description: thu-yt (dò YouTube) · luyen (lấy giọng + luyện)
        default: 'thu-yt'
permissions:
  contents: read
concurrency:
  group: tach-giong-yt-1111
  cancel-in-progress: false
jobs:
  thu-yt:
    if: ${{ inputs.kieu == 'thu-yt' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: dò YouTube (nhánh tach-giong-yt)
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cài yt-dlp mới nhất
        run: |
          python3 -m pip install -q -U "yt-dlp[default]" 2>&1 | tail -2
          yt-dlp --version; deno --version | head -1; node --version; ffmpeg -version | head -1
      - name: Dò từng player_client (chỉ in trạng thái, tiếng ở RUNNER_TEMP)
        run: |
          cd "$RUNNER_TEMP"
          for id in PfhFCRGNLKM 2zcCycq9EYc kY0NUO7-fCc; do
            for c in default tv web_safari mweb android_vr web_embedded ios tv_simply; do
              ea=""; [ "$c" != default ] && ea="--extractor-args youtube:player_client=$c"
              if yt-dlp -q --no-warnings $ea -j "https://www.youtube.com/watch?v=$id" > "j-$id-$c.json" 2> "e-$id-$c.txt"; then
                python3 -c "import json,sys; d=json.load(open(sys.argv[1])); a=[f for f in d['formats'] if f.get('acodec') not in (None,'none') and f.get('vcodec') in (None,'none')]; print('OK', sys.argv[2], sys.argv[3], 'dài', d.get('duration'), 's ·', ' '.join(f\"{f['format_id']}:{f.get('acodec','')[:4]}/{f.get('asr')}/{round(f.get('abr') or 0)}\" for f in a))" "j-$id-$c.json" "$id" "$c"
              else
                echo "LỖI $id $c: $(grep -m1 -o 'ERROR.*' "e-$id-$c.txt" | cut -c1-160)"
              fi
            done
          done
      - name: Tải thử 40 s (bestaudio) bằng client đầu tiên dò được + đo dải
        run: |
          cd "$RUNNER_TEMP"
          for id in PfhFCRGNLKM 2zcCycq9EYc kY0NUO7-fCc; do
            c=$(ls j-$id-*.json 2>/dev/null | xargs -r -n1 sh -c '[ -s "$0" ] && echo "$0"' | head -1 | sed "s/j-$id-//; s/.json//")
            [ -z "$c" ] && { echo "KHÔNG client nào cho $id"; continue; }
            ea=""; [ "$c" != default ] && ea="--extractor-args youtube:player_client=$c"
            t0=$(date +%s)
            if yt-dlp -q --no-warnings $ea -f bestaudio --download-sections "*600-640" -o "a-$id.%(ext)s" "https://www.youtube.com/watch?v=$id" 2> "d-$id.txt"; then
              f=$(ls a-$id.* | head -1); ffmpeg -v error -i "$f" -ac 1 -ar 48000 -f f32le "a-$id.f32"
              python3 - "a-$id.f32" "$id" "$c" "$(( $(date +%s) - t0 ))" <<'PY'
          import sys, numpy as np
          x = np.fromfile(sys.argv[1], np.float32); n = 4096
          if len(x) < n * 4: print('ngắn quá', sys.argv[2]); sys.exit()
          f = x[:len(x) // n * n].reshape(-1, n) * np.hanning(n); p = (np.abs(np.fft.rfft(f, axis=1)) ** 2)
          e = (f ** 2).mean(1); p = p[e > np.percentile(e, 50)].mean(0); hz = np.arange(len(p)) * 48000 / n
          ref = p[(hz > 500) & (hz < 4000)].mean(); db = lambda a, b: 10 * np.log10(p[(hz >= a) & (hz < b)].mean() / ref + 1e-20)
          top = max([h for h, v in zip(hz, 10 * np.log10(p / ref + 1e-20)) if v > -60] or [0])
          print('TẢI', sys.argv[2], sys.argv[3], f'{len(x) / 48000:.0f} s trong {sys.argv[4]} s', '· dB so 0,5–4 kHz: 8–11k', round(db(8000, 11000), 1), '11–16k', round(db(11000, 16000), 1), '16–20k', round(db(16000, 20000), 1), '· tần cao nhất > −60 dB', round(top))
          PY
            else echo "LỖI TẢI $id $c: $(grep -m1 -o 'ERROR.*' d-$id.txt | cut -c1-200)"; fi
          done
      - name: Kiểm nguồn tải (HEAD) + tìm kho giọng Việt trên HF (chỉ in tên, giấy phép)
        run: |
          for u in \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/wespeaker_en_voxceleb_CAM++.onnx" \
            "https://huggingface.co/datasets/google/fleurs/resolve/main/data/vi_vn/audio/test.tar.gz" \
            "https://huggingface.co/datasets/google/fleurs/resolve/main/data/vi_vn/audio/dev.tar.gz" \
            "https://huggingface.co/datasets/google/fleurs/resolve/main/data/vi_vn/test.tsv" \
            "https://www.openslr.org/resources/141/dev_clean.tar.gz" \
            "https://us.openslr.org/resources/141/dev_clean.tar.gz" \
            "https://zenodo.org/records/1227121/files/SCAFE_48k.zip?download=1" \
            "https://zenodo.org/records/1227121/files/PCAFETER_48k.zip?download=1" \
            "https://raw.githubusercontent.com/soerenab/AudioMNIST/master/data/01/0_01_0.wav"; do
            echo "$(curl -sIL -o /dev/null -w '%{http_code} %{size_download} ' "$u") $(curl -sIL "$u" | grep -i '^content-length' | tail -1 | tr -d '\r') $u"
          done
          curl -s "https://huggingface.co/api/datasets?search=vietnamese&limit=60&full=true" | python3 -c "
          import json,sys
          for d in json.load(sys.stdin):
              t=d.get('tags',[]); lic=[x for x in t if x.startswith('license:')]; tc=[x for x in t if 'speech' in x or 'audio' in x]
              if tc: print(d['id'], lic, d.get('gated'), d.get('downloads'))"
