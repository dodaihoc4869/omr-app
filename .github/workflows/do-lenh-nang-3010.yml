# ĐO LỆNH NẶNG THEO ĐƯỜNG (CHỈ ĐỌC, KHÔNG truy vấn D1) — thầy 30/10 21:35: «máy chủ thừa cho hàng trăm nghìn học sinh mà tối nào có 200 hs làm cũng kêu lag».
# 1) wrangler tail 120 giây giờ cao điểm: theo đường (bỏ chuỗi hỏi, rút gọn mã) — số lần, CPU tb/p90/p99/max, thời gian tường tb/p99, kết cục.
# 2) Workers Logs (observability) cùng phép gộp cho khung 19:00–21:30 VN nếu khoá có quyền.
# 3) D1: truy vấn theo tổng thời gian và theo thời gian TB (lâu nhất) khung 19:00–21:30 VN, SQL rút gọn 400 ký tự. Không in SBD / tên / khoá.
name: Đo lệnh nặng theo đường (chỉ đọc)
on:
  workflow_dispatch:
  push:
    branches: [claude/do-lenh-nang-3010]
    paths: ['.github/workflows/do-lenh-nang-3010.yml']
permissions:
  contents: read
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Làm sạch khoá Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lam-sach-khoa-cf.sh
      - name: Tail 120 giây
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN_SACH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACC_SACH }}
        run: |
          timeout 125 npx -y wrangler@4 tail omr --format json > /tmp/tail.ndjson 2>/tmp/tail.err || true
          echo "dòng tail: $(wc -l < /tmp/tail.ndjson)"; head -c 300 /tmp/tail.err | tr -d '\n'; echo
          node -e '
            const fs=require("fs");const L=fs.readFileSync("/tmp/tail.ndjson","utf8");const ev=[];let buf="",d=0
            for(const ch of L){buf+=ch;if(ch==="{")d++;else if(ch==="}"){d--;if(d===0){try{ev.push(JSON.parse(buf.trim()))}catch{}buf=""}}}
            console.log("sự kiện:",ev.length,"· khoá mẫu:",ev[0]?Object.keys(ev[0]).join(","):"-")
            const g=new Map(),q=a=>{a.sort((x,y)=>x-y);return p=>a.length?a[Math.min(a.length-1,Math.floor(p*a.length))]:0}
            for(const e of ev){const u=e.event?.request?.url;let p="(cron)";if(u){const x=new URL(u);p=(e.event.request.method||"")+" "+x.pathname.split("/").slice(0,3).join("/").replace(/[0-9a-f]{8,}/g,":id").slice(0,60)}
              const o=g.get(p)||{n:0,cpu:[],wall:[],kq:{}};o.n++;o.cpu.push(Number(e.cpuTime??0));o.wall.push(Number(e.wallTime??0));o.kq[e.outcome]=(o.kq[e.outcome]||0)+1;g.set(p,o)}
            const rows=[...g].map(([p,o])=>{const c=q(o.cpu),w=q(o.wall),s=o.cpu.reduce((a,b)=>a+b,0);return{p,n:o.n,cpuTong:s,cpuTb:Math.round(s/o.n),cpu90:c(.9),cpu99:c(.99),cpuMax:c(1),wallTb:Math.round(o.wall.reduce((a,b)=>a+b,0)/o.n),wall99:w(.99),kq:o.kq}})
            rows.sort((a,b)=>b.cpuTong-a.cpuTong)
            for(const r of rows.slice(0,45))console.log(`${r.p.padEnd(48)} n=${String(r.n).padStart(4)} cpuTong=${String(r.cpuTong).padStart(6)} tb=${r.cpuTb} p90=${r.cpu90} p99=${r.cpu99} max=${r.cpuMax} | tuong tb=${r.wallTb} p99=${r.wall99} | ${JSON.stringify(r.kq)}`)
          '
      - name: Workers Logs khung 19:00–21:30 VN
        env:
          TOKEN: ${{ env.CF_TOKEN_SACH }}
          ACC: ${{ env.CF_ACC_SACH }}
        run: |
          TU=$(date -u -d '2026-10-30T12:00:00Z' +%s)000; DEN=$(date -u -d '2026-10-30T14:30:00Z' +%s)000
          for KEY in '$workers.event.request.path' '$workers.event.request.url'; do
          jq -n --arg tu "$TU" --arg den "$DEN" --arg k "$KEY" '{queryId:"do-lenh-nang",timeframe:{from:($tu|tonumber),to:($den|tonumber)},view:"calculations",limit:60,
            parameters:{datasets:["cloudflare-workers"],filters:[{key:"$workers.scriptName",operation:"eq",type:"string",value:"omr"}],
              calculations:[{operator:"count"},{operator:"sum",key:"$workers.cpuTimeMs",keyType:"number"},{operator:"avg",key:"$workers.cpuTimeMs",keyType:"number"},{operator:"p99",key:"$workers.cpuTimeMs",keyType:"number"},{operator:"avg",key:"$workers.wallTimeMs",keyType:"number"},{operator:"p99",key:"$workers.wallTimeMs",keyType:"number"}],
              groupBys:[{type:"string",value:$k}]}}' > /tmp/q.json
          curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data @/tmp/q.json "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/observability/telemetry/query" > /tmp/obs.json
          echo "== $KEY: success=$(jq -c '.success' /tmp/obs.json) loi=$(jq -c '.errors' /tmp/obs.json | head -c 300)"
          jq -r '.result.calculations[]? | .alias as $a | .aggregates[]? | "\($a // "-") \(.groups|map(.value|tostring|split("?")[0]|.[0:70])|join(",")) = \(.value)"' /tmp/obs.json 2>/dev/null | sed -E 's/[0-9]{5,}/:so/g' | sort -t= -k2 -rn | head -120
          jq -e '.success' /tmp/obs.json >/dev/null && break
          done
      - name: D1 truy vấn nặng khung 19:00–21:30 VN
        env:
          TOKEN: ${{ env.CF_TOKEN_SACH }}
          ACC: ${{ env.CF_ACC_SACH }}
        run: |
          DB=$(grep -A3 '\[\[d1_databases\]\]' server/wrangler.toml | grep database_id | cut -d'"' -f2)
          jq -n --arg db "$DB" --arg acc "$ACC" '{query:"query($acc:String!,$db:String!){viewer{accounts(filter:{accountTag:$acc}){d1QueriesAdaptiveGroups(limit:400,filter:{databaseId:$db,datetime_geq:\"2026-10-30T12:00:00Z\",datetime_leq:\"2026-10-30T14:30:00Z\"},orderBy:[sum_queryDurationMs_DESC]){dimensions{query} count sum{queryDurationMs rowsRead rowsWritten}}}}}",variables:{acc:$acc,db:$db}}' > /tmp/g.json
          curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data @/tmp/g.json https://api.cloudflare.com/client/v4/graphql > /tmp/d1.json
          echo "loi GraphQL: $(jq -c '.errors' /tmp/d1.json | head -c 300)"
          F='"lan=\(.count) tongS=\((.sum.queryDurationMs/1000*10|round)/10) tbMs=\((.sum.queryDurationMs/.count*10|round)/10) docTB=\((.sum.rowsRead/.count)|round) ghi=\(.sum.rowsWritten) | \(.dimensions.query|gsub("\\s+";" ")|.[0:400])"'
          echo "=== D1 tổng thời gian: $(jq '[.data.viewer.accounts[0].d1QueriesAdaptiveGroups[].sum.queryDurationMs]|add/1000|round' /tmp/d1.json) s · số lệnh $(jq '[.data.viewer.accounts[0].d1QueriesAdaptiveGroups[].count]|add' /tmp/d1.json)"
          echo "=== D1 theo TỔNG thời gian (40 đầu)"; jq -r ".data.viewer.accounts[0].d1QueriesAdaptiveGroups[:40][] | $F" /tmp/d1.json
          echo "=== D1 theo thời gian TB mỗi lần (lâu nhất, ≥ 3 lần)"; jq -r ".data.viewer.accounts[0].d1QueriesAdaptiveGroups | map(select(.count>=3)) | sort_by(-(.sum.queryDurationMs/.count))[:30][] | $F" /tmp/d1.json
          echo "=== D1 theo dòng đọc"; jq -r ".data.viewer.accounts[0].d1QueriesAdaptiveGroups | sort_by(-.sum.rowsRead)[:20][] | $F" /tmp/d1.json
