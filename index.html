<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- App GIÁO VIÊN — một manifest duy nhất. Manifest riêng cho học sinh và
      phụ huynh đã gỡ khỏi repo này: hai app đó tách sang repo riêng
      (TACHAPPHSPH.md). -->
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS tự bo góc biểu tượng, nên file này phải là hình VUÔNG phủ kín,
      không bo sẵn: trỏ vào icon-192 (đã bo góc) là bị bo hai lần, ra viền xấu. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ĐỖ ĐẠI HỌC" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Màu thanh trạng thái/địa chỉ = --muc của hệ thiết kế (tokens.css); manifest.json do vite-plugin-pwa sinh từ vite.config.ts -->
    <meta name="theme-color" content="#1a2332" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ĐỖ ĐẠI HỌC</title>
    <!-- Nền khi CSS của app chưa nạp (tránh loé trắng ở nền tối) — cùng giá trị --nen trong tokens.css -->
    <style>
      body { margin: 0; background: #f7f8fa; }
      @media (prefers-color-scheme: dark) { body { background: #0f1419; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
