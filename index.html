<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- CHỌN MANIFEST NGAY LÚC PHÂN TÍCH HTML, TRƯỚC KHI REACT CHẠY.
      ~
      Thầy quay video 14/09: em lưu app ra màn hình chính iPhone, mở lên thì
      nhảy thẳng vào app GIÁO VIÊN.
      ~
      Hai nguyên nhân chồng nhau:
        1. Thẻ manifest trong HTML luôn trỏ `manifest.json` (bản của thầy).
           Mã JS đổi thẻ sau đó là ĐÃ MUỘN — Safari đọc manifest ngay lúc phân
           tích HTML, và người dùng bấm "Thêm vào Màn hình chính" thì nó dùng
           bản đã đọc.
        2. `start_url` của cả ba bản đều là `./` hoặc một đường dẫn trần. App
           mở `/` trần thì phải TRA localStorage mới biết vai — mà app đã cài
           trên iOS có kho lưu RIÊNG, trống trơn. Không biết vai ⇒ rơi về màn
           quản lý của thầy.
      ~
      Sửa cả hai: `start_url` nay mang sẵn `?vai=`, và thẻ manifest được chọn
      bằng đoạn mã đồng bộ ngay dưới đây, đọc vai từ chính đường dẫn đang mở.
      Không có JS thì vẫn còn thẻ `<link>` dự phòng ở sau. -->
    <script>
      (function () {
        try {
          var d = (location.pathname || '') + (location.search || '')
          var vai = /[?&]vai=hocsinh|(^|\/)(hoc-sinh|hocsinh|hs)\/?($|\?)/.test(d)
            ? 'hs'
            : /[?&]vai=phuhuynh|(^|\/)(phu-huynh|phuhuynh|ph)\/?($|\?)/.test(d)
              ? 'ph'
              : /[?&]vai=gv|(^|\/)gv\/?($|\?)/.test(d)
                ? 'gv'
                : localStorage.getItem('ddh.vaiDaDung') || ''
          var ten = vai === 'hs' ? 'manifest-hs.json' : vai === 'ph' ? 'manifest-ph.json' : 'manifest.json'
          var ten2 = vai === 'hs' ? 'ĐĐH Học Sinh' : vai === 'ph' ? 'ĐĐH Phụ Huynh' : 'ĐỖ ĐẠI HỌC'
          document.write('<link rel="manifest" href="/' + ten + '">')
          document.write('<meta name="apple-mobile-web-app-title" content="' + ten2 + '">')
        } catch (e) {
          document.write('<link rel="manifest" href="/manifest.json">')
        }
      })()
    </script>
    <noscript><link rel="manifest" href="/manifest.json" /></noscript>
    <!-- iOS tự bo góc biểu tượng, nên file này phải là hình VUÔNG phủ kín,
      không bo sẵn: trỏ vào icon-192 (đã bo góc) là bị bo hai lần, ra viền xấu. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Màu thanh trạng thái/địa chỉ = --muc của hệ thiết kế (tokens.css); manifest.json do vite-plugin-pwa sinh từ vite.config.ts -->
    <meta name="theme-color" content="#1a2332" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ĐỖ ĐẠI HỌC</title>
    <!-- Mô tả này KHÔNG để lên Google (xem public/robots.txt — app chặn hết bọ
      tìm kiếm). Nó ở đây vì trình đọc màn hình và thẻ chia sẻ đọc nó. -->
    <meta name="description" content="Công cụ nội bộ lớp luyện thi Hoá Thầy Đỗ Đại Học: mở ca kiểm tra, quét phiếu, chấm bài và dựng giáo án chữa." />
    <!-- Nền khi CSS của app chưa nạp (tránh loé trắng ở nền tối) — cùng giá trị --nen trong tokens.css -->
    <style>
      body { margin: 0; background: #f7f8fa; }
      @media (prefers-color-scheme: dark) { body { background: #0f1419; } }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script type="module" src="/src/main.tsx"></script>

    <!-- CHỐT CHẶN CUỐI: APP TRẮNG MÀN THÌ TỰ SỬA, KHÔNG ĐỢI THẦY.
      ~
      Thầy chốt 14/09: "app học sinh và phụ huynh lại không truy cập được. Bạn
      phải tìm cách để hiện tượng này không lặp lại nữa."
      ~
      Nguyên nhân LẦN NÀY đã sửa trong `src/sw.ts`. Nhưng "không lặp lại nữa"
      thì không thể chỉ vá đúng nguyên nhân vừa bắt được: lần sau sẽ là nguyên
      nhân khác. Đoạn dưới không cần biết vì sao app trắng màn — nó chỉ đo MỘT
      điều đo được: sau 9 giây mà `#root` vẫn rỗng thì app KHÔNG chạy. Lúc ấy
      nó gỡ service worker, xoá kho tạm, nạp lại thẳng từ mạng.
      ~
      BA RÀNG BUỘC ĐỂ THỨ NÀY KHÔNG TỰ THÀNH LỖI MỚI:
        1. CHỈ MỘT LẦN mỗi tab (`sessionStorage`), nên không có vòng lặp nạp
           lại — đó mới là thứ đáng sợ hơn cả màn hình trắng.
        2. Chỉ chạy khi `#root` RỖNG. App đã vẽ ra dù chỉ một phần thì không
           đụng tới, kể cả khi mạng chậm.
        3. Nạp lại kèm `_moi=` — đường này nằm trong danh sách service worker
           KHÔNG đụng vào, nên lượt nạp ấy chắc chắn đi thẳng ra mạng.
      ~
      Mất mạng thật thì `location.replace` không đi được đâu cả, trình duyệt
      hiện trang lỗi của chính nó — vẫn hơn màn trắng không lời giải thích. -->
    <script>
      (function () {
        var GIAY_CHO = 9000
        var KHOA = 'ddh.daTuSua'
        function daThu() {
          try {
            return sessionStorage.getItem(KHOA) === '1'
          } catch (e) {
            return true
          }
        }
        function ghiDaThu() {
          try {
            sessionStorage.setItem(KHOA, '1')
          } catch (e) {
            /* riêng tư/hết chỗ: coi như đã thử, thà không sửa còn hơn lặp vô hạn */
          }
        }
        setTimeout(function () {
          var goc = document.getElementById('root')
          if (goc && goc.childElementCount > 0) return
          if (daThu()) return
          ghiDaThu()
          console.error('[tu-sua] app chưa vẽ ra gì sau ' + GIAY_CHO + 'ms — gỡ service worker và nạp lại từ mạng')
          var xong = function () {
            var d = location.pathname + (location.search ? location.search + '&' : '?') + '_moi=' + Date.now()
            location.replace(d)
          }
          var viec = []
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              viec.push(
                navigator.serviceWorker.getRegistrations().then(function (ds) {
                  return Promise.all(
                    ds.map(function (r) {
                      return r.unregister()
                    }),
                  )
                }),
              )
            }
            if (window.caches && caches.keys) {
              viec.push(
                caches.keys().then(function (ks) {
                  return Promise.all(
                    ks.map(function (k) {
                      return caches.delete(k)
                    }),
                  )
                }),
              )
            }
          } catch (e) {
            /* trình duyệt không cho thì thôi, vẫn nạp lại */
          }
          if (viec.length === 0) return xong()
          Promise.all(viec).then(xong, xong)
          // Dọn dẹp treo quá 3 giây thì nạp lại luôn, không chờ nữa.
          setTimeout(xong, 3000)
        }, GIAY_CHO)
      })()
    </script>
  </body>
</html>
