<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bát Linh · Duyệt giao diện</title>
<style>
:root{color-scheme:light;font:15px system-ui,sans-serif;color:#214e43;background:#f2f1e5}*{box-sizing:border-box}body{margin:0}button,select,a{font:inherit}header{padding:17px 24px;background:#fffcf2;border-bottom:1px solid #ded6ba;display:flex;gap:18px;align-items:center;justify-content:space-between}h1{font:700 25px Georgia,serif;margin:0}header p{margin:5px 0 0;font-size:12px;color:#61796a}.mark{font-size:11px;letter-spacing:2px;color:#947234}.layout{display:grid;grid-template-columns:248px 1fr;height:calc(100dvh - 92px)}aside{padding:14px;overflow:auto;background:#faf8ee;border-right:1px solid #ded6ba}aside h2{font-size:11px;letter-spacing:1px;text-transform:uppercase;margin:18px 9px 8px;color:#8a743f}.screen{width:100%;text-align:left;padding:10px 12px;border:0;border-radius:12px;background:transparent;color:inherit;cursor:pointer;display:block;margin-bottom:3px}.screen:hover{background:#e6eddf}.screen[aria-current=true]{background:#236956;color:#fff9e7}.stage{min-width:0;display:flex;flex-direction:column}.toolbar{padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-bottom:1px solid #ded6ba;background:#f8f6ea}.toolbar strong{margin-right:auto}.toolbar button,.toolbar a,.open{border:1px solid #cfc3a0;border-radius:10px;padding:8px 12px;text-decoration:none;color:#214e43;background:#fffdf4;cursor:pointer}.toolbar button[aria-pressed=true]{background:#dcebdd;border-color:#33775f}.canvas{flex:1;min-height:0;overflow:auto;padding:20px;display:flex;justify-content:center;align-items:flex-start;background:radial-gradient(ellipse at top,#dce6d2,#ede9d9)}iframe{display:block;border:1px solid #d7c69d;border-radius:22px;background:#f9f7eb;box-shadow:0 12px 35px #214e4322;width:390px;max-width:100%;height:844px;flex-shrink:0}select{display:none}footer{font-size:12px;line-height:1.45;padding:9px 20px;color:#627768;background:#f8f6ea}.open{white-space:nowrap}.toolbar button:focus-visible,a:focus-visible,.screen:focus-visible,select:focus-visible{outline:3px solid #c18a26;outline-offset:2px}
@media(max-width:700px){header{padding:12px 14px}header h1{font-size:20px}.mark{font-size:9px}.open{display:none}.layout{display:block;height:auto}aside{display:none}select{display:block;width:100%;padding:11px;border:1px solid #cfc3a0;border-radius:12px;background:#fffcf2;color:#214e43}.toolbar{padding:10px}.toolbar strong{display:none}.toolbar button{font-size:12px}.canvas{padding:0;display:block}iframe{width:100%!important;height:calc(100dvh - 215px)!important;border:0;border-radius:0;box-shadow:none;min-height:460px}footer{font-size:11px;padding:8px 12px}}
</style></head><body>
<header><div><span class="mark">BÁT LINH · PHÒNG DUYỆT THIẾT KẾ</span><h1>Mỗi màn, một hành trình</h1><p>Bản xem thử riêng · Dữ liệu minh hoạ · 30/09/2026</p></div><a class="open" href="scripts/preview-bat-linh/games.html?game=bieu-cam" target="_blank" rel="noopener">Xem biểu cảm & xe mới ↗</a></header>
<div class="layout"><aside id="menu" aria-label="Danh mục màn hình"></aside><main class="stage"><div class="toolbar"><select id="choice" aria-label="Chọn màn hình"></select><strong id="name"></strong><button data-size="phone" aria-pressed="true">Điện thoại</button><button data-size="wide" aria-pressed="false">Màn ngang</button><button data-size="desktop" aria-pressed="false">Máy tính</button><a id="full" target="_blank" rel="noopener">Mở riêng ↗</a></div><div class="canvas"><iframe id="view" title="Bản xem thử giao diện" src="about:blank" allow="fullscreen" referrerpolicy="no-referrer"></iframe></div><footer id="hint">Chọn màn trong mục lục. Các thao tác ở đây dùng dữ liệu mẫu; không ghi lên tài khoản học sinh thật.</footer></main></div>
<script>
const app='scripts/preview-bat-linh/trang.html?',game='scripts/preview-bat-linh/games.html?';
const groups=[
['Mới hoàn thiện',[
['Biểu cảm 8 thú & xe Linh Tâm',game+'game=bieu-cam','Chọn 6 trạng thái để xem cả 8 thú; kéo thanh máu để kiểm tra xe Linh Tâm.'],
['Hộ tống · trận thường',game+'game=doan&man=tran'],['Tung chưởng · thường',game+'game=chuong'],['Tung chưởng · trùm',game+'game=chuong&boss']]],
['Ứng dụng học sinh',[
['Đăng nhập học sinh',app+'man=hs-login','Màn minh hoạ đăng nhập; không dùng tài khoản thật trong bản xem thử.'],['Sảnh · kế hoạch hôm nay',app+'man=sanh'],['Sảnh · đã hoàn thành',app+'man=xong'],['Tự luyện · chọn / làm / giải',app+'man=tl','Chọn chế độ, làm câu hỏi, nộp bài và xem tổng hợp ngay trong bản mẫu.'],['Câu đã làm · lọc / lời giải',app+'man=cau-da-lam']]],
['Bát Linh Đảo',[
['Bản đồ · 6 ải · kết quả',game+'game=dao&thu=1&cap=50','Bấm LÊN ĐƯỜNG để xem trận, trả lời, tung chưởng, lời giải, ải trùm và kết thúc chuyến.'],['Chọn người bạn đồng hành',game+'game=thu&man=chon'],['Đảo riêng · tiến hoá',game+'game=thu&man=dao&thu=1&cap=50'],['Sổ tay kiến thức',game+'game=thu&man=so-tay&thu=1&cap=50'],['Túi đồ',game+'game=thu&man=tui&thu=1&cap=50']]],
['Đoàn Hộ Tống',[
['Sảnh · chuẩn bị chuyến',game+'game=doan&man=sanh'],['Sảnh · hết câu hôm nay',game+'game=doan&man=sanh-het'],['Trùm · giáp 4 đoạn',game+'game=doan&man=trum'],['Kiến thức cốt lõi',game+'game=doan&man=cot-loi'],['Kết quả · xem lời giải',game+'game=doan&man=ket-qua'],['Tiếp sức đồng đội',game+'game=doan&man=tiep-suc'],['Thắng · cầu đã hạ',game+'game=doan&man=thang'],['Chưa thắng · nghỉ ngơi',game+'game=doan&man=thua'],['Còn câu ôn · cầu kéo lên',game+'game=doan&man=keo']]],
['Phụ kiện & trò chơi',[
['Cửa hàng phụ kiện',game+'game=shop&man=cua-hang&pet=1&cap=50'],['Thử đồ',game+'game=shop&man=thu-do&pet=1&cap=50'],['Tủ đồ',game+'game=shop&man=tu-do&pet=1&cap=50'],['Bi-a Phản Ứng',game+'game=bia']]],
['Ứng dụng phụ huynh',[
['Đăng nhập phụ huynh',app+'man=ph-login','Màn minh hoạ đăng nhập; không dùng tài khoản thật trong bản xem thử.'],['Tổng quan / điểm / tiến bộ / lời thầy',app+'man=ph','Dùng 4 tab dưới cùng để xem từng mục. Chạm bài kiểm tra để mở báo cáo chi tiết.'],['Phụ huynh · chưa có dữ liệu',app+'man=ph-empty']]]];
const rows=groups.flatMap(g=>g[1]),menu=document.querySelector('#menu'),select=document.querySelector('#choice'),frame=document.querySelector('#view');
let index=0;
for(const [group,items]of groups){const h=document.createElement('h2');h.textContent=group;menu.append(h);const og=document.createElement('optgroup');og.label=group;select.append(og);for(const item of items){const id=index++;const b=document.createElement('button');b.className='screen';b.textContent=item[0];b.dataset.id=id;b.onclick=()=>show(id);menu.append(b);const o=document.createElement('option');o.value=id;o.textContent=item[0];og.append(o)}}
function show(i){if(!rows[i])i=0;const [name,url,hint]=rows[i];select.value=i;frame.src=url;frame.title=name;document.querySelector('#name').textContent=name;document.querySelector('#full').href=url;document.querySelector('#hint').textContent=hint||'Bản xem thử dùng dữ liệu mẫu. Chọn màn khác bằng mục lục; không ghi lên máy chủ ứng dụng thật.';menu.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',String(+b.dataset.id===i)));history.replaceState(null,'','#man='+i)}
select.onchange=()=>show(+select.value);
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const [w,h]=({phone:[390,844],wide:[844,390],desktop:[1440,900]})[b.dataset.size];frame.style.width=w+'px';frame.style.height=h+'px';document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
show(Number(new URLSearchParams(location.hash.slice(1)).get('man'))||0);
</script></body></html>
