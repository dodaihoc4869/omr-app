<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HS · Lịch sử ca</title>
<link rel="stylesheet" href="neo.css"><link rel="stylesheet" href="khung.css">
<style>
  main.khung { padding-bottom: 110px; }
  #ds { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; align-items: start; }
  .ca { padding: 18px 20px; margin-top: 24px; }
  @media (max-width: 900px) { #ds { grid-template-columns: 1fr; } }
  .ca .dau-ca { display: flex; gap: 16px; align-items: center; }
  .ca .dau-ca > div:nth-child(2) { min-width: 0; flex: 1; }
  .ca .ten-ca { font: 600 20px/1.2 var(--f-to); }
  .ca .tong { text-align: right; flex: none; }
  .ca .tong .so { font-size: 46px; }
  .ca .tong small { font: 600 16px var(--f-to); color: var(--mo); }
  /* Thanh ba phần: dài theo điểm tối đa từng phần (4,5 · 4 · 1,5 = 10), phần tô = điểm em được. */
  .ba-phan { display: grid; grid-template-columns: 4.5fr 4fr 1.5fr; gap: 6px; margin: 16px 0 4px; }
  .ba-phan > div { height: 18px; border: 2px solid var(--muc); border-radius: 6px; background: var(--mat-2); overflow: hidden; }
  .ba-phan i { display: block; height: 100%; border-right: 2px solid var(--muc); }
  .p1 { background: var(--xanh); } .p2 { background: var(--vang); } .p3 { background: var(--san-ho); }
  .o-phan { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .o-phan > div { border: 2px solid var(--muc); border-radius: 12px; padding: 10px 12px; background: var(--mat-2); min-width: 0; }
  .o-phan .nhan-p { display: flex; align-items: center; gap: 6px; font: 500 12px/1.2 var(--f-may); color: var(--mo); }
  .o-phan .nhan-p i { width: 12px; height: 12px; flex: none; border: 2px solid var(--muc); border-radius: 3px; }
  .o-phan .so-nho { display: block; margin-top: 8px; font-size: 22px; }
  .o-phan .so-nho small { font: 500 13px var(--f-may); color: var(--mo); }
  .o-phan .nhan { margin-top: 4px; }
  .chan-ca { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  .chan-ca .nut { margin-left: auto; }
  @media (max-width: 520px) {
    .ca { padding: 16px; } .ca .ngay { display: none; } .ca .tong .so { font-size: 38px; }
    .o-phan { gap: 6px; } .o-phan > div { padding: 8px; } .o-phan .so-nho { font-size: 19px; }
    .chan-ca .nut { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body data-app="hs" data-tab="ket-qua" data-khung="man-con" data-tieu="Xem Điểm &amp; Lịch Sử Ca Kiểm Tra" data-phu="Lịch sử ca kiểm tra &amp; Báo cáo kết quả" data-ve="Kết quả">
<main class="khung">
  <div class="chips">
    <span class="chip">6 ca gần nhất · 19/09 – 24/10</span>
    <span class="chip">Thang 10 điểm</span>
    <span class="chip an-dt">Phần I 4,5 · Phần II 4 · Phần III 1,5</span>
  </div>
  <h1 class="tieu-de"><span class="mo">Lịch sử</span> <span class="danh-dau">ca kiểm tra</span></h1>

  <section class="the o-so">
    <div class="chinh-so"><span class="so" id="tb">–</span><span class="nhan">điểm trung bình 6 ca gần nhất</span></div>
    <div><span class="so-vua" id="tb1">–</span><span class="nhan">Phần I (TN) trung bình · tối đa 4,5</span></div>
    <div><span class="so-vua" id="tb2">–</span><span class="nhan">Phần II (Đ/S) trung bình · tối đa 4</span></div>
    <div><span class="so-vua" id="tb3">–</span><span class="nhan">Phần III (Trả lời) trung bình · tối đa 1,5</span></div>
  </section>

  <div id="ds"></div>
</main>
<script src="khung.js"></script>
<script>
  // Mỗi ca: [ngày, thứ, tên, P1 (câu đúng/18, 0,25 đ/câu), P2 (điểm 4 câu Đ/S), P3 (câu đúng/6, 0,25 đ/câu)]. Tổng = P1 + P2 + P3, khớp màn «Kết quả».
  const ca = [
    ['24', 'THỨ BẢY', 'Kiểm tra tuần 12 · Polymer', 16, [1, 1, 1, 0.5], 4],
    ['17', 'THỨ BẢY', 'Kiểm tra tuần 11 · Amino acid và peptide', 17, [1, 1, 0.5, 0.5], 4],
    ['10', 'THỨ BẢY', 'Kiểm tra tuần 10 · Amine', 15, [1, 1, 1, 0.25], 3],
    ['03', 'THỨ BẢY', 'Kiểm tra tuần 9 · Tinh bột và cellulose', 16, [1, 1, 0.5, 0.25], 5],
    ['26', 'THỨ BẢY', 'Kiểm tra tuần 8 · Saccharose và maltose', 14, [1, 1, 0.5, 0.5], 4],
    ['19', 'THỨ BẢY', 'Kiểm tra tuần 7 · Glucose và fructose', 13, [1, 1, 0.25, 0.25], 4],
  ]
  const thang = ['10', '10', '10', '10', '09', '09']
  const so = (v) => v.toFixed(2).replace('.', ',')
  const dong = ca.map(([n, thu, ten, c1, ds, c3], k) => {
    const p1 = c1 * 0.25, p2 = ds.reduce((a, b) => a + b, 0), p3 = c3 * 0.25, tong = p1 + p2 + p3
    const sai = (18 - c1) + ds.filter((d) => d < 1).length + (6 - c3)
    return { n, thu, ten, c1, ds, c3, p1, p2, p3, tong, sai, k }
  })
  const tb = (f) => dong.reduce((a, d) => a + d[f], 0) / dong.length
  document.getElementById('tb').textContent = so(tb('tong'))
  document.getElementById('tb1').textContent = so(tb('p1'))
  document.getElementById('tb2').textContent = so(tb('p2'))
  document.getElementById('tb3').textContent = so(tb('p3'))
  document.getElementById('ds').innerHTML = dong.map((d) => `
    <section class="the ca">
      <div class="dau-ca">
        <div class="ngay"><b>${d.thu}</b><span>${d.n}</span><small>Tháng ${thang[d.k]}</small></div>
        <div><div class="nhan">${d.thu.charAt(0) + d.thu.slice(1).toLowerCase()} ${d.n}/${thang[d.k]} · 28 câu</div><div class="ten-ca">${d.ten}</div></div>
        <div class="tong"><span class="so">${so(d.tong)}</span><small>/10</small></div>
      </div>
      <div class="ba-phan" aria-hidden="true"><div><i class="p1" style="width:${(d.p1 / 4.5) * 100}%"></i></div><div><i class="p2" style="width:${(d.p2 / 4) * 100}%"></i></div><div><i class="p3" style="width:${(d.p3 / 1.5) * 100}%"></i></div></div>
      <div class="o-phan">
        <div><span class="nhan-p"><i class="p1"></i>Phần I (TN)</span><span class="so-nho">${so(d.p1)}<small>/4,5</small></span><div class="nhan">${d.c1}/18 câu</div></div>
        <div><span class="nhan-p"><i class="p2"></i>Phần II (Đ/S)</span><span class="so-nho">${so(d.p2)}<small>/4</small></span><div class="nhan">đúng hết ${d.ds.filter((x) => x === 1).length}/4 câu</div></div>
        <div><span class="nhan-p"><i class="p3"></i>Phần III (Trả lời)</span><span class="so-nho">${so(d.p3)}<small>/1,5</small></span><div class="nhan">${d.c3}/6 câu</div></div>
      </div>
      <div class="chan-ca">
        ${d.k === 0 ? '<span class="chip vang">Ca mới nhất</span>' : ''}<span class="nhan">Sai ${d.sai} câu</span>
        <span class="nut${d.k === 0 ? ' san-ho' : ''}">Xem báo cáo →</span>
      </div>
    </section>`).join('')
</script>
</body></html>
