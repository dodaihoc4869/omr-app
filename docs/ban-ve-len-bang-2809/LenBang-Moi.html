<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gọi lên bảng — bản vẽ mới</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  BẢN VẼ (docs) — màn chiếu "Gọi lên bảng" thế hệ mới, 28/09/2026.
  Mô phỏng tờ chiếu 1920×1080, co giãn theo cửa sổ (16:9). Đơn vị --u = 1% bề ngang tờ ⇒ 1u = 19,2 px ở 1920.
  Mọi số liệu học sinh là VÍ DỤ. Thần thú vẽ SVG tượng trưng — khi build dùng ảnh thật `anhThu`.
-->
<style>
:root{
  --u:min(1vw,1.777778vh);
  --giay:#fbf7ee; --giay2:#f3ecdc; --muc:#1d1b16; --muc2:#5b5647; --vien:#e2d8c2;
  --nhan:#b8461b; --xanh:#1f7a4d; --do:#c8322f; --vang:#c98a0b; --lam:#2456c9;
  --nen:#0e1118; --kinh:rgba(19,23,36,.78); --kinh2:rgba(255,255,255,.065); --kinhvien:rgba(255,255,255,.12);
  --L1:#e5534b; --L2:#f0a53a; --L3:#35b6a4; --L4:#4cb35f; --Lx:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--nen);color:var(--muc);font-family:"Be Vietnam Pro",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
sub{font-size:.68em;vertical-align:-.28em;line-height:0}
sup{font-size:.62em;vertical-align:.55em;line-height:0}

/* ---------- TỜ CHIẾU 16:9 ---------- */
.khung{position:fixed;inset:0;display:grid;place-items:center}
.to{position:relative;width:min(100vw,177.7778vh);height:min(56.25vw,100vh);background:var(--giay);overflow:hidden;
  display:grid;grid-template-rows:1fr calc(var(--u)*3.6);box-shadow:0 0 0 1px #000}
.than{position:relative;display:grid;grid-template-columns:2fr 1fr;min-height:0}
.cot-de{position:relative;display:grid;grid-template-rows:auto 1fr auto;min-height:0;padding:calc(var(--u)*1.6) calc(var(--u)*1.8) calc(var(--u)*.4) calc(var(--u)*2.2)}
.de-khung{position:relative;min-height:0;grid-row:2}
.cot-de>.tk{grid-row:1}.cot-de>.chan-de{grid-row:3}
/* CHỮ CỐ ĐỊNH (luật thầy 28/09): không co chữ ở bất kỳ trường hợp nào. Dài ⇒ lật trang (chờ gọi) / cuộn (đang chữa) */
.de{position:absolute;inset:0;overflow:hidden;font-size:calc(var(--u)*2.34);line-height:1.38;color:var(--muc)}
.de-noi{position:relative;transition:transform .35s cubic-bezier(.3,.8,.3,1)}
.de .ngoai{visibility:hidden}
.de.cuon{overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(29,27,22,.35) transparent;padding-right:calc(var(--u)*.6)}
.de.cuon .de-noi{transition:none}
.de::-webkit-scrollbar{width:calc(var(--u)*.45)}
.de::-webkit-scrollbar-thumb{background:rgba(29,27,22,.35);border-radius:1em}
.tiep{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*2.4);z-index:2;display:none;align-items:center;gap:.6em;font-size:calc(var(--u)*1.05);font-weight:700;color:var(--muc2);border-bottom:1px dashed var(--vien);background:var(--giay)}
.tiep.hien{display:flex}
.tiep b{color:var(--nhan)}
.con-nua{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*4.5);z-index:2;pointer-events:none;display:none;align-items:flex-end;justify-content:center;
  background:linear-gradient(rgba(251,247,238,0),var(--giay) 80%);font-size:calc(var(--u)*1);font-weight:800;color:var(--nhan);padding-bottom:calc(var(--u)*.2)}
.con-nua.hien{display:flex}
.chan-de{height:calc(var(--u)*2.3);display:flex;align-items:center;gap:calc(var(--u)*.8);font-size:calc(var(--u)*1);font-weight:700;color:var(--muc2)}
.chan-de .cham{display:flex;gap:calc(var(--u)*.4)}
.chan-de .cham i{width:calc(var(--u)*.75);height:calc(var(--u)*.75);border-radius:50%;background:var(--vien)}
.chan-de .cham i.o{background:var(--nhan)}
.chan-de .goi-y{margin-left:auto;font-weight:600;font-size:.9em}
.chan-de kbd{font:inherit;font-weight:800;border:.1em solid var(--muc2);border-bottom-width:.18em;border-radius:.3em;padding:0 .3em}
.de .dau{font-weight:800;color:var(--nhan);margin-right:.35em}
.de .phan{display:inline-block;font-size:.5em;font-weight:700;letter-spacing:.04em;color:var(--muc2);border:.1em solid var(--vien);border-radius:.6em;padding:.15em .6em;margin-right:.6em;vertical-align:.35em}
.de p{margin-bottom:.35em}
.hang-hinh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.8em;align-items:center;margin-top:.3em}
.hinh{position:relative;display:block;width:max-content;max-width:100%;margin:.1em 0 .35em;border:.06em solid var(--vien);border-radius:.4em;background:#fff;cursor:zoom-in;padding:.2em}
.hinh svg{display:block;height:calc(var(--u)*16.5);width:auto;max-width:100%}
.hinh .kinh-lup{position:absolute;right:.3em;bottom:.3em;font-size:.42em;background:var(--muc);color:#fff;border-radius:1em;padding:.2em .7em;font-weight:600}
.pa-ds{display:grid;gap:.18em}
.pa{display:flex;align-items:baseline;gap:.45em}
.pa b{flex:none;display:inline-grid;place-items:center;width:1.45em;height:1.45em;border-radius:50%;border:.08em solid var(--muc);font-size:.8em;font-weight:800}
.pa.dung b{background:var(--xanh);border-color:var(--xanh);color:#fff}
.pa-chu{white-space:nowrap}
.y{display:grid;grid-template-columns:1.5em 1fr;gap:.2em;margin:.12em 0}
.y>b{font-weight:800}
.y.sang{background:linear-gradient(90deg,rgba(36,86,201,.1),transparent);border-radius:.3em}
/* Mũi tên theo em (P6) */
.mt{display:inline-block;position:relative;width:1.9em;height:.9em;margin:0 .24em;vertical-align:-.12em}
.mt::before{content:"";position:absolute;left:0;right:.1em;top:55%;border-top:.075em solid currentColor}
.mt::after{content:"";position:absolute;right:.04em;top:55%;width:.34em;height:.34em;border-top:.075em solid currentColor;border-right:.075em solid currentColor;transform:translateY(-50%) rotate(45deg);transform-origin:center}
.mt i{position:absolute;left:0;right:.1em;bottom:52%;font-size:.5em;line-height:1;text-align:center;font-style:normal;font-weight:600}

/* Dải thống kê lớp (P8) */
.tk{display:none;align-items:center;gap:calc(var(--u)*1);height:calc(var(--u)*3.4);margin-bottom:calc(var(--u)*.8);padding:0 calc(var(--u)*1);
  border-radius:calc(var(--u)*.6);background:#fff;border:1px solid var(--vien);font-size:calc(var(--u)*1.05);font-weight:600;white-space:nowrap;overflow:hidden}
.to.co-tk .tk{display:flex}
.tk .nhan{font-size:.8em;color:var(--muc2);font-weight:700}
.tk .vidu{font-size:.7em;color:#fff;background:var(--muc2);border-radius:1em;padding:.1em .6em;margin-left:auto}
.tk .o{display:flex;align-items:center;gap:.35em}
.tk .thanh{width:calc(var(--u)*5);height:calc(var(--u)*.7);background:var(--giay2);border-radius:1em;overflow:hidden}
.tk .thanh i{display:block;height:100%;background:var(--muc2)}
.tk .o.dung .thanh i{background:var(--xanh)}
.tk .o.dung{color:var(--xanh)}
.tk .sai{color:var(--do)}

/* Cột phải: em làm bài / lời giải */
.cot-em{position:relative;display:grid;grid-template-rows:auto 1fr;gap:calc(var(--u)*.9);min-height:0;padding:calc(var(--u)*1.2);border-left:calc(var(--u)*.12) dashed var(--vien);background:linear-gradient(var(--giay),var(--giay2))}
.cho{display:grid;place-items:center;text-align:center;border:calc(var(--u)*.12) dashed var(--vien);border-radius:calc(var(--u)*1);color:var(--muc2);font-size:calc(var(--u)*1.25);padding:calc(var(--u)*1.5)}
.cho strong{display:block;font-size:1.5em;color:var(--muc);margin-bottom:.3em}
.cho kbd{font:inherit;font-weight:800;border:.1em solid var(--muc2);border-bottom-width:.2em;border-radius:.3em;padding:0 .35em}
.cho .goi-y{margin-top:1em;font-size:.8em}
.vung-lam{border-radius:calc(var(--u)*1);border:calc(var(--u)*.1) solid var(--vien);
  background-image:linear-gradient(var(--vien) 1px,transparent 1px);background-size:100% calc(var(--u)*2.6);opacity:.7;display:grid;place-items:end center;
  color:var(--muc2);font-size:calc(var(--u)*.9);padding:calc(var(--u)*.6)}
/* Thẻ tên (P2, H15): lưới 2 cột, dòng phụ thẳng cột tên */
.the-ten{visibility:hidden;display:grid;grid-template-columns:calc(var(--u)*4.6) 1fr auto;align-items:center;column-gap:calc(var(--u)*.9);text-align:left;
  background:#fff;border:1px solid var(--vien);border-radius:calc(var(--u)*1);padding:calc(var(--u)*.55) calc(var(--u)*.9) calc(var(--u)*.55) calc(var(--u)*.55);
  box-shadow:0 calc(var(--u)*.3) calc(var(--u)*1.2) rgba(60,40,10,.12);transition:transform .15s}
.the-ten:hover{transform:translateY(-2px)}
.the-ten.hien{visibility:visible}
.the-ten.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.92)}100%{transform:scale(1)}}
.the-ten .av{grid-row:span 2;width:calc(var(--u)*4.6);height:calc(var(--u)*4.6);border-radius:30%;background:radial-gradient(circle at 50% 40%,#fff6e0,#f3e2bd);display:grid;place-items:center}
.the-ten .av svg{width:88%;height:88%}
.the-ten .ten{font-weight:800;font-size:calc(var(--u)*1.55);line-height:1.1}
.the-ten .phu{grid-column:2;font-size:calc(var(--u)*.92);color:var(--muc2);font-weight:600}
.the-ten .xem{grid-row:1/span 2;grid-column:3;font-size:calc(var(--u)*.8);font-weight:700;color:var(--lam);border:1px solid rgba(36,86,201,.3);border-radius:2em;padding:.35em .8em}
.the-ten .dau-kq{margin-left:.4em;font-size:.8em;border-radius:1em;padding:.05em .55em;color:#fff}
.the-ten .dau-kq.dat{background:var(--xanh)} .the-ten .dau-kq.kd{background:var(--do)}

/* Lời giải — nằm TRONG vùng 2/3, ngay dưới đề, hiện dần (P3, P4 theo luật 28/09) */
.lg-dau{display:flex;align-items:baseline;gap:.6em;margin:.5em 0 .2em;padding-top:.3em;border-top:.08em solid var(--nhan);color:var(--nhan);font-weight:800}
.lg-dau span{font-size:.45em;color:var(--muc2);font-weight:600}
.buoc{display:grid;grid-template-columns:1.6em 1fr;gap:.25em;padding:.18em .2em;border-radius:.3em;opacity:0;transform:translateY(.4em);transition:opacity .35s,transform .35s,background .35s}
.buoc>b{color:var(--nhan);font-weight:800}
.buoc.mo{opacity:.5;transform:none}
.buoc.hienTai{opacity:1;background:rgba(201,138,11,.12)}
.buoc.ket{font-weight:800}
.buoc .d{color:var(--xanh);font-weight:800}.buoc .s{color:var(--do);font-weight:800}

/* Thanh dưới (P10) */
.thanh-duoi{display:flex;align-items:center;gap:calc(var(--u)*.7);padding:0 calc(var(--u)*1);background:#1b1a17;color:#f6f1e4;font-size:calc(var(--u)*1.2);font-weight:700;z-index:6}
.thanh-duoi .dot{display:flex;align-items:center;gap:calc(var(--u)*.4)}
.thanh-duoi .so{font-size:1.1em;font-weight:800;color:#ffd27a;min-width:5.6em;text-align:center}
.nut{display:inline-flex;align-items:center;gap:.35em;height:calc(var(--u)*2.5);padding:0 .6em;border-radius:.4em;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);white-space:nowrap;font-size:calc(var(--u)*1.02)}
.nut:hover{background:rgba(255,255,255,.16)}
.nut kbd{font:inherit;font-size:.78em;font-weight:800;background:#f6f1e4;color:#1b1a17;border-radius:.25em;padding:0 .35em;min-width:1.3em;text-align:center}
.nut.chinh{background:#ffd27a;color:#1b1a17;border-color:#ffd27a}.nut.chinh kbd{background:#1b1a17;color:#ffd27a}
.nut.bat{background:#f6f1e4;color:#1b1a17}
.nut.dat{background:var(--xanh);border-color:var(--xanh)}.nut.kd{background:var(--do);border-color:var(--do)}
.thanh-duoi .cau{color:#cfc6b0;font-weight:600;font-size:.9em;margin-right:auto;white-space:nowrap}
.thanh-duoi .nhom{display:flex;gap:calc(var(--u)*.45)}

/* Bút vẽ (P9) */
canvas.but{position:absolute;inset:0;z-index:4;pointer-events:none;touch-action:none}
.to.co-but canvas.but{pointer-events:auto;cursor:crosshair}
.but-cu{position:absolute;top:calc(var(--u)*.8);left:50%;transform:translateX(-50%);z-index:5;display:none;gap:calc(var(--u)*.5);align-items:center;
  background:#1b1a17;color:#fff;border-radius:3em;padding:calc(var(--u)*.4) calc(var(--u)*.8);font-size:calc(var(--u)*.9);font-weight:700;box-shadow:0 .5em 1.5em rgba(0,0,0,.25)}
.to.co-but .but-cu{display:flex}
.but-cu .m{width:calc(var(--u)*1.9);height:calc(var(--u)*1.9);border-radius:50%;border:.2em solid transparent}
.but-cu .m.chon{border-color:#fff;box-shadow:0 0 0 .12em #1b1a17 inset}
.but-cu .n{padding:.3em .8em;border-radius:2em;background:rgba(255,255,255,.1)}
.but-cu .n.chon{background:#fff;color:#1b1a17}

/* Lớp phủ trong tờ */
.phu-lop{position:absolute;inset:0;z-index:10;display:none}
.phu-lop.mo{display:block}
.bao{position:absolute;top:calc(var(--u)*1.2);left:50%;transform:translateX(-50%);z-index:30;background:#1b1a17;color:#fff;font-weight:700;font-size:calc(var(--u)*1.1);
  padding:.5em 1.1em;border-radius:2em;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.bao.hien{opacity:1}

/* Phóng hình (P7) */
.phong{background:rgba(20,18,14,.88);cursor:zoom-out}
.phong .ruot{position:absolute;inset:calc(var(--u)*2.5);background:#fff;border-radius:calc(var(--u)*1);display:grid;place-items:center;padding:calc(var(--u)*1.5)}
.phong svg{width:100%;height:100%}
.phong .gc{position:absolute;right:calc(var(--u)*3.2);top:calc(var(--u)*3);font-size:calc(var(--u)*1);font-weight:700;color:var(--muc2)}

/* Lưới tổng quan (P5) */
.luoi{background:rgba(14,17,24,.94);color:#eef;padding:calc(var(--u)*2) calc(var(--u)*2.4)}
.luoi h2{font-size:calc(var(--u)*1.7);margin-bottom:calc(var(--u)*1);display:flex;align-items:baseline;gap:1em}
.luoi h2 span{font-size:.55em;color:#9aa3b8;font-weight:500}
.luoi .ds{display:grid;grid-template-columns:repeat(6,1fr);gap:calc(var(--u)*.8)}
.the-dot{text-align:left;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:calc(var(--u)*.7);padding:calc(var(--u)*.7) calc(var(--u)*.8);font-size:calc(var(--u)*.95);line-height:1.35}
.the-dot:hover{background:rgba(255,255,255,.12)}
.the-dot b{font-size:1.35em;display:block}
.the-dot .tt{display:inline-block;margin-top:.3em;font-size:.8em;font-weight:700;border-radius:1em;padding:.05em .6em;background:rgba(255,255,255,.1)}
.the-dot .tt.dat{background:var(--xanh)}.the-dot .tt.kd{background:var(--do)}.the-dot .tt.dang{background:#ffd27a;color:#1b1a17}
.the-dot.dang{outline:.15em solid #ffd27a}

/* Bảng phím tắt */
.phim{background:rgba(14,17,24,.8);display:none;place-items:center}
.phim.mo{display:grid}
.phim .h{background:#fff;border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*1.6) calc(var(--u)*2.2);font-size:calc(var(--u)*1.1);min-width:42%}
.phim h2{font-size:1.3em;margin-bottom:.6em}
.phim dl{display:grid;grid-template-columns:auto 1fr;gap:.4em 1.2em;align-items:center}
.phim dt{text-align:right}
.phim kbd{font:inherit;font-weight:800;font-size:.85em;border:.1em solid var(--muc2);border-bottom-width:.22em;border-radius:.3em;padding:0 .4em;margin-left:.2em}

/* ---------- HIỆU ỨNG GỌI TÊN ---------- */
.goi{z-index:20;overflow:hidden}
.goi .nen{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,190,80,.42) 0,rgba(255,190,80,0) 38%),rgba(16,11,6,.94);animation:nenVao .35s ease-out both}
.goi.ve .nen{animation:nenRa .4s ease-in both}
@keyframes nenVao{from{opacity:0}to{opacity:1}}
@keyframes nenRa{to{opacity:0}}
.goi .vong{position:absolute;left:50%;top:40%;width:calc(var(--u)*16);height:calc(var(--u)*16);margin:calc(var(--u)*-8) 0 0 calc(var(--u)*-8);border-radius:50%;
  border:calc(var(--u)*.35) solid rgba(255,214,120,.9);box-shadow:0 0 calc(var(--u)*3) rgba(255,200,90,.8),inset 0 0 calc(var(--u)*2) rgba(255,200,90,.6);animation:vong 1.1s cubic-bezier(.2,.8,.2,1) both}
.goi .vong.v2{animation-delay:.18s;border-color:rgba(255,255,255,.6)}
@keyframes vong{0%{transform:scale(.2);opacity:0}30%{opacity:1}100%{transform:scale(2.3);opacity:0}}
.goi .tia{position:absolute;left:50%;top:40%;width:calc(var(--u)*40);height:calc(var(--u)*40);margin:calc(var(--u)*-20) 0 0 calc(var(--u)*-20);
  background:repeating-conic-gradient(rgba(255,220,140,.16) 0 6deg,transparent 6deg 18deg);border-radius:50%;
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:tia 1.5s linear both}
@keyframes tia{from{transform:rotate(0) scale(.6);opacity:0}25%{opacity:1}to{transform:rotate(40deg) scale(1.1);opacity:.8}}
.goi .hat{position:absolute;left:50%;top:40%;width:calc(var(--u)*.55);height:calc(var(--u)*.55);border-radius:50%;background:#ffe3a1;box-shadow:0 0 calc(var(--u)*.8) #ffc75a;
  animation:hat 1.05s cubic-bezier(.1,.7,.3,1) both}
@keyframes hat{0%{transform:translate(0,0) scale(.3);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
.goi .cum{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);display:grid;justify-items:center;text-align:center;color:#fff;transform-origin:0 0}
.goi .cum .thu{width:calc(var(--u)*15);height:calc(var(--u)*15);animation:thuVao .6s cubic-bezier(.2,1.5,.4,1) .1s both;filter:drop-shadow(0 0 calc(var(--u)*1.5) rgba(255,200,90,.8))}
@keyframes thuVao{0%{transform:scale(.2) translateY(30%);opacity:0}100%{transform:none;opacity:1}}
.goi .cum .tg{font-size:calc(var(--u)*1.05);font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#ffd27a;margin-top:calc(var(--u)*.6);animation:chuVao .4s .3s both}
.goi .cum .tl{font-size:calc(var(--u)*5.4);font-weight:800;line-height:1.05;text-shadow:0 .06em .3em rgba(0,0,0,.5);animation:chuVao .45s .38s both;white-space:nowrap}
.goi .cum .tp{font-size:calc(var(--u)*1.5);font-weight:600;color:#ffe9bd;margin-top:calc(var(--u)*.5);animation:chuVao .4s .5s both}
.goi .cum .tp b{color:#fff}
.goi .ghi{position:absolute;right:calc(var(--u)*1);bottom:calc(var(--u)*.8);font-size:calc(var(--u)*.75);color:rgba(255,255,255,.55)}
@keyframes chuVao{from{opacity:0;transform:translateY(.4em)}to{opacity:1;transform:none}}
.goi.ve .cum{transition:transform .42s cubic-bezier(.5,0,.2,1),opacity .42s}
.goi.ve .hat,.goi.ve .vong,.goi.ve .tia{opacity:0;transition:opacity .2s}

/* ---------- BẢNG CHI TIẾT HỌC SINH (kính, trượt từ phải) ---------- */
.ct-mo{position:absolute;inset:0;z-index:15;background:rgba(10,12,18,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.ct-mo.mo{opacity:1;pointer-events:auto}
.ct{position:absolute;top:0;right:0;bottom:0;width:68%;z-index:16;transform:translateX(104%);transition:transform .45s cubic-bezier(.2,.9,.2,1);

<script>
(function(){
'use strict';
const $ = (s) => document.querySelector(s);
const to = $('#to');

/* ---------- Dữ liệu mẫu ---------- */
const hoa = (s) => s
  .replace(/\{-t->\}/g,'<span class="mt"><i>t°</i></span>')
  .replace(/\{->\}/g,'<span class="mt"></span>')
  .replace(/([A-Za-z)])(\d+)/g,'$1<sub>$2</sub>');

const HINH = `<svg viewBox="0 0 640 300" role="img" aria-label="Sơ đồ điều chế và thu khí X bằng cách đẩy nước">
  <g fill="none" stroke="#1d1b16" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <line x1="40" y1="276" x2="250" y2="276"/><line x1="70" y1="276" x2="70" y2="60"/><line x1="70" y1="120" x2="120" y2="120"/>
    <path d="M110 105 L220 80 L226 104 L118 130 Z" fill="#fff"/>
    <path d="M122 124 q10 -8 30 -12 q24 -5 38 -4" stroke="#8a6d3b" stroke-width="10" opacity=".55"/>
    <path d="M160 250 l-18 26 h52 l-18 -26 z" fill="#e9e2d0"/>
    <path d="M168 248 q-8 -22 0 -34 q10 12 4 34" stroke="#d9531e" fill="#ffb347"/>
    <path d="M222 92 L300 92 L300 150 L470 150 L470 214"/>
    <path d="M360 170 V270 H600 V170" fill="#dbeefe" stroke="#1d1b16"/>
    <line x1="360" y1="200" x2="600" y2="200" stroke="#6aa6d8" stroke-dasharray="8 6"/>
    <path d="M450 110 H490 V240 q-20 12 -40 0 Z" fill="#fff"/>
    <path d="M452 200 H488 V238 q-18 10 -36 0 Z" fill="#dbeefe" stroke="none"/>
    <circle cx="470" cy="190" r="5" fill="#fff"/><circle cx="462" cy="172" r="4" fill="#fff"/><circle cx="476" cy="160" r="3" fill="#fff"/>
  </g>
  <g font-family="Be Vietnam Pro, sans-serif" font-size="22" font-weight="600" fill="#1d1b16">
    <text x="112" y="72">Chất rắn</text><text x="505" y="130">Khí X</text><text x="520" y="245">Nước</text><text x="100" y="236">Đèn cồn</text>
  </g></svg>`;

const CAU = [
  { stt:3, phan:'I', ten:'Phần I',
    de:`<p><span class="dau">Câu 3.</span>Cho sơ đồ điều chế và thu khí X trong phòng thí nghiệm như hình vẽ. Phản ứng nào sau đây phù hợp với sơ đồ?</p>
      <button class="hinh" id="hinh">${HINH}<span class="kinh-lup">Bấm để phóng to</span></button>
      <div class="pa-ds">
        <div class="pa" data-pa="A"><b>A</b><span class="pa-chu">${hoa('2KMnO4 {-t->} K2MnO4 + MnO2 + O2')}</span></div>
        <div class="pa" data-pa="B"><b>B</b><span class="pa-chu">${hoa('CaCO3 + 2HCl {->} CaCl2 + CO2 + H2O')}</span></div>
        <div class="pa" data-pa="C"><b>C</b><span class="pa-chu">${hoa('NH4Cl + NaOH {-t->} NaCl + NH3 + H2O')}</span></div>
        <div class="pa" data-pa="D"><b>D</b><span class="pa-chu">${hoa('Zn + H2SO4 {->} ZnSO4 + H2')}</span></div>
      </div>`,
    lg:[
      ['Đáp án','<b>A</b>', 'dapan'],
      ['Cốt lõi','Đun nóng chất <b>rắn</b>, thu khí bằng <b>đẩy nước</b> ⇒ khí ít tan trong nước.'],
      ['B','Không cần đun; CO<sub>2</sub> tan một phần — loại.'],
      ['C','NH<sub>3</sub> tan rất nhiều trong nước, không thu bằng đẩy nước — loại.'],
      ['D','Không cần đun nóng — loại.'],
      ['A','O<sub>2</sub> ít tan, KMnO<sub>4</sub> rắn cần đun ⇒ <b>đúng</b>.','ket'],
    ],
    tk:{ kieu:'pa', dung:'A', so:{A:58,B:9,C:27,D:6}, bai:38 } },
  { stt:17, phan:'II', ten:'Phần II',
    de:`<p><span class="dau">Câu 17.</span>Tiến hành thí nghiệm xà phòng hoá chất béo theo các bước sau:
      <b>Bước 1:</b> Cho vào bát sứ khoảng 2 gam mỡ lợn và 6 mL dung dịch NaOH 40%.
      <b>Bước 2:</b> Đun sôi nhẹ hỗn hợp, liên tục khuấy đều bằng đũa thuỷ tinh khoảng 30 phút, thỉnh thoảng thêm vài giọt nước cất để giữ thể tích hỗn hợp không đổi.
      <b>Bước 3:</b> Rót thêm vào hỗn hợp 10 mL dung dịch NaCl bão hoà nóng, khuấy nhẹ rồi để nguội.</p>
      <div class="y" data-y="a"><b>a)</b><span>Sau bước 3, thấy có lớp chất rắn màu trắng nổi lên trên, đó là muối natri của axit béo (xà phòng).</span></div>
      <div class="y" data-y="b"><b>b)</b><span>Mục đích của việc thêm dung dịch NaCl bão hoà ở bước 3 là để phản ứng xà phòng hoá xảy ra hoàn toàn hơn.</span></div>
      <div class="y" data-y="c"><b>c)</b><span>Nếu thay mỡ lợn bằng dầu nhớt bôi trơn động cơ thì hiện tượng ở bước 3 vẫn xảy ra tương tự.</span></div>
      <div class="y" data-y="d"><b>d)</b><span>Ở bước 2, việc thêm nước cất nhằm tránh hỗn hợp bị cạn khô, làm chất béo bị phân huỷ và phản ứng xà phòng hoá không xảy ra được.</span></div>`,
    lg:[
      ['Đáp án','a <span class="d">Đ</span> · b <span class="s">S</span> · c <span class="s">S</span> · d <span class="d">Đ</span>','dapan'],
      ['Cốt lõi','Chất béo + NaOH ⇒ muối axit béo (xà phòng) + glixerol; NaCl chỉ để <b>tách</b> xà phòng.'],
      ['a)','<span class="d">Đúng.</span> Xà phòng nhẹ, ít tan trong dung dịch NaCl nên nổi lên.','',"a"],
      ['b)','<span class="s">Sai.</span> NaCl làm giảm độ tan và tăng tỉ khối dung dịch để xà phòng tách ra, không làm phản ứng hoàn toàn hơn.','',"b"],
      ['c)','<span class="s">Sai.</span> Dầu nhớt là hiđrocacbon, không có nhóm este nên không bị xà phòng hoá.','',"c"],
      ['d)','<span class="d">Đúng.</span> Giữ nước để phản ứng thuỷ phân tiếp diễn, chất béo không bị cháy khét.','',"d"],
    ],
    tk:{ kieu:'y', so:{a:82,b:41,c:67,d:55}, bai:38 } },

/* ---------- Xếp đề: CHỮ CỐ ĐỊNH (luật thầy 28/09) ----------
   Chờ gọi  ⇒ LẬT TRANG: chia ở ranh giới khối (đoạn đề / hàng hình / phương án / ý a–d / bước lời giải), không cắt giữa dòng.
   Đang chữa ⇒ CUỘN dọc trong vùng 2/3, 1/3 bên phải để trống cho em viết. */
const khoi = () => [...noi.children];
function chiaTrang(){
  noi.style.transform = ''; khoi().forEach(b => b.classList.remove('ngoai'));
  const H = hop.clientHeight, hT = u()*2.4 + 4;
  TRANG = [0]; let dau = 0, suc = H;
  for (const b of khoi()){
    const tren = b.offsetTop, duoi = tren + b.offsetHeight;
    if (duoi - dau > suc && tren > dau){ dau = tren; TRANG.push(tren); suc = H - hT; }
  }
}
function hienTrang(i){
  S.trang = Math.max(0, Math.min(TRANG.length-1, i));
  const dau = TRANG[S.trang], cuoi = TRANG[S.trang+1] ?? Infinity, hT = S.trang ? u()*2.4 + 4 : 0;
  khoi().forEach(b => b.classList.toggle('ngoai', b.offsetTop < dau || b.offsetTop >= cuoi));
  noi.style.transform = `translateY(${hT - dau}px)`;
  const c = cau();
  $('#tiep').innerHTML = `<b>Câu ${c.stt}</b> (tiếp) · trang ${S.trang+1}/${TRANG.length}`;
  $('#tiep').classList.toggle('hien', S.trang > 0);
  veChan();
}
function xepDe(){
  hop.classList.toggle('cuon', S.pha === 'chua');
  if (S.pha === 'chua'){
    noi.style.transform = ''; khoi().forEach(b => b.classList.remove('ngoai')); $('#tiep').classList.remove('hien');
    TRANG = [0]; kiemCuon(); veChan(); return;
  }
  $('#conNua').classList.remove('hien'); hop.scrollTop = 0; chiaTrang(); hienTrang(S.trang);
}
function kiemCuon(){
  const con = S.pha === 'chua' && hop.scrollTop + hop.clientHeight < hop.scrollHeight - 2;
  $('#conNua').classList.toggle('hien', con);
}
hop.addEventListener('scroll', () => { kiemCuon(); veChan(); });
function veChan(){
  const c = cau();
  if (S.pha === 'chua'){
    const dai = hop.scrollHeight > hop.clientHeight + 2;
    const pt = dai ? Math.round((hop.scrollTop + hop.clientHeight) / hop.scrollHeight * 100) : 100;
    $('#chanDe').innerHTML = dai
      ? `<span>Câu ${c.stt} · đang cuộn trong 2/3 bảng — đã xem ${pt}%</span><span class="goi-y">con lăn / kéo · <kbd>Space</kbd> <kbd>↓</kbd> cuộn một khung</span>`
      : `<span>Câu ${c.stt} · vừa một khung</span><span class="goi-y">1/3 bên phải để em làm bài</span>`;
    return;
  }
  const n = TRANG.length;
  $('#chanDe').innerHTML = n > 1
    ? `<span>Trang ${S.trang+1}/${n} của Câu ${c.stt}</span><span class="cham">${TRANG.map((_,i) => `<i class="${i===S.trang?'o':''}"></i>`).join('')}</span><span class="goi-y"><kbd>Space</kbd> <kbd>↓</kbd> lật trang · <kbd>←</kbd> <kbd>→</kbd> đổi đợt</span>`
    : `<span>Câu ${c.stt} · một trang</span>`;
}
/* Cuộn một khung (đang chữa) hoặc lật trang (chờ gọi) */
function xuong(huong){
  if (S.pha === 'chua'){ hop.scrollBy({ top: huong * (hop.clientHeight - u()*3), behavior: giamCD() ? 'auto' : 'smooth' }); return true; }
  const moi = S.trang + huong;
  if (moi < 0 || moi >= TRANG.length) return false;
  hienTrang(moi); return true;
}
/* Sau khi hiện một bước lời giải: đưa bước đó vào tầm nhìn */
function denBuoc(){
  const b = noi.querySelector(`.buoc[data-i="${S.buoc-1}"]`); if (!b) return;
  if (S.pha === 'chua'){
    const duoi = b.offsetTop + b.offsetHeight, tren = b.offsetTop;
    if (duoi > hop.scrollTop + hop.clientHeight - u()*2) hop.scrollTo({ top: duoi - hop.clientHeight + u()*3, behavior: giamCD() ? 'auto' : 'smooth' });
    else if (tren < hop.scrollTop) hop.scrollTo({ top: tren - u(), behavior: 'auto' });
    return;
  }
  let i = 0; TRANG.forEach((m,k) => { if (m <= b.offsetTop) i = k; });
  if (i !== S.trang) hienTrang(i);
}

/* ---------- Bút vẽ (P9) ---------- */
const cv = $('#but'), g = cv.getContext('2d');
function coCanvas(){
  const r = $('#than').getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr); g.setTransform(dpr,0,0,dpr,0,0);
}
function xoaBut(){ g.clearRect(0,0,cv.width,cv.height); }
let dangVe = false, truoc = null;
cv.addEventListener('pointerdown', (e) => { if (!S.but) return; dangVe = true; cv.setPointerCapture(e.pointerId); truoc = diem(e); });
cv.addEventListener('pointermove', (e) => {
  if (!dangVe) return; const p = diem(e);
  g.globalCompositeOperation = S.tay ? 'destination-out' : 'source-over';
  g.strokeStyle = S.mau; g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = u() * (S.tay ? 2.2 : 0.35);
  g.beginPath(); g.moveTo(truoc.x, truoc.y); g.lineTo(p.x, p.y); g.stroke(); truoc = p;
});
['pointerup','pointercancel'].forEach(t => cv.addEventListener(t, () => { dangVe = false; }));
function diem(e){ const r = cv.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; }

function toiDot(i){
  i = Math.max(0, Math.min(TONG_DOT-1, i));
  S.dot = i; S.pha = 'cho'; S.lg = false; S.buoc = 0; S.trang = 0; xoaBut(); dongChiTiet(); dongPhong();
  ve(); bao(`Đợt ${i+1} / ${TONG_DOT}`, 900);
}
function space(){
  if (S.lg && S.buoc < cau().lg.length){ S.buoc++; capNhatLg(); denBuoc(); veBangThu(); return; }
  if (!xuong(1)) bao('Hết câu — bấm → để sang đợt sau');
}
function lenh(k){
  switch (k){
    case 'L': if (S.pha === 'cho') goiTen(); else bao('Em đã lên bảng'); break;
    case 'G': {
      const giu = hop.scrollTop;
      S.lg = !S.lg; S.buoc = S.lg ? 1 : 0; ve();
      if (S.pha === 'chua') hop.scrollTop = giu;
      if (S.lg) denBuoc(); else if (S.trang >= TRANG.length) hienTrang(TRANG.length-1);
      break; }
    case 'D': case 'K':
      if (S.pha !== 'chua') { bao('Gọi em lên bảng trước (L)'); break; }
      S.ketQua[S.dot] = k === 'D' ? 'dat' : 'kd'; veEm(); veThanh(); bao(`Đã ghi: ${k==='D'?'Đạt':'Chưa đạt'} — ${em().ten}`); break;
    case 'T': { const giu = hop.scrollTop; S.tk = !S.tk; ve(); hop.scrollTop = giu; break; }
    case 'B': S.but = !S.but; to.classList.toggle('co-but', S.but); veThanh(); veButCu(); break;
    case 'Tab': $('#luoi').classList.contains('mo') ? $('#luoi').classList.remove('mo') : moLuoi(); break;
    case '?': $('#phim').classList.contains('mo') ? $('#phim').classList.remove('mo') : moPhim(); break;
    case '→': toiDot(S.dot+1); break;
    case '←': toiDot(S.dot-1); break;
    case 'SP': space(); break;
    case '↓': xuong(1); break;
    case '↑': xuong(-1); break;
  }
}
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input,textarea,select')) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === 'Escape'){
    if (S.soGo){ S.soGo = ''; bao(''); return; }
    for (const id of ['#phim','#luoi','#phong']) if ($(id).classList.contains('mo')){ $(id).classList.remove('mo'); return; }
    if (S.ctMo) return dongChiTiet();
    if (S.but) return lenh('B');
    return;
  }
  if (/^[0-9]$/.test(k)){ S.soGo = (S.soGo + k).slice(-2); bao(`Tới đợt: ${S.soGo}  ↵ Enter`, 0); return; }
  if (k === 'Backspace' && S.soGo){ S.soGo = S.soGo.slice(0,-1); bao(S.soGo ? `Tới đợt: ${S.soGo}  ↵ Enter` : '', 0); return; }
  if (k === 'Enter' && S.soGo){ const n = +S.soGo; S.soGo = ''; $('#luoi').classList.remove('mo'); toiDot(n-1); e.preventDefault(); return; }
  const map = { l:'L', g:'G', d:'D', k:'K', t:'T', b:'B', Tab:'Tab', '?':'?', ArrowRight:'→', ArrowLeft:'←', ' ':'SP', ArrowDown:'↓', PageDown:'↓', ArrowUp:'↑', PageUp:'↑', Home:'H', End:'E' };
  const m = map[k] || map[k.toLowerCase && k.toLowerCase()];
  if (!m) return;
  e.preventDefault();
  if (m === 'H') return toiDot(0);
  if (m === 'E') return toiDot(TONG_DOT-1);
  lenh(m);
});
