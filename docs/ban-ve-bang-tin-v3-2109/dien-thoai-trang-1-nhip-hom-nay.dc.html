<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bảng tin — điện thoại, trang Nhịp hôm nay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#F3F6FB;color:#1A1F27}
a{color:#1849A9;text-decoration:none}a:hover{color:#123A87}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 14px; background: #F3F6FB; color: #1A1F27;">
<header style="display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; align-items: center; gap: 10px;">
<h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.3px; flex-grow: 1;">Bảng tin</h1>
<button type="button" aria-label="Tìm học sinh" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #DDE4EF; background: #FFFFFF; color: #1A1F27; display: flex; align-items: center; justify-content: center;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
</button>
</div>
<div style="display: flex; align-items: center; gap: 8px;">
<span style="padding: 6px 12px; border-radius: 999px; background: #DCE7FB; color: #123A87; font-size: 13px; font-weight: 600;">Từ 12:00 · Thứ Hai 21/09/2026</span>
<span style="font-size: 13px; color: #4A5565;">Cập nhật 14:32</span>
</div>
</header>
<div style="font-size: 13px; font-weight: 700; color: #4A5565; text-transform: uppercase; letter-spacing: 0.5px;">Trang 1 trong 6 · Nhịp hôm nay</div>
<section aria-label="Nhịp hôm nay" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<sc-for list="{{so}}" as="s" hint-placeholder-count="4">
<div style="box-sizing: border-box; height: 150px; padding: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #DDE4EF; display: flex; flex-direction: column; justify-content: space-between;">
<div style="font-size: 13px; font-weight: 600; color: #4A5565; line-height: 18px;">{{s.nhan}}</div>
<div style="display: flex; align-items: baseline; gap: 6px;">
<span style="font-size: 38px; line-height: 40px; font-weight: 700; letter-spacing: -1px; color: {{accent}};">{{s.so}}</span>
<span style="font-size: 14px; font-weight: 600;">{{s.donVi}}</span>
</div>
<div style="font-size: 12px; color: #4A5565; line-height: 16px;">{{s.phu}}</div>
</div>
</sc-for>
</section>
<section style="flex-grow: 1; box-sizing: border-box; padding: 16px 18px; border-radius: 20px; background: #10233F; color: #FFFFFF; display: flex; flex-direction: column; gap: 9px; min-height: 0;">
<h2 style="margin: 0 0 2px; font-size: 17px; font-weight: 700;">Máy đã tự làm hôm nay</h2>
<sc-for list="{{may}}" as="v" hint-placeholder-count="4">
<div style="display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 21px;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7EE0A6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px;"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
<span><span style="font-weight: 700;">{{v.so}}</span> {{v.viec}}</span>
</div>
</sc-for>
<div style="margin-top: auto; padding-top: 10px; border-top: 1px solid #2B4166; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #C9D8F0;">
<span style="width: 10px; height: 10px; border-radius: 50%; background: #7EE0A6;"></span>
<span>Hệ thống bình thường · thầy không cần làm gì</span>
</div>
</section>
<nav aria-label="Các trang của bảng tin" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 28px;">
<span style="width: 22px; height: 8px; border-radius: 4px; background: #1849A9;"></span>
<span style="width: 8px; height: 8px; border-radius: 50%; background: #B8C4D6;"></span>
<span style="width: 8px; height: 8px; border-radius: 50%; background: #B8C4D6;"></span>
<span style="width: 8px; height: 8px; border-radius: 50%; background: #B8C4D6;"></span>
<span style="width: 8px; height: 8px; border-radius: 50%; background: #B8C4D6;"></span>
<span style="width: 8px; height: 8px; border-radius: 50%; background: #B8C4D6;"></span>
<a href="DienThoai2.dc.html" style="margin-left: 10px; font-size: 14px; font-weight: 600; min-height: 28px; display: flex; align-items: center;">Lướt sang: Bài tập về nhà</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1849A9","options":["#1849A9","#0F6B3A","#7A2E9C","#B3261E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
accent: this.props.accent ?? '#1849A9',
so: [
{ nhan: 'Em đã học hôm nay', so: '108', donVi: '/ 265 em', phu: '41% số em' },
{ nhan: 'Câu đã làm', so: '1.248', donVi: 'câu', phu: '11,6 câu mỗi em đã học' },
{ nhan: 'Tỉ lệ đúng', so: '71', donVi: '%', phu: '886 đúng trong 1.248 câu' },
{ nhan: 'Bài tập về nhà đúng nhịp', so: '97', donVi: '/ 148 em', phu: '51 em chậm một chặng' }
],
may: [
{ so: '102 em', viec: 'được rút bộ câu riêng' },
{ so: '46 em', viec: 'chưa mở bài được nhắc nộp' },
{ so: '14 em', viec: 'được khắc phục luôn ở chặng kế' },
{ so: '362 câu sai', viec: 'đã vào lịch ôn lại' }
]
};
}
}
</script>
</body>
</html>
