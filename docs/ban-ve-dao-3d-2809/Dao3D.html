<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bản đồ Đảo 3D</title>
<!--
 BẢN VẼ 28/09 · BẢN ĐỒ BÁT LINH ĐẢO trong game (thay kiểu phẳng của src/game/than-thu-v2/dao2/BanDo.tsx + dao2.css)
 theo ĐÚNG ngôn ngữ hình của Sảnh 3D (src/components/hoa2/CanhSanh3D.tsx + sanh-ban-do.css):
 SÁNG = hoàng hôn (trời tím → hồng → cam, mặt trời + tia) · TỐI = đêm (tím sẫm, sao, trăng, viền sáng trăng).
 Giữ đủ chức năng BanDo.tsx: vùng theo dạng "Tên · x%", Sương đã tan · Cọ xát, Đền đã dựng · Thành thạo, đường 6 ải
 (ải Trùm to + vương miện) + vị trí thần thú, chuyến k/n + 6 ô vai, Rương Bát Linh (+ Mở rương), đi dở, đảo khoá,
 đảo trống (THONG_BAO_TRONG_2), LÊN ĐƯỜNG · XUA SƯƠNG MÙ, thanh dưới Đảo/Sổ tay/Túi đồ/Cửa hàng, nút toàn màn hình.
 KHI BUILD:
  · Thần thú ở đây là hình tượng trưng — dùng <img src={anhThu(thu,profile.cap,true)}> như BanDo.tsx hiện có.
  · Mọi số lấy từ `hoa2-sanh`/`start` như cũ; thiếu thì ẩn, không bịa. Màu đưa vào biến --d2-* (check:mau cấm hex).
  · Sương mỗi vùng: độ đục = 1 − tiLe/100 (vùng chưa có số dùng tỉ lệ Cọ xát chung). Đền: ceil(6·thanhThao/tong) ở vùng % cao nhất.
  · Chuyển động chỉ transform/opacity; prefers-reduced-motion ⇒ đứng yên; thị sai chỉ khi có chuột/nghiêng máy.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --chu:rgb(24 30 62);--chu-phu:rgb(62 72 108);--chu-mo:rgb(84 92 126);
 --kinh-nen:rgb(255 255 255 / .78);--kinh-vien:rgb(255 255 255 / .95);
 --kinh-bong:0 10px 28px rgb(70 40 120 / .18),0 2px 6px rgb(70 40 120 / .1);
 --vang:rgb(255 196 46);--vang-sang:rgb(255 226 120);--cam:rgb(246 146 18);--nau-chu:rgb(66 32 0);--nau-bong:rgb(186 98 6);
 --ngoc:rgb(0 170 175);--xanh:rgb(16 122 76);--hong:rgb(214 40 96);--cam-chu:rgb(170 72 0);
 --troi-1:rgb(128 132 236);--troi-2:rgb(206 150 226);--troi-3:rgb(255 164 180);--troi-4:rgb(255 206 150);
 --bien-0:rgb(255 214 190);--bien-1:rgb(170 226 232);--bien-2:rgb(92 206 214);--bien-3:rgb(28 150 186);
 --co-1:rgb(180 240 130);--co-2:rgb(96 196 110);--co-3:rgb(40 130 80);
 --vach-1:rgb(214 170 120);--vach-2:rgb(160 116 84);--vach-3:rgb(110 78 78);
 --vien-sang:rgb(255 244 200);--bong-dao:rgb(20 70 120 / .38);--bot:rgb(255 255 255 / .85);
 --suong:rgb(255 255 255);--suong-hong:rgb(250 238 252);
 --duong:rgb(255 226 140);--duong-sang:rgb(255 200 90);
 --nut-bg:rgb(255 255 255 / .92);
 color-scheme:light;
}
:root[data-giao-dien="toi"]{
 --chu:rgb(236 238 255);--chu-phu:rgb(206 210 240);--chu-mo:rgb(178 186 224);
 --kinh-nen:rgb(24 22 62 / .74);--kinh-vien:rgb(170 160 255 / .26);--kinh-bong:0 10px 28px rgb(0 0 0 / .42),0 2px 6px rgb(0 0 0 / .26);
 --ngoc:rgb(60 214 220);--xanh:rgb(110 230 160);--hong:rgb(255 128 168);--cam-chu:rgb(255 196 110);
 --troi-1:rgb(14 12 44);--troi-2:rgb(34 26 86);--troi-3:rgb(62 44 120);--troi-4:rgb(92 70 150);
 --bien-0:rgb(120 110 190);--bien-1:rgb(40 60 130);--bien-2:rgb(20 40 100);--bien-3:rgb(8 18 60);
 --co-1:rgb(96 170 120);--co-2:rgb(44 116 96);--co-3:rgb(18 70 66);
 --vach-1:rgb(110 96 130);--vach-2:rgb(72 62 104);--vach-3:rgb(40 36 72);
 --vien-sang:rgb(190 220 255);--bong-dao:rgb(0 0 20 / .5);--bot:rgb(200 220 255 / .6);
 --suong:rgb(200 206 240);--suong-hong:rgb(170 170 230);
 --duong:rgb(255 220 130);--duong-sang:rgb(255 190 80);--nut-bg:rgb(30 28 74 / .92);
 color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-giao-dien="sang"]){
 --chu:rgb(236 238 255);--chu-phu:rgb(206 210 240);--chu-mo:rgb(178 186 224);
 --kinh-nen:rgb(24 22 62 / .74);--kinh-vien:rgb(170 160 255 / .26);--kinh-bong:0 10px 28px rgb(0 0 0 / .42),0 2px 6px rgb(0 0 0 / .26);
 --ngoc:rgb(60 214 220);--xanh:rgb(110 230 160);--hong:rgb(255 128 168);--cam-chu:rgb(255 196 110);
 --troi-1:rgb(14 12 44);--troi-2:rgb(34 26 86);--troi-3:rgb(62 44 120);--troi-4:rgb(92 70 150);
 --bien-0:rgb(120 110 190);--bien-1:rgb(40 60 130);--bien-2:rgb(20 40 100);--bien-3:rgb(8 18 60);
 --co-1:rgb(96 170 120);--co-2:rgb(44 116 96);--co-3:rgb(18 70 66);
 --vach-1:rgb(110 96 130);--vach-2:rgb(72 62 104);--vach-3:rgb(40 36 72);
 --vien-sang:rgb(190 220 255);--bong-dao:rgb(0 0 20 / .5);--bot:rgb(200 220 255 / .6);
 --suong:rgb(200 206 240);--suong-hong:rgb(170 170 230);
 --duong:rgb(255 220 130);--duong-sang:rgb(255 190 80);--nut-bg:rgb(30 28 74 / .92);
 color-scheme:dark;
}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--troi-2);color:var(--chu);font:500 14px/1.35 'Be Vietnam Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--vang);outline-offset:2px}
.baloo{font-family:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif}
.kinh{background:var(--kinh-nen);border:1px solid var(--kinh-vien);box-shadow:var(--kinh-bong),inset 0 1px 0 rgb(255 255 255 / .5);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3)}

/* ── CẢNH NỀN (trời · biển · sóng · mây) phủ cả màn ─────────────────── */
.canh{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,var(--troi-1) 0%,var(--troi-2) 11%,var(--troi-3) 19%,var(--troi-4) 24%,var(--bien-0) 25%,var(--bien-1) 32%,var(--bien-2) 60%,var(--bien-3) 100%)}
.canh svg{position:absolute;inset:0;width:100%;height:100%}
.lop{position:absolute;inset:-24px;will-change:transform}
.mat-troi{position:absolute;left:68%;top:14%;width:110px;height:110px;margin:-55px;border-radius:50%;background:radial-gradient(circle,rgb(255 255 240) 0%,rgb(255 238 170) 38%,rgb(255 196 110 / .7) 52%,rgb(255 196 110 / 0) 70%)}
.tia{position:absolute;left:68%;top:14%;width:420px;height:420px;margin:-210px;border-radius:50%;background:repeating-conic-gradient(rgb(255 240 200 / .22) 0 5deg,rgb(255 240 200 / 0) 5deg 18deg);-webkit-mask:radial-gradient(circle,black 10%,transparent 68%);mask:radial-gradient(circle,black 10%,transparent 68%);animation:xoay 90s linear infinite}
.trang,.sao{display:none}
.trang{position:absolute;left:74%;top:10%;width:54px;height:54px;margin:-27px;border-radius:50%;background:radial-gradient(circle at 38% 36%,rgb(255 252 236),rgb(236 230 206) 60%,rgb(214 208 186));box-shadow:0 0 40px 12px rgb(200 210 255 / .35)}
.sao i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgb(255 255 255);animation:lap var(--t,3s) ease-in-out var(--d,0s) infinite}
:root[data-giao-dien="toi"] .mat-troi,:root[data-giao-dien="toi"] .tia{display:none}
:root[data-giao-dien="toi"] .trang,:root[data-giao-dien="toi"] .sao{display:block}
@media (prefers-color-scheme:dark){:root:not([data-giao-dien="sang"]) .mat-troi,:root:not([data-giao-dien="sang"]) .tia{display:none}
 :root:not([data-giao-dien="sang"]) .trang,:root:not([data-giao-dien="sang"]) .sao{display:block}}
.song{animation:troi var(--t,10s) linear infinite}
.song.nguoc{animation-direction:reverse}
.lap{animation:lap var(--t,3s) ease-in-out var(--d,0s) infinite}
.may{position:absolute;height:34px;border-radius:40px;background:radial-gradient(ellipse at 50% 60%,rgb(255 255 255 / .95),rgb(250 240 252 / .8) 55%,rgb(236 222 250 / 0) 72%);animation:may var(--t,40s) ease-in-out var(--d,0s) infinite alternate}
.may::before,.may::after{content:"";position:absolute;border-radius:50%;background:inherit}
.may::before{width:46%;height:150%;left:16%;top:-60%}.may::after{width:36%;height:120%;left:48%;top:-40%}
:root[data-giao-dien="toi"] .may{opacity:.35}
@media (prefers-color-scheme:dark){:root:not([data-giao-dien="sang"]) .may{opacity:.35}}

/* ── KHUNG MÀN ───────────────────────────────────────────────────────── */
.man{position:relative;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.dau{display:flex;align-items:center;gap:6px;padding:8px 12px 4px;position:relative;z-index:5}
.nut-tron{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--chu)}
.dau h1{flex:1;min-width:0;margin:0;font:800 19px/1.05 'Baloo 2',system-ui;color:var(--chu);text-shadow:0 1px 0 rgb(255 255 255 / .5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dau h1 small{display:block;font:700 10px/1.2 'Be Vietnam Pro';letter-spacing:.14em;color:var(--chu-phu)}
.the-luc{flex:none;display:flex;align-items:center;gap:6px;margin:0;padding:5px 10px 5px 8px;border-radius:999px}
.the-luc svg{fill:var(--ngoc)}
.the-luc span{font:800 15px/1 'Baloo 2';color:var(--chu)}
.the-luc small{display:block;font:600 9px/1.1 'Be Vietnam Pro';color:var(--chu-mo)}

.trai{position:relative;min-height:0}
.dao-lop{position:absolute;inset:0;will-change:transform}
.dao-lop>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.phu{position:absolute;inset:0;pointer-events:none}
.phu>*{pointer-events:auto}
.nhan{position:absolute;transform:translate(-50%,-50%);padding:4px 10px;border-radius:999px;font:700 12px/1.2 'Be Vietnam Pro';color:var(--chu);white-space:nowrap}
.nhan b{font:800 13px/1 'Baloo 2';color:var(--cam-chu)}
.nhan[data-sang]{border-color:var(--vang);box-shadow:var(--kinh-bong),0 0 0 2px rgb(255 214 107 / .5),0 0 18px rgb(255 214 107 / .6)}
.nhan[data-sang] b{color:var(--xanh)}
.thu{position:absolute;width:64px;height:64px;margin:-60px 0 0 -32px;animation:nhun 1.6s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgb(40 20 80 / .35))}
.thu svg{width:100%;height:100%}
.thu-ghi{position:absolute;transform:translate(-50%,0);font:600 9px/1 'Be Vietnam Pro';color:var(--chu-phu);opacity:.8;white-space:nowrap}

.phai{display:flex;flex-direction:column;gap:6px;padding:0 12px 6px;position:relative;z-index:4;min-height:0}
.so{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.so p{margin:0;padding:5px 10px;border-radius:14px}
.so small{display:block;font:600 10.5px/1.2 'Be Vietnam Pro';color:var(--chu-mo)}
.so b{font:800 17px/1.05 'Baloo 2'}
.so-xanh{color:var(--ngoc)}.so-vang{color:var(--cam-chu)}
.chu-thich{grid-column:1/-1;margin:0;font:500 10px/1.3 'Be Vietnam Pro';color:var(--chu-phu);text-align:center;text-shadow:0 1px 0 rgb(255 255 255 / .35)}
.tam{border-radius:22px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:7px}
.tam-dau{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tam-dau h2{margin:0;font:800 17px/1.1 'Baloo 2'}
.tam-dau span{font:600 11.5px/1 'Be Vietnam Pro';color:var(--chu-mo);white-space:nowrap}
.vai{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:0;padding:0;list-style:none}
.vai li{height:30px;border-radius:10px;display:grid;place-items:center;font:700 11px/1 'Be Vietnam Pro';background:rgb(255 214 107 / .22);border:1.5px solid rgb(255 196 46 / .6);color:var(--cam-chu)}
.vai li[data-vai="on_lai"]{background:rgb(0 170 175 / .14);border-color:rgb(0 170 175 / .5);color:var(--ngoc)}
.vai li[data-vai="trum"]{background:rgb(214 40 96 / .14);border-color:rgb(214 40 96 / .55);color:var(--hong)}
.vai li[data-trang="dung"]{background:var(--xanh);border-color:var(--xanh);color:rgb(255 255 255)}
.vai li[data-trang="sai"]{background:rgb(255 150 120 / .35);border-color:rgb(230 100 70);color:var(--chu)}
.vai li[data-hien]{box-shadow:0 0 0 2px var(--vang),0 0 12px rgb(255 196 46 / .7)}
.ruong{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:rgb(255 214 107 / .16);border:1px solid rgb(255 196 46 / .4)}
.ruong b{display:block;font:700 12px/1.25 'Be Vietnam Pro'}
.vach{display:block;height:6px;margin-top:5px;border-radius:9px;background:rgb(120 90 40 / .18);overflow:hidden}
.vach i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--vang),var(--cam));transform-origin:left}
.ruong-so{font:800 14px/1 'Baloo 2';color:var(--cam-chu)}
.nut-vien{padding:6px 12px;border-radius:999px;border:1.5px solid var(--cam);color:var(--cam-chu);font-weight:700;font-size:12px;background:var(--nut-bg)}
.ruong .nut-vien{grid-column:1/-1}
.ghi{margin:0;font:500 12px/1.35 'Be Vietnam Pro';color:var(--chu-phu)}
.ghi.khoa{color:var(--cam-chu);font-weight:600}
.het{margin:0;padding:14px 12px;border-radius:14px;text-align:center;font:600 13.5px/1.4 'Be Vietnam Pro';background:rgb(255 255 255 / .18);border:1px dashed var(--kinh-vien)}
.nut-vang{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:16px;font:800 16px/1 'Baloo 2';letter-spacing:.04em;color:var(--nau-chu);background:linear-gradient(180deg,var(--vang-sang),var(--vang) 55%,var(--cam));box-shadow:0 5px 0 var(--nau-bong),0 10px 18px rgb(186 98 6 / .35),inset 0 2px 0 rgb(255 255 255 / .6);transition:transform .12s}
.nut-vang:active{transform:translateY(3px)}
.nut-vang:disabled{opacity:.5;cursor:not-allowed;transform:none}
.duoi{display:flex;justify-content:space-around;margin:0 12px 8px;padding:4px;border-radius:22px;position:relative;z-index:4}
.duoi button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;border-radius:16px;font:600 11px/1.1 'Be Vietnam Pro';color:var(--chu-phu)}
.duoi button svg{width:22px;height:22px}
.duoi button[aria-current]{background:linear-gradient(180deg,var(--vang-sang),var(--vang));color:var(--nau-chu);box-shadow:0 3px 0 var(--nau-bong)}

/* bảng thử */
.thu-bang{position:fixed;z-index:20;top:58px;right:12px;width:230px;border-radius:18px;padding:12px;display:none;flex-direction:column;gap:6px}
.thu-bang[data-mo]{display:flex}
.thu-bang h3{margin:0 0 2px;font:800 14px/1 'Baloo 2'}
.thu-bang button{text-align:left;padding:7px 10px;border-radius:10px;font-size:12.5px;font-weight:600;background:rgb(255 255 255 / .2);border:1px solid var(--kinh-vien)}
.thu-bang button[aria-pressed="true"]{background:var(--vang);color:var(--nau-chu)}
.thu-bang .hang{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.thu-bang .hang button{text-align:center;padding:6px 0}

/* ── SVG ĐẢO ─────────────────────────────────────────────────────────── */
.bot-vien{animation:bot 3.2s ease-in-out infinite;transform-origin:200px 240px;transform-box:view-box}
.bot-vien.b2{animation-delay:-1.6s}
.suong-vung{transition:opacity 1.2s ease}
.suong-cuon{animation:cuon var(--t,14s) ease-in-out var(--d,0s) infinite alternate;transform-box:fill-box;transform-origin:center}
.duong-sang{stroke-dasharray:2 12;animation:chay 1.4s linear infinite}
.nut-hien{animation:nhip 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.co{animation:phap 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.la-cay{animation:lac 4s ease-in-out var(--d,0s) infinite alternate;transform-box:fill-box;transform-origin:bottom center}

@keyframes xoay{to{transform:rotate(360deg)}}
@keyframes troi{from{transform:translateX(0)}to{transform:translateX(-120px)}}
@keyframes lap{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes may{from{transform:translateX(-30px)}to{transform:translateX(40px)}}
@keyframes nhun{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-7px) scale(.97,1.03)}55%{transform:translateY(-7px) scale(.97,1.03)}}
@keyframes bot{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.85;transform:scale(1.012)}}
@keyframes cuon{from{transform:translate(-6px,2px) scale(1)}to{transform:translate(8px,-3px) scale(1.08)}}
@keyframes chay{to{stroke-dashoffset:-28}}
@keyframes nhip{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.9)}}
@keyframes phap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.8) skewY(4deg)}}
@keyframes lac{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}

/* ── NGANG ───────────────────────────────────────────────────────────── */
@media (min-width:900px) and (min-aspect-ratio:1/1){
 .man{grid-template-columns:minmax(0,1fr) 420px;grid-template-rows:auto minmax(0,1fr) auto}
 .dau{grid-column:1/-1;padding:16px 24px 8px}
 .dau h1{font-size:24px}
 .trai{grid-row:2/4;grid-column:1}
 .phai{grid-row:2;grid-column:2;padding:8px 24px 12px 0;justify-content:flex-end;gap:12px}
 .duoi{grid-row:3;grid-column:2;margin:0 24px 18px 0}
 .so p{padding:10px 14px}.so b{font-size:22px}
 .tam{padding:16px 18px 18px;gap:12px}
 .tam-dau h2{font-size:20px}
 .vai li{height:38px;font-size:12px}
 .nut-vang{height:58px;font-size:18px}
 .nhan{font-size:13px;padding:6px 13px}
 .thu{width:92px;height:92px;margin:-86px 0 0 -46px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="canh" aria-hidden="true">
 <div class="lop" data-sau=".15">
  <div class="tia"></div><div class="mat-troi"></div><div class="trang"></div>
  <div class="sao" id="sao"></div>
  <div class="may" style="left:6%;top:9%;width:120px;--t:46s"></div>
  <div class="may" style="left:44%;top:5%;width:90px;--t:38s;--d:-12s"></div>
  <div class="may" style="left:80%;top:19%;width:140px;--t:52s;--d:-20s"></div>
 </div>
 <div class="lop" data-sau=".35">
  <svg preserveAspectRatio="none" viewBox="0 0 400 800" id="bien"></svg>
 </div>
</div>

<div class="man">
 <header class="dau">
  <button type="button" class="nut-tron kinh" aria-label="Về app học sinh" title="Về app học sinh"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <h1><small>BÁT LINH ĐẢO</small><span id="ten-dao"></span></h1>
  <p class="kinh the-luc" id="the-luc"></p>
  <button type="button" class="nut-tron kinh" id="mo-thu" aria-label="Bảng thử bản vẽ" title="Bảng thử bản vẽ" aria-expanded="false"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
  <button type="button" class="nut-tron kinh" id="toan-man" aria-label="Toàn màn hình" title="Toàn màn hình"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>

 document.getElementById('ten-dao').textContent=cd?`Đảo ${ca.ten}`:'Bát Linh Đảo';
 const tl=document.getElementById('the-luc');
 tl.hidden=!ca.theLuc;if(ca.theLuc){tl.setAttribute('aria-label',`Thể lực hôm nay: còn ${ca.theLuc.con} trên ${ca.theLuc.tong} câu`);tl.innerHTML=`<svg viewBox="0 0 14 16" width="14" height="16" aria-hidden="true"><polygon points="7,0 14,5 11,16 3,16 0,5"/></svg><span><small>Thể lực</small>${ca.theLuc.con}/${ca.theLuc.tong}</span>`}
 /* nhãn vùng + thần thú */
 const phu=document.getElementById('phu');phu.textContent='';
 const ul=h('<ul aria-label="Vùng đất theo dạng bài" style="margin:0;padding:0;list-style:none"></ul>');phu.appendChild(ul);
 ca.vung.slice(0,6).forEach((v,i)=>{const li=h(`<li class="nhan kinh" data-x="${VUNG[i].n[0]}" data-y="${VUNG[i].n[1]}" ${v.p>=60?'data-sang':''} aria-label="Vùng ${esc(v.t)}: ${v.p}% câu làm đúng ở lần gần nhất (${v.d}/${v.l} câu)">${esc(v.t)} · <b>${v.p}%</b></li>`);ul.appendChild(li)});
 const hien=Math.min(ca.kq.length,5),[tx,ty]=ca.cau?NUT[hien]:[110,330];
 const thu=h(`<div class="thu" data-x="${tx}" data-y="${ty}" role="img" aria-label="Thần thú của em: Hoả Linh">${THU}</div>`);phu.appendChild(thu);
 /* cột phải / tấm dưới */
 const ph=document.getElementById('phai');ph.textContent='';
 if(cd){ph.appendChild(h(`<div class="so"><p class="kinh"><small>Sương đã tan · Cọ xát</small><b class="so-xanh">${cd.coXat}/${cd.tong} ô</b></p><p class="kinh"><small>Đền đã dựng · Thành thạo</small><b class="so-vang">${cd.thanhThao}/${cd.tong} ô</b>${cd.thanhThao===0&&cd.tangTu?`<small>Đền mọc từ ${cd.tangTu}</small>`:''}</p>${ca.vung.length?'<p class="chu-thich">1 ô = 1 câu của chiến dịch · % ở mỗi vùng = câu em làm đúng ở lần gần nhất</p>':''}</div>`))}
 const cau=ca.cau;
 let t=`<section class="kinh tam" aria-label="Chuyến thám hiểm hôm nay"><div class="tam-dau"><h2>${ca.soChuyen?`Chuyến thám hiểm ${ca.soChuyen.k}/${ca.soChuyen.n}`:'Chuyến thám hiểm'}</h2>${cau?`<span>${cau.length} ải · ${cau.length}–${cau.length+2} phút</span>`:''}</div>`;
 if(ca.het)t+=`<p class="het" role="status">${esc(ca.het)}</p>`;
 else t+='<ol class="vai" aria-label="Vai của từng ải">'+cau.map((v,i)=>{const k=ca.kq[i];return `<li data-vai="${v}" ${k===undefined?'':`data-trang="${k?'dung':'sai'}"`} ${i===hien&&!ca.khoa?'data-hien':''} aria-label="Ải ${i+1}: ${TEN_VAI[v]}${k===undefined?'':(k?' · đã qua, đúng':' · đã qua, chưa đúng')}">${NHAN[v]}</li>`}).join('')+'</ol>';
 const ru=ca.ruong;
 if(ru&&ru.tong>0)t+=`<div class="ruong"><svg viewBox="0 0 28 24" width="28" height="24" aria-hidden="true"><rect x="2" y="9" width="24" height="13" rx="2" fill="rgb(186 98 6)"/><path d="M2 11 C2 4 26 4 26 11 Z" fill="rgb(246 146 18)"/><rect x="12" y="9" width="4" height="7" rx="1" fill="rgb(255 226 120)"/></svg><span><b>${ru.daMo?'Rương Bát Linh · đã mở hôm nay':`Rương Bát Linh · xong ${ru.tong}/${ru.tong} câu hôm nay để mở`}</b><span class="vach" role="progressbar" aria-label="Câu đã làm hôm nay" aria-valuemin="0" aria-valuemax="${ru.tong}" aria-valuenow="${Math.min(ru.daLam,ru.tong)}"><i style="transform:scaleX(${Math.min(1,ru.daLam/ru.tong)})"></i></span></span><span class="ruong-so">${Math.min(ru.daLam,ru.tong)}/${ru.tong}</span>${ru.moDuoc&&!ru.daMo?'<button type="button" class="nut-vien">Mở rương</button>':''}</div>`;
 if(ca.khoa)t+='<p class="ghi khoa" role="status">Đảo đang khoá: em còn câu ôn hôm nay ở Đoàn Hộ Tống — làm xong là đảo mở.</p>';
 else if(ca.kq.length&&!ca.het)t+=`<p class="ghi">Em đang đi dở chuyến — bấm LÊN ĐƯỜNG để đi tiếp từ ải ${ca.kq.length+1}.</p>`;
 if(!ca.het)t+=`<button type="button" class="nut-vang" ${ca.khoa?'disabled':''}><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>LÊN ĐƯỜNG · XUA SƯƠNG MÙ</button>`;
 t+='</section>';ph.appendChild(h(t));
 datNhan();
}
function ve(){const ca=CA[caHien];veDao(ca);veDong(ca);veHUD();
 document.querySelectorAll('[data-ca]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.ca===caHien)))}

/* ── bảng thử + giao diện ── */
const bang=document.getElementById('thu-bang'),moThu=document.getElementById('mo-thu');
moThu.addEventListener('click',()=>{const m=!bang.hasAttribute('data-mo');bang.toggleAttribute('data-mo',m);moThu.setAttribute('aria-expanded',String(m))});
bang.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.ca){caHien=b.dataset.ca;ve()}
 if(b.dataset.gd!==undefined){if(b.dataset.gd)document.documentElement.dataset.giaoDien=b.dataset.gd;else delete document.documentElement.dataset.giaoDien;danhDauGd()}});
function danhDauGd(){const g=document.documentElement.dataset.giaoDien||'';document.querySelectorAll('[data-gd]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.gd===g)))}
document.getElementById('toan-man').addEventListener('click',()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}});

/* ── thị sai: chỉ khi có chuột / nghiêng máy; dừng khi tab ẩn ── */
const giam=matchMedia('(prefers-reduced-motion: reduce)').matches;
let mx=0,my=0,cx=0,cy=0,raf=0;
const lop=[...document.querySelectorAll('[data-sau]')];
function buoc(){cx+=(mx-cx)*.08;cy+=(my-cy)*.08;lop.forEach(l=>{const k=+l.dataset.sau;l.style.transform=`translate3d(${(cx*k*18).toFixed(2)}px,${(cy*k*10).toFixed(2)}px,0)`});
 raf=Math.abs(mx-cx)+Math.abs(my-cy)>.002&&!document.hidden?requestAnimationFrame(buoc):0}
function day(x,y){if(giam)return;mx=x;my=y;if(!raf)raf=requestAnimationFrame(buoc)}
addEventListener('pointermove',e=>day(e.clientX/innerWidth-.5,e.clientY/innerHeight-.5),{passive:true});
addEventListener('deviceorientation',e=>{if(e.gamma!=null)day(Math.max(-1,Math.min(1,e.gamma/30))*.5,Math.max(-1,Math.min(1,(e.beta-40)/30))*.5)},{passive:true});
new ResizeObserver(()=>datNhan()).observe(document.getElementById('dao-lop'));
if(document.fonts)document.fonts.ready.then(datNhan);
const q=new URLSearchParams(location.search);if(CA[q.get('ca')])caHien=q.get('ca');if(q.get('gd'))document.documentElement.dataset.giaoDien=q.get('gd');
ve();danhDauGd();
</script>
</body>
</html>
