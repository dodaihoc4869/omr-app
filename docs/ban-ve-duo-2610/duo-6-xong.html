<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HS · Làm chặng kiểu Duolingo · 6 Xong chặng</title><link rel="stylesheet" href="trong.css"><link rel="stylesheet" href="lam-duo.css"></head>
<body class="duo" data-app="hs" data-khung="khong" data-ai="khong">
<div class="duo-vo">
  <main class="duo-xong">
    <div class="duo-huy"><span class="duo-tia" style="top:-6px;left:10px;background:var(--dung)"></span><span class="duo-tia" style="top:20px;right:-10px;background:var(--tin)"></span><span class="duo-tia" style="bottom:-4px;left:-8px;background:var(--sai)"></span><span class="duo-tia" style="bottom:12px;right:-14px;background:var(--sao)"></span><i data-i="trophy"></i></div>
    <h1>Xong chặng 1!</h1>
    <p>Ester – Lipid · tầng Hiểu</p>
    <div class="duo-3">
      <div class="a"><p>Tự làm đúng</p><b><i data-i="target"></i>5/6</b></div>
      <div class="b"><p>Thời gian</p><b><i data-i="clock"></i>4:12</b></div>
      <div class="c"><p>Hôm nay</p><b><i data-i="flame"></i>18/30</b></div>
    </div>
    <div class="duo-chang" aria-label="Xong 1/5 chặng hôm nay"><i class="x"></i><i></i><i></i><i></i><i></i></div>
    <p class="duo-ghi">Câu 4 sai đã vào lịch ôn 1 · 3 · 7 ngày. Còn 12 câu nữa là đủ mức hôm nay.</p>
  </main>
  <div class="duo-day"><div class="giua"><span class="duo-nut">Học tiếp chặng 2</span><div class="duo-bo"><span>Về Hôm nay</span></div></div></div>
</div>
<script src="khung.js"></script>
</body></html>
