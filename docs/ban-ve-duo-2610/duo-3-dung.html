<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HS · Làm chặng kiểu Duolingo · 3 Đúng</title><link rel="stylesheet" href="trong.css"><link rel="stylesheet" href="lam-duo.css"></head>
<body class="duo" data-app="hs" data-khung="khong" data-ai="khong">
<div class="duo-vo">
  <div class="duo-tren"><span class="duo-dong" aria-label="Thoát, lưu chặng"><i data-i="x"></i></span><div class="duo-thanh" aria-label="Câu 2/6 của chặng"><i style="--p:33%"></i></div><span class="duo-chuoi" aria-label="Chuỗi câu đúng liền"><i data-i="flame"></i>3</span></div>
  <main class="duo-than">
    <p class="duo-nhan">Câu mới · Hợp chất chứa nitrogen <span class="chip">Chặng 1</span></p>
    <p class="duo-de">Số đồng phân amine có công thức phân tử C<sub>4</sub>H<sub>11</sub>N tác dụng với dung dịch HNO<sub>2</sub> (ở nhiệt độ thường) tạo ra alcohol là</p>
    <div class="duo-pa luoi">
      <div class="mo"><b>A</b>2</div>
      <div class="mo"><b>B</b>8</div>
      <div class="mo"><b>C</b>3</div>
      <div class="dung"><b>D</b>4</div>
    </div>
  </main>
  <div class="duo-day dung"><div class="giua">
    <div class="duo-kq"><span class="o"><i data-i="check"></i></span><div><h3>Chính xác!</h3><p>Chỉ amine bậc một cho alcohol với HNO<sub>2</sub>; C<sub>4</sub>H<sub>11</sub>N có 4 đồng phân bậc một.</p></div></div>
    <div class="duo-them"><span><i data-i="book"></i>Lời giải từng bước</span><span><i data-i="ask"></i>Hỏi thầy</span></div>
    <span class="duo-nut">Tiếp tục</span>
  </div></div>
</div>
<script src="khung.js"></script>
</body></html>
