<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HS · Một trang · Đủ mức hôm nay</title><link rel="stylesheet" href="trong.css"><link rel="stylesheet" href="mot-trang.css"></head>
<body class="mot" data-app="hs" data-tab="hom-nay" data-menu="phai" data-ai="menu" data-diem-danh="xong">
<main class="khung">
  <!-- GỌN HƠN: Đủ 30 câu ⇒ việc kế tiếp tự lên số 1; học thêm là liên kết. -->
  <header class="mt-dau"><p class="nhan">Thứ Hai 26/10 · 12A1</p><h1>Chào Minh Anh</h1></header>
  <div class="mt-luoi">
    <section class="the viec" aria-label="Việc của em lúc này">
      <p class="nhan-viec"><span class="so-thu">1</span>Việc tiếp theo</p>
      <div class="viec-than">
        <div class="vong" style="--p:100;--c:var(--dung)"><div><div class="so-lon">30<small>/30</small></div><div class="mo">câu hôm nay</div></div></div>
        <div class="viec-chu">
          <span class="chip dung" style="align-self:flex-start"><i data-i="check" class="nho"></i>Đủ mức hôm nay</span>
          <h2>Sửa 5 câu sai</h2>
          <p class="phu">Sửa xong, câu đó về lịch ôn như câu đúng</p>
        </div>
      </div>
      <span class="nut chinh lon rong-het">Sửa lỗi ngay <i data-i="arrow"></i></span>
      <div class="viec-chan"><span class="chip sao"><i data-i="flame" class="nho"></i>Chuỗi 7 ngày</span></div>
    </section>
    <section class="sau-do" aria-label="Sau đó">
      <p class="nhan-viec">Sau đó</p>
      <div class="ds-gon">
        <div class="dong"><span class="so-thu xam">2</span><span class="o-icon tin"><i data-i="target" class="nho"></i></span><div class="giua"><p class="ten">Kiểm tra ôn tập</p><p class="mo">28 câu · 50 phút · hạn 24:00</p></div><i data-i="chevron" class="mui"></i></div>
        <div class="dong"><span class="so-thu xam">3</span><span class="o-icon chu-y"><i data-i="pen" class="nho"></i></span><div class="giua"><p class="ten">Bài tập về nhà</p><p class="mo">1 bài · hạn 28/10</p></div><i data-i="chevron" class="mui"></i></div>
      </div>
      <a class="lien-ket">Học thêm câu mới <i data-i="chevron" class="nho"></i></a>
    </section>
  </div>
</main>
<script src="khung.js"></script>
</body></html>
