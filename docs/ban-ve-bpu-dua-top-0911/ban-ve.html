<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng đua top</title>
<!-- BẢN VẼ (09/11) — màn «cả lớp đang làm» + «đã mở đáp án» của bảng Bình Phản Ứng, bỏ đề, thay bằng đua top.
     Mở: ban-ve.html#A-lam · #A-mo · #B-lam · #B-mo  (thêm ?chup=1 để đứng hình khi chụp). Dữ liệu giả: 16 em, 4 đội.
     Màu: CHỈ giá trị của bảng chiếu hiện tại — src/lib/bpu/mau-chieu.ts (--tr-chieu-*), styles/trong.css (--tr-sao, --tr-chu-y, --tr-sai, --tr-dung, --tr-hs),
     styles/tokens.css (--p-cam, --p-tim-2, --p-xanh, --p-do = 4 đội; --p-muc). Phông Be Vietnam Pro (@fontsource trong node_modules). -->
<style>
:root{
  /* mau-chieu.ts */
  --tr-chieu-bang:#15181c; --tr-chieu-giay:#f4efe4; --tr-chieu-chu:#22262b; --tr-chieu-phu:#5b6168; --tr-chieu-the:#e7e1d3;
  --tr-chieu-mat:#23282d; --tr-chieu-mat-2:#2f353b; --tr-chieu-mat-3:#3b4148; --tr-chieu-nhan:#0b57d0; --tr-chieu-nhan-toi:#a8c7fa;
  /* trong.css (bản sáng) */
  --tr-sao:#fdb022; --tr-chu-y:#f79009; --tr-sai:#f04438; --tr-dung:#12b76a; --tr-hs:#16a34a;
  /* tokens.css */
  --p-muc:#1a2332; --p-cam:#f59e0b; --p-tim-2:#8b5cf6; --p-xanh:#10b981; --p-do:#ef4444;
  /* đè giống bpu-bang.css khối 08/11 */
  --tr-nen:var(--tr-chieu-bang); --tr-chu:var(--tr-chieu-giay);
  --tr-chu-2:color-mix(in srgb, var(--tr-chieu-giay) 78%, transparent); --tr-chu-3:color-mix(in srgb, var(--tr-chieu-giay) 58%, transparent);
  --tr-mat:var(--tr-chieu-mat); --tr-mat-2:var(--tr-chieu-mat-2); --tr-mat-3:var(--tr-chieu-mat-3);
  --tr-vien:color-mix(in srgb, var(--tr-chieu-giay) 16%, transparent); --tr-vien-2:color-mix(in srgb, var(--tr-chieu-giay) 30%, transparent);
  --tr-tin:var(--tr-chieu-nhan-toi); --giay:var(--tr-chieu-giay);
  --sans:'Be Vietnam Pro','Noto Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--tr-nen); overflow:hidden; }
body{ color:var(--tr-chu); font-family:var(--sans); font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; }
.san{ position:absolute; left:50%; top:50%; width:1920px; height:1080px; transform-origin:50% 50%; overflow:hidden; background:var(--tr-nen); }

/* ── Thanh trên (giữ như bảng hiện tại) ── */
.tren{ position:absolute; left:64px; right:150px; top:30px; height:60px; display:flex; align-items:center; gap:14px; z-index:5; }
.logo{ width:34px; height:46px; --doi:var(--tr-tin); }
.pill{ padding:8px 18px; border-radius:999px; background:var(--tr-mat-2); box-shadow:inset 0 0 0 2px var(--tr-vien); font-size:30px; font-weight:700; white-space:nowrap; }
.chip{ padding:6px 18px; border-radius:12px; background:var(--tr-mat-2); color:var(--tr-chu-2); font-size:26px; font-weight:600; white-space:nowrap; }
.lop{ display:flex; align-items:baseline; gap:16px; font-size:30px; color:var(--tr-chu-2); white-space:nowrap; }
.lop .ma{ font-size:22px; font-weight:600; color:var(--tr-chu-3); } .lop .ma b{ font-weight:800; letter-spacing:.06em; color:var(--tr-chu-2); }
.gian{ flex:1; }
.gio{ font-size:40px; font-weight:800; min-width:128px; text-align:center; padding:4px 18px; border-radius:16px; background:var(--tr-mat); box-shadow:inset 0 0 0 2px var(--tr-vien); }
.hoi{ display:flex; align-items:center; gap:8px; height:48px; padding:0 13px; border-radius:16px; background:var(--tr-mat-2); color:var(--tr-chu-3); font-size:19px; font-weight:700; box-shadow:inset 0 0 0 2px var(--tr-vien); }
.hoi kbd{ font:800 19px var(--sans); color:var(--tr-chu); padding:2px 10px; border-radius:8px; background:var(--tr-mat-2); box-shadow:inset 0 0 0 2px var(--tr-vien); }
.chinh{ display:flex; align-items:center; gap:12px; height:60px; padding:0 26px; border-radius:18px; font:800 25px var(--sans); background:var(--tr-hs); color:var(--p-muc); box-shadow:0 5px 0 color-mix(in srgb, var(--tr-hs) 60%, var(--p-muc)); white-space:nowrap; }
.chinh kbd{ font:700 19px var(--sans); padding:3px 10px; border-radius:10px; background:color-mix(in srgb, var(--p-muc) 14%, transparent); }
.dong{ position:absolute; right:12px; top:12px; min-width:64px; height:44px; display:grid; place-items:center; padding:0 14px; border-radius:12px; background:var(--tr-mat-2); color:var(--tr-chu-2); font:600 15px var(--sans); opacity:.35; }

/* ── Ngọn lửa (cùng hình .bpu-lua của bảng) ── */
.lua .ngoai{ fill:var(--doi); } .lua .trong{ fill:var(--giay); fill-opacity:.85; }
.lua{ transform-origin:50% 100%; animation:lua .5s ease-in-out infinite alternate; }
@keyframes lua{ to{ transform:scaleY(1.12) translateY(-2px); } }

/* ── Chung: huy hiệu hạng, ô đội ── */
.hc{ flex:none; display:grid; place-items:center; width:46px; height:46px; border-radius:50%; font-size:24px; font-weight:800; color:var(--p-muc); }
.hc.h1{ background:var(--tr-sao); box-shadow:0 0 22px color-mix(in srgb, var(--tr-sao) 55%, transparent); }
.hc.h2{ background:var(--tr-chieu-the); }
.hc.h3{ background:var(--tr-chu-y); }
.hc.hx{ background:transparent; color:var(--tr-chu-3); box-shadow:inset 0 0 0 2px var(--tr-vien); }
.ky{ display:inline-grid; place-items:center; min-width:46px; height:30px; padding:0 8px; border-radius:9px; font-size:18px; font-weight:800; color:var(--doi); background:color-mix(in srgb, var(--doi) 18%, transparent); box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--doi) 55%, transparent); }
.len{ font-size:22px; font-weight:800; color:var(--tr-tin); white-space:nowrap; }
.cong{ display:inline-flex; align-items:center; padding:4px 14px; border-radius:12px; background:var(--giay); color:var(--tr-chieu-chu); font-weight:800; white-space:nowrap; }
.nhan-muc{ font-size:24px; font-weight:800; letter-spacing:.01em; color:var(--tr-chu-3); }

/* ── Thẻ tên em (dải đáy) — trạng thái bằng HÌNH + CHỮ, không chỉ bằng màu ── */
.ten-em{ position:relative; display:flex; align-items:center; justify-content:center; gap:10px; min-width:0; height:60px; padding:0 26px 0 16px; border-radius:14px; font-size:27px; font-weight:600; color:var(--tr-chu-3);
  box-shadow:inset 0 0 0 2px var(--tr-vien); white-space:nowrap; }
.ten-em > span{ min-width:0; overflow:hidden; text-overflow:ellipsis; }
.ten-em::before{ content:""; position:absolute; left:0; top:12px; bottom:12px; width:5px; border-radius:0 4px 4px 0; background:var(--doi); opacity:.35; }
.ten-em .dau{ position:absolute; right:6px; top:6px; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; }
.ten-em.gui{ color:var(--tr-chu); font-weight:800; background:color-mix(in srgb, var(--doi) 20%, var(--tr-mat)); box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--doi) 55%, transparent); }
.ten-em.gui::before{ opacity:1; }
.ten-em.gui .dau{ background:var(--giay); }
.ten-em.gui .dau svg{ width:15px; height:15px; stroke:var(--p-muc); stroke-width:3.4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ten-em.vua{ box-shadow:inset 0 0 0 3px var(--giay), 0 0 26px color-mix(in srgb, var(--doi) 60%, transparent); }
.ten-em.roi{ color:var(--tr-chu); box-shadow:inset 0 0 0 3px var(--tr-sai); background:color-mix(in srgb, var(--tr-sai) 10%, transparent); }
.ten-em.roi::before{ opacity:.35; }
.ten-em .the-roi{ position:absolute; top:-15px; right:10px; padding:1px 10px; border-radius:8px; background:var(--tr-sai); color:var(--giay); font-size:16px; font-weight:800; }
.ten-em .hc{ position:absolute; right:5px; top:5px; width:30px; height:30px; font-size:17px; }

/* ── Tên «bay» vào đội (vừa gửi) ── */
.bay{ position:absolute; z-index:6; display:flex; align-items:center; gap:10px; height:54px; padding:0 18px 0 14px; border-radius:999px; font-size:28px; font-weight:800;
  background:color-mix(in srgb, var(--doi) 30%, var(--tr-mat)); box-shadow:inset 0 0 0 3px var(--giay), 0 0 40px color-mix(in srgb, var(--doi) 70%, transparent); white-space:nowrap; }
.bay svg{ width:26px; height:34px; }
.bay.mo{ opacity:.45; transform:scale(.86); }
.vet{ position:absolute; inset:0; width:1920px; height:1080px; pointer-events:none; z-index:5; }
.vet path{ fill:none; stroke-width:4; stroke-linecap:round; stroke-dasharray:2 14; }
.sao{ position:absolute; width:26px; height:26px; fill:var(--giay); z-index:6; }

/* ═════════ PHƯƠNG ÁN A · THÁP LỬA ═════════ */
.A-dai{ position:absolute; left:40px; top:112px; width:1210px; height:710px; }
.A-cot{ position:absolute; top:0; width:280px; height:710px; margin-left:-140px; --doi:var(--p-cam); }
.A-ong{ position:absolute; left:50px; width:180px; top:56px; height:470px; border-radius:22px 22px 90px 90px; background:color-mix(in srgb, var(--tr-mat) 70%, transparent);
  box-shadow:inset 0 0 0 3px var(--tr-vien-2); overflow:hidden; }
.A-ong::after{ content:""; position:absolute; left:18px; top:30px; bottom:90px; width:10px; border-radius:6px; background:linear-gradient(var(--tr-vien-2), transparent); opacity:.7; } /* vệt sáng thuỷ tinh */
.A-vach{ position:absolute; right:14px; height:3px; border-radius:2px; background:var(--tr-vien); }
.A-day{ position:absolute; left:0; right:0; bottom:0; border-radius:0 0 90px 90px;
  background:linear-gradient(to top, color-mix(in srgb, var(--doi) 70%, var(--tr-chieu-bang)), color-mix(in srgb, var(--doi) 92%, var(--giay)) ); }
.A-day::before{ content:""; position:absolute; left:0; right:0; top:0; height:14px; background:color-mix(in srgb, var(--doi) 60%, var(--giay)); opacity:.6; }
.A-bot{ position:absolute; border-radius:50%; background:var(--giay); opacity:.35; }
.A-cu{ position:absolute; left:50px; width:180px; height:0; border-top:3px dashed color-mix(in srgb, var(--giay) 75%, transparent); z-index:4; }
.A-cu span{ position:absolute; right:10px; top:6px; padding:1px 10px; border-radius:8px; background:color-mix(in srgb, var(--giay) 88%, transparent); color:var(--tr-chieu-chu); font-size:18px; font-weight:800; white-space:nowrap; }
.A-lua{ position:absolute; left:50%; width:116px; height:162px; margin-left:-58px; z-index:3; filter:drop-shadow(0 0 26px var(--doi)); }
.A-lua svg{ width:100%; height:100%; }
.A-cot.dan .A-ong{ box-shadow:inset 0 0 0 3px color-mix(in srgb, var(--doi) 80%, var(--giay)), 0 0 70px color-mix(in srgb, var(--doi) 45%, transparent); }
.A-cot.dan .A-lua{ width:140px; height:196px; margin-left:-70px; }
.A-chan{ position:absolute; left:0; right:0; top:540px; display:grid; justify-items:center; gap:2px; text-align:center; }
.A-chan .t{ display:flex; align-items:center; gap:12px; font-size:30px; font-weight:800; }
.A-chan .t i{ display:grid; place-items:center; width:42px; height:42px; border-radius:50%; background:var(--doi); color:var(--p-muc); font-style:normal; font-size:18px; font-weight:800; }
.A-chan b{ font-size:64px; font-weight:800; line-height:1.05; letter-spacing:-.01em; white-space:nowrap; }
.A-chan b small{ font-size:28px; font-weight:700; color:var(--tr-chu-2); margin-left:6px; }
.A-chan .phu{ font-size:23px; font-weight:700; color:var(--tr-chu-2); white-space:nowrap; }
.dau-bang{ display:inline-flex; align-items:center; gap:8px; padding:4px 16px; border-radius:999px; background:var(--giay); color:var(--tr-chieu-chu); font-size:23px; font-weight:800; white-space:nowrap; box-shadow:0 0 30px color-mix(in srgb, var(--doi) 70%, transparent); }
.A-chan .cong{ margin-top:4px; font-size:26px; }
.A-noi{ position:absolute; left:50%; transform:translateX(-50%); z-index:5; font-size:26px; padding:6px 20px; box-shadow:0 0 40px color-mix(in srgb, var(--doi) 80%, transparent); }
.A-kich{ margin-top:-4px; text-align:center; padding:9px 16px; border-radius:18px; background:var(--tr-sao); color:var(--p-muc); font-size:25px; font-weight:800; white-space:nowrap; box-shadow:0 0 50px color-mix(in srgb, var(--tr-sao) 60%, transparent); }

.A-phai{ position:absolute; left:1290px; top:112px; width:590px; height:710px; display:flex; flex-direction:column; gap:14px; }
.the{ border-radius:24px; background:var(--tr-mat); box-shadow:inset 0 0 0 2px var(--tr-vien); }
.A-dem{ padding:14px 28px 20px; }
.A-dem .so{ display:flex; align-items:baseline; gap:8px; font-size:34px; color:var(--tr-chu-2); white-space:nowrap; }
.A-dem .so b{ font-size:96px; line-height:1; font-weight:800; color:var(--tr-chu); letter-spacing:-.02em; }
.A-dem .so .tren2{ font-size:44px; font-weight:800; color:var(--tr-chu); }
.thanh-o{ display:grid; gap:6px; margin-top:12px; }
.thanh-o i{ height:16px; border-radius:5px; background:var(--tr-mat-3); }
.thanh-o i.c{ background:var(--tr-tin); box-shadow:0 0 12px color-mix(in srgb, var(--tr-tin) 50%, transparent); }
.bv{ padding:14px 20px 12px; display:grid; gap:6px; }
.bv .dau, .nhanh .dau{ display:flex; align-items:baseline; justify-content:space-between; padding:0 6px 2px; }
.hang{ display:grid; grid-template-columns:46px minmax(0,1fr) auto 104px 64px; align-items:center; gap:14px; height:54px; padding:0 6px; border-radius:14px; }
.hang .t{ font-size:31px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hang .d{ font-size:31px; font-weight:800; text-align:right; }
.bv .hang:nth-child(2){ background:color-mix(in srgb, var(--tr-sao) 10%, transparent); }
.chuoi{ display:flex; align-items:center; gap:16px; padding:12px 22px; }
.chuoi .so-c{ flex:none; display:grid; place-items:center; width:60px; height:60px; border-radius:16px; background:var(--giay); color:var(--tr-chieu-chu); font-size:34px; font-weight:800; }
.chuoi .c2{ font-size:30px; font-weight:800; white-space:nowrap; }
.chuoi .c2 span{ font-weight:600; color:var(--tr-chu-2); }
/* mở đáp án (A) */
.A-da{ display:flex; align-items:center; gap:22px; padding:12px 26px; }
.A-da .chu-da{ display:grid; place-items:center; width:80px; height:80px; border-radius:22px; background:var(--tr-dung); color:var(--p-muc); font-size:54px; font-weight:800; box-shadow:0 0 40px color-mix(in srgb, var(--tr-dung) 45%, transparent); }
.A-da .x2{ font-size:34px; color:var(--tr-chu-2); white-space:nowrap; } .A-da .x2 b{ font-size:56px; font-weight:800; color:var(--tr-chu); }
.nhanh{ padding:14px 20px 12px; display:grid; gap:6px; box-shadow:inset 0 0 0 3px color-mix(in srgb, var(--tr-sao) 55%, transparent), 0 0 40px color-mix(in srgb, var(--tr-sao) 14%, transparent); }
.nhanh .hang{ grid-template-columns:46px minmax(0,1fr) auto 140px; }
.mo-dap .A-phai .hang{ height:50px; } .mo-dap .A-phai{ gap:12px; }

/* Dải tên A: 4 nhóm theo đội */
.A-dai-ten{ position:absolute; left:40px; right:40px; top:842px; height:206px; display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:20px; }
.A-nhom{ display:grid; grid-template-rows:auto 1fr; gap:10px; padding:12px 14px 14px; border-radius:22px; background:color-mix(in srgb, var(--tr-mat) 60%, transparent); box-shadow:inset 0 3px 0 var(--doi), inset 0 0 0 2px var(--tr-vien); }
.A-nhom .dau{ display:flex; align-items:center; gap:10px; padding:0 4px; font-size:22px; font-weight:800; color:var(--tr-chu-2); }
.A-nhom .dau i{ width:14px; height:14px; border-radius:50%; background:var(--doi); }
.A-nhom .dau span{ margin-left:auto; color:var(--tr-chu-3); font-weight:700; }
.A-nhom .luoi{ display:grid; grid-template-columns:1fr 1fr; gap:10px; align-content:start; }

/* ═════════ PHƯƠNG ÁN B · ĐƯỜNG ĐUA ═════════ */
.B-duong{ position:absolute; left:40px; top:118px; width:1840px; height:400px; }
.B-lan{ position:absolute; left:0; width:1840px; height:88px; --doi:var(--p-cam); }
.B-nhan{ position:absolute; left:0; top:0; width:250px; height:88px; display:flex; align-items:center; gap:14px; }
.B-nhan i{ flex:none; display:grid; place-items:center; width:70px; height:70px; border-radius:50%; background:var(--doi); color:var(--p-muc); font-style:normal; font-size:26px; font-weight:800; }
.B-nhan b{ display:block; font-size:32px; font-weight:800; line-height:1.1; }
.B-nhan small{ display:flex; align-items:center; gap:6px; font-size:21px; font-weight:700; color:var(--tr-chu-3); white-space:nowrap; }
.B-nhan small u{ width:12px; height:12px; border-radius:50%; box-shadow:inset 0 0 0 2px var(--tr-vien-2); }
.B-nhan small u.c{ background:var(--giay); box-shadow:none; }
.B-ray{ position:absolute; left:262px; top:0; width:1330px; height:88px; border-radius:48px; background:var(--tr-mat); box-shadow:inset 0 0 0 2px var(--tr-vien); overflow:hidden; }
.B-ray .k{ position:absolute; top:22px; bottom:22px; width:2px; background:var(--tr-vien); }
.B-vet{ position:absolute; left:0; top:0; bottom:0; border-radius:48px; background:linear-gradient(to right, transparent, color-mix(in srgb, var(--doi) 22%, transparent) 40%, color-mix(in srgb, var(--doi) 62%, transparent)); }
.B-ma{ position:absolute; top:4px; width:80px; height:80px; margin-left:-40px; border-radius:50%; border:3px dashed color-mix(in srgb, var(--giay) 55%, transparent); z-index:1; }
.B-lua{ position:absolute; top:-10px; width:72px; height:100px; margin-left:-36px; z-index:3; filter:drop-shadow(0 0 22px var(--doi)); }
.B-lua svg{ width:100%; height:100%; }
.B-so{ position:absolute; top:0; height:88px; display:flex; align-items:center; gap:12px; z-index:3; font-size:40px; font-weight:800; white-space:nowrap; }
.B-so small{ font-size:24px; font-weight:700; color:var(--tr-chu-2); margin-left:-4px; }
.B-so .cong{ font-size:24px; }
.B-ben{ position:absolute; left:1612px; top:0; width:228px; height:88px; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; gap:4px; }
.B-ben .hg{ font-size:26px; font-weight:800; color:var(--tr-chu-2); }
.B-ben .cach{ font-size:24px; font-weight:700; color:var(--tr-chu-2); white-space:nowrap; }
.B-ben .dau-bang{ display:inline-flex; align-items:center; gap:8px; padding:5px 16px; border-radius:999px; background:var(--giay); color:var(--tr-chieu-chu); font-size:22px; font-weight:800; white-space:nowrap; box-shadow:0 0 30px color-mix(in srgb, var(--doi) 70%, transparent); }
.B-lan.dan .B-ray{ box-shadow:inset 0 0 0 3px color-mix(in srgb, var(--doi) 80%, var(--giay)), 0 0 60px color-mix(in srgb, var(--doi) 40%, transparent); }
.B-lan.dan .B-lua{ width:86px; height:120px; margin-left:-43px; top:-20px; }

.B-duoi{ position:absolute; left:40px; top:540px; width:1840px; height:290px; display:grid; grid-template-columns:450px 790px minmax(0,1fr); gap:24px; }
.B-dem{ display:flex; align-items:center; gap:26px; padding:0 28px; }
.B-dem svg{ flex:none; width:210px; height:210px; }
.B-dem .vong-nen{ fill:none; stroke:var(--tr-mat-3); stroke-width:16; }
.B-dem .vong{ fill:none; stroke:var(--tr-tin); stroke-width:16; stroke-linecap:round; transform:rotate(-90deg); transform-origin:50% 50%; }
.B-dem .ss{ font:800 64px var(--sans); fill:var(--tr-chu); }
.B-dem .ss2{ font:700 30px var(--sans); fill:var(--tr-chu-2); }
.B-dem .nh{ font-size:28px; font-weight:700; line-height:1.3; color:var(--tr-chu-2); }
.B-dem .nh b{ display:block; font-size:40px; color:var(--tr-chu); font-weight:800; white-space:nowrap; }
.B-buc{ position:relative; }
.B-buc .nhan-muc{ position:absolute; left:4px; top:0; }
.B-cot{ position:absolute; bottom:0; width:248px; border-radius:26px 26px 18px 18px; display:grid; grid-auto-rows:max-content; justify-items:center; align-content:start; gap:8px; padding:40px 12px 14px;
  background:linear-gradient(180deg, color-mix(in srgb, var(--m) 30%, var(--tr-mat)), var(--tr-mat) 70%); box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--m) 60%, transparent); }
.B-cot .hc{ position:absolute; top:-26px; width:56px; height:56px; font-size:30px; box-shadow:0 0 0 5px var(--tr-nen); }
.B-cot .t{ max-width:100%; min-height:44px; font-size:34px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.B-cot .d{ font-size:30px; font-weight:800; }
.B-cot .dong-d{ display:flex; align-items:baseline; gap:10px; }
.B-cot .d small{ font-size:20px; color:var(--tr-chu-2); font-weight:700; }
.B-cot .cong{ font-size:26px; }
.B-ds{ padding:12px 22px; display:grid; gap:4px; align-content:start; overflow:hidden; }
.B-ds .hang{ height:42px; grid-template-columns:40px minmax(0,1fr) auto 96px 56px; }
.B-ds .hang .t, .B-ds .hang .d{ font-size:28px; }
.B-ds .hang:first-of-type{ background:none; }
.B-ds .hc{ width:38px; height:38px; font-size:20px; }
.B-da{ display:grid; align-content:center; gap:14px; padding:18px 26px; }
.B-da .hang1{ display:flex; align-items:center; gap:20px; }
.B-da .chu-da{ display:grid; place-items:center; width:96px; height:96px; border-radius:24px; background:var(--tr-dung); color:var(--p-muc); font-size:62px; font-weight:800; }
.B-da .x2{ font-size:30px; color:var(--tr-chu-2); white-space:nowrap; } .B-da .x2 b{ display:block; font-size:54px; font-weight:800; color:var(--tr-chu); line-height:1.05; }
.B-da .kich{ padding:8px 16px; border-radius:14px; background:var(--tr-sao); color:var(--p-muc); font-size:24px; font-weight:800; line-height:1.25; text-align:center; }
.B-chu-giai{ position:absolute; right:40px; top:514px; font-size:20px; font-weight:600; color:var(--tr-chu-3); white-space:nowrap; }

/* Dải tên B: 2 hàng, mỗi hàng 2 đội, đầu mỗi đội là ô kí hiệu */
.B-dai-ten{ position:absolute; left:40px; right:40px; top:856px; display:grid; gap:14px; }
.B-hang{ display:grid; grid-template-columns:1fr 1fr; gap:28px; }
.B-doi{ display:grid; grid-template-columns:62px repeat(4, minmax(0,1fr)); gap:10px; align-items:center; }
.B-doi > i{ display:grid; place-items:center; width:62px; height:84px; border-radius:16px; background:color-mix(in srgb, var(--doi) 22%, transparent); box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--doi) 60%, transparent); color:var(--doi); font-style:normal; font-size:24px; font-weight:800; line-height:1.05; text-align:center; }
.B-doi > i small{ display:block; font-size:16px; color:var(--tr-chu-2); font-weight:700; }
.B-doi .ten-em{ height:84px; justify-content:center; padding:0 10px; font-size:30px; }
.B-doi .ten-em .dau{ position:absolute; right:8px; top:8px; width:24px; height:24px; margin:0; }
.B-doi .ten-em .dau svg{ width:15px; height:15px; }
.B-doi .ten-em .hc{ position:absolute; right:6px; top:6px; margin:0; width:30px; height:30px; font-size:17px; }

/* Ghi chú vùng (chỉ ở bản vẽ, ?ghi=1) */
.ghi{ display:none; }
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; } }
.chup *{ animation:none !important; transition:none !important; }
</style>
</head>
<body>
<div class="san" id="san"></div>
<script>
// Phông: Be Vietnam Pro từ @fontsource trong node_modules (bản vẽ mở trong repo); thiếu thì rơi về Noto Sans.
(() => {
  const goc = '../../node_modules/@fontsource/be-vietnam-pro/files/be-vietnam-pro-'
  const VI = 'U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB'
  const LA = 'U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD'
  let css = ''
  for (const w of [500, 600, 700, 800]) for (const [bo, r] of [['vietnamese', VI], ['latin', LA]])
    css += `@font-face{font-family:'Be Vietnam Pro';font-style:normal;font-weight:${w};font-display:block;src:url(${goc}${bo}-${w}-normal.woff2) format('woff2');unicode-range:${r};}`
  const s = document.createElement('style'); s.textContent = css; document.head.prepend(s)
})()

const thamSo = new URLSearchParams(location.search)
const [PA, TT] = (location.hash.slice(1) || 'A-lam').split('-')
const MO = TT === 'mo'
if (thamSo.get('chup')) document.documentElement.classList.add('chup')
if (MO) document.documentElement.classList.add('mo-dap')

// ── DỮ LIỆU GIẢ (đúng hình viewBang: ds[].{ten,doi,kj,chuoi,vao}, luot.{daGui,ketQua{dung,nhanh,kj}}, doiThuong, soDoi, roiNay) ──
const DOI = [
  { ten: 'Natri', ky: 'Na', mau: 'var(--p-cam)' }, { ten: 'Kali', ky: 'K', mau: 'var(--p-tim-2)' },
  { ten: 'Đồng', ky: 'Cu', mau: 'var(--p-xanh)' }, { ten: 'Canxi', ky: 'Ca', mau: 'var(--p-do)' },
]
// ten, doi, kJ trước khi mở, kJ sau khi mở, đã gửi lúc chụp «đang làm», ketQua.nhanh (1..3) khi mở
const DS = [
  ['Lan Anh', 0, 520, 694, 1, 3], ['Quốc Bảo', 0, 410, 570, 1], ['Tâm', 0, 300, 330, 0], ['Hà My', 0, 450, 600, 1],
  ['Minh Khôi', 1, 480, 657, 1, 2], ['Bảo Ngọc', 1, 560, 740, 1, 1], ['Gia Huy', 1, 330, 498, 1], ['Kiệt', 1, 250, 412, 1],
  ['Thảo', 2, 390, 548, 1], ['Ngọc Hân', 2, 440, 610, 1], ['Đăng', 2, 280, 420, 0], ['Minh Anh', 2, 360, 505, 0],
  ['Khánh Linh', 3, 430, 593, 1], ['Hân', 3, 350, 380, 1], ['Duy', 3, 270, 300, 0], ['Phương', 3, 330, 360, 0],
].map(([ten, doi, kj0, kj1, gui, nhanh]) => ({ ten, doi, kj0, kj1, gui: !!gui, nhanh: nhanh || null }))
const THUONG0 = [160, 100, 140, 110], THUONG1 = [160, 100, 140, 310] // Canxi: Khánh Linh lên bảng Đạt +200
const ROI = MO ? [] : ['Duy']                 // roiNay — mở đáp án thì rỗng
const VUA = MO ? null : 'Ngọc Hân'            // vừa gửi (bảng so hai view liên tiếp)
const VUA_DAP = MO ? null : 'Gia Huy'         // vừa chạm đội (mờ dần)
const GUI = (e) => (MO ? e.ten !== 'Phương' : e.gui)
const LEN_TRUOC = { 'Minh Khôi': 2, 'Ngọc Hân': 1, 'Khánh Linh': 3 } // lên hạng so với lượt trước (chỉ mũi tên LÊN)
const NHANH = { 1: 180, 2: 177, 3: 174 } // ketQua[sbd].kj của 3 em nhanh nhất: 100 đúng + nhanh + 30 năng lượng hoạt hoá

const kj = (e) => (MO ? e.kj1 : e.kj0)
const diemDoi = (d, mo = MO) => DS.filter((e) => e.doi === d).reduce((s, e) => s + (mo ? e.kj1 : e.kj0), 0) + (mo ? THUONG1 : THUONG0)[d]
const so = (n) => n.toLocaleString('vi-VN')
const xepDoi = (mo = MO) => [0, 1, 2, 3].map((d) => ({ d, t: diemDoi(d, mo) })).sort((a, b) => b.t - a.t)
const xepEm = (mo = MO) => [...DS].sort((a, b) => (mo ? b.kj1 - a.kj1 : b.kj0 - a.kj0))
const lenHang = (e) => {
  if (!MO) return LEN_TRUOC[e.ten] || 0
  const t = xepEm(false).indexOf(e), s = xepEm(true).indexOf(e)
  return t > s ? t - s : 0
}
const coMat = DS.length, daGui = DS.filter(GUI).length

const lua = (cls = '') => `<svg class="lua ${cls}" viewBox="0 0 40 56" aria-hidden="true"><path class="ngoai" d="M20 1C25 12 37 21 37 36a17 17 0 0 1-34 0C3 27 10 21 13 11c2 6 4 9 7 11C21 14 19 8 20 1Z"/><path class="trong" d="M20 26c3 5 8 8 8 14a8 8 0 0 1-16 0c0-5 4-8 5-12 1 2 2 3 3 4z"/></svg>`
const dauTick = '<svg viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9"/></svg>'
const saoSvg = (x, y, s = 1) => `<svg class="sao" style="left:${x}px;top:${y}px;transform:scale(${s})" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/></svg>`

function thanhTren() {
  const len = MO ? `<div class="pill" style="box-shadow:inset 0 0 0 3px var(--p-do)">Lên bảng: Khánh Linh · Đạt · Đội Canxi +200</div>` : ''
  const phai = MO
    ? `<div class="hoi"><kbd>?</kbd>Phím</div><div class="chinh">Câu tiếp<kbd>→</kbd></div>`
    : `<div class="gio">0:42</div><div class="hoi"><kbd>?</kbd>Phím</div><div class="chinh">Lên bảng<kbd>L</kbd></div>`
  return `<div class="tren">${lua('logo')}<div class="pill">Lượt 3</div><span class="chip">Trắc nghiệm</span>${len}
    <div class="lop">12A1<span class="ma">Mã <b>842517</b></span></div><div class="gian"></div>${phai}</div><div class="dong">Đóng</div>`
}

function theTen(e, cls = '') {
  const roi = ROI.includes(e.ten), gui = GUI(e)
  let k = 'ten-em ' + cls
  if (gui) k += ' gui'
  if (roi) k += ' roi'
  if (e.ten === VUA) k += ' vua'
  const dau = MO && e.nhanh ? `<span class="hc h${e.nhanh}">${e.nhanh}</span>` : gui ? `<span class="dau">${dauTick}</span>` : ''
  return `<div class="${k}" style="--doi:${DOI[e.doi].mau}"><span>${e.ten}</span>${dau}${roi ? '<b class="the-roi">Rời màn</b>' : ''}</div>`
}

function hangEm(e, i, cot) {
  const h = i < 3 ? `h${i + 1}` : 'hx', len = lenHang(e)
  return `<div class="hang"><span class="hc ${h}">${i + 1}</span><span class="t">${e.ten}</span><span class="ky" style="--doi:${DOI[e.doi].mau}">${DOI[e.doi].ky}</span><span class="d">${so(kj(e))}</span><span class="len">${len ? '▲' + len : ''}</span></div>`
}

// ═════════ A · THÁP LỬA ═════════
function veA() {
  const thu = xepDoi(), dan = thu[0].d, MAX = 3500, H = 470, TOP = 56
  const X = [151, 453, 756, 1058] // tâm 4 tháp trong vùng 1210 px
  const dauTruoc = xepDoi(false)[0].d
  let cot = ''
  for (let d = 0; d < 4; d++) {
    const t = diemDoi(d), t0 = diemDoi(d, false), h = Math.round((t / MAX) * H), h0 = Math.round((t0 / MAX) * H)
    const hang = thu.findIndex((x) => x.d === d), tren = hang ? thu[hang - 1].t - t : 0
    const bung = MO && d === dan && dauTruoc !== d
    const phu = MO
      ? `<span class="cong">+${so(t - t0)} kJ lượt này</span>`
      : (hang === 0 ? '<span class="dau-bang">Dẫn đầu</span>' : `<span class="phu">kém hạng trên ${so(tren)} kJ</span>`)
    const vach = Array.from({ length: 9 }, (_, i) => `<i class="A-vach" style="top:${40 + i * 44}px;width:${i % 2 ? 14 : 24}px"></i>`).join('')
    const bot = [[40, 30, 10], [110, 70, 7], [70, 120, 12], [130, 160, 6], [52, 200, 8], [100, 250, 9]].filter(([, y]) => y < h - 24).map(([x, y, r]) => `<i class="A-bot" style="left:${x}px;bottom:${y}px;width:${r}px;height:${r}px"></i>`).join('')
    const lh = d === dan ? 196 : 162, mat = TOP + H - h, top = mat - Math.round(lh * 0.9)
    cot += `<div class="A-cot${d === dan ? ' dan' : ''}" style="left:${X[d]}px;--doi:${DOI[d].mau}">
      <div class="A-ong">${vach}<div class="A-day" style="height:${h}px">${bot}</div></div>
      ${MO ? `<div class="A-cu" style="top:${TOP + H - h0}px"><span>trước ${so(t0)}</span></div>` : ''}
      <div class="A-lua" style="top:${top}px">${lua()}</div>${bung ? `<span class="dau-bang A-noi" style="top:${Math.max(-4, top - 30)}px">Bứt lên dẫn đầu</span>` : ''}
      <div class="A-chan"><div class="t"><i>${DOI[d].ky}</i>${DOI[d].ten}</div><b>${so(t)}<small>kJ</small></b>${phu}</div>
    </div>`
  }
  let sao = ''
  if (MO) { const x = X[dan]; sao = saoSvg(x - 140, 160) + saoSvg(x + 110, 120, 0.8) + saoSvg(x + 104, 250, 1.2) + saoSvg(x - 124, 300, 0.7) }
  let bay = ''
  if (!MO) {
    const nh = DS.find((e) => e.ten === VUA), gh = DS.find((e) => e.ten === VUA_DAP)
    const xD = 40 + X[2], yD = 112 + TOP + H - Math.round((diemDoi(2) / MAX) * H) - 60
    bay = `<svg class="vet"><path d="M 1296 896 C 1100 885, 930 870, 932 730 S 900 ${yD + 120}, ${xD + 30} ${yD + 60}" stroke="var(--p-xanh)"/></svg>
      <div class="bay" style="left:842px;top:560px;--doi:${DOI[nh.doi].mau}">${lua()}${nh.ten}</div>
      <div class="bay mo" style="left:${40 + X[1] - 90}px;top:${112 + TOP + H - Math.round((diemDoi(1) / MAX) * H) - 230}px;--doi:${DOI[gh.doi].mau}">${lua()}${gh.ten}</div>`
  }
  const xep = xepEm()
  let phai
  if (!MO) {
    const chuoi = [...DS].sort((a, b) => b.kj0 - a.kj0)[0]
    phai = `<div class="the A-dem"><div class="so"><b>${daGui}</b><span class="tren2">/${coMat}</span> em đã gửi</div>
        <div class="thanh-o" style="grid-template-columns:repeat(${coMat},1fr)">${Array.from({ length: coMat }, (_, i) => `<i class="${i < daGui ? 'c' : ''}"></i>`).join('')}</div></div>
      <div class="the bv"><div class="dau"><span class="nhan-muc">Bảng vàng kJ</span><span class="nhan-muc">cả buổi</span></div>${xep.slice(0, 6).map(hangEm).join('')}</div>
      <div class="the chuoi"><span class="so-c">5</span><div><div class="nhan-muc">Chuỗi đúng dài nhất</div><div class="c2">${chuoi.ten} <span>· 5 câu đúng liền</span></div></div></div>`
  } else {
    const nhanh = DS.filter((e) => e.nhanh).sort((a, b) => a.nhanh - b.nhanh)
    phai = `<div class="the A-da"><span class="chu-da">B</span><div><div class="nhan-muc">Đáp án</div><div class="x2"><b>12</b>/${coMat} em đúng</div></div></div>
      <div class="A-kich">Vượt năng lượng hoạt hoá · cả lớp +30 kJ</div>
      <div class="the nhanh"><div class="dau"><span class="nhan-muc">Nhanh và đúng nhất</span></div>${nhanh.map((e) => `<div class="hang"><span class="hc h${e.nhanh}">${e.nhanh}</span><span class="t">${e.ten}</span><span class="ky" style="--doi:${DOI[e.doi].mau}">${DOI[e.doi].ky}</span><span class="d"><span class="cong" style="font-size:26px">+${NHANH[e.nhanh]} kJ</span></span></div>`).join('')}</div>
      <div class="the bv"><div class="dau"><span class="nhan-muc">Bảng vàng kJ</span><span class="nhan-muc">cả buổi</span></div>${xep.slice(0, 4).map(hangEm).join('')}</div>`
  }
  const nhom = DOI.map((dd, d) => { const th = DS.filter((e) => e.doi === d), g = th.filter(GUI).length
    return `<div class="A-nhom" style="--doi:${dd.mau}"><div class="dau"><i></i>${dd.ten}<span>${g === th.length ? 'đủ đội' : ''} ${g}/${th.length} đã gửi</span></div><div class="luoi">${th.map((e) => theTen(e)).join('')}</div></div>` }).join('')
  return `${thanhTren()}
    <div class="A-dai">${cot}${sao}</div>${bay}
    <div class="A-phai">${phai}</div>
    <div class="A-dai-ten">${nhom}</div>`
}

// ═════════ B · ĐƯỜNG ĐUA ═════════
function veB() {
  const thu = xepDoi(), dan = thu[0].d, dauTruoc = xepDoi(false)[0].d
  const vi = (t) => 70 + Math.round((t / 2700) * 1000) // vị trí ngọn lửa trên ray 1330 px
  let lan = ''
  for (let d = 0; d < 4; d++) {
    const t = diemDoi(d), t0 = diemDoi(d, false), hang = thu.findIndex((x) => x.d === d), x = vi(t), x0 = vi(t0)
    const thanh = DS.filter((e) => e.doi === d), gui = thanh.filter(GUI).length
    const k = Array.from({ length: 9 }, (_, i) => `<i class="k" style="left:${133 * (i + 1)}px"></i>`).join('')
    const ben = MO
      ? (d === dan && dauTruoc !== d ? '<span class="dau-bang">Bứt lên dẫn đầu</span>' : `<span class="hg">Hạng ${hang + 1}</span>`)
      : (hang === 0 ? '<span class="dau-bang">Dẫn đầu</span>' : `<span class="hg">Hạng ${hang + 1}</span><span class="cach">kém ${so(thu[hang - 1].t - t)} kJ</span>`)
    lan += `<div class="B-lan${d === dan ? ' dan' : ''}" style="top:${d * 102}px;--doi:${DOI[d].mau}">
      <div class="B-nhan"><i>${DOI[d].ky}</i><div><b>${DOI[d].ten}</b><small>${thanh.map((e) => `<u class="${GUI(e) ? 'c' : ''}"></u>`).join('')}&nbsp;${gui}/${thanh.length} đã gửi</small></div></div>
      <div class="B-ray">${k}<div class="B-vet" style="width:${x + 20}px"></div>${MO ? `<i class="B-ma" style="left:${x0}px"></i>` : ''}
        <div class="B-lua" style="left:${x}px">${lua()}</div>
        <div class="B-so" style="left:${x + (d === dan ? 60 : 50)}px">${so(t)}<small>kJ</small>${MO ? `<span class="cong">+${so(t - t0)}</span>` : ''}</div></div>
      <div class="B-ben">${ben}</div></div>`
  }
  let bay = ''
  if (!MO) {
    const nh = DS.find((e) => e.ten === VUA), gh = DS.find((e) => e.ten === VUA_DAP)
    bay = `<svg class="vet"><path d="M 672 ${118 + 2 * 102 + 44} L ${40 + 262 + vi(diemDoi(2)) - 50} ${118 + 2 * 102 + 44}" stroke="var(--p-xanh)"/></svg>
      <div class="bay" style="left:460px;top:${118 + 2 * 102 + 17}px;--doi:${DOI[nh.doi].mau}">${lua()}${nh.ten}</div>
      <div class="bay mo" style="left:${40 + 262 + vi(diemDoi(1)) - 240}px;top:${118 + 102 + 17}px;--doi:${DOI[gh.doi].mau}">${lua()}${gh.ten}</div>`
  }
  const xep = xepEm()
  const MAU_BUC = ['var(--tr-sao)', 'var(--tr-chieu-the)', 'var(--tr-chu-y)']
  const buc = (ba, tieu, phu) => `<div class="the B-buc" style="background:none;box-shadow:none"><span class="nhan-muc">${tieu}</span>${[1, 0, 2].map((i, j) => { const e = ba[i]; if (!e) return ''
    return `<div class="B-cot" style="left:${j * 268}px;height:${[214, 248, 196][j]}px;--m:${MAU_BUC[i]}"><span class="hc h${i + 1}">${i + 1}</span><span class="t">${e.ten}</span><span class="ky" style="--doi:${DOI[e.doi].mau}">${DOI[e.doi].ten}</span><div class="dong-d">${phu(e)}</div></div>` }).join('')}</div>`
  let duoi
  if (!MO) {
    const C = 2 * Math.PI * 84
    duoi = `<div class="the B-dem"><svg viewBox="0 0 200 200"><circle class="vong-nen" cx="100" cy="100" r="84"/><circle class="vong" cx="100" cy="100" r="84" stroke-dasharray="${(C * daGui) / coMat} ${C}"/>
        <text class="ss" x="100" y="112" text-anchor="middle">${daGui}</text><text class="ss2" x="100" y="148" text-anchor="middle">/${coMat}</text></svg>
        <div class="nh"><b>em đã gửi</b>còn ${coMat - daGui} em đang làm</div></div>
      ${buc(xep.slice(0, 3), 'Bảng vàng kJ · cả buổi', (e) => `<span class="d">${so(kj(e))} <small>kJ</small></span>${lenHang(e) ? `<span class="len">▲${lenHang(e)}</span>` : ''}`)}
      <div class="the B-ds"><span class="nhan-muc" style="padding:0 6px 4px">Hạng 4 – 8</span>${xep.slice(3, 8).map((e, i) => hangEm(e, i + 3)).join('')}</div>`
  } else {
    const nhanh = DS.filter((e) => e.nhanh).sort((a, b) => a.nhanh - b.nhanh)
    duoi = `<div class="the B-da"><div class="hang1"><span class="chu-da">B</span><div class="x2"><b>12/${coMat} em</b>trả lời đúng</div></div><div class="kich">Vượt năng lượng hoạt hoá<br>cả lớp +30 kJ</div></div>
      ${buc(nhanh, 'Nhanh và đúng nhất', (e) => `<span class="cong">+${NHANH[e.nhanh]} kJ</span>`)}
      <div class="the B-ds"><span class="nhan-muc" style="padding:0 6px 4px">Bảng vàng kJ</span>${xep.slice(0, 5).map(hangEm).join('')}</div>`
  }
  const hang = [[0, 1], [2, 3]].map((cap) => `<div class="B-hang">${cap.map((d) => { const th = DS.filter((e) => e.doi === d), g = th.filter(GUI).length
    return `<div class="B-doi" style="--doi:${DOI[d].mau}"><i>${DOI[d].ky}<small>${g}/${th.length}</small></i>${th.map((e) => theTen(e)).join('')}</div>` }).join('')}</div>`).join('')
  return `${thanhTren()}<div class="B-duong">${lan}</div>${MO ? '<div class="B-chu-giai">Vòng nét đứt: chỗ đứng trước lượt này · ô trắng: kJ đội thêm lượt này</div>' : ''}${bay}<div class="B-duoi">${duoi}</div><div class="B-dai-ten">${hang}</div>`
}

const san = document.getElementById('san')
san.innerHTML = PA === 'B' ? veB() : veA()
const co = () => { const k = Math.min(innerWidth / 1920, innerHeight / 1080); san.style.transform = `translate(-50%,-50%) scale(${k})` }
co(); addEventListener('resize', co); addEventListener('hashchange', () => location.reload())
</script>
