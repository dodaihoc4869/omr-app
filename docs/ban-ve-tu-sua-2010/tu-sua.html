<!-- BẢN VẼ TỰ SỬA LỖI (20/10) — thầy: "học sinh phải cực kì hứng thú và thấy ý nghĩa với việc sửa lỗi … vẽ cho tôi xem trước khi chốt build".
     CHỈ là bản vẽ: số liệu GIẢ, chưa sửa src/. Không EXP, không điểm thưởng, không xếp hạng. Màu = đúng tên + giá trị biến chuẩn của src/styles/tokens.css (sáng + tối), không màu mới.
     Mở từng khung bằng #k=<khung>&toi=1 (xem scripts/chup-ban-ve-tu-sua-2010.mjs). -->

/* Biến chuẩn (cùng tên, cùng giá trị src/styles/tokens.css) */
:root{--nen:#f5f4ef;--the:#fffefb;--the-2:#eeeee8;--muc:#1a2332;--nhat:#505b69;--mo:#626c7b;--muc-nguoc:#fff;--phu:rgba(26,35,50,.55);--vien:#e5e7eb;--vien-dam:#d1d5db;
 --xanh:#10b981;--xanh-nen:#ecfdf5;--do:#ef4444;--do-nen:#fef2f2;--cam:#f59e0b;--cam-nen:#fffbeb;--tim:#6366f1;--tim-nen:#eef2ff;--lg-nhan:#4338ca;--gap:#dc2626;--vang-diu:#91691e;--vang-diu-nen:#f7efd9;
 --bong-1:0 1px 3px rgba(0,0,0,.06);--bong-2:0 4px 16px rgba(0,0,0,.1);
 --serif:'Noto Serif',serif;--sans:'Be Vietnam Pro','Noto Sans',system-ui,sans-serif;color-scheme:light}
:root[data-toi]{--nen:#0f1419;--the:#171d24;--the-2:#1e252e;--muc:#e8eaed;--nhat:#c2c8cf;--mo:#a6b0bc;--muc-nguoc:#0f1419;--phu:rgba(0,0,0,.6);--vien:#2a323d;--vien-dam:#3a434f;
 --xanh:#34d399;--xanh-nen:#0d2f24;--do:#f87171;--do-nen:#2f1516;--cam:#fbbf24;--cam-nen:#2d2411;--tim:#818cf8;--tim-nen:#1e1f3d;--lg-nhan:#a5b4fc;--bong-1:0 1px 3px rgba(0,0,0,.4);--bong-2:0 4px 16px rgba(0,0,0,.5);color-scheme:dark}
:root{--giay:#fff;--vang-diu:#91691e;--vang-diu-nen:#f7efd9}
:root[data-toi]{--vang-diu:#e4c47e;--vang-diu-nen:#343126}

*{box-sizing:border-box}
html,body{margin:0;background:var(--nen);color:var(--muc);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;background:none;border:0;padding:0}
h1,h2,h3,p,ol,ul{margin:0;padding:0}ol,ul{list-style:none}
.so{font-variant-numeric:tabular-nums}
.chu-nho{font-size:13px;line-height:1.5;color:var(--nhat)}
template{display:none}

/* ── Khung app học sinh ── */
.app{min-height:100dvh;display:flex;flex-direction:column}
.tren{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--vien);background:var(--nen)}
.logo{width:44px;height:44px;border-radius:12px;background:var(--muc);display:grid;place-items:center;color:var(--nen);flex:none}
.ten-app{display:none;line-height:1.2}.ten-app b{display:block;font-size:15px}.ten-app small{color:var(--nhat);font-size:12px}
.gian{flex:1}
.ava{width:44px;height:44px;border-radius:50%;background:var(--muc);color:var(--nen);display:grid;place-items:center;font-weight:600;font-size:15px}
.giua{display:flex;flex:1;min-width:0}
.ray{display:none}
.noi{flex:1;min-width:0;padding:20px 16px 112px}
.duoi{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--the);border-top:1px solid var(--vien);z-index:5}
.duoi a,.ray a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:14px;color:var(--nhat);font-size:13px;font-weight:500;min-height:48px}
.duoi a[aria-current],.ray a[aria-current]{background:var(--tim-nen);color:var(--lg-nhan);font-weight:600}
@media (min-width:1024px){
 .ten-app{display:block}.tren{padding:14px 32px}
 .ray{display:flex;flex-direction:column;gap:8px;width:208px;padding:36px 16px;flex:none}
 .ray a{flex-direction:row;gap:12px;padding:14px 16px;font-size:16px}
 .duoi{display:none}
 .noi{padding:32px 40px 56px}
}
.cot{display:grid;gap:20px;min-width:0;margin:0 auto;max-width:720px}
@media (min-width:1024px){.cot.hai{max-width:1120px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start;gap:28px}}

/* ── Chữ + nút (cùng họ với app: ht-nut-chinh / ht-nut-phu) ── */
.dau-man{display:flex;align-items:center;gap:8px;min-height:44px}
.lui{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--vien);background:var(--the)}
h1.tieu{font-size:24px;line-height:1.25;font-weight:800;letter-spacing:-.015em}
.nut-chinh{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px 20px;border-radius:16px;background:var(--lg-nhan);color:var(--muc-nguoc);font-size:17px;font-weight:700}
:root[data-toi] .nut-chinh{background:var(--tim);color:#0f1419}
.nut-vien{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 20px;border-radius:16px;border:1.5px solid var(--vang-diu);background:var(--the);color:var(--muc);font-size:17px;font-weight:700;width:100%}
.nut-chu{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 14px;color:var(--lg-nhan);font-weight:700;font-size:16px}
.the{border:1px solid var(--vien);background:var(--the);border-radius:24px;padding:18px;min-width:0}
.nhan{font-size:14px;font-weight:700;color:var(--nhat);line-height:1.35}

/* ── Biểu tượng Tự sửa lỗi (đúng hình đang dùng ở Hôm nay) ── */
.bt64{display:block;width:100%;height:100%;--bt-c:var(--cam);--bt-d:color-mix(in srgb,var(--cam) 55%,var(--vang-diu));--bt-dam:color-mix(in srgb,var(--bt-c) 62%,var(--muc));--bt-xanh:var(--xanh);--bt-do:var(--do)}
.bt64[data-sac=xanh]{--bt-c:var(--xanh);--bt-d:color-mix(in srgb,var(--xanh) 70%,var(--muc))}
.gc{--bt-c:var(--cam);--bt-d:color-mix(in srgb,var(--cam) 55%,var(--vang-diu))}.gx{--bt-c:var(--xanh);--bt-d:color-mix(in srgb,var(--xanh) 70%,var(--muc))}
.bt64-s{stop-color:color-mix(in srgb,var(--bt-c) 58%,var(--giay))}.bt64-d{stop-color:var(--bt-d)}
.bt64-b{stop-color:var(--giay);stop-opacity:.42}.bt64-b0{stop-opacity:0}
.bt-v{fill:var(--giay)}.bt-mo{opacity:.4}
.bt-n{fill:none;stroke:var(--bt-dam);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.bt-sai{stroke:var(--bt-do);stroke-width:3}.bt-dung{stroke:var(--bt-xanh);stroke-width:3.6}
.bt-go{fill:color-mix(in srgb,var(--cam) 28%,var(--giay))}.bt-ruot{fill:var(--bt-dam)}.bt-than{fill:var(--tim)}.bt-dai{fill:color-mix(in srgb,var(--tim) 35%,var(--giay))}.bt-tay{fill:color-mix(in srgb,var(--do) 45%,var(--giay))}
.bt-dam{fill:var(--bt-dam)}
.bt-sang{stroke:var(--giay)}

/* ── Ba ô việc hôm nay ── */
.o3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.o3 i{height:10px;border-radius:99px;background:var(--the-2);border:1.5px solid var(--vien-dam)}
.o3 i[data-tt=xong]{background:var(--xanh);border-color:var(--xanh)}
.o3 i[data-tt=nay]{background:var(--vang-diu-nen);border-color:var(--vang-diu)}
.hang-o3{display:flex;align-items:center;gap:12px}.hang-o3 .o3{flex:1}.hang-o3 b{font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── THẺ MỜI Ở HÔM NAY (giữ nhận diện thẻ hiện tại: nền vàng dịu, vạch trái, ô hình 60px) ── */
.moi{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:14px;padding:16px 18px;border-radius:24px;background:var(--vang-diu-nen);color:var(--muc);border:1px solid color-mix(in srgb,var(--vang-diu) 30%,var(--vien));box-shadow:inset 5px 0 0 var(--vang-diu);min-width:0}
.moi .bt{width:60px;height:60px}
.moi .chu{display:flex;flex-direction:column;gap:4px;min-width:0}
.moi h2{font-size:20px;font-weight:800;line-height:1.3;letter-spacing:-.01em;overflow-wrap:anywhere}
.moi h2 b{font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.moi .phu{font-size:14px;line-height:1.5;color:var(--nhat)}
.moi .hang-o3,.moi .nut-vien,.moi .nut-chu{grid-column:1/-1}
.moi[data-tt=xong]{background:var(--xanh-nen);border-color:color-mix(in srgb,var(--xanh) 35%,var(--vien));box-shadow:inset 5px 0 0 var(--xanh)}
.moi .nut-chu{justify-self:start;color:var(--muc);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--vien-dam)}
@media(min-width:700px){.moi{grid-template-columns:auto minmax(0,1fr) auto;gap:16px 20px;padding:18px 22px}.moi .bt{grid-row:1/3;align-self:center}.moi .hang-o3{grid-column:2}.moi .nut-vien{grid-column:3;grid-row:1/3;min-width:220px;width:auto}.moi .nut-chu{grid-column:3}}

/* Khung ngữ cảnh của Hôm nay (nền, không phải đối tượng sửa) */
.ngay{font-size:14px;color:var(--nhat)}
h1.chao{font-size:26px;line-height:1.25;font-weight:800;letter-spacing:-.01em;margin:2px 0 4px}
.hoc-tiep{display:grid;gap:12px}
.hoc-tiep .thanh{height:10px;border-radius:99px;background:var(--the-2);overflow:hidden}.hoc-tiep .thanh i{display:block;height:100%;width:50%;background:var(--lg-nhan);border-radius:99px}
:root[data-toi] .hoc-tiep .thanh i{background:var(--tim)}
.ghi-chu-khung{font-size:13px;color:var(--mo);padding:2px 4px}
.bang{display:grid;gap:22px}
.bang>div>.ghi{display:inline-block;margin:0 0 8px 4px;padding:3px 10px;border-radius:99px;background:var(--tim-nen);color:var(--lg-nhan);font-size:13px;font-weight:700}

/* ── Đường sửa một câu: 4 chặng ── */
.duong{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative}
.duong li{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative;min-width:0}
.duong li::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:3px;background:var(--vien-dam);z-index:0}
.duong li:first-child::before{display:none}
.duong li[data-tt=xong]::before,.duong li[data-tt=nay]::before{background:var(--xanh)}
.duong i{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;border:2.5px solid var(--vien-dam);background:var(--the);display:grid;place-items:center}
.duong li[data-tt=xong] i{background:var(--xanh);border-color:var(--xanh);color:#fff}
.duong li[data-tt=nay] i{border-color:var(--vang-diu);background:var(--vang-diu-nen);box-shadow:0 0 0 4px color-mix(in srgb,var(--vang-diu) 18%,transparent)}
.duong span{font-size:13px;line-height:1.35;color:var(--nhat);font-weight:500;padding:0 2px}
.duong li[data-tt=nay] span{color:var(--muc);font-weight:700}
:root[data-toi] .duong li[data-tt=xong] i{color:#0f1419}

/* Đường thu nhỏ trên thẻ câu: 4 chấm */
.cham4{display:inline-flex;gap:5px;align-items:center}
.cham4 i{width:9px;height:9px;border-radius:50%;background:var(--the-2);border:1.5px solid var(--vien-dam)}
.cham4 i[data-tt=xong]{background:var(--xanh);border-color:var(--xanh)}
.cham4 i[data-tt=nay]{background:var(--vang-diu-nen);border-color:var(--vang-diu);box-shadow:0 0 0 2px color-mix(in srgb,var(--vang-diu) 22%,transparent)}

/* ── Màn Tự sửa lỗi: Việc hôm nay ── */
.hom-nay{display:grid;gap:14px;padding:20px;border-radius:28px;background:var(--vang-diu-nen);border:1px solid color-mix(in srgb,var(--vang-diu) 30%,var(--vien));box-shadow:inset 5px 0 0 var(--vang-diu)}
.hom-nay>.dau{display:flex;align-items:center;gap:14px}
.hom-nay .bt{width:56px;height:56px;flex:none}
.hom-nay h2{font-size:22px;line-height:1.25;font-weight:800;letter-spacing:-.015em}
.hom-nay .phu{font-size:14px;color:var(--nhat);line-height:1.5}
.ds{display:grid;gap:10px}
.cau{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 12px;min-height:76px;padding:14px 16px;border-radius:18px;border:1px solid var(--vien);background:var(--the);text-align:left;width:100%}
.cau .ten{font-size:16px;font-weight:750;line-height:1.35;overflow-wrap:anywhere}
.cau .phu2{font-size:13px;line-height:1.5;color:var(--nhat)}
.cau .tt{font-size:13px;font-weight:700;line-height:1.45;font-variant-numeric:tabular-nums;color:var(--lg-nhan)}
:root[data-toi] .cau .tt{color:var(--lg-lh,var(--lg-nhan))}
.cau[data-tt=xong]{background:color-mix(in srgb,var(--the) 55%,var(--nen))}
.cau[data-tt=xong] .tt{color:color-mix(in srgb,var(--xanh) 55%,var(--muc))}
.cau[data-tt=gan]{box-shadow:inset 4px 0 0 var(--vang-diu)}
.cau[data-tt=gan] .tt{color:var(--vang-diu)}
.cau .mui{color:var(--nhat);display:inline-flex}
.cau .cham4{margin-top:2px}
.xanh-dau{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--xanh);color:#fff;flex:none}
:root[data-toi] .xanh-dau{color:#0f1419}
.nhom-hang{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 16px;border-radius:18px;border:1px solid var(--vien);background:var(--the);width:100%;text-align:left}
.nhom-hang b{font-size:16px;font-weight:700}.nhom-hang span{font-size:14px;color:var(--nhat);font-variant-numeric:tabular-nums}
.nhom-hang .ben{display:flex;align-items:center;gap:6px}

/* ── Thẻ bên: tiến độ thật ── */
.tien{display:grid;gap:14px}
.tien .so-lon{display:flex;align-items:baseline;gap:8px}
.tien .so-lon b{font-size:44px;line-height:1;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tien .so-lon span{font-size:15px;color:var(--nhat)}
.tuan{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:64px}
.tuan div{display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%}
.tuan i{display:block;width:100%;max-width:28px;border-radius:6px 6px 3px 3px;background:var(--xanh);min-height:4px}
.tuan i[data-0]{background:var(--the-2);border:1px solid var(--vien-dam);height:4px}
.tuan small{font-size:12px;color:var(--nhat)}
.tuan div[data-nay] small{font-weight:800;color:var(--muc)}

/* ── Lần gặp lại 2 ── */
.luat{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--tim-nen);color:var(--muc);font-size:15px;line-height:1.5}
.luat svg{flex:none;color:var(--lg-nhan);margin-top:2px}
:root[data-toi] .luat svg{color:var(--lg-nhan)}
.de{display:grid;gap:14px}
.de .meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;min-height:28px;padding:2px 10px;border-radius:99px;background:var(--the-2);font-size:13px;font-weight:600;color:var(--nhat)}
.de p.hoi{font-family:var(--serif);font-size:18px;line-height:1.65}
.pa{display:grid;gap:10px}
.pa label{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border-radius:16px;border:1.5px solid var(--vien-dam);background:var(--the);font-size:17px;cursor:pointer}
.pa label b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--the-2);font-size:14px;flex:none}
.pa label[data-chon]{border-color:var(--lg-nhan);background:var(--tim-nen)}
.pa label[data-chon] b{background:var(--lg-nhan);color:var(--muc-nguoc)}
:root[data-toi] .pa label[data-chon] b{background:var(--tim);color:#0f1419}
.thanh-nop{position:sticky;bottom:0;margin:0 -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--nen) 70%,transparent)}
@media(max-width:1023px){.thanh-nop{bottom:68px;position:fixed;left:0;right:0;margin:0}}

/* ── Khoảnh khắc đã sửa xong ── */
.mung{display:flex;align-items:center;gap:16px}
.mung .bt{width:72px;height:72px;flex:none}
.mung h1{font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.02em}
.mung p{font-size:15px;color:var(--nhat);margin-top:2px}
.moc{display:grid;gap:0}
.moc li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:0 12px;padding-bottom:16px;position:relative}
.moc li::before{content:"";position:absolute;left:9px;top:20px;bottom:0;width:2px;background:var(--vien-dam)}
.moc li:last-child{padding-bottom:0}.moc li:last-child::before{display:none}
.moc li>i{width:20px;height:20px;border-radius:50%;background:var(--xanh);display:grid;place-items:center;color:#fff;margin-top:2px}
:root[data-toi] .moc li>i{color:#0f1419}
.moc b{display:block;font-size:16px;line-height:1.4}.moc span{font-size:14px;color:var(--nhat);line-height:1.5}
.moc .ngay-so{font-variant-numeric:tabular-nums;color:var(--muc);font-weight:700}
.truoc-sau{display:grid;gap:10px}
.truoc-sau>div{padding:14px 16px;border-radius:18px;border:1px solid var(--vien);background:var(--the)}
.truoc-sau .nhan{font-size:13px;font-weight:700;color:var(--nhat);margin-bottom:2px}
.truoc-sau>div:last-child{border-color:color-mix(in srgb,var(--xanh) 45%,var(--vien));background:color-mix(in srgb,var(--xanh) 7%,var(--the))}
.truoc-sau p{font-size:16px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{background:color-mix(in srgb,var(--xanh) 12%,var(--the));color:color-mix(in srgb,var(--xanh) 40%,var(--muc));min-height:32px;padding:4px 12px;font-size:14px}
.thanh-dang{height:10px;border-radius:99px;background:var(--the-2);overflow:hidden;display:flex}
.thanh-dang i{display:block;height:100%}.thanh-dang .da{background:var(--xanh)}.thanh-dang .vua{background:color-mix(in srgb,var(--xanh) 55%,var(--giay))}
.hang-nut{display:grid;gap:10px}

h2.muc{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.3}

/* ── Theo dạng ── */
.dang{display:grid;gap:10px;padding:16px;border-radius:18px;border:1px solid var(--vien);background:var(--the);text-align:left;width:100%}
.dang .d1{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.dang .d1 b{font-size:16px;font-weight:750;line-height:1.35;overflow-wrap:anywhere}
.dang .d1 span{font-size:13px;color:var(--nhat);white-space:nowrap;font-variant-numeric:tabular-nums}
.dang .d2{font-size:13px;color:var(--nhat);display:flex;justify-content:space-between;gap:12px}
.dang[data-nay]{box-shadow:inset 4px 0 0 var(--vang-diu);border-color:color-mix(in srgb,var(--vang-diu) 40%,var(--vien))}
.dang .gan{display:inline-block;margin-bottom:2px;font-size:13px;font-weight:700;color:var(--vang-diu)}
.luoi{display:grid;gap:10px}
@media(min-width:700px){.luoi{grid-template-columns:1fr 1fr}}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
