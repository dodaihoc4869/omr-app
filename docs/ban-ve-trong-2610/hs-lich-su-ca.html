<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HS · Lịch sử ca</title><link rel="stylesheet" href="trong.css">
<style>
p{text-wrap:pretty}
.tong-ket{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:28px;align-items:center}
.ba-tb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.ba-tb>div{padding:12px;border-radius:12px;background:var(--mat-2)}
.ba-tb .so{font-size:20px}
.ngay{display:flex;flex-direction:column;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;background:var(--mat-2);flex:none;line-height:1.1}
.ngay b{font-size:19px;font-weight:700}.ngay small{font-size:10.5px;color:var(--chu-3)}
.ca-phan{display:flex;gap:16px;margin-top:4px;font-size:13px;color:var(--chu-3)}
.ca-phan b{color:var(--chu-2);font-weight:600}
.diem-ca{text-align:right;min-width:72px}
.diem-ca .so{font-size:22px}
.ca .dong{min-height:76px}
@media (max-width:900px){.tong-ket{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){
  .ca .dong{align-items:flex-start;flex-wrap:wrap;gap:12px}
  .ca .ngay{width:44px;height:48px}
  .ca-phan{flex-wrap:wrap;gap:2px 12px}
  .ca .dong .nut-xem{flex:0 0 calc(100% - 56px);margin:-4px 0 -8px 56px;justify-content:flex-start}
  .ca .dong .nut-xem.chinh{margin:0 0 0 56px;justify-content:center}
  .ca .dong .nut-xem:not(.chinh){background:transparent;border-color:transparent;box-shadow:none;color:var(--chinh-chu);padding:0;font-size:14px}
  .ba-tb{grid-template-columns:minmax(0,1fr);gap:6px}
  .ba-tb>div{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px}
}
</style></head>
<body data-app="hs" data-tab="ket-qua" data-khung="man-con" data-tieu="Xem điểm & lịch sử ca kiểm tra" data-phu="Lịch sử ca kiểm tra & Báo cáo kết quả" data-ve="Kết quả">
<main class="khung cot" style="gap:20px">
  <!-- GỌN HƠN: 6 thẻ ca to → một danh sách 6 dòng (ngày · tên · điểm ba phần · tổng · Xem báo cáo); chỉ ca mới nhất có nút chính.
       Bốn ô trung bình + chip thang điểm gộp thành một thẻ «Trung bình» có đường điểm 6 ca. -->
  <div>
    <p class="nhan">6 ca gần nhất · 26/09 – 26/10 · thang 10 điểm</p>
    <h1 class="tieu-de mt-1">Lịch sử ca kiểm tra</h1>
  </div>

  <section class="the">
    <div class="tong-ket">
      <div>
        <p class="nhan">Điểm trung bình 6 ca gần nhất</p>
        <div class="hang mt-1" style="align-items:baseline;gap:10px"><span class="so-lon">6,63<small>/10</small></span><span class="chip dung"><i data-i="chart" class="nho"></i>+2,5 điểm từ 26/09</span></div>
        <div class="ba-tb">
          <div><p class="mo">Phần I (TN)</p><p class="so">3,46<small>/4,5</small></p></div>
          <div><p class="mo">Phần II (Đ/S)</p><p class="so">2,21<small>/4</small></p></div>
          <div><p class="mo">Phần III (Trả lời)</p><p class="so">0,96<small>/1,5</small></p></div>
        </div>
      </div>
      <svg id="duong" style="width:calc(100% - 14px);height:190px;display:block;overflow:visible" role="img" aria-label="Điểm 6 ca: 5,25 · 6,5 · 6 · 7 · 7,25 · 7,75"></svg>
    </div>
  </section>

  <section class="the dem ca">
    <div class="the-dau" style="padding:18px 20px 4px;margin:0"><div class="h3">Các ca đã làm</div><span class="mo">mới nhất ở trên</span></div>
    <div class="ds" id="ds"></div>
  </section>
</main>
<script src="khung.js"></script>
<script>
  // Mỗi ca: [ngày, thứ, tên, P1 câu đúng/18 (0,25 đ/câu), P2 điểm 4 câu Đ/S, P3 câu đúng/6 (0,25 đ/câu)]. Tổng = P1 + P2 + P3.
  // Ca 26/10 khớp màn «Kết quả sau nộp» (7,75 · 6 câu chưa đúng trọn). Tổng câu chưa đúng 6 ca = 55, khớp màn «Khắc phục lỗi sai».
  const ca = [
    ['26', '10', 'T2', 'Kiểm tra 50 phút · 12A1', 15, [1, 0.5, 1, 0.25], 5],
    ['24', '10', 'T7', 'Kiểm tra tuần 12 · Polymer', 14, [1, 1, 0.5, 0.25], 4],
    ['17', '10', 'T7', 'Kiểm tra tuần 11 · Amino acid và peptide', 15, [1, 0.5, 0.5, 0.25], 4],
    ['10', '10', 'T7', 'Kiểm tra tuần 10 · Amine', 13, [1, 0.5, 0.25, 0.25], 3],
    ['03', '10', 'T7', 'Kiểm tra tuần 9 · Tinh bột và cellulose', 14, [1, 0.5, 0.25, 0.25], 4],
    ['26', '09', 'T7', 'Kiểm tra tuần 8 · Saccharose và maltose', 12, [0.5, 0.5, 0.25, 0.25], 3],
  ]
  const so = (v) => v.toFixed(2).replace('.', ',')
  const dong = ca.map(([n, t, thu, ten, c1, ds, c3], k) => {
    const p1 = c1 * 0.25, p2 = ds.reduce((a, b) => a + b, 0), p3 = c3 * 0.25, tong = p1 + p2 + p3
    const sai = (18 - c1) + ds.filter((d) => d < 1).length + (6 - c3)
    return `<div class="dong">
      <span class="ngay" aria-label="${n}/${t}"><b>${n}</b><small>tháng ${+t}</small></span>
      <div class="giua"><p class="ten">${ten}</p><p class="mo an-dt">${thu === "T2" ? "Thứ Hai" : "Thứ Bảy"} ${n}/${t} · 28 câu</p><div class="ca-phan"><span>Phần I <b>${so(p1)}</b></span><span>Phần II <b>${so(p2)}</b></span><span>Phần III <b>${so(p3)}</b></span><span class="an-dt">· chưa đúng ${sai} câu</span></div></div>
      <div class="diem-ca"><span class="so">${so(tong)}<small>/10</small></span>${k === 0 ? '<p class="mo">ca mới nhất</p>' : ''}</div>
      <span class="nut${k === 0 ? ' chinh' : ''} nut-xem">Xem báo cáo</span>
    </div>`
  })
  document.getElementById('ds').innerHTML = dong.join('')
  veDuong('duong', [5.25, 6.5, 6, 7, 7.25, 7.75], { max: 10, buoc: 2.5, nhan: ['26/09', '03/10', '10/10', '17/10', '24/10', '26/10'], dinhDang: (v) => String(v).replace('.', ',') })
</script>
</body></html>
