<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản vẽ đếm ngược</title>
<style>
@font-face{font-family:'Be Vietnam Pro';font-weight:500;src:url(/phong/be-vietnam-pro-vietnamese-500-normal.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:'Be Vietnam Pro';font-weight:700;src:url(/phong/be-vietnam-pro-vietnamese-700-normal.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:'Be Vietnam Pro';font-weight:500;src:url(/phong/be-vietnam-pro-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Be Vietnam Pro';font-weight:700;src:url(/phong/be-vietnam-pro-latin-700-normal.woff2) format('woff2')}
/* Biến màu: đúng bảng app học sinh (src/styles/trong-hs-mau.css), không thêm màu mới. */
:root{--tr-nen:#fff;--tr-mat:#fff;--tr-mat-2:#f7f7f7;--tr-vien:#e5e5e5;--tr-chu:#1b1938;--tr-chu-2:#3a385e;--tr-chu-3:#47456d;
 --tr-hs:#6c71ff;--tr-hs-nut:#584dff;--tr-hs-go:#3f00dc;--tr-hs-nhat:#e6eaff;--tr-hs-chu:#565bbd;--tr-hs-tren:#fff;
 --tr-chu-y:#ff8c51;--tr-chu-y-nhat:#ffeee0;--tr-chu-y-chu:#b24f19;--tr-chu-y-nut:#f06b27;--tr-chu-y-day:#ce6837;
 --tr-dung:#00d396;--tr-dung-nhat:#c2ffdd;--tr-dung-chu:#007c58;--tr-dung-day:#009e73;--tr-sao:#feba00;--tr-sao-nhat:#fff5d4;--tr-sao-chu:#956400}
:root[data-toi]{--tr-nen:#131f24;--tr-mat:#202f36;--tr-mat-2:#263840;--tr-vien:#37464f;--tr-chu:#f1f7fb;--tr-chu-2:#dce6ec;--tr-chu-3:#c4d0d6;
 --tr-hs:#7772ff;--tr-hs-nut:#7772ff;--tr-hs-go:#3f00dc;--tr-hs-nhat:#2c2e47;--tr-hs-chu:#b1b6ff;
 --tr-chu-y:#ff9447;--tr-chu-y-nhat:#422a1a;--tr-chu-y-chu:#ffa569;--tr-chu-y-nut:#ff9447;--tr-chu-y-day:#de6a00;
 --tr-dung:#00d497;--tr-dung-nhat:#18382a;--tr-dung-chu:#00df9f;--tr-dung-day:#00aa76;--tr-sao:#ffc735;--tr-sao-nhat:#3b2f14;--tr-sao-chu:#ecb400}
*{box-sizing:border-box}
body{margin:0;background:var(--tr-nen);color:var(--tr-chu);font-family:'Be Vietnam Pro',system-ui,sans-serif}
.man{max-width:1120px;margin:0 auto;padding:20px 16px 40px}
.chao{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.chao b{font-size:24px;font-weight:700}
.chao span{color:var(--tr-chu-3);font-size:14px;font-weight:500}
.cho{border:2px dashed var(--tr-vien);border-radius:20px;height:180px;display:grid;place-items:center;color:var(--tr-chu-3);font-size:14px;margin-top:16px}
/* ───── THẺ ĐẾM NGƯỢC ───── */
.dn{--m:var(--tr-hs-chu);--m-nut:var(--tr-hs-nut);--m-nhat:var(--tr-hs-nhat);--m-go:var(--tr-hs-go);
 position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:18px 20px 20px;border-radius:22px;
 background:var(--tr-mat);border:2px solid var(--tr-vien);box-shadow:0 4px 0 var(--tr-vien);overflow:hidden}
.dn[data-tt='gap'],.dn[data-tt='tuan']{--m:var(--tr-chu-y-chu);--m-nut:var(--tr-chu-y-nut);--m-nhat:var(--tr-chu-y-nhat);--m-go:var(--tr-chu-y-day)}
.dn[data-tt='thi']{--m:var(--tr-dung-chu);--m-nut:var(--tr-dung);--m-nhat:var(--tr-dung-nhat);--m-go:var(--tr-dung-day)}
/* ô số: mặt tô + gờ 3D như nút app */
.so{min-width:104px;padding:10px 14px 12px;border-radius:18px;background:var(--m-nut);color:var(--tr-hs-tren);text-align:center;box-shadow:inset 0 -5px 0 var(--m-go)}
:root[data-toi] .so{color:#fff}
.so b{display:block;font-size:44px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.so small{display:block;margin-top:4px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.92}
.noi{min-width:0;display:flex;flex-direction:column;gap:6px}
.nhan{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:3px 10px;border-radius:999px;background:var(--m-nhat);color:var(--m);font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.tieu{font-size:18px;font-weight:700;line-height:1.3}
.ngay-thi{font-size:14px;font-weight:700;color:var(--m)}
.phu{font-size:14px;font-weight:500;color:var(--tr-chu-3)}
.thanh{margin-top:4px;height:10px;border-radius:999px;background:var(--tr-mat-2);overflow:hidden;border:1px solid var(--tr-vien)}
.thanh i{display:block;height:100%;border-radius:999px;background:var(--m-nut)}
.duoi{display:flex;gap:6px;font-size:12.5px;font-weight:500;color:var(--tr-chu-3);flex-wrap:wrap}
.duoi b{color:var(--m);font-weight:700}
/* ỐNG NGHIỆM (thầy 09/11 «chèn vào khung ống thí nghiệm cho tinh tế»): mực chất lỏng = phần năm học lớp 12 đã đi; vạch chia 25/50/75 %; bọt khí tĩnh.
   Thủy tinh = viền chữ mờ + mặt nhạt; chất lỏng = màu chặng (--m-nut), mặt khum sáng hơn (--m-nhat). Không chuyển động (máy yếu, dễ chịu mắt). */
.ong{display:flex;flex-direction:column;align-items:center;gap:4px}
.ong svg{display:block;width:38px;height:128px}
.ong .thuy-tinh{fill:var(--tr-mat-2);stroke:var(--tr-chu-3);stroke-opacity:.55;stroke-width:2}
.ong .mieng{fill:var(--tr-mat);stroke:var(--tr-chu-3);stroke-opacity:.55;stroke-width:2}
.ong .long{fill:var(--m-nut)}
.ong .khum{fill:var(--m-nhat);opacity:.9}
.ong .bot{fill:var(--tr-hs-tren);opacity:.55}
.ong .vach{stroke:var(--tr-chu-3);stroke-opacity:.45;stroke-width:1.5;stroke-linecap:round}
.ong .ane{fill:#fff;opacity:.35}
.ong small{display:flex;flex-direction:column;align-items:center;line-height:1.15;font-size:12px;font-weight:700;color:var(--m);font-variant-numeric:tabular-nums}
.ong small span{font-size:10.5px;font-weight:500;color:var(--tr-chu-3)}
@media (max-width:480px){.dn{gap:12px;padding:16px}.ong svg{width:30px;height:112px}.so{min-width:88px;padding:8px 10px 11px}.so b{font-size:38px}.tieu{font-size:16.5px}.duoi{display:none}}
</style>
</head>
<body>
<main class="man" id="goc"></main>
<script>
const q=new URLSearchParams(location.hash.slice(1)); if(q.get('toi'))document.documentElement.dataset.toi='1'
const tt=q.get('tt')||'binh'
const NGAY_THI=Date.UTC(2027,5,22), KHAI_GIANG=Date.UTC(2026,8,5)
const HOM_NAY={binh:Date.UTC(2026,10,9),gap:Date.UTC(2027,4,30),tuan:Date.UTC(2027,5,17),thi:Date.UTC(2027,5,22)}[tt]
const con=Math.round((NGAY_THI-HOM_NAY)/864e5), pt=Math.round(100*(HOM_NAY-KHAI_GIANG)/(NGAY_THI-KHAI_GIANG))
const nf=n=>n.toLocaleString('vi-VN')
// Ống nghiệm 38×128 (đơn vị viewBox): miệng loe trên, thân y 12→118, đáy tròn bán kính 11. Mực = pt % chiều cao thân (đo từ đáy).
function ongNghiem(pt){
  const top=14, day=117, h=day-top, muc=day-h*Math.max(0,Math.min(100,pt))/100
  const than='M8 12 H30 V106 A11 11 0 0 1 8 106 Z'
  return `<div class="ong" role="img" aria-label="Ống nghiệm: đã đi ${pt}% năm học lớp 12">
  <svg viewBox="0 0 38 128" aria-hidden="true">
    <defs><clipPath id="cl"><path d="${than}"/></clipPath></defs>
    <path class="thuy-tinh" d="${than}"/>
    <g clip-path="url(#cl)">
      <rect class="long" x="0" y="${muc}" width="38" height="${128-muc}"/>
      <ellipse class="khum" cx="19" cy="${muc}" rx="11" ry="2.6"/>
      ${pt>8?`<circle class="bot" cx="15" cy="${Math.min(day-8,muc+14)}" r="2.2"/><circle class="bot" cx="23" cy="${Math.min(day-4,muc+26)}" r="1.6"/><circle class="bot" cx="18" cy="${Math.min(day-2,muc+36)}" r="1.2"/>`:''}
    </g>
    ${[25,50,75].map(p=>{const y=day-h*p/100;return `<line class="vach" x1="24" y1="${y}" x2="30" y2="${y}"/>`}).join('')}
    <rect class="ane" x="11" y="18" width="3" height="70" rx="1.5"/>
    <rect class="mieng" x="5" y="8" width="28" height="6" rx="3"/>
  </svg>
  <small>${pt}%<span>năm học</span></small>
</div>`
}
const loai=con===0?'thi':con<=7?'tuan':con<=30?'gap':'binh'
const nhan={binh:'Đếm ngược',gap:'Chặng nước rút',tuan:'Tuần cuối',thi:'Hôm nay'}[loai]
const tieu='Thi tốt nghiệp THPT'
const phu=loai==='thi'?'Bình tĩnh, đọc kĩ đề, làm câu chắc trước. Thầy tin em.':`≈ ${Math.floor(con/7)} tuần · đủ 28 câu mỗi ngày là thêm ${nf(con*28)} câu`
document.getElementById('goc').innerHTML=`
<div class="chao"><b>Chào Minh Anh</b><span>Lớp 12 Tinh Hoa</span></div>
<section class="dn" data-tt="${loai}" aria-label="Đếm ngược ngày thi tốt nghiệp THPT">
  <div class="so" aria-hidden="true"><b>${loai==='thi'?'<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/><path d="M22 9v6"/></svg>':con}</b><small>${loai==='thi'?'ngày thi':'ngày'}</small></div>
  <div class="noi">
    <span class="nhan">${nhan}</span>
    <div class="tieu">${tieu}</div>
    <div class="ngay-thi">Thứ Ba · 22/06/2027</div>
    <div class="phu">${phu}</div>
    ${loai==='thi'?'':`<div class="duoi"><span>đã đi <b>${pt}%</b> năm học lớp 12 · từ khai giảng 05/09</span></div>`}
  </div>
  ${ongNghiem(loai==='thi'?100:pt)}
</section>
<div class="cho">Việc hôm nay và phần dưới — giữ nguyên</div>`
</script>
</body>
</html>
