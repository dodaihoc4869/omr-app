  background: linear-gradient(165deg, rgba(42,58,66,.97), rgba(24,36,42,.98)); border: 1px solid rgba(255,255,255,.14);
  box-shadow: 0 calc(24 * var(--k1)) calc(60 * var(--k1)) rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12); }
.tam::before { content: ''; position: absolute; left: -20%; top: -30%; width: 90%; height: 60%; background: radial-gradient(closest-side, rgba(245,165,36,.22), transparent); pointer-events: none; }

<div class="man">
  <section class="giay">
    <div class="chip"><b>Câu 1</b><span>Phần I · Trắc nghiệm</span></div>
    Alcohol nào sau đây là alcohol bậc II?
    <div class="pa"><b>A.</b>CH₃–CH₂–OH</div><div class="pa"><b>B.</b>CH₃–CH(OH)–CH₃</div><div class="pa"><b>C.</b>(CH₃)₃C–OH</div><div class="pa"><b>D.</b>CH₃–OH</div>
  </section>
  <section class="bang" id="bang"></section>
  <footer class="thanh">
    <span class="live"><i></i>LIVE 12:40</span><span class="dot">◂ &nbsp;Câu 1/2&nbsp; ▸</span><span class="pha">CẢ LỚP ĐANG LÀM</span>
    <span class="gian"></span>
    <span id="ong"></span>
    <span class="tron o4"><svg viewBox="0 0 20 20"><rect x="1" y="1" width="7.5" height="7.5" rx="2" fill="#f1f7fb"/><rect x="11.5" y="1" width="7.5" height="7.5" rx="2" fill="#f1f7fb"/><rect x="1" y="11.5" width="7.5" height="7.5" rx="2" fill="#f1f7fb"/><rect x="11.5" y="11.5" width="7.5" height="7.5" rx="2" fill="#f1f7fb"/></svg></span>
  </footer>
</div>
<script>
var k = new URLSearchParams(location.search).get('k') || 'nut'
var DOI = { na: 'var(--na)', k: 'var(--k)', cu: 'var(--cu)', ca: 'var(--ca)' }
var NOP = [['Phạm Khánh Vy', 'k', '0:08', 'B', 1], ['Nguyễn Thị Hà', 'na', '0:11', 'B', 1], ['Lê Gia Huy', 'k', '0:14', 'C', 0], ['Đỗ Hoàng Nam', 'na', '0:19', 'B', 1], ['Vũ Ngọc Lan', 'cu', '0:27', 'A', 0]]
var CHUA = [['Trần Minh Anh', 'na'], ['Ngô Gia Bảo', 'ca'], ['Bùi Đức Anh', 'cu']]
// ống nghiệm: mực dâng theo tỉ lệ đã nộp; tia lửa xoắn ốc từ đáy lên miệng mỗi khi một em gửi (như ống nghiệm ở màn điểm danh)
function ong(n, tong, lop) {
  var muc = 26 - 20 * (tong ? n / tong : 0)
  var tia = lop === 'vua' ? '<svg class="tia" viewBox="0 0 40 86"><defs><linearGradient id="gt" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffb347" stop-opacity="0"/><stop offset="1" stop-color="#fff2c2"/></linearGradient><filter id="lo"><feGaussianBlur stdDeviation="1.6"/></filter></defs>'
    + '<path d="M13 78 C 30 72, 30 64, 13 58 C -2 52, -2 44, 13 38 C 28 32, 28 24, 15 18" fill="none" stroke="url(#gt)" stroke-width="2.4" stroke-linecap="round"/>'
    + '<circle cx="15" cy="18" r="5" fill="#ffd27a" filter="url(#lo)"/><circle cx="15" cy="18" r="2.4" fill="#fff8e0"/><circle cx="24" cy="30" r="1.2" fill="#ffd27a"/><circle cx="6" cy="46" r="1" fill="#ffb347"/><circle cx="27" cy="62" r="1.1" fill="#ffb347"/></svg>' : ''
  return '<span class="ong ' + (lop || '') + '">' + tia
    + '<svg viewBox="0 0 18 30"><defs><linearGradient id="gm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#f7498f"/></linearGradient><clipPath id="co"><path d="M4 2 V22 a5 5 0 0 0 10 0 V2 Z"/></clipPath></defs>'
    + '<g clip-path="url(#co)"><rect x="0" y="' + muc + '" width="18" height="30" fill="url(#gm)"/><circle cx="7" cy="' + (muc + 5) + '" r="1.1" fill="#fff" opacity=".7"/><circle cx="11" cy="' + (muc + 9) + '" r=".8" fill="#fff" opacity=".6"/></g>'
    + '<path d="M4 2 V22 a5 5 0 0 0 10 0 V2" fill="none" stroke="#e6eef2" stroke-width="1.6" stroke-linecap="round"/><path d="M2.4 2 H15.6" stroke="#e6eef2" stroke-width="1.8" stroke-linecap="round"/></svg>'
    + n + '/' + tong + '<small>đã nộp</small></span>'
}
var V = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 5"/></svg>', X = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>'
function tam(nop, chua) {
  var d = nop.filter(function (e) { return e[4] }).length, s = nop.length - d, t = nop.length + chua.length
  var h = '<div class="tam"><div class="dau"><div><h2>Ai đã nộp</h2><p>Câu 1 · xếp theo em gửi nhanh nhất</p></div><div class="so">' + nop.length + '<small>/' + t + '</small></div></div>'
    + '<div class="ti"><i class="d" style="width:' + (100 * d / t) + '%"></i><i class="s" style="width:' + (100 * s / t) + '%"></i></div><div class="chu-ti"><b class="d">' + d + ' đúng</b><b class="s">' + s + ' sai</b><span>' + chua.length + ' em chưa nộp</span></div>'
  if (!nop.length) h += '<div class="rong">Chưa em nào gửi đáp án<small>Em nào gửi là hiện ngay ở đây, nhanh nhất đứng đầu.</small></div>'
  else { h += '<div class="nhan">Đã nộp · ' + nop.length + '</div><div class="ds">' + nop.map(function (e, i) { return '<div class="em' + (i === 0 ? ' nhat' : '') + '"><span class="hang">' + (i + 1) + '</span><span class="ten"><i style="background:' + DOI[e[1]] + '"></i>' + e[0] + '</span><span class="gio">' + e[2] + '</span><b class="chon">' + e[3] + '</b><span class="kq ' + (e[4] ? 'd' : 's') + '">' + (e[4] ? V : X) + '</span></div>' }).join('') + '</div>' }
  if (chua.length) h += '<div class="nhan">Chưa nộp · ' + chua.length + '</div><div class="chua">' + chua.map(function (e) { return '<span><i style="background:' + DOI[e[1]] + '"></i>' + e[0] + '</span>' }).join('') + '</div>'
  return h + '<div class="chan">Chỉ máy thầy thấy · bấm ống nghiệm lần nữa để đóng</div></div>'
}
var net = '<svg class="net" viewBox="0 0 300 120" fill="none" stroke="#e8eef2" stroke-width="3" stroke-linecap="round"><path d="M10 40 q30 -30 60 0 t60 0"/><path d="M20 90 h160"/></svg>'
var o = document.getElementById('ong'), b = document.getElementById('bang')
if (k === 'nut') { o.outerHTML = ong(4, 8, ''); b.innerHTML = net }
if (k === 'vua') { o.outerHTML = ong(5, 8, 'vua') ; b.innerHTML = net + '<div class="cong1"><i style="background:var(--cu)"></i>Vũ Ngọc Lan vừa gửi · 0:27</div>' }
if (k === 'ds') { o.outerHTML = ong(5, 8, 'mo'); b.innerHTML = tam(NOP, CHUA) }
if (k === 'rong') { o.outerHTML = ong(0, 8, 'mo'); b.innerHTML = tam([], NOP.map(function (e) { return [e[0], e[1]] }).concat(CHUA)) }
</script>
