<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bản vẽ: khung chat luôn hiện bên phải app thầy khi live (chế độ Bảng và Học)</title>
<style>
@font-face { font-family: 'DDH'; font-weight: 100 549; src: url('../../src/styles/phong-ddh/ddh-rounded-de-vietnamese.woff2') format('woff2'), url('../../src/styles/phong-ddh/ddh-rounded-de-latin.woff2') format('woff2'); }
@font-face { font-family: 'DDH'; font-weight: 100 549; src: url('../../src/styles/phong-ddh/ddh-rounded-de-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+2070-208F; }
@font-face { font-family: 'DDH'; font-weight: 550 1000; src: url('../../src/styles/phong-ddh/ddh-rounded-dam-vietnamese.woff2') format('woff2'), url('../../src/styles/phong-ddh/ddh-rounded-dam-latin.woff2') format('woff2'); }
@font-face { font-family: 'DDH'; font-weight: 550 1000; src: url('../../src/styles/phong-ddh/ddh-rounded-dam-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+2070-208F; }
:root { --nen: #131f24; --nen-2: #0e171b; --mat: #1a262c; --mat-2: #24323a; --vien: #2e3e47; --giay: #f4efe4; --muc: #1f2429; --chu: #f1f7fb; --chu2: #cfdae0; --chu3: #8fa1ab;
  --na: #f59e0b; --k: #8b5cf6; --cu: #10b981; --ca: #ef4444; --do: #c8262b; --vang: #f5c84a; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--nen-2); font-family: 'DDH', 'Be Vietnam Pro', system-ui, sans-serif; color: var(--chu); -webkit-font-smoothing: antialiased; overflow: hidden; }
/* PHẦN CHIẾU: nguyên cỡ màn (W × H) rồi thu đều về góc trên trái ⇒ tỉ lệ bảng không đổi, máy em thấy y như cũ */
.chieu { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; transform-origin: 0 0; background: var(--nen); overflow: hidden; }
.tren { position: absolute; left: 0; right: 0; top: 0; height: 48px; background: #fff; }
.tren i { position: absolute; right: 10px; top: 8px; width: 34px; height: 34px; border-radius: 50%; background: #5b6770; display: grid; place-items: center; color: #fff; font-style: normal; font-size: 17px; }
.but { position: absolute; left: 6px; top: 52px; height: 26px; padding: 0 10px; border-radius: 13px; background: #19242a; border: 1px solid #26343c; display: flex; align-items: center; gap: 13px; }
.but b { width: 13px; height: 13px; border-radius: 50%; background: #8d979d; } .but b:nth-child(2) { background: #8a7648; } .but b:nth-child(3) { background: #3f8f77; } .but b:nth-child(4) { background: #7a5a66; } .but b:nth-child(5) { background: #2c5fa8; } .but b.nho { width: 5px; height: 5px; }
.bang { position: absolute; left: 0; right: 0; top: 48px; bottom: 62px; }
.ke { position: absolute; left: 66.667%; top: 10px; bottom: 0; width: 2px; background: #33434c; }
.day { position: absolute; left: 8px; right: 8px; bottom: 6px; height: 50px; border-radius: 16px; background: #1a262c; display: flex; align-items: center; gap: 12px; padding: 0 10px; }
.live { display: flex; align-items: center; height: 38px; border-radius: 19px; background: var(--do); font-weight: 800; font-size: 15px; overflow: hidden; }
.live span { padding: 0 13px; border-right: 1.5px solid rgba(255,255,255,.25); display: flex; align-items: center; gap: 7px; } .live span:last-child { border: 0; }
.live u { width: 8px; height: 8px; border-radius: 50%; background: #fff; }
.gian { flex: 1; }
.o { width: 36px; height: 36px; border-radius: 50%; background: #2c3a42; display: grid; place-items: center; }
.o svg { width: 18px; height: 18px; }
.giay { position: absolute; left: 10px; top: 58px; bottom: 68px; width: calc(66.667% - 15px); border-radius: 18px; background: var(--giay); color: var(--muc); padding: 22px 34px; font-size: 27px; line-height: 1.5; }
.giay .chip { display: flex; gap: 10px; margin-bottom: 12px; font-size: 15px; font-weight: 800; } .giay .chip b { background: #d9e4fb; padding: 4px 14px; border-radius: 99px; } .giay .chip span { background: #e6e0d2; color: #5d6770; padding: 4px 14px; border-radius: 99px; }
.giay .pa { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 30px; font-size: 25px; } .giay .pa b { margin-right: 10px; }
.bang-hoc { position: absolute; left: calc(66.667% + 5px); right: 10px; top: 58px; bottom: 68px; border-radius: 18px; border: 2px solid #33434c; }
svg.viet { position: absolute; overflow: visible; }
svg.viet text { font-family: 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive; fill: #eef4f7; font-style: italic; }
/* CỘT TIN NHẮN LỚP — của riêng máy thầy, luôn hiện */
.cot { position: fixed; right: 0; top: 0; bottom: 0; width: var(--c); background: #0f191e; border-left: 1.5px solid #24323a; display: flex; flex-direction: column; }
.cot-dau { flex: none; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 8px 0 14px; border-bottom: 1.5px solid #1f2c33; }
.cot-dau b { font-size: 14.5px; font-weight: 800; letter-spacing: .01em; white-space: nowrap; }
.cot-dau .loc { margin-left: auto; display: flex; white-space: nowrap; border-radius: 99px; background: rgba(245,200,74,.14); font-size: 12px; font-weight: 800; color: var(--vang); }
.cot-dau .loc i { font-style: normal; padding: 4px 10px; border-radius: 99px; } .cot-dau .loc i.chon { background: #2c3a42; color: var(--chu); }
.ds { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 5px; padding: 8px 8px 8px 8px; }
.tin { position: relative; padding: 6px 10px 7px 13px; border-radius: 10px; background: color-mix(in srgb, var(--d) 9%, #141f25); }
.tin::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 99px; background: var(--d); }
.tin .ten { display: flex; align-items: baseline; gap: 8px; font-size: 14.5px; font-weight: 800; line-height: 1.25; color: color-mix(in srgb, var(--d) 78%, #fff); }
.tin .ten span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tin .ten time { margin-left: auto; flex: none; font-size: 11px; font-weight: 700; color: #6f828d; font-variant-numeric: tabular-nums; }
.tin .ten em { flex: none; font-style: normal; font-size: 10.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px; border-radius: 99px; background: rgba(245,200,74,.16); color: var(--vang); }
.tin p { margin: 2px 0 0; font-size: 13px; line-height: 1.38; font-weight: 500; color: var(--chu2); overflow-wrap: anywhere; }
.tin.hoi { box-shadow: inset 0 0 0 1.5px rgba(245,200,74,.5); }
.tin.thay { --d: #dfe8ee; background: #1b272e; } .tin.thay .ten { color: #fff; }
.na { --d: var(--na); } .kk { --d: var(--k); } .cu { --d: var(--cu); } .ca { --d: var(--ca); }
.nhap { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px; border-top: 1.5px solid #1f2c33; }
.nhap .ba { width: 34px; height: 36px; border-radius: 11px; background: #18242a; display: grid; place-items: center; gap: 0; color: var(--chu3); font-weight: 800; letter-spacing: 1px; }
.nhap .o-nhap { flex: 1; height: 36px; border-radius: 11px; background: #18242a; border: 1.5px solid #26343c; display: flex; align-items: center; padding: 0 11px; font-size: 13.5px; font-weight: 600; color: #6f828d; }
.nhap .gui { width: 36px; height: 36px; border-radius: 11px; background: #2c3a42; display: grid; place-items: center; }
/* DẢI CỦA THẦY dưới phần chiếu: các thẻ chỉ thầy thấy dọn xuống đây, không đè lên bảng */
.dai { position: fixed; left: 0; bottom: 0; background: #0f191e; border-top: 1.5px solid #24323a; display: flex; align-items: stretch; gap: 10px; padding: 10px 12px; }
.dai .nhan { flex: none; align-self: center; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #5f727d; }
.the { min-width: 0; border-radius: 14px; background: #162127; border: 1.5px solid #24323a; padding: 9px 12px; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
.the h5 { margin: 0; font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--chu3); display: flex; gap: 8px; } .the h5 em { font-style: normal; color: var(--vang); }
.the .so { font-size: 26px; font-weight: 800; line-height: 1; } .the .so small { font-size: 13px; font-weight: 700; color: var(--chu3); margin-left: 6px; }
.the .dong { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 800; white-space: nowrap; } .the .dong small { font-size: 12px; font-weight: 600; color: var(--chu3); }
.the .dong i { font-style: normal; padding: 5px 12px; border-radius: 9px; font-size: 12.5px; font-weight: 800; } .the .dong i.ok { background: #34c98a; color: #0d2b20; margin-left: auto; } .the .dong i.tu { background: #2c3a42; color: var(--chu2); }
.the .cham { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--d); margin-right: 2px; }
.the.rong { flex: 1; }
</style></head><body>
<div class="chieu" id="chieu">
  <div class="tren"><i>✕</i></div>
  <div id="noi-dung"></div>
  <div class="day">
    <div class="live"><span><u></u>LIVE 24:16</span><span><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>62</span></div>
    <div class="gian"></div>
    <div class="o"><svg viewBox="0 0 24 24" fill="none" stroke="#dfe8ee" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h0M16 12h0M8 16h2M12 16h0M16 16h0"/></svg></div>
    <div class="o" style="background:#f1f7fb"><svg viewBox="0 0 24 24" fill="#16222a"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></div>
  </div>
</div>
<aside class="cot" id="cot">
  <div class="cot-dau"><b>Tin nhắn lớp</b><div class="loc"><i>2 câu hỏi</i></div></div>
  <div class="ds" id="ds"></div>
  <div class="nhap"><div class="ba">···</div><div class="o-nhap">Nhắn cả lớp…</div><div class="gui"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8fa1ab" stroke-width="2.2" stroke-linejoin="round"><path d="M4 12 20 4l-6 16-3-7-7-1Z"/></svg></div></div>
</aside>
<div class="dai" id="dai">
  <span class="nhan">Chỉ thầy thấy</span>
  <div class="the"><h5>Trong lớp</h5><div class="so">62<small>/ 68 em</small></div></div>
  <div class="the"><h5>Giơ tay<em>2 em</em></h5><div class="dong"><span class="cham cu"></span>Lê Hoàng Nam <small>chờ 0:42</small></div><div class="dong"><span class="cham na"></span>Đỗ Thu Trang <small>chờ 0:15</small></div></div>
  <div class="the" style="border-color:rgba(255,107,94,.5)"><h5>Xin vào lại<em>1 em</em></h5><div class="dong"><span class="cham kk"></span>Nguyễn Thị Hà <small>rời 3 lần · 19:52</small><i class="ok">Duyệt</i><i class="tu">Từ chối</i></div><div class="dong" style="font-weight:700;color:#cfdae0"><small>Đang bị nhắc:</small> Trần Minh Khôi <small>2/3</small> · Vũ Gia Bảo <small>1/3</small></div></div>
</div>
<script>
const q = new URLSearchParams(location.search), k = q.get('k') || 'bang'
const W = innerWidth, H = innerHeight, C = Math.round(Math.min(340, Math.max(248, W * 0.2))), s = (W - C) / W
document.documentElement.style.setProperty('--c', C + 'px')
const chieu = document.getElementById('chieu'); chieu.style.transform = `scale(${s})`
const dai = document.getElementById('dai'); dai.style.width = (W - C) + 'px'; dai.style.height = Math.round(H - H * s) + 'px'
const viet = (x, y, co, dong, mau) => `<svg class="viet" style="left:${x}%;top:${y}%"><g>${dong.map((d, i) => `<text x="0" y="${i * co * 1.55}" font-size="${co}" ${mau && mau[i] ? `style="fill:${mau[i]}"` : ''}>${d}</text>`).join('')}</g></svg>`
const noi = document.getElementById('noi-dung')
if (k === 'hoc') {
  noi.innerHTML = `<div class="giay"><div class="chip"><b>Câu 3</b><span>Trắc nghiệm</span></div>Đốt cháy hoàn toàn 0,1 mol một ester no, đơn chức, mạch hở X thu được 8,8 gam CO₂. Công thức phân tử của X là
    <div class="pa"><span><b>A.</b>C₂H₄O₂</span><span><b>B.</b>C₃H₆O₂</span><span><b>C.</b>C₄H₈O₂</span><span><b>D.</b>C₅H₁₀O₂</span></div></div>
    <div class="bang-hoc">${viet(7, 9, 24, ['n CO₂ = 8,8 : 44', '        = 0,2 mol', 'Số C = 0,2 : 0,1 = 2', '⇒ C₂H₄O₂'], [0, 0, 0, '#f5c84a'])}</div>`
} else {
  noi.innerHTML = `<div class="but"><b></b><b></b><b></b><b></b><b></b><b class="nho"></b><b></b><b class="nho"></b><b class="nho"></b></div><div class="bang"><i class="ke"></i>
    ${viet(5, 13, 30, ['Liên kết cộng hoá trị', 'H₂ :  H · · H  ⇒  H – H', 'O₂ :  O :: O  ⇒  O = O', 'Δχ = 3,44 – 2,2 = 1,24  ⇒  LK CHT phân cực'], ['#f5c84a'])}
    ${viet(70, 13, 25, ['VD1:  CH₄', 'C : 2,55    H : 2,2', 'Δχ = 0,35 ⇒ không phân cực', 'VD2:  CO₂'], [0, 0, '#f5c84a'])}</div>`
}
const T = [
  ['cu', 'Lê Hoàng Nam', '19:48', 'Dạ em nghe rõ rồi ạ'],
  ['na', 'Đỗ Thu Trang', '19:49', 'Thầy ơi hiệu độ âm điện bao nhiêu thì tính là liên kết ion ạ', 'hoi'],
  ['thay', 'Thầy', '19:49', 'Từ 1,7 trở lên em nhé'],
  ['ca', 'Phạm Ngọc Bảo Anh', '19:50', 'Em chép xong phần H₂ và O₂ rồi ạ'],
  ['kk', 'Nguyễn Thị Hà', '19:50', 'Mạng em hơi lag, tiếng thầy bị ngắt một đoạn'],
  ['cu', 'Trần Minh Khôi', '19:51', 'CO₂ có liên kết phân cực mà sao phân tử lại không phân cực ạ', 'hoi'],
  ['na', 'Vũ Gia Bảo', '19:51', 'Em hiểu rồi ạ'],
  ['ca', 'Hoàng Đức Anh', '19:52', 'Câu VD1 em ra 0,35 giống thầy'],
  ['kk', 'Bùi Khánh Linh', '19:52', 'Dạ rõ ạ'],
  ['cu', 'Đặng Quỳnh Chi', '19:53', 'Thầy viết to hơn một chút được không ạ'],
]
document.getElementById('ds').innerHTML = T.map(([d, ten, gio, chu, loai]) => `<div class="tin ${d}${loai ? ' ' + loai : ''}"><div class="ten"><span>${ten}</span>${loai === 'hoi' ? '<em>Câu hỏi</em>' : ''}<time>${gio}</time></div><p>${chu}</p></div>`).join('')
</script>
</body></html>
