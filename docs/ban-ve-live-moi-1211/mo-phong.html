<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bản vẽ Live mới 12/11</title>
<style>
/* BẢN VẼ (mô phỏng tĩnh, KHÔNG phải mã app). Màu chép đúng biến đang có: nền xanh than --tr-nen #131f24 · mặt --tr-mat #202f36 · viền --tr-vien #37464f · chữ --tr-chu #f1f7fb;
   đội --p-cam / --p-tim-2 / --p-xanh / --p-do; màu chính HS --tr-hs #7772ff; đúng --tr-dung #00d497; chú ý --tr-chu-y #ff9447. */
@font-face { font-family: 'DDH Rounded'; font-weight: 100 549; src: url('../../src/styles/phong-ddh/ddh-rounded-de-vietnamese.woff2') format('woff2'), url('../../src/styles/phong-ddh/ddh-rounded-de-latin.woff2') format('woff2'); }
@font-face { font-family: 'DDH Rounded'; font-weight: 550 1000; src: url('../../src/styles/phong-ddh/ddh-rounded-dam-vietnamese.woff2') format('woff2'), url('../../src/styles/phong-ddh/ddh-rounded-dam-latin.woff2') format('woff2'); }
:root { --nen:#131f24; --nen-2:#0e181c; --mat:#202f36; --mat-2:#263840; --vien:#37464f; --chu:#f1f7fb; --chu-2:#c4d0d6; --chu-3:#8fa3ad;
  --d0:#f59e0b; --d1:#8b5cf6; --d2:#10b981; --d3:#ef4444; --hs:#7772ff; --hs-go:#3f00dc; --dung:#00d497; --dung-day:#00aa76; --chu-y:#ff9447; --sai:#f7498f; --tin:#00bfd4; --sao:#ffc735; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { font-family: 'DDH Rounded', system-ui, sans-serif; background: var(--nen); color: var(--chu); font-size: 14px; line-height: 1.35; -webkit-font-smoothing: antialiased; }
b, h1, h2, h3 { font-weight: 800; }
button { font: inherit; color: inherit; border: 0; background: none; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.hang { display: flex; align-items: center; gap: 8px; }
.cot { display: flex; flex-direction: column; }
.gian { flex: 1; min-width: 0; }
.mo { color: var(--chu-3); }
.the { background: var(--mat); border: 2px solid var(--vien); border-radius: 16px; }
.nut { min-height: 44px; padding: 0 18px; border-radius: 14px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--mat-2); border: 2px solid var(--vien); box-shadow: 0 3px 0 #0b1418; white-space: nowrap; }
.nut.chinh { background: var(--dung); color: #06281d; border-color: transparent; box-shadow: 0 4px 0 var(--dung-day); }
.nut.hs { background: var(--hs); color: #fff; border-color: transparent; box-shadow: 0 4px 0 var(--hs-go); }
.nut.do { background: transparent; color: #ff9bba; border-color: #5a2b3c; box-shadow: none; }
.vien { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 99px; background: var(--mat-2); font-weight: 700; font-size: 12.5px; white-space: nowrap; }
.cham { width: 8px; height: 8px; border-radius: 50%; background: var(--sai); box-shadow: 0 0 0 4px rgba(247,73,143,.22); }
/* ngọn lửa đội — đúng 3 lớp của NgonLua (ManBinhPhanUng.tsx) */
.lua { position: relative; display: inline-grid; place-items: center; width: var(--c, 56px); height: calc(var(--c, 56px) * 1.25); flex: none; }
.lua::before { content: ''; position: absolute; inset: 10% -25% -10%; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--doi) 55%, transparent), transparent); opacity: .7; }

.lua .ngoai { fill: var(--doi); }
.lua .giua { fill: color-mix(in srgb, var(--doi) 55%, #fff3c4); }
.lua .loi { fill: #fff8dc; }
.lua b { position: absolute; bottom: 12%; font-size: calc(var(--c, 56px) * .26); color: #1b1300; }
.doi0 { --doi: var(--d0); } .doi1 { --doi: var(--d1); } .doi2 { --doi: var(--d2); } .doi3 { --doi: var(--d3); }
/* ───── NỀN SÁNG (chỉ hai màn lối vào: app thầy và trang chủ em) ───── */

body.sang .nut { box-shadow: 0 3px 0 #d5d9df; }
body.sang .nut.chinh { box-shadow: 0 4px 0 var(--dung-day); } body.sang .nut.hs { box-shadow: 0 4px 0 var(--hs-go); }

/* ───── APP THẦY: lối vào ───── */
.gv-khung { display: grid; grid-template-columns: 220px 1fr; height: 100%; }
.gv-ben { background: var(--mat); border-right: 2px solid var(--vien); padding: 18px 12px; gap: 6px; }
.gv-ben .muc { height: 44px; border-radius: 12px; padding: 0 12px; font-weight: 700; color: var(--chu-2); }
.gv-ben .muc.chon { background: color-mix(in srgb, var(--sai) 16%, transparent); color: var(--chu); }
.gv-ben .moi { margin-left: auto; font-size: 11px; padding: 2px 7px; border-radius: 99px; background: var(--chu-y); color: #2a1300; font-weight: 800; }
.gv-than { padding: 28px 40px; overflow: hidden; }
.ba-the { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 18px; }
.ba-the .the { padding: 18px; min-height: 128px; gap: 6px; position: relative; }
.ba-the .the.chon { border-color: var(--dung); box-shadow: 0 0 0 4px color-mix(in srgb, var(--dung) 22%, transparent); }
.ba-the h3 { font-size: 18px; }
.bieu { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 4px; }
.khoi-hang { display: flex; gap: 12px; margin-top: 10px; }

.o-nhap { height: 44px; border-radius: 12px; border: 2px solid var(--vien); background: var(--mat); padding: 0 12px; display: flex; align-items: center; font-weight: 700; min-width: 150px; }
.lich-dong { height: 56px; padding: 0 14px; border-bottom: 2px solid var(--vien); } .lich-dong:last-child { border-bottom: 0; }

/* ───── KHUNG LIVE THẦY ───── */
.lv { display: grid; grid-template-rows: 56px 1fr; height: 100%; }
.lv-dau { padding: 0 16px; gap: 12px; border-bottom: 2px solid var(--vien); background: var(--nen-2); }
.doi-che { display: inline-flex; padding: 4px; border-radius: 14px; background: var(--mat); border: 2px solid var(--vien); }
.doi-che span { height: 36px; min-width: 104px; padding: 0 16px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; color: var(--chu-3); }
.doi-che .chon { background: var(--hs); color: #fff; box-shadow: 0 3px 0 var(--hs-go); }
.am { height: 40px; padding: 0 12px; border-radius: 12px; background: var(--mat); border: 2px solid var(--vien); gap: 10px; }

.doi-the .thanh { height: 6px; border-radius: 4px; background: var(--mat-2); overflow: hidden; margin-top: 4px; } .doi-the .thanh i { display: block; height: 100%; background: var(--doi); border-radius: 4px; }
.san { min-width: 0; min-height: 0; padding: 14px; gap: 12px; }

.chip { height: 36px; padding: 0 14px; border-radius: 99px; border: 2px solid var(--vien); background: var(--mat); font-weight: 700; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip.chon { background: color-mix(in srgb, var(--hs) 22%, var(--mat)); border-color: var(--hs); }
.giay { flex: 1; min-height: 0; border-radius: 18px; background: #fbfaf5; color: #1c2529; padding: 22px 28px; font-size: 18px; overflow: hidden; }
.giay .pa { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 24px; margin-top: 16px; } .giay .pa span b { margin-right: 6px; }
.bang { flex: 1; min-height: 0; border-radius: 18px; background: radial-gradient(120% 100% at 30% 0%, #1a2a31, #101b20); border: 2px solid var(--vien); position: relative; overflow: hidden; }
.bang svg.net { position: absolute; inset: 0; width: 100%; height: 100%; }
.phan { font-family: 'Segoe Print', 'Comic Sans MS', 'DDH Rounded', cursive; }
.but { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); padding: 6px; border-radius: 16px; background: rgba(32,47,54,.92); border: 2px solid var(--vien); gap: 6px; }
.but i { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-style: normal; } .but i.mau { border: 3px solid var(--mat); box-shadow: 0 0 0 2px var(--vien); border-radius: 50%; width: 26px; height: 26px; margin: 0 3px; }
.lv-chat { border-left: 2px solid var(--vien); min-height: 0; background: var(--nen-2); }
.chat-ds { flex: 1; min-height: 0; overflow: hidden; padding: 10px 12px; gap: 10px; justify-content: flex-end; }
.tn { gap: 8px; align-items: flex-start; }
.tn .av { width: 30px; height: 30px; border-radius: 50%; background: var(--doi); color: #14110a; display: grid; place-items: center; font-weight: 800; font-size: 12px; flex: none; }
.tn .bong { background: var(--mat); border-radius: 4px 14px 14px 14px; padding: 6px 10px; border: 2px solid var(--vien); }
.tn small { color: var(--chu-3); font-size: 11.5px; } .tn .ten { color: color-mix(in srgb, var(--doi) 70%, #fff); font-weight: 800; font-size: 12.5px; }
.tn.hoi .bong { border-color: var(--chu-y); background: color-mix(in srgb, var(--chu-y) 12%, var(--mat)); }
.tn.thay .av { background: var(--hs); color: #fff; } .tn.thay .ten { color: #b1b6ff; }
.o-chat { height: 44px; margin: 10px 12px 12px; border-radius: 14px; background: var(--mat); border: 2px solid var(--vien); padding: 0 6px 0 14px; color: var(--chu-3); }
.o-chat .gui { width: 34px; height: 34px; border-radius: 10px; background: var(--hs); color: #fff; display: grid; place-items: center; }

/* ───── MÁY EM ───── */
.em { display: grid; grid-template-columns: auto 1fr 44px; height: 100%; }
.em-doi { width: 150px; padding: 8px; gap: 8px; border-right: 2px solid var(--vien); background: var(--nen-2); min-height: 0; }
.em-doi.gon { width: 44px; padding: 8px 0; align-items: center; gap: 10px; }
.lua4 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.lua4 > div { border-radius: 12px; padding: 4px 0 3px; align-items: center; font-size: 11px; font-weight: 800; border: 2px solid transparent; }
.lua4 > div.minh { background: color-mix(in srgb, var(--doi) 16%, transparent); border-color: color-mix(in srgb, var(--doi) 60%, transparent); }
.ds-ten { flex: 1; min-height: 0; overflow: hidden; gap: 3px; }

.ds-ten .t::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--doi); flex: none; }
.ds-ten .t.toi { background: color-mix(in srgb, var(--doi) 30%, var(--mat)); }
.em-san { min-width: 0; min-height: 0; padding: 8px; gap: 8px; position: relative; }
.em-dau { height: 26px; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--chu-2); }
.em-hoc { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.25fr 1fr; gap: 8px; }
.em-hoc .giay { font-size: 14.5px; padding: 14px 16px; border-radius: 14px; }
.em-pa { gap: 7px; justify-content: center; }
.em-pa .p { flex: 1; max-height: 58px; min-height: 44px; border-radius: 14px; border: 2px solid var(--vien); background: var(--mat); padding: 0 12px; font-weight: 800; gap: 10px; box-shadow: 0 3px 0 #0b1418; }
.em-pa .p i { width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--vien); display: grid; place-items: center; font-style: normal; flex: none; }
.em-pa .p.chon { border-color: var(--hs); background: color-mix(in srgb, var(--hs) 20%, var(--mat)); } .em-pa .p.chon i { background: var(--hs); border-color: var(--hs); color: #fff; }
.thanh-an { background: var(--nen-2); border-left: 2px solid var(--vien); align-items: center; padding: 8px 0; gap: 8px; }
.thanh-an .o { width: 44px; height: 44px; display: grid; place-items: center; color: var(--chu-2); position: relative; }
.thanh-an .o em { position: absolute; top: 6px; right: 5px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--sai); color: #fff; font-size: 10.5px; font-style: normal; font-weight: 800; display: grid; place-items: center; padding: 0 4px; }
.bong-noi { position: absolute; right: 8px; top: 44px; max-width: 250px; padding: 7px 12px; border-radius: 14px 14px 4px 14px; background: rgba(32,47,54,.94); border: 2px solid var(--vien); font-size: 12.5px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.khay { position: absolute; right: 52px; top: 8px; bottom: 8px; width: 206px; border-radius: 18px; background: rgba(32,47,54,.97); border: 2px solid var(--vien); box-shadow: 0 16px 40px rgba(0,0,0,.5); padding: 8px; gap: 4px; }
.khay .d { height: 44px; border-radius: 12px; padding: 0 10px; gap: 10px; font-weight: 700; } .khay .d.sang { background: var(--mat-2); } .khay .d small { margin-left: auto; color: var(--chu-3); font-weight: 700; }
.pop { position: absolute; right: 52px; top: 8px; bottom: 8px; width: min(340px, 52%); border-radius: 20px; background: rgba(24,36,42,.97); border: 2px solid var(--vien); box-shadow: 0 20px 50px rgba(0,0,0,.55); }
.pop .dau { height: 44px; padding: 0 6px 0 14px; border-bottom: 2px solid var(--vien); font-weight: 800; }
.pop .chat-ds { padding: 8px 10px; gap: 7px; } .pop .tn .av { width: 24px; height: 24px; font-size: 10.5px; } .pop .tn .bong { padding: 4px 9px; font-size: 13px; }
.pop .nhanh { padding: 0 10px; gap: 6px; } .pop .nhanh span { height: 30px; padding: 0 10px; border-radius: 99px; background: var(--mat); border: 2px solid var(--vien); font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; white-space: nowrap; }
.pop .o-chat { margin: 8px 10px 10px; }
.phu { position: absolute; inset: 0; background: rgba(8,14,17,.82); display: grid; place-items: center; text-align: center; }
.hop { width: min(440px, 86%); padding: 22px; border-radius: 22px; background: var(--mat); border: 2px solid var(--vien); gap: 10px; align-items: center; }
/* màn chào 4 đội */
.chao { height: 100%; padding: 10px 14px; gap: 8px; background: radial-gradient(90% 70% at 50% 0%, #1c2d35, var(--nen)); }
.chao-4 { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.chao-cot { align-items: center; min-height: 0; border-radius: 18px; padding: 6px 8px 8px; border: 2px solid transparent; }
.chao-cot.minh { border-color: color-mix(in srgb, var(--doi) 65%, transparent); background: linear-gradient(color-mix(in srgb, var(--doi) 16%, transparent), transparent 70%); }
.chao-cot h3 { font-size: 15px; color: color-mix(in srgb, var(--doi) 75%, #fff); }
.chao-cot .ds-ten .t { font-size: 11px; padding: 0 5px; gap: 4px; }
.chao-cot .ds-ten { width: 100%; margin-top: 6px; display: grid; grid-template-columns: 1fr 1fr; align-content: start; gap: 4px; }
/* phòng chờ — đấu trường Giữ Lửa */
.dau-truong { position: relative; height: 100%; overflow: hidden; background: radial-gradient(60% 60% at 50% 50%, #1b2c34, #0d171b 90%); }
.dau-truong::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(241,247,251,.07) 1.2px, transparent 1.4px); background-size: 28px 28px; }
.goc { position: absolute; width: 34%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--doi) 34%, transparent), transparent); display: grid; place-items: center; }
.goc.g0 { left: -9%; top: -22%; } .goc.g1 { right: -9%; top: -22%; } .goc.g2 { left: -9%; bottom: -22%; } .goc.g3 { right: -9%; bottom: -22%; }
.goc .ten { position: absolute; font-weight: 800; font-size: 12.5px; color: color-mix(in srgb, var(--doi) 70%, #fff); white-space: nowrap; }
.vong { position: absolute; left: 50%; top: 50%; width: 74%; aspect-ratio: 1.9; transform: translate(-50%, -50%); border-radius: 50%; border: 2px dashed rgba(0,191,212,.55); box-shadow: 0 0 0 2000px rgba(0,191,212,.05), inset 0 0 40px rgba(0,191,212,.12); }

.tia.toi { outline: 2px solid #fff; outline-offset: 3px; }

.tia span { position: absolute; left: 50%; top: -17px; transform: translateX(-50%); font-size: 10.5px; font-weight: 800; white-space: nowrap; text-shadow: 0 1px 3px #000; }
.hat { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--sao); box-shadow: 0 0 8px var(--sao); }
.hat.xanh { background: var(--tin); box-shadow: 0 0 8px var(--tin); }
.dt-bang { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); padding: 5px 8px; border-radius: 14px; background: rgba(19,31,36,.86); border: 2px solid var(--vien); gap: 12px; font-size: 12.5px; font-weight: 800; white-space: nowrap; }
.dt-bang .o { gap: 5px; } .dt-bang .o i { width: 10px; height: 10px; border-radius: 50%; background: var(--doi); }
.dt-cho { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); padding: 6px 14px; border-radius: 99px; background: rgba(19,31,36,.86); border: 2px solid var(--vien); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.can { position: absolute; left: 150px; bottom: 18px; width: 104px; height: 104px; border-radius: 50%; border: 2px solid rgba(241,247,251,.22); background: rgba(241,247,251,.05); display: grid; place-items: center; }
.can i { width: 44px; height: 44px; border-radius: 50%; background: rgba(241,247,251,.34); transform: translate(14px, -10px); }
.tang { position: absolute; right: 150px; bottom: 30px; width: 76px; height: 76px; border-radius: 50%; background: color-mix(in srgb, var(--d0) 30%, transparent); border: 2px solid var(--d0); display: grid; place-items: center; font-weight: 800; font-size: 12.5px; }
.tin-tran { position: absolute; right: 12px; top: 52px; gap: 4px; align-items: flex-end; font-size: 11.5px; font-weight: 700; } .tin-tran span { padding: 3px 9px; border-radius: 99px; background: rgba(19,31,36,.8); }
.nguyen { position: relative; width: 100%; height: 100%; background: #14181d center / 100% 100% no-repeat; }
.chat-noi { position: absolute; right: 10px; top: 10px; bottom: 62px; width: 326px; border-radius: 18px; overflow: hidden; border: 2px solid var(--vien); box-shadow: 0 16px 40px rgba(0,0,0,.5); }
.chat-noi .lv-chat { height: 100%; border-left: 0; }
.moi-ghi { position: absolute; padding: 3px 9px; border-radius: 99px; background: var(--chu-y); color: #2a1300; font-weight: 800; font-size: 11px; white-space: nowrap; }
.o-chat-em { position: absolute; right: 0; top: 47%; width: 26px; height: 30px; display: grid; place-items: center; color: var(--chu-2); background: rgba(32,47,54,.9); border-radius: 10px 0 0 10px; }
.o-chat-em em { position: absolute; top: -6px; left: -6px; min-width: 15px; height: 15px; border-radius: 8px; background: var(--sai); color: #fff; font-size: 10px; font-style: normal; font-weight: 800; display: grid; place-items: center; }
/* trang chủ em (dọc) */
.hs-nha { height: 100%; padding: 18px 16px; gap: 14px; }
.live-nut { border-radius: 20px; padding: 14px; gap: 12px; background: var(--mat); border: 2px solid var(--vien); }
.live-nut.sang-len { border-color: var(--sai); background: linear-gradient(120deg, color-mix(in srgb, var(--sai) 20%, var(--mat)), var(--mat)); box-shadow: 0 0 0 5px color-mix(in srgb, var(--sai) 16%, transparent); }
.live-nut .bieu { margin: 0; background: color-mix(in srgb, var(--sai) 22%, transparent); color: var(--sai); }
.live-nut.tat { opacity: .62; } .live-nut.tat .bieu { background: var(--mat-2); color: var(--chu-3); }
.ghi { position: fixed; left: 8px; bottom: 6px; font-size: 10.5px; color: var(--chu-3); opacity: .8; }

<body>
<script>
const q = new URLSearchParams(location.search), man = q.get('man') || 'g-nut', che = q.get('che') || 'hoc'
if (q.get('nen') === 'sang') document.body.classList.add('sang')

      <div class="chat-noi cot">${cotChat}</div><span class="moi-ghi" style="left:75.5%;bottom:8%">MỚI · công tắc Học | Bảng</span><span class="moi-ghi" style="right:25%;top:3%">MỚI · cột tin nhắn, bấm M để đóng / mở</span></div>`
    : `<div class="lv">${dauLv(che)}<div class="lv-than">${cotDoi}${sanBang}${cotChat}</div></div>`,
  'h-nut': () => `<div class="hs-nha cot"><b style="font-size:20px">Chào Minh Anh</b>
    <small class="mo">1 · Thầy đang mở live cho khối của em</small><div class="live-nut sang-len hang"><span class="bieu">${ic('live', 24)}</span><div class="gian"><b style="font-size:16px">Thầy đang live · Khối 12</b><div class="mo">78 bạn đã vào phòng</div></div><button class="nut hs">Tham gia</button></div>
    <small class="mo">2 · Có lịch hẹn, chưa tới giờ</small><div class="live-nut hang"><span class="bieu" style="background:color-mix(in srgb, var(--hs) 20%, transparent);color:var(--hs)">${ic('lich', 24)}</span><div class="gian"><b style="font-size:16px">Live 19:30 tối nay</b><div class="mo">Chữa đề Ester – Lipid · còn 2 giờ 15 phút</div></div></div>
    <small class="mo">3 · Không có live cho khối của em</small><div class="live-nut tat hang"><span class="bieu">${ic('live', 24)}</span><div class="gian"><b style="font-size:16px">Live</b><div class="mo">Chưa có buổi nào</div></div></div></div>`,
  'h-xoay': () => `<div class="phu" style="position:fixed"><div class="hop cot"><span style="color:var(--hs)">${ic('xoay', 64)}</span><h2 style="font-size:20px">Xoay ngang máy để vào live</h2><span class="mo">Live chỉ chạy ở màn ngang, toàn màn hình. Nếu máy đang khoá xoay, mở khoá xoay rồi xoay lại.</span><button class="nut hs" style="width:100%;margin-top:6px">Em đã xoay ngang</button></div></div>`,
  'h-cho': () => dauTruong(false),
  'h-chao': () => `<div class="chao cot"><div class="hang" style="justify-content:center;gap:10px"><span class="vien"><span class="cham"></span>THẦY BẮT ĐẦU LIVE</span><b style="font-size:16px">Em thuộc Đội Natri</b></div><div class="chao-4">${DOI.map((d, i) => `<div class="chao-cot cot doi${i}${i === 0 ? ' minh' : ''}">${lua(i, 54)}<h3>${d[0]}</h3><small class="mo">${SO[i]} em · ${KJ[i]} kJ</small><div class="ds-ten doi${i}">${dsTen(i, 14, i === 0 ? 0 : -1)}</div></div>`).join('')}</div></div>`,
  'h-hoc': () => `<div class="nguyen" style="background-image:url(../ban-ve-live-1011/that-4-em-844-vua-vao-giay-uu-tien.jpg)"><span class="o-chat-em">${ic('chat', 18)}<em>2</em></span><div class="bong-noi doi2" style="right:30px;top:36%"><b style="color:color-mix(in srgb, var(--d2) 70%, #fff)">Lan Anh · Cu</b> Câu này chọn B đúng không ạ</div><span class="moi-ghi" style="right:34px;top:52%">MỚI · bong bóng chat trong thanh ẩn sẵn có</span></div>`,
  'h-bang': () => `<div class="em">${cotEm(true)}${emBang}<div class="bong-noi doi2"><b style="color:color-mix(in srgb, var(--d2) 70%, #fff)">Lan Anh · Cu</b> Muối là CH₃COONa chứ, M = 82 mà</div></div>${thanhAn(1)}</div>`,
  'h-khay': () => `<div class="em">${cotEm(true)}${emBang}<div class="khay cot">${[['chat', 'Nhắn cả lớp', '2 tin mới', 1], ['tay', 'Giơ tay', ''], ['mic', 'Mic của em', 'Tắt'], ['loa', 'Tiếng thầy', 'Bật'], ['lua', 'Bốn đội', ''], ['toan', 'Toàn màn hình', 'Bật']].map((d) => `<div class="d hang${d[3] ? ' sang' : ''}">${ic(d[0], 18)}${d[1]}<small>${d[2]}</small></div>`).join('')}<span class="gian"></span><div class="d hang" style="color:#ff9bba">${ic('roi', 18)}Rời live</div></div></div>${thanhAn(0, true)}</div>`,
  'h-chat': () => `<div class="em">${cotEm(true)}${emBang}<div class="pop cot"><div class="dau hang">${ic('chat', 18)}Nhắn cả lớp<span class="gian"></span><span style="width:44px;height:44px;display:grid;place-items:center">${ic('x', 18)}</span></div><div class="chat-ds cot">${CHAT.slice(1, 5).join('')}</div><div class="nhanh hang"><span>Em hiểu rồi ạ</span><span>Thầy giảng lại ạ</span><span>🔥</span><span>👏</span></div><div class="o-chat hang"><span class="gian">Nhắn thầy và cả lớp…</span><span class="gui">${ic('gui', 18)}</span></div></div></div>${thanhAn(0, true)}</div>`,
  'h-roi': () => `<div class="nguyen" style="background-image:url(../ban-ve-live-1011/that-4-em-844-vua-vao-giay-uu-tien.jpg)"></div><div class="phu" style="position:fixed"><div class="hop cot"><h2 style="font-size:20px;color:var(--chu-y)">Em vừa rời màn live</h2><span class="mo">Thầy đã thấy em rời màn 1 lần (12 giây). Quay lại ngay để không mất kJ của Đội Natri.</span><button class="nut hs" style="width:100%;margin-top:6px">Quay lại live</button></div></div>`,
}
document.body.innerHTML = (MAN[man] || MAN['g-nut'])()
</script>
