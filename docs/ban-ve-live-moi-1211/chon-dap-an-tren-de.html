<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bản vẽ: chọn đáp án ngay trên đề + con dấu đè cả màn (live theo khối)</title>
<style>
@font-face { font-family: 'DDH'; font-weight: 100 549; src: url('../../src/styles/phong-ddh/ddh-rounded-de-vietnamese.woff2') format('woff2'), url('../../src/styles/phong-ddh/ddh-rounded-de-latin.woff2') format('woff2'); }
@font-face { font-family: 'DDH'; font-weight: 100 549; src: url('../../src/styles/phong-ddh/ddh-rounded-de-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+2070-208F; }
@font-face { font-family: 'DDH'; font-weight: 550 1000; src: url('../../src/styles/phong-ddh/ddh-rounded-dam-vietnamese.woff2') format('woff2'), url('../../src/styles/phong-ddh/ddh-rounded-dam-latin.woff2') format('woff2'); }
@font-face { font-family: 'DDH'; font-weight: 550 1000; src: url('../../src/styles/phong-ddh/ddh-rounded-dam-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+2070-208F; }
:root { --nen: #131f24; --mat: #202f36; --mat2: #2b3b43; --vien: #46565f; --chu: #f1f7fb; --chu2: #c4d0d6; --chu3: #8fa1ab; --giay: #f4efe4; --muc: #1f2429; --hs: #7772ff; --dung: #00d497; --sai: #f7498f; --vang: #e8a13a; --nhan: #2152c9;
  --k: 1; }
@media (max-width: 900px) { :root { --k: .62; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--nen); font-family: 'DDH', 'Be Vietnam Pro', system-ui, sans-serif; color: var(--chu); -webkit-font-smoothing: antialiased; overflow: hidden; }
.man { position: fixed; inset: 0; display: grid; grid-template-columns: 74fr 26fr; gap: calc(10px * var(--k)); padding: calc(8px * var(--k)) calc(26px * var(--k)) calc(8px * var(--k)) calc(8px * var(--k)); }
.man.thay { grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 48px; padding: 10px; }
.giay { position: relative; background: var(--giay); color: var(--muc); border-radius: calc(16px * var(--k)); padding: calc(20px * var(--k)) calc(28px * var(--k)); font-size: calc(30px * var(--k)); line-height: 1.5; overflow: hidden; min-width: 0; }
.chip { display: flex; gap: calc(10px * var(--k)); margin-bottom: calc(10px * var(--k)); font-size: calc(15px * var(--k)); font-weight: 800; }
.chip b { background: #d6deeb; padding: calc(4px * var(--k)) calc(13px * var(--k)); border-radius: 99px; }
.chip span { background: #e6e0d2; color: #6a737b; padding: calc(4px * var(--k)) calc(13px * var(--k)); border-radius: 99px; }
.y { display: flex; gap: calc(20px * var(--k)); margin-top: calc(6px * var(--k)); }
.y b { color: var(--nhan); font-weight: 800; flex: none; }
.bang { position: relative; border-radius: calc(16px * var(--k)); border: 2px solid #33434c; min-width: 0; }
.bang p { position: absolute; inset: 0; margin: 0; display: grid; place-items: center; text-align: center; color: #5e707a; font-size: calc(17px * var(--k)); font-weight: 700; line-height: 1.5; padding: 0 10%; }
.nam { position: fixed; right: calc(8px * var(--k)); top: 46%; width: calc(8px * var(--k)); height: calc(84px * var(--k)); border-radius: 99px; background: var(--vang); }
/* DẢI CHỌN ĐÁP ÁN — neo đáy khung ĐỀ */
.dai { position: absolute; left: calc(10px * var(--k)); right: calc(10px * var(--k)); bottom: calc(10px * var(--k)); display: flex; flex-wrap: wrap; align-items: center; gap: calc(8px * var(--k)) calc(12px * var(--k)); padding: calc(10px * var(--k)) calc(12px * var(--k)); border-radius: calc(20px * var(--k)); background: rgba(32, 44, 51, .97); color: var(--chu); box-shadow: 0 calc(10px * var(--k)) calc(30px * var(--k)) rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.1); font-size: calc(17px * var(--k)); font-weight: 800; line-height: 1.2; }
.dai .chu { flex: 1 1 100%; display: flex; justify-content: space-between; font-size: calc(14px * var(--k)); color: var(--chu2); font-weight: 700; padding: 0 calc(4px * var(--k)); }
.dai .chu em { font-style: normal; color: var(--vang); }
.nhom { display: flex; align-items: center; gap: calc(6px * var(--k)); flex: 1 1 0; min-width: calc(150px * var(--k)); }
.nhom > b { width: calc(30px * var(--k)); height: calc(30px * var(--k)); border-radius: 50%; background: var(--mat2); display: grid; place-items: center; font-size: calc(16px * var(--k)); flex: none; }
.nut { flex: 1; height: calc(46px * var(--k)); min-width: calc(44px * var(--k)); border-radius: calc(13px * var(--k)); background: var(--mat2); border: 1.5px solid var(--vien); display: grid; place-items: center; font-size: calc(17px * var(--k)); font-weight: 800; color: var(--chu); }
.nut.d { background: var(--dung); border-color: var(--dung); color: #05281e; }
.nut.s { background: var(--sai); border-color: var(--sai); color: #3a0a1f; }
.nut.c { background: var(--hs); border-color: #a9a6ff; color: #fff; }
.gui { flex: 0 0 auto; height: calc(46px * var(--k)); padding: 0 calc(22px * var(--k)); border-radius: calc(13px * var(--k)); background: var(--hs); color: #fff; display: grid; place-items: center; font-size: calc(17px * var(--k)); font-weight: 800; box-shadow: 0 calc(3px * var(--k)) 0 #3f00dc; white-space: nowrap; }
.gui.tat { background: var(--mat2); color: var(--chu3); box-shadow: none; border: 1.5px solid var(--vien); }
.tn .nut { font-size: calc(21px * var(--k)); }
.so { flex: 0 0 auto; min-width: calc(130px * var(--k)); height: calc(46px * var(--k)); border-radius: calc(13px * var(--k)); background: #0f181c; border: 1.5px solid var(--hs); display: flex; align-items: center; padding: 0 calc(14px * var(--k)); font-size: calc(22px * var(--k)); letter-spacing: .04em; }
.so i { width: 2px; height: 55%; background: var(--hs); margin-left: 3px; }
.phim { display: flex; gap: calc(5px * var(--k)); flex: 1 1 auto; }
.phim .nut { min-width: calc(34px * var(--k)); }
/* dải kết quả gọn (không còn thẻ Đạt / Chưa đạt) */
.kq { position: absolute; left: calc(10px * var(--k)); bottom: calc(10px * var(--k)); padding: calc(11px * var(--k)) calc(20px * var(--k)); border-radius: 99px; background: rgba(32,44,51,.97); color: var(--vang); font-size: calc(17px * var(--k)); font-weight: 800; }
/* CON DẤU — đè giữa CẢ MÀN (cả đề lẫn bảng) */
.dau { position: fixed; left: 50%; top: 47%; transform: translate(-50%, -50%) rotate(-9deg); padding: calc(14px * var(--k)) calc(44px * var(--k)); border: calc(9px * var(--k)) double currentColor; border-radius: calc(22px * var(--k)); font-size: calc(104px * var(--k)); font-weight: 900; letter-spacing: .06em; line-height: 1.05; white-space: nowrap; color: var(--sai); background: rgba(247,73,143,.1); text-shadow: 0 0 calc(18px * var(--k)) rgba(247,73,143,.35); box-shadow: 0 0 calc(60px * var(--k)) rgba(247,73,143,.22), inset 0 0 calc(30px * var(--k)) rgba(247,73,143,.14); }
.dau.dat { color: var(--dung); background: rgba(0,212,151,.1); text-shadow: 0 0 calc(18px * var(--k)) rgba(0,212,151,.35); box-shadow: 0 0 calc(60px * var(--k)) rgba(0,212,151,.22), inset 0 0 calc(30px * var(--k)) rgba(0,212,151,.14); }
.dau small { display: block; font-size: .2em; letter-spacing: .12em; text-align: center; opacity: .9; margin-top: .2em; }
/* máy thầy */
.thanh { grid-column: 1 / -1; background: #1a262c; border-radius: 14px; display: flex; align-items: center; gap: 14px; padding: 0 10px; font-weight: 800; font-size: 15px; }
.live { background: #c8262b; border-radius: 99px; padding: 7px 16px; }
.the { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); background: var(--giay); color: var(--muc); padding: 8px 30px; border-radius: 16px; font-size: 30px; font-weight: 800; white-space: nowrap; }
.net { position: absolute; left: 8%; top: 22%; width: 70%; opacity: .55; }
</style></head><body>
<div id="goc"></div>
<script>
var k = new URLSearchParams(location.search).get('k') || 'ds'
var DE = { ds: ['Câu 11', 'Phần II · Đúng / Sai', 'Thủy phân hoàn toàn 1 mol peptide X thu được 2 mol Gly và 1 mol Val.', [['a.', 'Số liên kết peptide trong X là 2.'], ['b.', 'Công thức phân tử của X là C₉H₁₈N₃O₄.'], ['c.', '1 mol X tác dụng tối đa với 3 mol NaOH trong dung dịch.'], ['d.', 'Có 3 công thức cấu tạo phù hợp với X.']]],
  tn: ['Câu 1', 'Phần I · Trắc nghiệm', 'Alcohol nào sau đây là alcohol bậc II?', [['A.', 'CH₃–CH₂–OH'], ['B.', 'CH₃–CH(OH)–CH₃'], ['C.', '(CH₃)₃C–OH'], ['D.', 'CH₃–OH']]],
  so: ['Câu 5', 'Phần III · Trả lời ngắn', 'Đốt cháy hoàn toàn 0,1 mol ethanol cần vừa đủ V lít khí O₂ (đkc). Giá trị của V là bao nhiêu? (làm tròn đến hàng phần trăm)', []] }
function giay(d, them) { return '<section class="giay"><div class="chip"><b>' + d[0] + '</b><span>' + d[1] + '</span></div>' + d[2] + d[3].map(function (y) { return '<div class="y"><b>' + y[0] + '</b><span>' + y[1] + '</span></div>' }).join('') + (them || '') + '</section>' }
function daiDs(chon) { var n = chon.replace(/ /g, '').length; return '<div class="dai"><div class="chu"><span>Câu 2 · chọn Đúng / Sai cho từng ý · <em>' + n + '/4 ý</em></span><span>0/1 bạn đã gửi</span></div>' + ['a', 'b', 'c', 'd'].map(function (c, i) { return '<div class="nhom"><b>' + c + '</b><span class="nut' + (chon[i] === 'D' ? ' d' : '') + '">Đúng</span><span class="nut' + (chon[i] === 'S' ? ' s' : '') + '">Sai</span></div>' }).join('') + '<span class="gui' + (n < 4 ? ' tat' : '') + '">' + (n < 4 ? 'Chọn đủ 4 ý' : 'Gửi đáp án') + '</span></div>' }
function daiTn(c) { return '<div class="dai tn"><div class="chu"><span>Câu 1 · chọn một đáp án</span><span>3/8 bạn đã gửi</span></div>' + ['A', 'B', 'C', 'D'].map(function (x) { return '<span class="nut' + (x === c ? ' c' : '') + '">' + x + '</span>' }).join('') + '<span class="gui' + (c ? '' : ' tat') + '">' + (c ? 'Gửi đáp án ' + c : 'Chọn đáp án') + '</span></div>' }
function daiSo() { return '<div class="dai"><div class="chu"><span>Câu 5 · nhập đáp số</span><span>1/8 bạn đã gửi</span></div><span class="so">6,72<i></i></span><span class="nut" style="flex:0 0 auto;padding:0 14px">Xoá</span><div class="phim">' + ['1','2','3','4','5','6','7','8','9','0',',','−'].map(function (p) { return '<span class="nut">' + p + '</span>' }).join('') + '</div><span class="gui">Gửi đáp số</span></div>' }
var bangTrong = '<section class="bang"><p>Bảng đen<br>Thầy viết gì, em thấy ngay ở đây</p></section><i class="nam"></i>'
var bangNet = '<section class="bang"><svg class="net" viewBox="0 0 300 160" fill="none" stroke="#e8eef2" stroke-width="2.4" stroke-linecap="round"><path d="M10 30 q20 -22 40 0 t40 0 M110 30 h60"/><path d="M30 80 q30 -10 60 0 M40 110 h110"/></svg></section><i class="nam"></i>'
var h = ''
if (k === 'ds') h = '<div class="man">' + giay(DE.ds, daiDs('D S ')) + bangTrong + '</div>'
if (k === 'tn') h = '<div class="man">' + giay(DE.tn, daiTn('B')) + bangTrong + '</div>'
if (k === 'so') h = '<div class="man">' + giay(DE.so, daiSo()) + bangTrong + '</div>'
if (k === 'dau') h = '<div class="man" style="grid-template-columns:66fr 34fr">' + giay(DE.ds, '<div class="kq">Chưa đúng · +50 kJ</div>') + bangNet + '</div><div class="dau">KHÔNG ĐẠT<small>ĐỖ ĐẠI HỌC · LÊN BẢNG</small></div>'
if (k === 'thay') h = '<div class="man thay">' + giay(DE.ds).replace('font-size', 'x') + '<section class="bang" style="border:0"><div class="the">Nguyễn Thị Hà</div><svg class="net" viewBox="0 0 300 160" fill="none" stroke="#e8eef2" stroke-width="2.4" stroke-linecap="round"><path d="M10 30 q20 -22 40 0 t40 0 M110 30 h60"/><path d="M30 80 q30 -10 60 0 M40 110 h110"/></svg></section><footer class="thanh"><span class="live">● LIVE 14:20</span><span style="color:#f5a524">◂ Câu 2/5 ▸</span><span style="background:#cfe3ff;color:#12325f;padding:5px 12px;border-radius:99px;font-size:14px">ĐANG CHỮA</span></footer></div><div class="dau dat">ĐẠT<small>NGUYỄN THỊ HÀ · LÊN BẢNG</small></div>'
document.getElementById('goc').innerHTML = h
</script>
</body></html>
