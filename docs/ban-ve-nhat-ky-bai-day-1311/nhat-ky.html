<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bản vẽ: Nhật ký bài dạy (bài học hoạt hoạ)</title>
<meta name="description" content="Bản vẽ chờ Thầy duyệt: buổi live được giảng lại thành các cảnh hoạt hoạ, dựng từ kịch bản JSON bằng thư viện khuôn.">
<!-- BẢN VẼ chạy được, chưa phải mã app. Trang ĐỌC kịch bản JSON (kich-ban-lien-ket.json, hoặc ?kb=fes2) rồi dựng từng cảnh bằng khuon.js.
     Tham số chụp ảnh / quay video: ?kb=fes2 · ?tua=1 (mọi cảnh ở trạng thái cuối) · ?dung=<cảnh>:<ms> (đứng hình một cảnh) · ?cuon=<id>&le=<px>
     · ?chon=<cảnh>:<số> (chọn sẵn đáp án Đoán nhanh) · ?bia=<ms> (đứng hình bìa) · ?toc=1.5 (chạy nhanh) · ?ghi=0 (ẩn ghi chú bản vẽ) · ?mayyeu=1 -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="khuon.css">
<style>
/* biến màu chép từ src/styles/trong-hs-mau.css (app học sinh), như các bản vẽ trước */
:root { color-scheme: light dark;
  --nen: #ffffff; --mat: #ffffff; --mat-2: #f7f7f7; --mat-3: #e5e5e5; --vien: #e5e5e5; --vien-nut: #c6c6d4; --chu: #1b1938; --chu-2: #3a385e; --chu-3: #47456d; --tren-nut: #ffffff; --bong: #e2e2f0;
  --hs: #6c71ff; --hs-nut: #584dff; --hs-go: #3f00dc; --hs-nhat: #e6eaff; --hs-chu: #565bbd; --p-tim-2: #8b5cf6; --p-do: #ef4444; --trang: #ffffff; }
@media (prefers-color-scheme: dark) { :root {
  --nen: #131f24; --mat: #202f36; --mat-2: #263840; --mat-3: #37464f; --vien: #37464f; --vien-nut: #4d5f6a; --chu: #f1f7fb; --chu-2: #dce6ec; --chu-3: #c4d0d6; --tren-nut: #131f24; --bong: #0b1418;
  --hs: #7772ff; --hs-nut: #7772ff; --hs-nhat: #2c2e47; --hs-chu: #b1b6ff; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 76px; }
body { margin: 0; background: var(--nen); color: var(--chu); font: 500 16px/1.5 var(--phong); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
h1, h2, p { margin: 0; }
button { font: inherit; color: inherit; border: 0; margin: 0; padding: 0; background: none; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--hs-nut); outline-offset: 2px; }
.so { font-variant-numeric: tabular-nums; }

/* ── thanh trên (dính) ── */
.thanh { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--nen) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--vien); }
html.may-yeu .thanh { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--nen); }
.thanh-trong { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 6px max(16px, env(safe-area-inset-right)) 6px max(16px, env(safe-area-inset-left)); }
.lui { flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--mat); box-shadow: inset 0 0 0 1px var(--vien), 0 3px 0 var(--bong); }
.thanh-chu { min-width: 0; flex: 1; }
.thanh-chu b { display: block; font-size: 16px; font-weight: 800; line-height: 1.2; }
.thanh-chu span { display: block; font-size: 13.5px; font-weight: 600; color: var(--chu-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thanh-dem { flex: none; font-size: 14px; font-weight: 800; color: var(--hs-chu); background: var(--hs-nhat); min-height: 32px; padding: 4px 12px; border-radius: 999px; display: inline-flex; align-items: center; }
.thanh-tien { position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; transform-origin: left; transform: scaleX(0); background: var(--hs-nut); transition: transform 0.2s; }

/* ── ghi chú bản vẽ (không có trong app thật) ── */
.bv { border: 2px dashed var(--hs-chu); background: var(--hs-nhat); color: var(--hs-chu); border-radius: 14px; padding: 8px 12px; font-size: 14px; font-weight: 700; line-height: 1.4; }
.bv b { font-weight: 800; }
html.khong-ghi .bv { display: none; }
.bv-dai { max-width: 1240px; margin: 12px auto 0; margin-left: max(16px, calc((100% - 1240px) / 2 + 16px)); margin-right: max(16px, calc((100% - 1240px) / 2 + 16px)); }

.nk { max-width: 1240px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }

/* ── BÌA ── */
.bia { position: relative; overflow: hidden; border-radius: 30px; background: var(--hs-go); color: var(--trang); padding: 22px 18px 18px; display: grid; gap: 18px; }
.bia::before, .bia::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; }
.bia::before { right: -18%; top: -40%; width: 64%; padding-top: 64%; background: var(--p-tim-2); opacity: 0.8; }
.bia::after { left: -22%; bottom: -60%; width: 56%; padding-top: 56%; background: var(--p-do); opacity: 0.45; }
.bia > * { position: relative; z-index: 1; min-width: 0; }
.bia-nhan { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; }
.bia-nhan i { width: 8px; height: 8px; border-radius: 50%; background: var(--trang); }
.bia h1 { font-size: clamp(30px, 3.4vw + 14px, 50px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.04; margin: 12px 0 10px; text-wrap: balance; }
.bia-ngay { font-size: 15px; font-weight: 700; opacity: 0.95; }
.bia-loi { font-size: 16px; font-weight: 600; line-height: 1.45; margin-top: 10px; max-width: 46ch; }
.bia-nut { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; margin-top: 18px; padding: 8px 22px; border-radius: 16px; background: var(--trang); color: var(--hs-go); font-size: 16.5px; font-weight: 800; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.18); width: 100%; }
.bia-nut:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18); }
.bia-bang { box-shadow: inset 0 0 0 2px var(--bang-vien), 0 18px 40px rgba(12, 0, 60, 0.35); }

/* ── thân: mục lục + các cảnh ── */
.nk-than { margin-top: 26px; }
.muc { display: none; }
.canh { padding: 22px 0 28px; border-top: 1px solid var(--vien); }
.canh:first-child { border-top: 0; }
.canh-dau { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.canh-so { flex: none; width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; background: var(--hs-nhat); color: var(--hs-chu); font-size: 17px; font-weight: 800; }
.canh-dau h2 { font-size: clamp(20px, 0.9vw + 15px, 26px); font-weight: 800; letter-spacing: -0.015em; line-height: 1.2; text-wrap: balance; }
.canh-loai { display: inline-flex; align-items: center; min-height: 26px; padding: 2px 10px; border-radius: 999px; background: var(--mat-2); color: var(--chu-2); font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.canh[data-khuon='doan-nhanh'] .canh-loai { background: var(--hs-nut); color: var(--trang); }
.canh-than { display: grid; gap: 14px; }
.canh-loi { background: var(--mat-2); border-radius: 22px; padding: 16px 16px 14px; display: flex; flex-direction: column; min-width: 0; }
.loi-tieu { font-size: 14px; font-weight: 800; color: var(--chu-3); margin-bottom: 8px; }
.loi { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.loi li { font-size: 16px; font-weight: 600; line-height: 1.5; color: var(--chu); display: flex; gap: 8px; align-items: baseline; }
.loi li::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--hs); transform: translateY(-2px); }
.loi li b { font-weight: 800; }
.loi .loi-the { flex: none; min-width: 48px; text-align: center; padding: 1px 8px; border-radius: 8px; background: var(--bang); color: var(--phan-vang); font-weight: 800; font-size: 15px; }
.loi li.loi-kl { font-weight: 800; padding: 8px 12px; border-radius: 12px; background: var(--bang); color: var(--m); }
.loi li.loi-kl::before { background: var(--m); }
.canh-nut { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 14px; }
.nut-lai { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 16px 6px 12px; border-radius: 14px; background: var(--mat); box-shadow: inset 0 0 0 1.5px var(--vien-nut); font-size: 15px; font-weight: 700; }
.canh .bv { margin-top: 12px; }
.canh.mot-cot .canh-than { grid-template-columns: minmax(0, 1fr) !important; max-width: 820px; }
.canh.mot-cot .canh-nut { padding-top: 0; }
.chan { margin-top: 18px; padding: 18px 0 0; border-top: 1px solid var(--vien); text-align: center; font-size: 14px; font-weight: 600; color: var(--chu-3); }
.tin { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30; max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 14px; background: var(--chu); color: var(--nen); font-size: 15px; font-weight: 700; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); }
.tin[hidden] { display: none; }
.dang-tai { padding: 40px 0; text-align: center; color: var(--chu-3); font-weight: 700; }

/* điện thoại ngang thấp: bìa hai cột, cảnh hai cột */
@media (orientation: landscape) and (max-height: 520px) {
  .thanh-trong { min-height: 52px; }
  .bia { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); align-items: center; padding: 18px; gap: 16px; }
  .bia h1 { font-size: 28px; }
  .bia-loi { font-size: 15px; }
  .canh-than { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
  .canh { padding: 16px 0 20px; }
  .canh-dau { margin-bottom: 10px; }
  .canh-dau h2 { font-size: 19px; }
}
/* máy tính: mục lục dính bên trái, bìa hai cột, cảnh hai cột */
@media (min-width: 900px) {
  .bia { grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.1fr); align-items: center; padding: 34px 32px 32px 38px; gap: 36px; }
  .bia-nut { width: auto; }
  .canh-than { grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); align-items: start; }
  .canh-loi { position: sticky; top: 84px; }
}
@media (min-width: 1180px) {
  .nk-than { display: grid; grid-template-columns: 228px minmax(0, 1fr); gap: 32px; align-items: start; }
  .muc { display: block; position: sticky; top: 84px; }
  .muc p { font-size: 13.5px; font-weight: 800; color: var(--chu-3); margin: 6px 0 8px 10px; }
  .muc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .muc a { display: flex; gap: 10px; align-items: flex-start; min-height: 44px; padding: 7px 10px; border-radius: 12px; color: var(--chu-2); text-decoration: none; font-size: 14.5px; font-weight: 700; line-height: 1.3; }
  .muc a span { flex: none; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; background: var(--mat-2); font-size: 13px; font-weight: 800; color: var(--chu-3); }
  .muc a[aria-current='true'] { background: var(--hs-nhat); color: var(--hs-chu); }
  .muc a[aria-current='true'] span { background: var(--hs-nut); color: var(--trang); }
  .muc a.da span { background: var(--bang); color: var(--phan-ngoc); }
}
@media (prefers-reduced-motion: reduce) { .thanh-tien { transition: none; } }
</style></head>
<body>
<header class="thanh">
  <div class="thanh-trong">
    <button type="button" class="lui" aria-label="Về buổi live"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="thanh-chu"><b>Nhật ký bài dạy</b><span id="thanh-ten"></span></div>
    <span class="thanh-dem so" id="thanh-dem" aria-live="polite"></span>
  </div>
  <i class="thanh-tien" id="thanh-tien" aria-hidden="true"></i>
</header>
<p class="bv bv-dai" id="bv-dai"><b>Bản vẽ.</b> Đây là trang học sinh thấy SAU khi Thầy duyệt. Ô viền đứt như ô này chỉ có trong bản vẽ.</p>
<main class="nk" id="nk"><p class="dang-tai">Đang mở nhật ký…</p></main>
<p class="tin" id="tin" role="status" hidden></p>
<script src="khuon.js"></script>
<script>
(function () {
  'use strict'
  const q = new URLSearchParams(location.search), N = window.NKB, h = N.h
  if (q.get('mayyeu') === '1') document.documentElement.classList.add('may-yeu')
  if (q.get('ghi') === '0') document.documentElement.classList.add('khong-ghi')
  const TEN_KB = q.get('kb') === 'fes2' ? 'fes2' : 'lien-ket'
  const TUA = q.has('tua'), DUNG = q.get('dung') ? q.get('dung').split(':') : null, CHON = q.get('chon') ? q.get('chon').split(':') : null
  const tin = document.getElementById('tin'); let henTin = 0
  const bao = (t) => { tin.textContent = t; tin.hidden = false; clearTimeout(henTin); henTin = setTimeout(() => { tin.hidden = true }, 2600) }
  const ngayVi = (iso, thu) => { const [y, m, d] = iso.split('-'); return `${thu} ${d}/${m}/${y}` }
  const ICON_LAI = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg>'

  N.taiKichBan(TEN_KB).then(dung).catch((e) => { document.getElementById('nk').innerHTML = '<p class="dang-tai">Chưa tải được nhật ký. Em thử lại.</p>'; console.error(e) })

  function dung(kb) {
    const b = kb.buoi, nk = document.getElementById('nk'), ng = kb.nguongDangDung || 'sgk'
    document.title = `Bản vẽ: Nhật ký bài dạy · ${b.ten}`
    document.getElementById('thanh-ten').textContent = b.ten
    if (kb.mau) document.getElementById('bv-dai').innerHTML = '<b>Bản vẽ.</b> Kịch bản MẪU (không phải buổi thật) để thử cùng thư viện khuôn với một bài tính toán. Ô viền đứt chỉ có trong bản vẽ.'
    // học sinh chỉ thấy cảnh có trên bảng; cảnh đề xuất ngoài bảng chỉ hiện khi Thầy đã chọn đưa vào (duyet.html)
    const ds = kb.canh.filter((c) => !c.deXuat || (kb.duyet && kb.duyet.dua && kb.duyet.dua.includes(c.id)))
    const chot = {}; (kb.canChot || []).forEach((x) => (x.canh || []).forEach((id) => { (chot[id] = chot[id] || []).push(x) }))
    nk.innerHTML = ''
    // BÌA
    const bangBia = h('div', { class: 'bang bia-bang' })
    const bia = h('section', { class: 'bia', 'aria-labelledby': 'bia-ten' }, [
      h('div', { class: 'bia-chu' }, [
        h('p', { class: 'bia-nhan' }, [h('i', { 'aria-hidden': 'true' }), 'Nhật ký bài dạy']),
        h('h1', { id: 'bia-ten', text: b.ten }),
        h('p', { class: 'bia-ngay so', text: `${ngayVi(b.ngay, b.thu)} · ${b.lop}` }),
        h('p', { class: 'bia-loi', text: kb.bia.loi }),
        h('button', { type: 'button', class: 'bia-nut', id: 'bat-dau', html: 'Bắt đầu từ cảnh 1<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>' }),
      ]),
      bangBia,
    ])
    nk.append(bia)
    const dkBia = N.dungCanh(bangBia, null, { id: 'bia', khuon: kb.bia.hoatHoa.khuon, duLieu: kb.bia.hoatHoa.duLieu, tieuDe: b.ten }, { nguong: ng, hat: true })
    // MỤC LỤC + CẢNH
    const than = h('div', { class: 'nk-than' }), muc = h('nav', { class: 'muc', 'aria-label': 'Các cảnh' }), ol = h('ol'), cot = h('div', { class: 'ds-canh' })
    muc.append(h('p', { text: `${ds.length} cảnh` }), ol); than.append(muc, cot); nk.append(than)
    const dk = {}, the = {}
    ds.forEach((c, i) => {
      const a = h('a', { href: '#' + c.id }, [h('span', { class: 'so', text: String(i + 1) }), c.tieuDe]); ol.append(h('li', null, a))
      const bang = h('div', { class: 'bang' }), loi = h('ol', { class: 'loi' })
      const nut = h('button', { type: 'button', class: 'nut-lai', html: ICON_LAI + 'Xem lại cảnh này' })
      // cảnh không có lời giảng riêng (đoán nhanh, tổng kết): bảng một cột, nút xem lại ngay dưới bảng
      const coLoi = !['doan-nhanh', 'tong-ket'].includes(c.khuon) || (c.duLieu.loi && c.duLieu.loi.length)
      const sec = h('section', { class: 'canh' + (coLoi ? '' : ' mot-cot'), id: c.id, 'data-khuon': c.khuon, 'aria-labelledby': c.id + '-ten' }, [
        h('div', { class: 'canh-dau' }, [h('span', { class: 'canh-so so', text: String(i + 1), 'aria-hidden': 'true' }), h('div', null, [h('span', { class: 'canh-loai', text: N.TEN_KHUON[c.khuon] }), h('h2', { id: c.id + '-ten', text: c.tieuDe })])]),
        h('div', { class: 'canh-than' }, [bang, coLoi ? h('aside', { class: 'canh-loi', 'aria-label': 'Thầy giảng' }, [h('p', { class: 'loi-tieu', text: 'Thầy giảng' }), loi, h('div', { class: 'canh-nut' }, nut)]) : (c.khuon === 'tong-ket' ? null : h('div', { class: 'canh-nut' }, nut))]),
      ])
      ;(chot[c.id] || []).forEach((x) => sec.append(h('p', { class: 'bv', html: `<b>Cần Thầy chốt:</b> ${N.h('span', { text: x.hoi }).innerHTML}. Bản vẽ đang hiện phương án «${N.h('span', { text: (x.phuongAn.find((p) => p.ma === x.macDinh) || {}).chu || '' }).innerHTML}».` })))
      cot.append(sec); the[c.id] = { sec, a, i }
      dk[c.id] = N.dungCanh(bang, coLoi ? loi : null, c, { nguong: ng, khiNghe: (giay) => bao(`Mở trình phát Xem lại ở phút ${N.gio(giay)}. Bản vẽ chỉ có nút.`) })
      nut.addEventListener('click', () => { dk[c.id].datLai(); dk[c.id].chay(); daChay.add(c.id) })
    })
    nk.append(h('p', { class: 'chan', text: `Thầy Đỗ Đại Học · chỉ lớp ${b.lop} xem được nhật ký này` }))
    document.getElementById('bat-dau').addEventListener('click', () => { const e = document.getElementById(ds[0].id); if (e) e.scrollIntoView({ behavior: N.GIAM ? 'auto' : 'smooth' }) })

    // ── chạy cảnh khi cuộn tới; cảnh đang xem lên thanh trên ──
    const daChay = new Set(), dem = document.getElementById('thanh-dem'), tien = document.getElementById('thanh-tien')
    const capNhat = (id) => { const t = the[id]; if (!t) return; dem.textContent = `Cảnh ${t.i + 1}/${ds.length}`; tien.style.transform = `scaleX(${(t.i + 1) / ds.length})`; Object.values(the).forEach((x) => x.a.setAttribute('aria-current', x === t ? 'true' : 'false')) }
    dem.textContent = `${ds.length} cảnh`
    if (TUA || DUNG) {
      dkBia.toi(+q.get('bia') || 7700)
      ds.forEach((c) => dk[c.id].cuoi())
      if (DUNG && dk[DUNG[0]]) dk[DUNG[0]].toi(+DUNG[1] || 0)
    } else {
      const lapBia = () => dkBia.chay(() => setTimeout(lapBia, 1600)); lapBia()
      const io = new IntersectionObserver((ent) => {
        ent.forEach((e) => {
          const id = e.target.id
          if (e.isIntersecting && e.intersectionRatio >= 0.35) {
            capNhat(id)
            if (!daChay.has(id)) { daChay.add(id); dk[id].chay(() => the[id].a.classList.add('da')) }
          } else if (!e.isIntersecting) dk[id].dungVong()
        })
      }, { threshold: [0, 0.35, 0.6] })
      ds.forEach((c) => io.observe(the[c.id].sec))
    }
    if (CHON && dk[CHON[0]] && dk[CHON[0]].dieuKhien.traLoi) dk[CHON[0]].dieuKhien.traLoi(+CHON[1] || 0, true)

    else if (TUA) capNhat(ds[0].id)
