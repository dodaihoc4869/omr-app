<style>
/* BẢN VẼ 3D (mô phỏng, KHÔNG phải mã app): MỘT cảnh three.js thật (WebGL) — đúng công nghệ sẽ dùng khi build ⇒ ảnh chụp là hình thật của máy dựng hình,
   không phải tranh vẽ tay. Màu chép đúng biến đang có của phòng chờ: --tr-nen #131f24 · --tr-vien #37464f · --tr-chu #f1f7fb · đội --p-cam / --p-tim-2 /
   --p-xanh / --p-do · --tr-dung #00d497 · --tr-tin #00bfd4 · --tr-sao #ffc735 · mực --p-muc #1a2332. Lớp chữ phủ trên giữ nguyên như bản 2D đang sống. */
@font-face { font-family: 'DDH Rounded'; font-weight: 100 549; src: url('../../src/styles/phong-ddh/ddh-rounded-de-vietnamese.woff2') format('woff2'), url('../../src/styles/phong-ddh/ddh-rounded-de-latin.woff2') format('woff2'); }
@font-face { font-family: 'DDH Rounded'; font-weight: 550 1000; src: url('../../src/styles/phong-ddh/ddh-rounded-dam-vietnamese.woff2') format('woff2'), url('../../src/styles/phong-ddh/ddh-rounded-dam-latin.woff2') format('woff2'); }
:root { --nen:#131f24; --nen-2:#0e181c; --mat:#202f36; --mat-2:#263840; --vien:#37464f; --chu:#f1f7fb; --chu-2:#c4d0d6; --chu-3:#9db0b9;
  --d0:#f59e0b; --d1:#8b5cf6; --d2:#10b981; --d3:#ef4444; --dung:#00d497; --dung-day:#00aa76; --chu-y:#ff9447; --sai:#f7498f; --tin:#00bfd4; --sao:#ffc735; --muc:#1a2332;
  --kinh: color-mix(in srgb, var(--nen) 86%, transparent); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { font-family: 'DDH Rounded', system-ui, sans-serif; background: var(--nen-2); color: var(--chu); font-size: 14px; line-height: 1.35; font-weight: 700; -webkit-font-smoothing: antialiased; }
b, h1, h2 { font-weight: 800; }

#goc, #goc canvas.san { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#phu { position: absolute; inset: 0; pointer-events: none; }
.kinh { background: var(--kinh); border: 2px solid var(--vien); white-space: nowrap; }
.roi { position: absolute; left: 8px; top: 6px; min-height: 44px; padding: 0 12px; border-radius: 12px; font-weight: 700; font-size: 12.5px; color: var(--chu-3); background: color-mix(in srgb, var(--mat) 80%, transparent); }
.am { position: absolute; left: 8px; top: 56px; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--mat) 70%, transparent); color: var(--chu-2); }
.am svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bang { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 5px 12px; border-radius: 14px; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
.bang .o { display: inline-flex; align-items: center; gap: 5px; } .bang .o i { width: 10px; height: 10px; border-radius: 50%; background: var(--doi); }
.bang .o.toi-o { text-decoration: underline; text-decoration-color: var(--doi); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.bang .mo { color: var(--chu-3); font-weight: 700; } .bang .gio { padding-left: 12px; border-left: 2px solid var(--vien); color: var(--chu-2); }
.tin { position: absolute; right: 8px; top: 8px; list-style: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.tin li { padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 500; background: var(--kinh); white-space: nowrap; }
.tin b, .bao b { font-weight: 700; color: color-mix(in srgb, var(--doi) 78%, var(--chu)); }
.nho { position: absolute; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 500; line-height: 1.5; white-space: nowrap; color: var(--chu-2); background: var(--kinh); }
.cho { left: 50%; bottom: 8px; transform: translateX(-50%); } .cho i { display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: var(--chu-y); }
.sc { left: 8px; bottom: 8px; display: flex; align-items: center; gap: 6px; } .sc i { width: 7px; height: 7px; border-radius: 50%; background: var(--vien); } .sc i.co { background: var(--doi); }
.bao { left: 50%; top: 46px; transform: translateX(-50%); border: 1px solid color-mix(in srgb, var(--dung) 60%, var(--vien)); }
.bd { position: absolute; right: 8px; bottom: 8px; width: 138px; border-radius: 12px; padding: 4px 4px 2px; }
.bd svg { display: block; width: 100%; border-radius: 8px; background: var(--nen-2); }
.bd span { display: block; text-align: center; font-size: 12px; font-weight: 500; color: var(--chu-3); line-height: 1.5; }
.nhan { position: absolute; transform: translate(-50%, -100%); text-align: center; white-space: nowrap; font-size: 12.5px; font-weight: 800; text-shadow: 0 0 3px var(--nen-2), 0 0 3px var(--nen-2), 0 1px 2px var(--nen-2); }
.nhan.may { font-weight: 700; color: var(--chu-2); }
.nhan u { display: block; margin: 2px auto 0; width: var(--r, 42px); height: 9px; border-radius: 5px; background: var(--nen-2); padding: 2px; text-decoration: none; }
.nhan u s { display: block; height: 100%; border-radius: 3px; background: var(--mau, var(--dung)); text-decoration: none; }
.nhan img { display: block; margin: 0 auto -1px; width: 20px; height: 25px; }
.so { position: absolute; transform: translate(-50%, -50%); font-size: 15px; font-weight: 800; color: var(--sao); text-shadow: 0 0 4px var(--nen-2), 0 0 4px var(--nen-2); white-space: nowrap; }
@media (max-width: 720px) { .bang { left: auto; right: 8px; transform: none; gap: 9px; padding: 5px 10px; } .bang .gio { padding-left: 9px; } .tin { top: 48px; } .cho { left: 8px; bottom: 30px; transform: none; } .bao { top: 58px; left: 60px; transform: none; } }
/* bảng nhân vật / súng */
.tieu { position: absolute; left: 40px; top: 26px; right: 40px; } .tieu h1 { font-size: 26px; } .tieu p { margin-top: 4px; font-size: 15px; color: var(--chu-2); font-weight: 600; }
.the { position: absolute; transform: translate(-50%, 0); text-align: center; white-space: nowrap; }
.the h2 { font-size: 21px; color: color-mix(in srgb, var(--doi) 70%, var(--chu)); } .the p { font-size: 14px; color: var(--chu-2); font-weight: 600; } .the p b { color: var(--chu); }
.the .ky { display: inline-grid; place-items: center; width: 34px; height: 34px; margin-bottom: 4px; border-radius: 50%; background: var(--doi); color: var(--nen-2); font-weight: 800; }
.chan { position: absolute; left: 40px; right: 40px; bottom: 22px; padding: 10px 16px; border-radius: 16px; background: var(--mat); border: 2px solid var(--vien); font-size: 14px; color: var(--chu-2); font-weight: 600; }
.chan b { color: var(--chu); }
/* máy thầy */
.gv { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 360px; grid-template-rows: auto 1fr auto; gap: 14px 16px; padding: 18px 24px; pointer-events: none; }
.gv .dau { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; }
.vien { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 99px; background: var(--mat-2); font-weight: 800; font-size: 15px; } .vien i { width: 9px; height: 9px; border-radius: 50%; background: var(--chu-y); }
.gv .dong-p { margin-left: auto; min-height: 44px; padding: 0 18px; border-radius: 14px; border: 2px solid color-mix(in srgb, var(--d3) 55%, transparent); color: color-mix(in srgb, var(--d3) 60%, var(--chu)); font-weight: 800; }
.gv .khung { position: relative; border-radius: 18px; overflow: hidden; border: 2px solid var(--vien); min-height: 0; }
.gv .doi-ds { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.gv .doi { flex: 1; padding: 8px 12px; border-radius: 16px; background: color-mix(in srgb, var(--doi) 10%, var(--mat)); border: 2px solid color-mix(in srgb, var(--doi) 55%, var(--vien)); overflow: hidden; }
.gv .doi .h { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; color: color-mix(in srgb, var(--doi) 70%, var(--chu)); }
.gv .doi .h b { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--doi); color: var(--nen-2); font-size: 14px; }
.gv .doi .h span { margin-left: auto; font-size: 13px; color: var(--chu-2); font-weight: 700; }
.gv .doi .ds { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 8px; margin-top: 6px; }
.gv .doi .ds em { font-style: normal; padding: 3px 10px; border-radius: 8px; background: var(--mat-2); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gv .doi .ds em.may { background: none; box-shadow: inset 0 0 0 1.5px var(--vien); color: var(--chu-3); }
.gv .chan2 { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; font-size: 15px; color: var(--chu-2); }
.gv .bat { margin-left: auto; min-height: 56px; padding: 0 40px; border-radius: 16px; background: var(--dung); color: #06281d; font-weight: 800; font-size: 16px; box-shadow: 0 5px 0 var(--dung-day); }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>

<body>
<div id="goc"></div><div id="phu"></div>
<script type="module">
import * as THREE from 'three'
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js'

const Q = new URLSearchParams(location.search), MAN = Q.get('man') || 'tran'
const DOI = [
  { ten: 'Đội Natri', ky: 'Na', nv: 'Ma Natri', mau: '#f59e0b', mo: 'mũ trùm chỏm xoáy' }, { ten: 'Đội Kali', ky: 'K', nv: 'Ma Kali', mau: '#8b5cf6', mo: 'mũ trùm tai mèo' },
  { ten: 'Đội Đồng', ky: 'Cu', nv: 'Ma Đồng', mau: '#10b981', mo: 'mũ trùm mầm lá' }, { ten: 'Đội Canxi', ky: 'Ca', nv: 'Ma Canxi', mau: '#ef4444', mo: 'mũ trùm hai búi tròn' },
]
const SUNG_TEN = ['Súng Hạt', 'Súng Đôi', 'Súng Sấm', 'Pháo Sao']
const M = { nen: '#172a31', nen2: '#0e181c', vien: '#37464f', chu: '#f1f7fb', muc: '#1a2332', dung: '#00d497', tin: '#00bfd4', sao: '#ffc735', kim: '#e8eef2', kim2: '#aab8c2' }
const SR = 1600, SC = 1000, K_NV = 0.74, K_SUNG = 0.9
const mau = (h) => new THREE.Color(h)
const pha = (a, b, t) => mau(a).lerp(mau(b), t)
const vl = (o) => new THREE.MeshStandardMaterial({ roughness: 0.7, metalness: 0, ...o })
const sang = (c, cuong = 1.6) => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: cuong, roughness: 0.4 })

// ── bản đồ: đúng mẫu đối xứng của bản đang sống (src/lib/live-khoi/sinh-ton-loi.ts) ──
const doiXung = (ds) => ds.flatMap(([x, y, w, h]) => { const t = new Set(), kq = []; for (const [a, b] of [[x, y], [SR - x - w, y], [x, SC - y - h], [SR - x - w, SC - y - h]]) { const k = a + ',' + b; if (!t.has(k)) { t.add(k); kq.push([a, b, w, h]) } } return kq })
const TUONG = doiXung([[262, 150, 44, 130], [110, 312, 130, 44], [450, 262, 170, 44], [650, 372, 44, 92], [650, 372, 112, 44], [778, 60, 44, 96]])
const THUNG = doiXung([[372, 424, 54, 54], [566, 104, 54, 54], [60, 473, 54, 54]])
const BUI = doiXung([[340, 150, 150, 92], [205, 452, 130, 96], [715, 190, 170, 86], [470, 620, 140, 90]])
const TRAI = [[130, 122], [1470, 122], [130, 878], [1470, 878]]
const VONG = { rx: 690, ry: 430 }

// ── hoạ tiết vẽ bằng canvas ──
function veCanvas(w, h, ve) { const c = document.createElement('canvas'); c.width = w; c.height = h; ve(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t }
const HT_SAN = veCanvas(1600, 1000, (g, w, h) => {
  g.fillStyle = M.nen; g.fillRect(0, 0, w, h)
  // ô gạch lớn so le hai tông + mạch gạch mờ
  for (let j = 0; j < h / 80; j++) for (let i = 0; i < w / 80; i++) { g.fillStyle = (i + j) % 2 ? 'rgba(255,255,255,.022)' : 'rgba(0,0,0,.05)'; g.fillRect(i * 80, j * 80, 80, 80) }
  g.strokeStyle = 'rgba(241,247,251,.07)'; g.lineWidth = 2
  for (let x = 0; x <= w; x += 80) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke() }
  for (let y = 0; y <= h; y += 80) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke() }
  const q = g.createRadialGradient(w / 2, h / 2, 80, w / 2, h / 2, 900); q.addColorStop(0, 'rgba(120,200,220,.10)'); q.addColorStop(1, 'rgba(0,0,0,.22)'); g.fillStyle = q; g.fillRect(0, 0, w, h)
})
const HT_QUANG = veCanvas(128, 128, (g) => { const q = g.createRadialGradient(64, 64, 2, 64, 64, 64); q.addColorStop(0, 'rgba(255,255,255,1)'); q.addColorStop(0.25, 'rgba(255,255,255,.55)'); q.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = q; g.fillRect(0, 0, 128, 128) })
const HT_VONG = veCanvas(8, 128, (g) => { const q = g.createLinearGradient(0, 0, 0, 128); q.addColorStop(0, 'rgba(255,255,255,0)'); q.addColorStop(0.75, 'rgba(255,255,255,.35)'); q.addColorStop(1, 'rgba(255,255,255,.95)'); g.fillStyle = q; g.fillRect(0, 0, 8, 128) })
const LUA = ['M32 4C35 17 50 25 54 40c4 17-7 34-22 34S6 57 10 40c2-8 7-12 9-19 3 7 6 10 9 11-1-10 1-19 4-28z', 'M32 28c2 9 12 14 14 24 2 12-5 21-14 21s-16-9-14-21c1-5 4-9 6-13 1 4 3 7 6 8-1-7 0-13 2-19z', 'M32 47c2 6 8 9 8 16a8 8 0 0 1-16 0c0-7 6-10 8-16z']
const canvasLua = (c) => { const cv = document.createElement('canvas'); cv.width = 128; cv.height = 160; const g = cv.getContext('2d'); g.scale(2, 2); g.lineWidth = 5; g.strokeStyle = M.nen2; g.stroke(new Path2D(LUA[0])); g.fillStyle = c; g.fill(new Path2D(LUA[0])); g.fillStyle = '#' + pha(c, M.sao, 0.6).getHexString(); g.fill(new Path2D(LUA[1])); g.fillStyle = '#' + pha('#ffffff', M.sao, 0.4).getHexString(); g.fill(new Path2D(LUA[2])); return cv }
const quang = (c, co, dam = 0.9) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: HT_QUANG, color: c, transparent: true, opacity: dam, blending: THREE.AdditiveBlending, depthWrite: false })); s.scale.set(co, co, 1); return s }
const datCho = (o, x, y, z) => { o.position.set(x, y, z); return o }
const bong = (m) => { m.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true } }); return m }

// ── BÉ MA 3D (gốc = mặt đất dưới chân, mặt quay về +z) ──
const gau = (g) => { const p = g.attributes.position; for (let i = 0; i < p.count; i++) { const y = p.getY(i); if (y < 15) { const goc = Math.atan2(p.getZ(i), p.getX(i)); p.setY(i, y - 5 * Math.abs(Math.sin(goc * 3)) * (1 - y / 15)) } } g.computeVertexNormals(); return g }
function ma(doi, o = {}) {
  const c = DOI[doi].mau, G = new THREE.Group()
  const ao = vl({ color: pha(c, '#ffffff', 0.92), side: THREE.DoubleSide, roughness: 0.82 }), mMau = vl({ color: c, roughness: 0.55 }), mToi = vl({ color: pha(c, M.muc, 0.36) }), mNhat = vl({ color: pha(c, '#ffffff', 0.6), side: THREE.DoubleSide })
  const them = (hinh, vat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(hinh, vat); m.position.set(x, y, z); G.add(m); return m }
  // áo choàng (hình tiện tròn xoay, gấu áo sáu múi) + mũ trùm tròn; mặt màu đội lồi ra qua miệng mũ
  const duong = new THREE.SplineCurve([[15, 52], [21, 47], [25, 40], [26.5, 30], [28.5, 20], [30.5, 10], [31.5, 3]].map(([r, y]) => new THREE.Vector2(r, y))).getPoints(28)
  them(gau(new THREE.LatheGeometry(duong, 64)), ao)
  them(new THREE.TorusGeometry(29.4, 1.9, 10, 64), mMau, 0, 21, 0).rotation.x = Math.PI / 2 // viền gấu áo màu đội
  them(gau(new THREE.LatheGeometry(new THREE.SplineCurve([[19, 49], [25, 44], [29.5, 36], [31.5, 30], [32, 27.5]].map(([r, y]) => new THREE.Vector2(r, y))).getPoints(16), 64)), mNhat) // áo khoác vai
  them(new THREE.SphereGeometry(25, 48, 36), ao, 0, 63, 0).scale.set(1, 1.04, 1) // mũ trùm
  them(new THREE.SphereGeometry(18.6, 40, 30), vl({ color: c, roughness: 0.4, emissive: c, emissiveIntensity: 0.2 }), 0, 61, 9.4).scale.set(1, 0.98, 0.95) // mặt màu đội
  const vanh = them(new THREE.TorusGeometry(14.4, 2.3, 12, 48), mToi, 0, 61, 20.6); vanh.scale.set(1, 0.98, 1) // vành miệng mũ
  for (const s of [-1, 1]) {
    them(new THREE.SphereGeometry(3.5, 18, 14), vl({ color: M.muc, roughness: 0.2 }), s * 5.9, 61.5, 25.9).scale.set(1, 1.42, 0.5)
    them(new THREE.SphereGeometry(1.3, 10, 8), vl({ color: '#ffffff', emissive: '#ffffff', emissiveIntensity: 0.7 }), s * 5.9 + 1.2, 63.8, 27.4)
    them(new THREE.SphereGeometry(2.7, 14, 10), mNhat, s * 10, 54.8, 23.8).scale.set(1, 0.6, 0.35)
    them(new THREE.SphereGeometry(5.6, 16, 12), ao, s * 28, 30, 5) // tay
  }
  them(new THREE.SphereGeometry(4.4, 16, 12), new THREE.MeshStandardMaterial({ color: M.sao, metalness: 0.6, roughness: 0.3 }), 0, 41, 25.4)
  // mũ trùm riêng từng đội
  if (doi === 0) {
    const d = new THREE.CatmullRomCurve3([new THREE.Vector3(-2, 84, 0), new THREE.Vector3(-5, 96, 0), new THREE.Vector3(3, 105, 0), new THREE.Vector3(13, 100, 0)])
    them(new THREE.TubeGeometry(d, 24, 6.4, 16), ao); them(new THREE.SphereGeometry(5.4, 16, 12), mMau, 15, 99.5, 0)
  } else if (doi === 1) for (const s of [-1, 1]) {
    const tai = them(new THREE.ConeGeometry(9.5, 26, 24), ao, s * 16, 91, 0); tai.rotation.z = -s * 0.36
    const trong = them(new THREE.ConeGeometry(5.4, 16, 16), mMau, s * 16, 89.5, 4.8); trong.rotation.z = -s * 0.36
  } else if (doi === 2) {
    them(new THREE.CylinderGeometry(1.5, 1.5, 11, 8), mMau, 0, 93, 0)
    for (const s of [-1, 1]) { const la = them(new THREE.SphereGeometry(10, 18, 12), mMau, s * 9.5, 101, 0); la.scale.set(1, 0.3, 0.6); la.rotation.z = s * 0.5 }
  } else for (const s of [-1, 1]) { them(new THREE.SphereGeometry(9.4, 18, 14), ao, s * 19, 83, 0); them(new THREE.SphereGeometry(4.6, 14, 10), mMau, s * 19, 83, 6.8) }
  // quai đeo chéo vai
  them(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(-17, 45, 17), new THREE.Vector3(2, 37, 27), new THREE.Vector3(26, 28, 12)]), 16, 2.1, 8), vl({ color: pha(c, M.muc, 0.55) }))
  if (o.may) { const cot = them(new THREE.CylinderGeometry(1.2, 1.2, 19, 8), vl({ color: '#c4d0d6' }), -19, 92, 0); cot.rotation.z = 0.42; them(new THREE.SphereGeometry(5, 14, 10), sang(M.tin, 1.4), -23, 102, 0) }
  G.scale.setScalar(K_NV)
  return bong(G)
}

// ── BỐN CẤP SÚNG 3D (chĩa +x, gốc = khớp đeo) ──
function sung(cap, doi, ban) {
  const c = DOI[doi].mau, G = new THREE.Group()
  const kim = new THREE.MeshStandardMaterial({ color: M.kim, metalness: 0.55, roughness: 0.28 }), mMau = new THREE.MeshStandardMaterial({ color: c, metalness: 0.35, roughness: 0.38 }), toi = new THREE.MeshStandardMaterial({ color: pha(c, M.muc, 0.42), metalness: 0.5, roughness: 0.4 }), den = new THREE.MeshStandardMaterial({ color: M.muc, metalness: 0.6, roughness: 0.35 })
  const them = (h, v, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(h, v); m.position.set(x, y, z); G.add(m); return m }
  const tru = (r1, r2, dai, v, x, y = 0, z = 0) => { const m = them(new THREE.CylinderGeometry(r1, r2, dai, 24), v, x, y, z); m.rotation.z = -Math.PI / 2; return m }
  let nong = 44
  if (cap === 1) {

function dan(scene, x0, z0, x1, z1, f, doi, cap) {

    duoi.rotation.z = Math.PI / 2; duoi.rotation.y = -Math.atan2(uz, ux) + Math.PI; them(duoi, bx - ux * 30, bz - uz * 30)

  }
}
