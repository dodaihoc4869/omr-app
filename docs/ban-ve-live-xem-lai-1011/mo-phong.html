:root{
  /* bảng màu tờ chiếu (chép từ src/lib/giao-dien-to-chieu.ts, như bản vẽ Live) */
  --mc-bang:#15181c;--mc-bang-chu:#f4efe4;--mc-bang-phu:rgba(244,239,228,.62);--mc-bang-vien:rgba(244,239,228,.22);--mc-bang-nut:rgba(244,239,228,.14);
  --mc-giay:#f4efe4;--mc-chu:#22262b;--mc-phu:#5b6168;--mc-nhan:#0b57d0;--mc-chip:#d3e3fd;--mc-chip-chu:#041e49;--mc-the:#e7e1d3;
  --mc-thanh-nen:#22262b;--mc-lam-nen:#c4eed0;--mc-lam-chu:#072100;--mc-qua-nen:#fdd663;--mc-qua-chu:#3b2f00;--mc-do:rgb(197,34,31);--mc-chua-nen:#c2e7ff;
}
:root[data-giay="toi"]{--mc-giay:#23282d;--mc-chu:#f4efe4;--mc-phu:#bfc5cb;--mc-nhan:#a8c7fa;--mc-chip:#1b3556;--mc-chip-chu:#d3e3fd;--mc-the:#2f353b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{color-scheme:light dark}
body{font-family:var(--sans);font-weight:500;color:var(--tr-chu);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[data-trong='gv'] body{background:var(--tr-nen)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
h1,h2,h3,p{margin:0}
sub{font-size:.72em;line-height:0}
svg{flex:none}
.so{font-variant-numeric:tabular-nums}
/* ══ dùng chung ══ */
.kinh{background:var(--kinh-ve);border-radius:26px;box-shadow:inset 0 1px 0 var(--kinh-vien),inset 0 0 0 1px var(--kinh-vien-2),var(--kinh-bong)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;background:var(--tr-mat-2);color:var(--tr-chu-2)}
.chip.chinh{background:var(--tr-chinh-nhat);color:var(--tr-chinh-chu)}
.chip.dung{background:var(--tr-dung-nhat);color:var(--tr-dung-chu)}
.chip.sai{background:var(--tr-sai-nhat);color:var(--tr-sai-chu)}
.chip.chuy{background:var(--tr-chu-y-nhat);color:var(--tr-chu-y-chu)}
.chip.sao{background:var(--tr-sao-nhat);color:var(--tr-sao-chu)}
.chip.doi{background:color-mix(in oklab,var(--doi) 20%,var(--tr-mat));color:var(--tr-chu);box-shadow:inset 0 0 0 1.5px var(--doi)}
.cham{width:10px;height:10px;border-radius:50%;background:var(--doi);flex:none}
.nut{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;font-size:16px;font-weight:700;white-space:nowrap}
.nut.chinh{background:var(--tr-chinh-nut);color:var(--tr-tren-chinh)}
.nut.vien{background:var(--tr-mat);color:var(--tr-chu);box-shadow:inset 0 0 0 1.5px var(--tr-vien-2)}
.nut.do{background:var(--tr-sai-chu);color:var(--tr-trang)}
/* bảng đen thu nhỏ (ảnh bìa một đoạn) */
.bia{position:relative;border-radius:18px;background:var(--mc-bang);overflow:hidden;aspect-ratio:16/8.2;display:block;width:100%}
.bia svg.net{position:absolute;inset:0;width:100%;height:100%}
.bia .giay-nho{position:absolute;left:2.2%;top:4%;bottom:4%;width:60%;border-radius:10px;background:var(--mc-giay)}
.bia .giay-nho i{position:absolute;left:8%;height:5.5%;border-radius:4px;background:color-mix(in srgb,var(--mc-chu) 26%,transparent)}
.bia .phat{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;display:grid;place-items:center;background:var(--mc-bang-chu);color:var(--mc-bang);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.bia .dai{position:absolute;right:10px;bottom:10px;height:26px;padding:0 10px;border-radius:999px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;background:rgba(0,0,0,.62);color:var(--mc-bang-chu)}
.bia .nhan{position:absolute;left:10px;top:10px;height:26px;padding:0 10px;border-radius:999px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;background:var(--mc-qua-nen);color:var(--mc-qua-chu)}
.net text{font-family:var(--sans);font-weight:600;font-style:italic}
.net .trang{fill:#f4efe4}.net .vang{fill:#fdd663}.net .lam{fill:#c2e7ff}
.net path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.net .s-trang{stroke:#f4efe4}.net .s-vang{stroke:#fdd663}.net .s-lam{stroke:#c2e7ff}

/* ══ APP HỌC SINH ══ */
.hs-trang{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 128px}
.hs-dau{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.hs-lui{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--kinh-mat-dam);box-shadow:inset 0 0 0 1px var(--kinh-vien-2),var(--tr-bong-2);color:var(--tr-chu)}
.hs-dau h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.hs-dau p{font-size:14px;color:var(--tr-chu-3);font-weight:600}
/* thanh nổi (đúng bố cục thanh kính đang có: Hôm nay · Kiểm tra · Thành tích · Thêm + nút A.I) */
.hs-thanh{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:10px}
.hs-thanh-ds{display:flex;gap:2px;padding:6px;border-radius:34px;background:var(--kinh-mat-dam);-webkit-backdrop-filter:var(--kinh-mo);backdrop-filter:var(--kinh-mo);box-shadow:inset 0 1px 0 var(--kinh-vien),inset 0 0 0 1px var(--kinh-vien-2),var(--kinh-bong)}
.hs-thanh-muc{width:72px;height:56px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:700;color:var(--tr-chu-2);position:relative}
.hs-thanh-muc[aria-current]{background:var(--tr-hs-nhat);color:var(--tr-hs-chu)}
.hs-thanh-muc.mo{color:var(--tr-hs-chu)}
.hs-thanh-ai{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--kinh-mat-dam);box-shadow:inset 0 1px 0 var(--kinh-vien),inset 0 0 0 1px var(--kinh-vien-2),var(--kinh-bong);color:var(--tr-tim-chu)}
.hs-phu{position:fixed;inset:0;z-index:20;background:color-mix(in oklab,var(--tr-chu) 22%,transparent)}
/* tấm «Thêm» */
.hs-them{position:fixed;left:10px;right:10px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:25;max-width:440px;margin:0 auto;padding:14px 12px 12px;border-radius:28px;display:flex;flex-direction:column;gap:10px;background:var(--kinh-mat-dam);-webkit-backdrop-filter:var(--kinh-mo);backdrop-filter:var(--kinh-mo);box-shadow:inset 0 1px 0 var(--kinh-vien),inset 0 0 0 1px var(--kinh-vien-2),var(--tr-bong-3)}
.hs-them>b{font-size:22px;font-weight:800;padding:2px 8px 0;line-height:1.2;letter-spacing:-.02em}
.hs-so{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.hs-so div{border-radius:16px;padding:8px 4px 7px;text-align:center;background:var(--kinh-ve);box-shadow:inset 0 0 0 1px var(--kinh-vien-2)}
.hs-so b{display:block;font-size:17px;font-weight:800}
.hs-so span{font-size:11.5px;color:var(--tr-chu-3);font-weight:600}
.hs-menu{padding:4px;border-radius:22px;background:var(--kinh-ve);box-shadow:inset 0 1px 0 var(--kinh-vien),inset 0 0 0 1px var(--kinh-vien-2),var(--kinh-bong);display:flex;flex-direction:column}
.hs-muc{min-height:52px;padding:6px 10px;display:flex;align-items:center;gap:12px;font-size:16px;font-weight:700;text-align:left;border-radius:18px;width:100%}
.hs-muc+.hs-muc{box-shadow:0 -1px 0 color-mix(in oklab,var(--tr-vien) 70%,transparent);border-radius:0 0 18px 18px}
.hs-o{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--tr-hs-nut);color:var(--tr-trang)}
.hs-o[data-sac='chu-y']{background:var(--tr-chu-y)}
.hs-o[data-sac='tin']{background:var(--tr-tin)}
.hs-o[data-sac='xam']{background:var(--tr-mat-3);color:var(--tr-chu-2)}
.hs-muc .day{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--tr-chu-3)}
/* nền «Hôm nay» phía sau tấm Thêm */
.hs-chao{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.hs-chao i{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:16px;background:var(--tr-hs-nhat);color:var(--tr-hs-chu)}
.hs-chao small{display:block;font-size:13.5px;color:var(--tr-chu-3);font-weight:600}
.hs-chao b{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hs-gia{padding:18px;margin-bottom:12px}
.hs-gia small{font-size:12.5px;font-weight:800;letter-spacing:.06em;color:var(--tr-chu-3)}
.hs-gia b{display:block;font-size:40px;font-weight:800;line-height:1.1}
.hs-gia b span{font-size:22px;color:var(--tr-chu-3)}
.hs-gia p{color:var(--tr-chu-2);font-weight:600;margin-top:4px}
/* danh sách buổi live */
.hs-noi{padding:12px;margin-bottom:18px}
.hs-noi h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:12px 4px 2px}
.hs-noi .phu{font-size:14px;color:var(--tr-chu-3);font-weight:600;margin:0 4px 10px}
.hs-noi .hang{display:flex;flex-wrap:wrap;gap:6px;margin:0 4px 12px}
.hs-noi .nut{width:100%}
.hs-thang{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tr-chu-3);margin:0 6px 8px}
.hs-ds{padding:4px;margin-bottom:18px;display:flex;flex-direction:column}
.hs-buoi{min-height:76px;padding:10px 8px 10px 10px;display:flex;align-items:center;gap:12px;text-align:left;width:100%;border-radius:20px}
.hs-buoi+.hs-buoi{box-shadow:0 -1px 0 color-mix(in oklab,var(--tr-vien) 70%,transparent);border-radius:0 0 20px 20px}
.hs-ngay{width:52px;height:56px;border-radius:16px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--tr-hs-nhat);color:var(--tr-hs-chu);line-height:1.1}
.hs-ngay small{font-size:11.5px;font-weight:700}
.hs-ngay b{font-size:20px;font-weight:800}
.hs-buoi .giua{flex:1;min-width:0}
.hs-buoi .giua b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:16px;font-weight:700;line-height:1.25}
.hs-buoi .giua span{display:block;font-size:13.5px;color:var(--tr-chu-3);font-weight:600;margin-top:2px}
.hs-buoi .mui{color:var(--tr-chu-3)}
.hs-trong{padding:28px 20px;text-align:center}
.hs-trong .hinh{width:84px;height:84px;border-radius:28px;margin:0 auto 14px;display:grid;place-items:center;background:var(--tr-hs-nhat);color:var(--tr-hs-chu)}
.hs-trong b{display:block;font-size:19px;font-weight:800;margin-bottom:6px}
.hs-trong p{color:var(--tr-chu-2);font-weight:500;max-width:300px;margin:0 auto 16px}
.hs-xuly{padding:14px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center}
.hs-xuly .vong{width:40px;height:40px;border-radius:50%;flex:none;background:conic-gradient(var(--tr-hs-nut) 62%,var(--tr-mat-3) 0);display:grid;place-items:center}
.hs-xuly .vong i{width:28px;height:28px;border-radius:50%;background:var(--tr-mat)}
.hs-xuly b{display:block;font-size:15.5px;font-weight:700}
.hs-xuly span{font-size:13.5px;color:var(--tr-chu-3);font-weight:600}
.hs-bao{padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;border-radius:18px;background:var(--tr-chu-y-nhat);color:var(--tr-chu-y-chu);font-weight:600;font-size:14px}
/* trang buổi live */
.lv-bia{position:relative;border-radius:30px;padding:22px 20px 20px;color:#fff;overflow:hidden;margin-bottom:14px;
  background:radial-gradient(90% 70% at 100% 0%,color-mix(in oklab,var(--p-tim-2) 85%,transparent),transparent 70%),radial-gradient(80% 70% at 0% 100%,color-mix(in oklab,var(--p-do) 55%,transparent),transparent 70%),radial-gradient(60% 60% at 100% 100%,color-mix(in oklab,var(--p-cam) 50%,transparent),transparent 70%),var(--tr-hs-go)}
.lv-bia .vet{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
.lv-bia>*{position:relative}
.lv-bia .tren{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;opacity:.92}
.lv-bia .tren i{width:8px;height:8px;border-radius:50%;background:#fff}
.lv-bia h1{font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.08;margin:10px 0 6px}
.lv-bia p{font-size:15px;font-weight:600;opacity:.95}
.lv-so{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:18px 0 16px}
.lv-so div{border-radius:18px;padding:10px 6px;text-align:center;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.lv-so b{display:block;font-size:24px;font-weight:800;line-height:1.1}
.lv-so span{white-space:nowrap;font-size:12.5px;font-weight:600;opacity:.95}
.lv-bia .nut{width:100%;background:#fff;color:var(--tr-hs-go);min-height:52px;font-size:16.5px}
.lv-the{padding:16px;margin-bottom:14px}
.lv-the h2{font-size:18px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.lv-the h2 small{margin-left:auto;font-size:13px;font-weight:600;color:var(--tr-chu-3)}
/* dòng thời gian */
.lv-tg{display:flex;gap:3px;height:44px}
.lv-tg i{display:block;height:100%;background:var(--tr-mat-3);position:relative}
.lv-tg i.chua{background:var(--doi)}
.lv-tg i.chua b{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:13.5px;font-weight:800;color:var(--p-muc)}
.lv-tg{position:relative;overflow:visible;margin-top:14px}.lv-tg i:first-child{border-radius:14px 0 0 14px}.lv-tg i:last-child{border-radius:0 14px 14px 0}
.lv-tg i.hay::after{content:'';position:absolute;left:50%;top:-13px;margin-left:-7px;border:7px solid transparent;border-top-color:var(--tr-sao-chu)}
.lv-tg-chu{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tr-chu-3);font-weight:600;margin-top:6px}
.lv-chu-giai{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--tr-chu-2);font-weight:600}
.lv-chu-giai span{display:inline-flex;align-items:center;gap:6px}
.lv-chu-giai i{width:14px;height:14px;border-radius:5px;background:var(--tr-mat-3)}
/* bảng vàng */
.lv-thang{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:color-mix(in oklab,var(--doi) 22%,var(--tr-mat));box-shadow:inset 0 0 0 2px var(--doi);margin-bottom:12px}
.lv-thang .cup{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--doi);color:var(--p-muc)}
.lv-thang b{display:block;font-size:19px;font-weight:800;line-height:1.15}
.lv-thang span{font-size:13.5px;font-weight:600;color:var(--tr-chu-2)}
.lv-doi{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px 10px;font-size:14px;font-weight:700}
.lv-doi .ten{display:flex;align-items:center;gap:7px;white-space:nowrap}
.lv-doi .thanh{height:14px;border-radius:7px;background:var(--tr-mat-3);overflow:hidden}
.lv-doi .thanh i{display:block;height:100%;border-radius:7px;background:var(--doi)}
.lv-doi .kj{font-weight:800;white-space:nowrap}
.lv-top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.lv-top div{border-radius:18px;padding:10px 8px;text-align:center;background:var(--tr-mat-2);min-width:0}
.lv-top i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;margin:0 auto 4px;font-style:normal;font-size:13px;font-weight:800;background:var(--tr-sao);color:var(--p-muc)}
.lv-top b{display:block;font-size:13.5px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-top span{font-size:13px;font-weight:800;color:var(--tr-sao-chu)}
.lv-chuoi{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:16px;background:var(--tr-chu-y-nhat);color:var(--tr-chu-y-chu);font-size:14px;font-weight:700}
/* thẻ câu */
.lv-cau-dau{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.lv-cau-dau .so-cau{height:30px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;font-size:14px;font-weight:800;background:var(--tr-hs-nut);color:var(--tr-trang)}
.lv-cau-dau .em{margin-left:auto}
.lv-de{font-size:16.5px;font-weight:500;line-height:1.45;margin-bottom:10px}
.lv-pa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:12px}
.lv-pa div{min-height:44px;padding:8px 12px;border-radius:14px;background:var(--tr-mat-2);font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px;min-width:0}
.lv-pa div b{font-weight:800;color:var(--tr-chu-3)}
.lv-pa div.dung{background:var(--tr-dung-nhat);color:var(--tr-dung-chu);box-shadow:inset 0 0 0 2px var(--tr-dung)}
.lv-pa div.dung b{color:var(--tr-dung-chu)}
.lv-pa div.dung svg{margin-left:auto}
.lv-dap{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--tr-dung-nhat);color:var(--tr-dung-chu);font-weight:700;margin-bottom:12px;box-shadow:inset 0 0 0 2px var(--tr-dung)}
.lv-dap b{font-size:20px;font-weight:800}
.lv-lop{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:14px;font-weight:700;margin-bottom:12px}
.lv-lop .thanh{grid-column:1/-1;height:10px;border-radius:5px;background:var(--tr-mat-3);overflow:hidden}
.lv-lop .thanh i{display:block;height:100%;border-radius:5px;background:var(--tr-dung)}
.lv-lop span{color:var(--tr-chu-3);font-weight:600}
.lv-len{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:14px;font-weight:600;color:var(--tr-chu-2)}
.lv-len b{color:var(--tr-chu);font-weight:700}
.lv-mo{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;margin-top:10px;padding:0 14px;border-radius:14px;background:var(--tr-mat-2);font-size:15px;font-weight:700}
.lv-hay{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;margin-top:8px;padding:6px 12px;border-radius:14px;background:var(--tr-sao-nhat);color:var(--tr-sao-chu);font-size:14.5px;font-weight:700;text-align:left}
.lv-hay .ly{flex:1;min-width:0;line-height:1.3}.lv-hay{margin:0 0 10px}
.lv-ten-doan{font-size:15px;font-weight:700;margin-top:10px;line-height:1.3}
.lv-nen{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;margin-top:10px;padding:8px 12px;border-radius:16px;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);font-size:14px;font-weight:700;text-align:left;color:#fff;line-height:1.3}
.lv-nen span{flex:1;min-width:0}
.lv-chan{text-align:center;font-size:13px;color:var(--tr-chu-3);font-weight:600;padding:6px 0 0}
/* máy tính: trang buổi live hai cột */
.mt{max-width:1240px;margin:0 auto;padding:28px 32px 60px;display:grid;grid-template-columns:400px minmax(0,1fr);gap:24px;align-items:start}
.mt .trai{position:sticky;top:28px}
.mt .lv-bia h1{font-size:38px}
.mt-dau{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.mt-dau b{font-size:15px;font-weight:700;color:var(--tr-chu-2)}
.mt .phai .lv-the{padding:20px}
.mt-phat{border-radius:22px;overflow:hidden;background:var(--mc-bang);margin-bottom:12px}
.mt-khung{position:relative;aspect-ratio:1600/820;overflow:hidden}
.mt-phat .ph-lop{position:static}.mt-phat .ph-day{position:static;background:var(--mc-thanh-nen);padding:12px 16px 10px}
.mt-hai{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
/* ngang thấp (điện thoại xoay ngang) + máy tính: thanh nổi thành ray trái như app thật */
@media (orientation:landscape) and (max-height:520px),(min-width:900px){
  .hs-thanh{left:max(12px,env(safe-area-inset-left));top:50%;bottom:auto;transform:translateY(-50%);flex-direction:column}
  .hs-thanh-ds{flex-direction:column}
  .hs-them{left:104px;right:auto;top:12px;bottom:12px;width:min(380px,calc(100vw - 120px));margin:0;overflow:auto}
  .hs-trang{max-width:760px;padding-left:112px;padding-bottom:24px}
}
@media (orientation:landscape) and (max-height:520px){
  .hs-thanh-muc{width:56px;height:48px;font-size:0;gap:0}
  .hs-thanh-ds{padding:4px}.hs-thanh-ai{width:52px;height:52px}
  .hs-them{left:84px}
  .hs-trang{max-width:none;padding-left:92px;padding-right:20px}
  .hs-hai{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
}
@media (min-width:900px){.hs-trang{margin:0 auto;padding-top:28px}}

/* ══ TRÌNH PHÁT MỘT ĐOẠN (ngang, phủ kín) ══ */
.ph{position:fixed;inset:0;background:var(--mc-bang);overflow:hidden;color:var(--mc-bang-chu)}
.ph-xoay{position:absolute;left:0;top:0;transform-origin:0 0}
.ph-chieu{position:absolute;left:0;top:0;width:1600px;height:820px;transform-origin:0 0}
.ph-giay{position:absolute;left:12px;top:12px;width:1042px;height:796px;border-radius:28px;background:var(--mc-giay);color:var(--mc-chu);overflow:hidden}
.ph-giay .chip1{position:absolute;top:36px;left:44px;height:52px;padding:0 24px;border-radius:26px;display:flex;align-items:center;font-size:28px;font-weight:800;background:var(--mc-chip);color:var(--mc-chip-chu)}
.ph-giay .chip2{position:absolute;top:36px;left:204px;height:52px;padding:0 24px;border-radius:26px;display:flex;align-items:center;font-size:26px;font-weight:600;background:var(--mc-the);color:var(--mc-phu)}
.ph-giay .de{position:absolute;left:44px;right:44px;top:132px;font-size:47px;font-weight:600;line-height:1.36}
.ph-giay .tra{position:absolute;left:44px;top:560px;display:flex;align-items:center;gap:20px;font-size:38px;font-weight:700}
.ph-giay .tra span{height:76px;padding:0 30px;border-radius:22px;display:flex;align-items:center;background:var(--mc-lam-nen);color:var(--mc-lam-chu);font-weight:800}
.ph-bang{position:absolute;left:1066px;top:12px;width:522px;height:796px}
.ph-bang svg{position:absolute;inset:0;width:100%;height:100%}
.ph-ten{position:absolute;left:1066px;top:20px;width:522px;display:flex;justify-content:center}
.ph-ten span{padding:8px 26px;border-radius:20px;background:var(--mc-giay);color:var(--mc-chu);font-size:34px;font-weight:700;white-space:nowrap;box-shadow:0 0 0 4px var(--doi)}
.ph-tro{position:absolute;width:26px;height:26px;border-radius:50%;margin:-13px 0 0 -13px;background:rgba(253,214,99,.3);box-shadow:0 0 0 2px #fdd663}
/* lớp điều khiển (theo điểm ảnh màn, không co theo bảng) */
.ph-lop{position:absolute;inset:0;pointer-events:none;color:var(--mc-bang-chu)}
.ph-lop>*{pointer-events:auto}
.ph-tren{position:absolute;left:max(12px,env(safe-area-inset-left));top:10px;right:max(12px,env(safe-area-inset-right));display:flex;align-items:center;gap:8px}
.ph-vien{height:40px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;background:rgba(21,24,28,.82);color:var(--mc-bang-chu);box-shadow:inset 0 0 0 1px var(--mc-bang-vien);white-space:nowrap;min-width:0}
.ph-vien b{font-weight:800}
.ph-vien .mo{overflow:hidden;text-overflow:ellipsis}
.ph-dong{margin-left:auto;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(21,24,28,.82);color:var(--mc-bang-chu);box-shadow:inset 0 0 0 1px var(--mc-bang-vien)}
.ph-day{position:absolute;left:0;right:0;bottom:0;padding:34px max(14px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:linear-gradient(to top,rgba(10,12,14,.95) 70%,rgba(10,12,14,0))}
.ph-ten-doan{display:flex;align-items:center;gap:8px;font-size:14.5px;margin-bottom:4px}.ph-ten-doan b{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ph-ten-doan span{margin-left:auto;font-weight:700;color:var(--mc-bang-phu);white-space:nowrap}
.ph-tua{display:flex;gap:4px;align-items:flex-end;height:30px}
.ph-tua .khuc{position:relative;height:30px;display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.ph-tua .khuc small{font-size:11.5px;font-weight:700;color:var(--mc-bang-phu);white-space:nowrap;margin-bottom:5px}
.ph-tua .khuc.nay small{color:var(--mc-bang-chu)}
.ph-tua .ray{height:8px;border-radius:4px;background:var(--mc-bang-nut);position:relative}
.ph-tua .ray i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--doi)}
.ph-tua .ray.xong{background:var(--mc-bang-phu)}
.ph-tua .ray u{position:absolute;top:-5px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--doi) 45%,transparent)}
.ph-tua .ray s{position:absolute;top:-9px;margin-left:-6px;border:6px solid transparent;border-top-color:#fdd663}
.ph-nut{display:flex;align-items:center;gap:6px;margin-top:6px}
.ph-n{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--mc-bang-chu)}
.ph-n.chinh{background:var(--mc-bang-chu);color:var(--mc-bang)}
.ph-gio{font-size:14.5px;font-weight:700;margin:0 8px;white-space:nowrap}
.ph-gio span{color:var(--mc-bang-phu)}
.ph-td{margin-left:auto;display:flex;align-items:center;gap:4px;padding:3px;border-radius:999px;background:var(--mc-bang-nut)}
.ph-td button{min-width:50px;height:48px;padding:0 8px;border-radius:999px;font-size:14.5px;font-weight:800;color:var(--mc-bang-phu)}
.ph-td button i{font-style:normal;font-weight:600;font-size:1.2em;margin-left:1px}
.ph-td button[aria-pressed='true']{background:var(--mc-bang-chu);color:var(--mc-bang)}
.ph-lang{height:48px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;background:var(--mc-bang-nut);color:var(--mc-bang-chu);white-space:nowrap}
.ph-lang i{width:30px;height:18px;border-radius:9px;background:var(--mc-lam-nen);position:relative}
.ph-lang i::after{content:'';position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--mc-lam-chu)}
.ph-giua{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-60px 0 0 -42px;border-radius:50%;display:grid;place-items:center;background:var(--mc-bang-chu);color:var(--mc-bang);box-shadow:0 12px 40px rgba(0,0,0,.55)}
.ph-luoc{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;height:34px;padding:0 14px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;background:rgba(21,24,28,.86);box-shadow:inset 0 0 0 1px var(--mc-bang-vien);white-space:nowrap}

/* ══ APP THẦY ══ */
.gv{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.gv-ben{background:var(--tr-mat);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.gv-logo{display:flex;align-items:center;gap:12px;padding:6px 10px 18px}
.gv-logo i{width:36px;height:36px;border-radius:10px;background:var(--tr-gv-nut);display:grid;place-items:center;color:var(--tr-gv-tren);font-style:normal;font-weight:800}
.gv-logo b{display:block;font-size:16px;font-weight:700;line-height:1.15}
.gv-logo small{font-size:12.5px;color:var(--tr-chu-3)}
.gv-muc{height:44px;padding:0 12px;border-radius:12px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:500;color:var(--tr-chu-2);width:100%;text-align:left}
.gv-muc.dang{background:var(--tr-chinh-nhat);color:var(--tr-chinh-chu);font-weight:600}
.gv-muc em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--tr-mat-2);color:var(--tr-chu-2)}
.gv-day{margin-top:auto;border-top:1px solid var(--tr-vien);padding-top:8px;display:flex;flex-direction:column;gap:2px}
.gv-nd{padding:24px 48px 80px;min-width:0}
.gv-dau{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px}
.gv-dau .chu{flex:1;min-width:0}
.gv-dau .phu{font-size:13px;color:var(--tr-chu-3)}
.gv-dau h1{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.gv-nut{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;font-size:15px;font-weight:600;white-space:nowrap;background:var(--tr-mat);color:var(--tr-chu);border:1px solid var(--tr-vien-2);box-shadow:var(--tr-bong-1)}
.gv-nut.chinh{background:var(--tr-chinh-nut);color:var(--tr-tren-chinh);border-color:var(--tr-chinh-nut)}
.gv-nut.do{background:var(--tr-sai-chu);color:var(--tr-trang);border-color:var(--tr-sai-chu)}
.gv-nut.nhe{box-shadow:none;border-color:transparent;background:transparent;color:var(--tr-chinh-chu)}
.gv-nut[disabled]{opacity:.45}
.gv-nut .dem{font-size:12px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--tr-chu-y-nhat);color:var(--tr-chu-y-chu)}
.gv-the{background:var(--tr-mat);border:1px solid var(--tr-vien);border-radius:20px;box-shadow:var(--tr-bong-1)}
.gv-luoi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.gv-gia{padding:20px;min-height:230px}
.gv-gia h3{font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px}
.gv-gia h3 i{width:40px;height:40px;border-radius:12px;display:block}
.gv-gia p{font-size:13.5px;color:var(--tr-chu-3);margin:6px 0 16px}
.gv-gia u{display:block;height:14px;border-radius:7px;background:var(--tr-mat-2);margin-bottom:22px;text-decoration:none}
.gv-loc{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.gv-tab{display:flex;gap:2px;padding:4px;border-radius:14px;background:var(--tr-mat-2)}
.gv-tab button{height:44px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:600;color:var(--tr-chu-2)}
.gv-tab button[aria-pressed='true']{background:var(--tr-mat);color:var(--tr-chu);box-shadow:var(--tr-bong-1)}
.gv-tab button span{color:var(--tr-chu-3);font-weight:500}
.gv-tim{flex:1;min-width:180px;height:44px;border-radius:12px;border:1px solid var(--tr-vien);background:var(--tr-mat);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--tr-chu-3);font-size:15px}
.gv-bang{width:100%;border-collapse:collapse;font-size:14.5px}
.gv-bang th{font-size:12.5px;font-weight:600;color:var(--tr-chu-3);text-align:left;padding:12px 12px;border-bottom:1px solid var(--tr-vien);white-space:nowrap}
.gv-bang td{padding:10px 12px;border-bottom:1px solid var(--tr-vien);vertical-align:middle}
.gv-bang tr:last-child td{border-bottom:0}
.gv-bang tr.chon td{background:var(--tr-chinh-nhat)}
.gv-bang .r{text-align:right;white-space:nowrap}
.gv-bang td b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.gv-bang td small{font-size:13px;color:var(--tr-chu-3)}
.gv-o{width:44px;height:44px;display:grid;place-items:center;border-radius:10px}
.gv-o i{width:22px;height:22px;border-radius:7px;border:2px solid var(--tr-vien-2);display:grid;place-items:center;background:var(--tr-mat);color:transparent}
.gv-o[aria-checked='true'] i{background:var(--tr-chinh-nut);border-color:var(--tr-chinh-nut);color:var(--tr-tren-chinh)}
.gv-o[aria-checked='mixed'] i{background:var(--tr-chinh-nut);border-color:var(--tr-chinh-nut);color:var(--tr-tren-chinh)}
.gv-o[disabled] i{background:var(--tr-mat-2);border-color:var(--tr-vien)}
.gv-vt{display:flex;gap:4px;justify-content:flex-end}
.gv-vt button{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--tr-chu-2)}
.gv-vt .mo{width:auto;padding:0 14px;font-size:14px;font-weight:600;color:var(--tr-chinh-chu);background:var(--tr-chinh-nhat)}

.gv-xl .thanh i{display:block;height:100%;width:62%;border-radius:4px;background:var(--tr-chu-y)}
.gv-chan{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--tr-vien);font-size:13.5px;color:var(--tr-chu-3)}
.gv-hanh{position:fixed;left:calc(248px + 50vw - 124px);transform:translateX(-50%);bottom:24px;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 20px;border-radius:18px;background:var(--tr-chu);color:var(--tr-mat);box-shadow:var(--tr-bong-3);font-size:15px;font-weight:600;white-space:nowrap}
.gv-hanh .gv-nut{box-shadow:none}
.gv-hanh .bo{background:transparent;color:var(--tr-mat);border-color:color-mix(in oklab,var(--tr-mat) 40%,transparent)}
.gv-man{position:fixed;inset:0;z-index:40;background:var(--tr-phu);display:grid;place-items:center;padding:16px}
.gv-hop{width:min(520px,100%);background:var(--tr-mat);border-radius:24px;box-shadow:var(--tr-bong-3);padding:24px}
.gv-hop h2{font-size:21px;font-weight:700;margin-bottom:6px}
.gv-hop>p{color:var(--tr-chu-2);font-size:14.5px;margin-bottom:14px}
.gv-hop ul{list-style:none;margin:0 0 14px;padding:0;border:1px solid var(--tr-vien);border-radius:14px}
.gv-hop li{display:flex;gap:10px;justify-content:space-between;padding:10px 14px;font-size:14.5px;font-weight:500}
.gv-hop li+li{border-top:1px solid var(--tr-vien)}
.gv-hop li span{color:var(--tr-chu-3);white-space:nowrap}
.gv-hau{padding:12px 14px;border-radius:14px;background:var(--tr-sai-nhat);color:var(--tr-sai-chu);font-size:14.5px;font-weight:600;line-height:1.45;margin-bottom:10px}
.gv-giu{padding:10px 14px;border-radius:14px;background:var(--tr-dung-nhat);color:var(--tr-dung-chu);font-size:14px;font-weight:600;margin-bottom:18px}
.gv-hop .cuoi{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.gv-nhan{display:block;font-size:13.5px;font-weight:600;color:var(--tr-chu-2);margin-bottom:6px}
.gv-nhap{width:100%;height:48px;border-radius:12px;border:2px solid var(--tr-chinh-nut);background:var(--tr-mat);padding:0 14px;font:inherit;font-size:16px;font-weight:500;color:var(--tr-chu);display:flex;align-items:center}
.gv-nhap::after{content:'';width:2px;height:22px;background:var(--tr-chinh-nut);margin-left:1px}
.gv-xem{margin:12px 0 6px;padding:12px 14px;border-radius:14px;background:var(--tr-mat-2);font-size:14px;color:var(--tr-chu-2)}
.gv-xem b{display:block;color:var(--tr-chu);font-weight:600;margin-top:2px}
.gv-rong{padding:56px 20px;text-align:center}
.gv-rong i{width:72px;height:72px;border-radius:22px;margin:0 auto 14px;display:grid;place-items:center;background:var(--tr-chinh-nhat);color:var(--tr-chinh-chu)}
.gv-rong b{display:block;font-size:19px;font-weight:700;margin-bottom:6px}
.gv-rong p{color:var(--tr-chu-2);max-width:440px;margin:0 auto}
.gv-day-dt{display:none}
@media (max-width:760px){
  .gv{grid-template-columns:minmax(0,1fr)}
  .gv-ben{display:none}
  .gv-nd{padding:16px 16px 150px}
  .gv-dau{flex-wrap:wrap;align-items:center}
  .gv-dau .chu{flex-basis:100%}
  .gv-dau h1{font-size:24px}
  .gv-luoi{grid-template-columns:minmax(0,1fr)}
  .gv-day-dt{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--tr-mat);border-top:1px solid var(--tr-vien);padding:6px 4px max(6px,env(safe-area-inset-bottom))}
  .gv-day-dt button{flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--tr-chu-3)}
  .gv-day-dt button.dang{color:var(--tr-chinh-chu)}
  .gv-dt-ds{display:flex;flex-direction:column}
  .gv-dt-hang{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 4px;border-bottom:1px solid var(--tr-vien)}
  .gv-dt-hang:last-child{border-bottom:0}
  .gv-dt-hang.chon{background:var(--tr-chinh-nhat)}
  .gv-dt-hang .giua{flex:1;min-width:0}
  .gv-dt-hang b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;font-weight:600;line-height:1.3}
  .gv-dt-hang small{font-size:13px;color:var(--tr-chu-3)}
  .gv-hanh{left:12px;right:12px;transform:none;bottom:76px;padding:8px 8px 8px 14px;font-size:14px;white-space:normal}
  .gv-hanh{justify-content:space-between}.gv-hanh .bo{display:none}
  .gv-hop{padding:20px}
  .gv-hop .cuoi .gv-nut{flex:1;justify-content:center}
}
/* màn chiếu: viên live có ngăn «Đang ghi» + nút đoạn hay */
.mc{position:fixed;inset:0;background:var(--mc-bang);color:var(--mc-bang-chu)}
.mc-thanh{position:absolute;left:12px;right:12px;bottom:10px;height:58px;border-radius:20px;background:var(--mc-thanh-nen);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:17px;font-weight:700;white-space:nowrap}
.mc-nut{height:44px;padding:0 16px;border-radius:999px;display:inline-flex;align-items:center;gap:9px;background:var(--mc-bang-nut);box-shadow:inset 0 0 0 1px var(--mc-bang-vien);color:var(--mc-bang-chu)}
.mc-nut kbd{font:800 13px var(--sans);min-width:22px;height:22px;padding:0 5px;border-radius:6px;display:inline-grid;place-items:center;background:var(--mc-bang-chu);color:var(--mc-bang)}
.mc-nut.hay{background:var(--mc-qua-nen);color:var(--mc-qua-chu);box-shadow:none}
.mc-nut.hay kbd{background:var(--mc-qua-chu);color:var(--mc-qua-nen)}
.mc-live{height:46px;border-radius:999px;display:inline-flex;align-items:stretch;background:var(--mc-do);color:#fff;font-weight:800;overflow:hidden;box-shadow:0 0 0 4px color-mix(in srgb,var(--mc-do) 28%,transparent)}
.mc-live span{display:flex;align-items:center;gap:8px;padding:0 14px}
.mc-live span+span{box-shadow:inset 1px 0 0 rgba(255,255,255,.28)}
.mc-live i{width:10px;height:10px;border-radius:50%;background:#fff}
.mc-bao{position:absolute;right:24px;bottom:84px;padding:14px 18px;border-radius:18px;background:#2a2f35;box-shadow:0 22px 60px rgba(0,0,0,.55),inset 0 0 0 1px var(--mc-bang-vien);font-size:16px;font-weight:600;max-width:420px;line-height:1.45}
.mc-bao b{display:flex;align-items:center;gap:8px;color:var(--mc-bang-chu);font-size:17px;margin-bottom:4px}
.mc-bao span{color:var(--mc-bang-phu)}
</style>

<script>

// ── Nét phấn minh hoạ (câu 3: sơ đồ cột dọc theo chất) — hình minh hoạ, không phải bộ máy bút thật

// ── Thanh nổi + tấm Thêm của app học sinh

  <button class="hs-thanh-muc" ${mo ? '' : 'aria-current="page"'}>${I.lap()}<span>Hôm nay</span></button>

      <td>${dangXl ? `<b>${b.thu} ${b.ngay}/${b.thang} · ${b.lop} · buổi vừa kết thúc</b><div class="gv-xl" style="margin-top:4px"><span class="thanh"><i></i></span>Đang xử lý buổi vừa xong · 62 % · thường xong dưới 1 phút</div>` : `<b>${b.ten}</b><small class="so">${b.thu} ${b.ngay}/${b.thang}/2026 · live từ ${b.gio}</small>`}</td>
      <td>${b.lop}</td><td class="r so">${dangXl ? '—' : b.phut + ' phút'}</td><td class="r so">${dangXl ? '—' : b.cau}</td><td class="r so">${dangXl ? '—' : b.doan}</td><td class="r so">${dangXl ? '—' : b.mb + ' MB'}</td>
      <td style="width:190px"><div class="gv-vt">${dangXl ? '' : `<button class="mo">Mở</button><button aria-label="Đổi tên buổi">${I.but()}</button><button aria-label="Xoá buổi này">${I.rac()}</button>`}</div></td></tr>`
  }
  const dau = `<header class="gv-dau"><div class="chu"><p class="phu"><button class="gv-nut nhe" style="min-height:44px;padding:0;font-size:13.5px">${I.lui(16)}Hôm nay</button></p><h1>Lịch sử Live</h1></div>${TT === 'rong' ? '' : `<p class="phu so" style="padding-bottom:6px">7 buổi · 121 MB đã lưu</p>`}</header>`
  if (TT === 'rong') return `<div class="gv">${benGv()}<main class="gv-nd">${dau}<section class="gv-the gv-rong"><i>${I.live(36)}</i><b>Chưa có buổi live nào</b><p>Thầy bấm «Live» trên màn chiếu khi đang dạy. Tắt live hoặc kết thúc buổi là app tự dựng trang xem lại và đặt tên, rồi buổi hiện ở đây.</p></section></main>${dayDt()}</div>`
  const loc = `<div class="gv-loc"><div class="gv-tab" role="group" aria-label="Lọc theo lớp"><button aria-pressed="true">Tất cả <span class="so">7</span></button><button aria-pressed="false">12A1 <span class="so">5</span></button><button aria-pressed="false">11A2 <span class="so">1</span></button><button aria-pressed="false">10A1 <span class="so">1</span></button></div>${dt ? '' : `<div class="gv-tim">${I.tim()}Tìm tên buổi</div>`}</div>`
  const bang = dt ? `<section class="gv-the gv-dt-ds">${dsB.map(hang).join('')}</section>` : `<section class="gv-the" style="overflow:hidden"><table class="gv-bang"><thead><tr><th style="padding-right:0">${oChon(chon.size ? 'mixed' : 'false')}</th><th>Buổi live</th><th>Lớp</th><th class="r">Thời lượng live</th><th class="r">Số câu</th><th class="r">Số đoạn</th><th class="r">Dung lượng</th><th></th></tr></thead><tbody>${dsB.map(hang).join('')}</tbody></table>
    <div class="gv-chan"><span>Tích ô đầu dòng để xoá nhiều buổi một lần.</span><button class="gv-nut nhe" style="margin-left:auto;min-height:44px">Chọn buổi cũ hơn 120 ngày</button></div></section>`
  const hanh = chon.size ? `<div class="gv-hanh" role="region" aria-label="Thao tác với buổi đã chọn"><span class="so">Đã chọn 3 buổi · 53 MB</span><button class="gv-nut bo">Bỏ chọn</button><button class="gv-nut do">${I.rac()}Xoá 3 buổi</button></div>` : ''
  const xoa = TT === 'xoa' ? `<div class="gv-man"><div class="gv-hop" role="alertdialog" aria-labelledby="xt"><h2 id="xt">Xoá 3 buổi live?</h2><p>Thầy sắp xoá các buổi sau:</p>
    <ul>${[4, 5, 6].map((i) => `<li><div>${BUOI_GV[i].thu} ${BUOI_GV[i].ngay}/${BUOI_GV[i].thang} · ${BUOI_GV[i].lop} · ${BUOI_GV[i].ten}</div><span class="so">${BUOI_GV[i].mb} MB</span></li>`).join('')}</ul>
    <div class="gv-hau">Xoá hẳn 53 MB: tiếng ghi lại, nét bảng và trang xem lại của 3 buổi. Học sinh không xem lại được 3 buổi này nữa. Không khôi phục được.</div>
    <div class="gv-giu">Điểm, kJ và điểm danh của các buổi này vẫn giữ nguyên.</div>
    <div class="cuoi"><button class="gv-nut">Giữ lại</button><button class="gv-nut do">${I.rac()}Xoá 3 buổi</button></div></div></div>` : ''
  const ten = TT === 'ten' ? `<div class="gv-man"><div class="gv-hop" role="dialog" aria-labelledby="dt"><h2 id="dt">Đổi tên buổi live</h2><p>Ngày, lớp, số câu và thời lượng app tự ghi. Thầy chỉ đổi phần tên.</p>
    <label class="gv-nhan" for="tb">Tên buổi</label><div class="gv-nhap" id="tb" role="textbox" aria-label="Tên buổi">Bài 8. Amine · chữa bài tính khối lượng muối</div>
    <div class="gv-xem">Học sinh sẽ thấy<b>Thứ Ba 10/11 · 12A1 · Bài 8. Amine · chữa bài tính khối lượng muối · 5 câu · 48 phút</b></div>
    <button class="gv-nut nhe" style="padding:0;margin-bottom:14px">Dùng lại tên tự động «Bài 8. Amine»</button>
    <div class="cuoi"><button class="gv-nut">Huỷ</button><button class="gv-nut chinh">Lưu tên</button></div></div></div>` : ''
  return `<div class="gv">${benGv()}<main class="gv-nd">${dau}${loc}${bang}</main>${hanh}${dayDt()}</div>${xoa}${ten}`
}

// ── Màn chiếu: đang live, app TỰ ghi (thầy không bấm gì)
const K_GV_CHIEU = () => {
  const tl = Math.min(innerWidth / 1600, (innerHeight - 76) / 820)
  const c = CAU[2]
  return `<div class="mc" ${doi(1)}><div class="ph-chieu" style="transform:translate(${(innerWidth - 1600 * tl) / 2}px,0) scale(${tl})"><div class="ph-giay"><span class="chip1">Câu 3</span><span class="chip2">Phần III · Trả lời ngắn</span><div class="de">${c.de}</div></div><div class="ph-bang">${netBang(true)}</div><div class="ph-ten"><span>Trần Minh Anh</span></div></div>
    <div class="mc-bao"><b>${I.mic()}Đang tự ghi để lớp xem lại</b>Thầy không cần bấm gì thêm.<br><span>Tắt live hoặc kết thúc buổi là app tự cắt đoạn, đặt tên và dựng trang xem lại.</span></div>
    <div class="mc-thanh"><span class="mc-nut"><kbd>←</kbd>Câu trước</span><span class="mc-nut"><kbd>→</kbd>Câu sau</span><span class="mc-nut"><kbd>G</kbd>Giải</span><span style="flex:1"></span>
      <span class="mc-live"><span><i></i>LIVE <span class="so">12:47</span></span><span class="so">142/150 em xem</span><span>${I.mic()}Đang ghi để xem lại</span></span><span class="mc-nut">Tắt live</span></div></div>`
}

const KHUNG = { 'hs-them': K_HS_THEM, 'hs-ds': K_HS_DS, 'hs-buoi': K_HS_BUOI, 'hs-phat': K_HS_PHAT, 'buoi-mt': K_BUOI_MT, 'gv-homnay': K_GV_HOMNAY, 'gv-ls': K_GV_LS, 'gv-chieu': K_GV_CHIEU }
document.body.innerHTML = (KHUNG[K] ?? K_HS_DS)()
// máy tính: co bảng trong khung phát nhúng
const mtc = document.getElementById('mtchieu')
if (mtc) mtc.style.transform = `scale(${mtc.parentElement.clientWidth / 1600})`
if (TS.cuon) scrollTo(0, Number(TS.cuon))
document.fonts.ready.then(() => { document.body.dataset.xong = '1' })
</script>
</body>
