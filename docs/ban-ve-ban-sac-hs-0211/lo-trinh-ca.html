<!doctype html>
<html lang="vi" data-trong="hs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lộ trình · có ca kiểm tra đang mở</title>
<link rel="stylesheet" href="he.css">
<style>
  .mach .mol { width: 86px; }
</style>
</head><body class="o-ly">
<div class="app">
  <nav class="ray" data-ve="ray" data-muc="lo-trinh"></nav>
  <header class="tren" data-ve="tren" data-lua="5" data-nt="128" data-tt="42" data-da="14" data-muc="24" data-tb="2"></header>
  <main class="giua">
    <section class="bang" data-sac="tin" aria-label="Ca kiểm tra đang mở"><span class="o" data-sac="tin" style="width:44px;height:44px;border-radius:14px"><i data-i="clip"></i></span><span class="giua-d"><b>Ca kiểm tra đang mở</b><span class="mo">Nhập mã ca thầy cho để vào làm</span></span><button class="nut" data-loai="tin">Vào ca</button></section>
    <section class="the" aria-label="Bài học hôm nay">
      <div class="bai">
        <span class="o" data-sac="hs" data-nhat><small>Bài</small><b>9</b></span>
        <div style="flex:1;min-width:0">
          <span class="mo">Bài học hôm nay</span>
          <h1>Amino acid (P1)</h1>
        </div>
      </div>
      <div class="vach" role="progressbar" aria-label="Chặng hôm nay" aria-valuemin="0" aria-valuemax="5" aria-valuenow="2"><i data-x></i><i data-x></i><i data-d style="--p:33%"></i><i></i><i></i></div>
      <div class="vach-dong"><span>2/5 chặng</span><span>Còn 10 câu tới mức hôm nay</span></div>
    </section>

    <section class="the go" aria-label="Bạn học cùng">
      <span class="anh">GB</span>
      <div class="giua-d"><b>Trần Gia Bảo chưa đủ mức hôm nay</b><span class="mo">Lửa đôi 3 ngày</span></div>
      <button class="nut" data-loai="phu"><i data-i="tay"></i>Gõ cửa</button>
    </section>

    <div class="mach" aria-label="Lộ trình hôm nay">
      <button class="nut-m" data-tt="xong" style="--x:56px" aria-label="Chặng 1: đã xong"><span class="so-o">1</span><i data-i="check"></i></button>
      <button class="nut-m" data-tt="xong" data-lk="doi" style="--x:-56px" aria-label="Chặng 2: đã xong"><span class="so-o">2</span><i data-i="check"></i></button>
      <button class="nut-m" data-tt="dang" data-lk="doi" data-vd="2/6" style="--x:56px" aria-label="Chặng 3: học tiếp, 4 câu"><span class="nhan-m">Học tiếp</span><i data-i="sach"></i></button>
      <button class="nut-m" data-loai="sua" data-tt="khoa" data-lk="cho" style="--x:-56px" aria-label="Tự sửa lỗi: làm xong các chặng phía trên để mở khoá"><i data-i="wrench"></i><span class="ten-m" data-ben="trai">Tự sửa lỗi</span></button>
      <button class="nut-m" data-tt="khoa" data-lk="cho" style="--x:56px" aria-label="Chặng 4: chưa mở"><span class="so-o">4</span><i data-i="lock"></i></button>
      <button class="nut-m" data-tt="khoa" data-lk="cho" style="--x:-56px" aria-label="Chặng 5: chưa mở"><span class="so-o">5</span><i data-i="lock"></i></button>
      <button class="nut-m" data-loai="bt" data-tt="mo" data-lk="cho" style="--x:56px" aria-label="Bài tập về nhà: 1 bài thầy đang giao"><span class="dem-n">1</span><i data-i="pen"></i><span class="ten-m" data-ben="trai">Bài tập về nhà</span></button>
      <div class="ruong" data-lk="cho" style="--x:-40px" aria-label="Rương hôm nay"><svg viewBox="0 0 92 80" aria-hidden="true"><ellipse class="rg-bong" cx="46" cy="74" rx="36" ry="5"/><rect class="rg-than" x="8" y="34" width="76" height="38" rx="10"/><path class="rg-nap" d="M8 36 Q8 12 30 12 H62 Q84 12 84 36 Z"/><rect class="rg-dai" x="40" y="12" width="12" height="60"/><path class="rg-khoa" d="M46 28 L56 34 V46 L46 52 L36 46 V34 Z"/><circle class="rg-ngoc" cx="46" cy="40" r="4"/></svg></div>
      <div class="mol"><span data-mol="chao"></span></div>
      <p class="loi" style="max-width:180px">Có ca kiểm tra đang mở. Em vào ca trước nhé.</p>
    </div>
  </main>
  <aside class="ben" aria-label="Tóm tắt">
    <section class="the" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 16px">
      <h3 style="align-self:flex-start;font-size:17px;font-weight:800">Hôm nay</h3>
      <div data-nguyen-tu data-da="14" data-muc="24" style="width:184px"></div>
      <span class="mo" style="text-align:center">Mỗi câu làm xong thắp một electron</span>
    </section>
    <section class="the" style="padding:6px">
      <button class="dong"><span class="o" data-sac="tin" data-nhat><i data-i="trophy"></i></span><span class="giua-d"><b>Giải tuần</b><span class="mo">Hạng 4 trong nhóm · 312 nguyên tử</span></span><i data-i="phai"></i></button>
      <button class="dong"><span class="o" data-sac="sao" data-nhat><i data-i="target"></i></span><span class="giua-d"><b>Nhiệm vụ ngày</b><span class="mo">2/3 nhiệm vụ</span></span><i data-i="phai"></i></button>
    </section>
    <section class="the" style="padding:6px">
      <h3 class="tieu-nho" style="margin:8px 12px 2px">Luyện tập</h3>
      <button class="dong"><span class="o" data-sac="sai" data-nhat><i data-i="wrench"></i></span><span class="giua-d"><b>Tự sửa lỗi</b></span><span class="so" style="color:var(--tr-sai-chu)">3</span></button>
      <button class="dong"><span class="o" data-sac="dung" data-nhat><i data-i="history"></i></span><span class="giua-d"><b>Câu đã làm</b></span><i data-i="phai"></i></button>
    </section>
  </aside>
  <nav class="duoi" data-ve="duoi" data-muc="lo-trinh"></nav>
</div>
<button class="ai-noi" aria-label="Mở A.I Đỗ Đại Học"><i data-i="chat"></i><b>A.I</b></button>
<script src="ve.js"></script>
</body></html>
