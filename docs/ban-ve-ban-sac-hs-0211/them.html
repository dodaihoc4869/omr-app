<!doctype html>
<html lang="vi" data-trong="hs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thêm · điểm danh, ca kiểm tra, A.I, cài đặt</title>
<link rel="stylesheet" href="he.css">
</head><body class="o-ly">
<div class="app">
  <nav class="ray" data-ve="ray" data-muc="cai-dat"></nav>
  <header class="tren" data-ve="tren" data-lua="5" data-nt="128" data-tt="42" data-da="14" data-muc="24" data-tb="2"></header>
  <main class="giua">
    <h1 class="tieu">Thêm</h1>
    <form class="dd" aria-label="Điểm danh buổi học">
      <div class="dd-dau"><span class="o"><i data-i="qr"></i></span>Điểm danh buổi học</div>
      <label class="dd-o"><span class="sr">Mã 6 số trên máy chiếu</span><span>2</span><span>7</span><span>4</span><span data-dang></span><span></span><span></span></label>
      <button class="nut" type="button" disabled style="background:color-mix(in oklab, var(--tr-mat) 45%, transparent);color:var(--tr-hs-tren)">Điểm danh</button>
      <p><b>Buổi 02/11</b> · Gõ mã 6 số trên máy chiếu, hoặc quét mã QR</p>
    </form>
    <section class="the" style="padding:6px">
      <button class="dong"><span class="o" data-sac="tin" data-nhat><i data-i="clip"></i></span><span class="giua-d"><b>Ca kiểm tra</b><span class="mo">Nhập mã ca thầy cho để vào làm</span></span><i data-i="phai"></i></button>
      <button class="dong"><span class="o" data-sac="tim" data-nhat><i data-i="chat"></i></span><span class="giua-d"><b>Hỏi A.I Đỗ Đại Học</b><span class="mo">Chụp đề, hỏi bài, tâm sự</span></span><i data-i="phai"></i></button>
      <button class="dong"><span class="o" data-sac="sai" data-nhat><i data-i="bell"></i></span><span class="giua-d"><b>Thông báo</b><span class="mo">2 thông báo chưa đọc</span></span><span class="cham-do" style="position:static;box-shadow:none">2</span></button>
    </section>
    <h2 class="tieu-nho">Cài đặt</h2>
    <section class="the" style="padding:6px">
      <button class="dong" role="switch" aria-checked="true"><span class="o" data-sac="hs" data-nhat><i data-i="loa"></i></span><span class="giua-d"><b>Âm thanh</b></span><span class="cong" aria-hidden="true"></span></button>
      <button class="dong" role="switch" aria-checked="false"><span class="o" data-sac="hs" data-nhat><i data-i="rung"></i></span><span class="giua-d"><b>Rung</b></span><span class="cong" data-tat aria-hidden="true"></span></button>
      <button class="dong"><span class="o" data-sac="dung" data-nhat><i data-i="tai"></i></span><span class="giua-d"><b>Cập nhật bài học</b><span class="mo">Tải bài mới thầy vừa giao</span></span><i data-i="phai"></i></button>
    </section>
    <h2 class="tieu-nho">Của em</h2>
    <section class="the" style="padding:6px">
      <button class="dong"><span class="anh" style="background:var(--tr-hs-nhat);color:var(--tr-hs-chu)">AN</span><span class="giua-d"><b>Nguyễn Hoài An</b><span class="mo">Số báo danh 120341 · Lớp 12A3</span></span></button>
      <button class="dong"><span class="o" data-sac="chu-y" data-nhat><i data-i="pen"></i></span><span class="giua-d"><b>Bài gia đình giao</b></span><i data-i="phai"></i></button>
      <button class="dong"><span class="o" data-sac="sao" data-nhat><i data-i="users"></i></span><span class="giua-d"><b>Thông tin từ gia đình</b></span><i data-i="phai"></i></button>
      <button class="dong"><span class="o" data-nhat><i data-i="ra"></i></span><span class="giua-d"><b>Đăng xuất</b></span></button>
    </section>
  </main>
  <nav class="duoi" data-ve="duoi" data-muc="them"></nav>
</div>
<script src="ve.js"></script>
</body></html>
