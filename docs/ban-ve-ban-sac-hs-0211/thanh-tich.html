<!doctype html>
<html lang="vi" data-trong="hs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thành tích · chuỗi ngày, thưởng, điểm thầy công bố</title>
<link rel="stylesheet" href="he.css">
</head><body class="o-ly">
<div class="app">
  <nav class="ray" data-ve="ray" data-muc="thanh-tich"></nav>
  <header class="tren" data-ve="tren" data-lua="5" data-nt="128" data-tt="42" data-da="14" data-muc="24" data-tb="2"></header>
  <main class="giua">
    <h1 class="tieu">Thành tích</h1>
    <section class="the" style="padding:14px 16px">
      <div class="chuoi" style="padding:0"><div class="mol-c" data-mol="vui"></div><div><b>12 ngày</b><p class="mo" style="margin-top:4px">Chuỗi ngày · mỗi ngày đủ mức giữ chuỗi</p></div></div>
      <ol class="tuan" aria-label="7 ngày gần nhất">
        <li><i data-d><span data-i="check"></span></i>T5</li><li><i data-d><span data-i="check"></span></i>T6</li><li><i data-d><span data-i="check"></span></i>T7</li><li><i data-d><span data-i="check"></span></i>CN</li><li><i data-d><span data-i="check"></span></i>T2</li><li><i data-d><span data-i="check"></span></i>T3</li><li><i data-nay></i>Hôm nay</li>
      </ol>
    </section>
    <div class="luoi-o">
      <button class="o-to"><span class="o" data-sac="sao" data-nhat><i data-i="trophy"></i></span><span class="so-g" style="color:var(--tr-sao-chu)">7</span><b>Huy hiệu</b><span class="mo">Huy hiệu đã có và sắp đạt</span></button>
      <button class="o-to"><span class="o" data-sac="chu-y" data-nhat><i data-i="flame"></i></span><b>Chuỗi ngày</b><span class="mo">Lịch chuỗi, bình giữ chuỗi, mốc</span></button>
      <button class="o-to"><span class="o" data-sac="tin" data-nhat><i data-i="route"></i></span><span class="so-g" style="color:var(--tr-tin-chu)">#4</span><b>Giải tuần</b><span class="mo">Bảng nhóm tuần này</span></button>
      <button class="o-to"><span class="o" data-sac="dung" data-nhat><i data-i="users"></i></span><b>Học cùng bạn</b><span class="mo">Chuỗi đôi với bạn học cùng</span></button>
      <button class="o-to"><span class="o" data-sac="tin" data-nhat><i data-i="award"></i></span><b>Thử thách Kim cương</b><span class="mo">10 câu khó của chuyên đề em đã vững</span></button>
      <button class="o-to"><span class="o" data-sac="tim" data-nhat><i data-i="gem"></i></span><span class="so-g" style="color:var(--tr-tim-chu)">42</span><b>Cửa hàng</b><span class="mo">Tinh thể và bình giữ chuỗi</span></button>
    </div>
    <h2 class="tieu-nho">Điểm thầy đã công bố</h2>
    <section class="the" style="padding:6px">
      <button class="dong"><span class="o" data-sac="tin" data-nhat><i data-i="chart"></i></span><span class="giua-d"><b>Ca kiểm tra</b><span class="mo">Điểm và lời giải ca đã công bố</span></span><i data-i="phai"></i></button>
      <button class="dong"><span class="o" data-sac="chu-y" data-nhat><i data-i="clip"></i></span><span class="giua-d"><b>Kết quả bài đã nộp</b><span class="mo">Điểm và báo cáo đã công bố</span></span><i data-i="phai"></i></button>
    </section>
  </main>
  <aside class="ben" aria-label="Tóm tắt">
    <section class="the" style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <h3 style="align-self:flex-start;font-size:17px;font-weight:800">Hôm nay</h3>
      <div data-nguyen-tu data-da="14" data-muc="24" style="width:170px"></div>
      <span class="mo">Còn 10 câu tới mức hôm nay</span>
    </section>
  </aside>
  <nav class="duoi" data-ve="duoi" data-muc="thanh-tich"></nav>
</div>
<button class="ai-noi" aria-label="Mở A.I Đỗ Đại Học"><i data-i="chat"></i><b>A.I</b></button>
<script src="ve.js"></script>
</body></html>
