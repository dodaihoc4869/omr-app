<html lang="vi" data-trong="hs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="he.css"><link rel="stylesheet" href="lam.css">
</head><body data-mot-man>
<div class="lam">
  <header class="lam-tren"><button class="nut-x" aria-label="Nghỉ và về Lộ trình"><i data-i="x"></i></button><div class="mach-nho" role="progressbar" aria-label="Câu trong chặng" aria-valuemin="0" aria-valuemax="6" aria-valuenow="2"><i data-x></i><b data-x></b><i data-x="ho-tro"></i><b data-x></b><i data-dang></i><b></b><i></i><b></b><i></i><b></b><i></i></div><span class="dem-cau">Câu 3/6</span></header>
  <div class="lam-than">
    <section class="cot" aria-label="Đề">
      <div class="de-nhan"><span class="chip" data-sac="hs">Chặng 3</span><span class="chip">Trắc nghiệm</span></div>
      <p class="de">Cho 8,9 gam alanine tác dụng vừa đủ với dung dịch NaOH theo phương trình dưới đây, thu được m gam muối. Giá trị của m là</p>
      <div class="ct-dai" tabindex="0" aria-label="Phương trình, kéo ngang để xem hết">H<sub>2</sub>N–CH(CH<sub>3</sub>)–COOH + NaOH → H<sub>2</sub>N–CH(CH<sub>3</sub>)–COONa + H<sub>2</sub>O &nbsp;&nbsp;(M<sub>alanine</sub> = 89; M<sub>muối</sub> = 111)</div>
      <button class="nut" data-loai="phu" style="align-self:flex-start;min-height:44px;padding:0 14px;font-size:15px"><i data-i="den"></i>Gợi ý</button>
    </section>
    <section class="cot" aria-label="Phương án">
      <div class="pa">
        <button aria-pressed="true"><span class="ky">A</span>11,10</button><button aria-pressed="false"><span class="ky">B</span>9,70</button><button aria-pressed="false"><span class="ky">C</span>11,15</button><button aria-pressed="false"><span class="ky">D</span>12,50</button>
      </div>
      <div class="lam-duoi"><button class="nut" data-loai="chinh">Kiểm tra</button></div>
    </section>
  </div>
</div>
