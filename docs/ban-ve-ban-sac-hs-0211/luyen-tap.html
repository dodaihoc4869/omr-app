<!doctype html>
<html lang="vi" data-trong="hs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luyện tập · sáu việc</title>
<link rel="stylesheet" href="he.css">
</head><body class="o-ly">
<div class="app">
  <nav class="ray" data-ve="ray" data-muc="luyen-tap"></nav>
  <header class="tren" data-ve="tren" data-lua="5" data-nt="128" data-tt="42" data-da="14" data-muc="24" data-tb="2"></header>
  <main class="giua">
    <h1 class="tieu">Luyện tập</h1>
    <div class="luoi-o">
      <button class="o-to" data-uu><span class="o" data-sac="sai"><i data-i="wrench"></i></span><span style="display:flex;flex-direction:column"><b>Tự sửa lỗi</b><span class="mo">Câu cần sửa hôm nay</span></span><span class="so-g">3<small>câu</small></span></button>
      <button class="o-to"><span class="o" data-sac="tin" data-nhat><i data-i="target"></i></span><span class="so-g" style="color:var(--tr-tin-chu)">0/20<small>câu</small></span><b>Kiểm tra ôn tập</b><span class="mo">Thứ Năm 06/11 · thầy mở lúc 19:00</span></button>
      <button class="o-to"><span class="o" data-sac="chu-y" data-nhat><i data-i="pen"></i></span><span class="so-g" style="color:var(--tr-chu-y-chu)">1<small>bài</small></span><b>Bài tập về nhà</b><span class="mo">Thầy đang giao</span></button>
      <button class="o-to"><span class="o" data-sac="dung" data-nhat><i data-i="history"></i></span><b>Câu đã làm</b><span class="mo">Lời giải và lịch ôn từng câu</span></button>
      <button class="o-to"><span class="o" data-sac="sao" data-nhat><i data-i="layers"></i></span><b>Tu luyện</b><span class="mo">Luyện thêm theo chương, dạng, mức</span></button>
      <button class="o-to"><span class="o" data-sac="sai" data-nhat><i data-i="refresh"></i></span><b>Luyện lại từ bài kiểm tra</b><span class="mo">Câu sai trong các bài kiểm tra</span></button>
    </div>
  </main>
  <aside class="ben" aria-label="Tóm tắt">
    <section class="the" style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <h3 style="align-self:flex-start;font-size:17px;font-weight:800">Hôm nay</h3>
      <div data-nguyen-tu data-da="14" data-muc="24" style="width:170px"></div>
      <span class="mo">Còn 10 câu tới mức hôm nay</span>
    </section>
  </aside>
  <nav class="duoi" data-ve="duoi" data-muc="luyen-tap"></nav>
</div>
<button class="ai-noi" aria-label="Mở A.I Đỗ Đại Học"><i data-i="chat"></i><b>A.I</b></button>
<script src="ve.js"></script>
</body></html>
