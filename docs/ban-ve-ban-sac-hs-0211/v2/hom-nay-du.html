<div class="rong"><main class="trang" style="padding-bottom:0">
  <header class="dau"><span class="ava" data-hinh="banh"><b>AN</b></span><div class="giua"><span class="mo">Thứ Hai 02/11 · Lớp 12A3</span><h1>Chào An</h1></div><button class="nut-tron kinh" aria-label="Thông báo, 2 chưa đọc"><span data-i="bell"></span><span class="cham">2</span></button></header>
  <section class="kinh hero" data-du aria-label="Đủ mức hôm nay">
    <div><span class="nhan" style="color:var(--tr-tim-chu)">ĐỦ MỨC HÔM NAY</span><div class="so-to">17<small> câu</small></div><p class="dong">Mức 12 — tới điểm tương đương, dung dịch đã hồng!</p></div>
    <div class="binh-o" data-binh-dep data-da="17" data-muc="12" data-chang="6,6"></div>
    <div class="chip-h"><span class="chip" data-k="lua" aria-label="Chuỗi 6 ngày"><span data-i="flame"></span>6 ngày</span><span class="chip" data-k="nt" aria-label="Nguyên tử hôm nay"><span data-i="atom"></span>128</span><span class="chip" data-k="tt" aria-label="Tinh thể"><span data-i="gem"></span>42</span></div>
  </section>
  <div class="mol-noi"><span class="m"><span data-mol="khen"></span></span><p class="kinh">Đủ mức rồi! Giờ đến Bài tập về nhà nhé.</p></div>
  <button class="nut-lon" data-sac="bt"><span class="banh-o" data-hinh="banh"><span data-i="pen"></span></span><span class="giua"><b>Làm Bài tập về nhà</b><span class="phu">1 bài thầy đang giao</span></span><span data-i="phai"></span></button>
</main><aside class="trang" aria-label="Việc hôm nay">

    <button class="hang" data-tt="xong"><span class="tich"><span data-i="check"></span></span><span class="giua"><b>Chặng 1</b><span class="mo">6 câu</span></span><span class="the-loai" data-k="hoc"></span></button>
    <button class="hang" data-tt="xong"><span class="tich"><span data-i="check"></span></span><span class="giua"><b>Chặng 2</b><span class="mo">6 câu</span></span><span class="the-loai" data-k="hoc"></span></button>
    <button class="hang" data-tt="xong"><span class="tich"><span data-i="check"></span></span><span class="giua"><b>Học thêm</b><span class="mo">5 câu mới</span></span><span class="the-loai" data-k="hoc"></span></button>
    <button class="hang" data-tt="xong"><span class="tich"><span data-i="check"></span></span><span class="giua"><b>Tự sửa lỗi</b><span class="mo">Hôm nay đã sửa xong</span></span><span class="the-loai" data-k="sua"></span></button>
    <button class="hang" data-tt="dang"><span class="tich"></span><span class="giua"><b>Bài tập về nhà</b><span class="mo">1 bài thầy đang giao</span></span><span class="phai" style="color:var(--tr-chu-y-chu)">Làm bài</span></button>
  </section>
  <button class="kinh hang" style="border-radius:26px;justify-content:center;font-weight:800;color:var(--tr-hs-chu)">Học thêm câu mới <span data-i="phai"></span></button>
