<!doctype html>
<html lang="vi" data-trong="hs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hôm nay · có ca kiểm tra đang mở</title>
<link rel="stylesheet" href="kinh.css">
</head><body>
<div class="rong"><main class="trang" style="padding-bottom:0">
  <header class="dau"><span class="ava" data-hinh="banh"><b>AN</b></span><div class="giua"><span class="mo">Thứ Hai 02/11 · Lớp 12A3</span><h1>Chào An</h1></div><button class="nut-tron kinh" aria-label="Thông báo, 2 chưa đọc"><span data-i="bell"></span><span class="cham">2</span></button></header>
  <section class="kinh the-p" style="display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 0 0 2px var(--tr-tin-day),var(--kinh-bong)" aria-label="Ca kiểm tra đang mở">
    <div style="display:flex;gap:12px;align-items:center"><span class="oi" data-sac="tin" data-co="to"><span data-i="clip"></span></span><div><b style="font-size:19px;display:block">Ca kiểm tra đang mở</b><span class="mo">Nhập mã ca thầy cho để vào làm</span></div></div>
    <button class="nut" data-l="tin" data-rong>Vào ca kiểm tra</button>
  </section>
  <section class="kinh hero" aria-label="Mức hôm nay">
    <div><span class="nhan">MỨC HÔM NAY</span><div class="so-to">14<small>/24 câu</small></div><p class="dong">Học tiếp sau khi nộp bài kiểm tra.</p></div>
    <div class="binh-o" data-binh-dep data-da="14" data-muc="24" data-chang="6,6,6,6"></div>
    <div class="chip-h"><span class="chip" data-k="lua" aria-label="Chuỗi 5 ngày"><span data-i="flame"></span>5 ngày</span><span class="chip" data-k="nt" aria-label="Nguyên tử hôm nay"><span data-i="atom"></span>128</span><span class="chip" data-k="tt" aria-label="Tinh thể"><span data-i="gem"></span>42</span></div>
  </section>
  <div class="mol-noi"><span class="m"><span data-mol="chao"></span></span><p class="kinh">Có ca kiểm tra đang mở. Em vào ca trước nhé.</p></div>
</main><aside class="trang" aria-label="Việc hôm nay">
  <section class="kinh viec"><h2>Việc hôm nay <span>3/7 xong</span></h2>
    <button class="hang" data-tt="xong"><span class="tich"><span data-i="check"></span></span><span class="giua"><b>Kiểm tra ôn tập</b><span class="mo">Đã nộp · điểm 8,5/10</span></span><span class="the-loai" data-k="kiem"></span></button>
    <button class="hang" data-tt="xong"><span class="tich"><span data-i="check"></span></span><span class="giua"><b>Chặng 1 · Chặng 2</b><span class="mo">12 câu</span></span><span class="the-loai" data-k="hoc"></span></button>
    <button class="hang"><span class="tich"></span><span class="giua"><b>Chặng 3</b><span class="mo">Chờ ca kiểm tra đóng</span></span><span class="the-loai" data-k="hoc"></span></button>
    <button class="hang" data-tt="khoa"><span class="tich"><span data-i="lock"></span></span><span class="giua"><b>Tự sửa lỗi · 3 câu</b><span class="mo">Làm xong các chặng phía trên để mở khoá</span></span><span class="the-loai" data-k="sua"></span></button>
  </section>
</aside></div>
