<!doctype html>
<html lang="vi" data-trong="hs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thêm · điểm danh, ca kiểm tra, cài đặt, của em</title>
<link rel="stylesheet" href="kinh.css">
</head><body>
<main class="trang" data-rong-1>
  <header class="tieu-trang"><h1>Thêm</h1><button class="nut-tron kinh" aria-label="Thông báo, 2 chưa đọc"><span data-i="bell"></span><span class="cham">2</span></button></header>
  <section class="kinh the-p" style="display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 0 0 2px var(--tr-hs-day),var(--kinh-bong)" aria-label="Điểm danh buổi học">
    <div style="display:flex;gap:10px;align-items:center"><span class="oi" data-sac="hs"><span data-i="qr"></span></span><b style="font-size:18px">Điểm danh buổi học</b></div>
    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px"><span class="kinh" style="height:56px;border-radius:18px;display:grid;place-items:center;font-size:24px;font-weight:800;background:var(--kinh-dam)">2</span><span class="kinh" style="height:56px;border-radius:18px;display:grid;place-items:center;font-size:24px;font-weight:800;background:var(--kinh-dam)">7</span><span class="kinh" style="height:56px;border-radius:18px;display:grid;place-items:center;font-size:24px;font-weight:800;background:var(--kinh-dam)">4</span><span class="kinh" style="height:56px;border-radius:18px;display:grid;place-items:center;font-size:24px;font-weight:800;background:var(--kinh-dam);box-shadow:inset 0 0 0 2.5px var(--tr-hs-day)"></span><span class="kinh" style="height:56px;border-radius:18px;display:grid;place-items:center;font-size:24px;font-weight:800;background:var(--kinh-dam)"></span><span class="kinh" style="height:56px;border-radius:18px;display:grid;place-items:center;font-size:24px;font-weight:800;background:var(--kinh-dam)"></span></div>
    <button class="nut" data-l="chinh" data-rong disabled>Điểm danh</button>
    <p class="mo" style="font-size:13.5px"><b>Buổi 02/11</b> · Gõ mã 6 số trên máy chiếu, hoặc quét mã QR</p>
  </section>
  <section class="kinh ds">
    <button class="hang"><span class="oi" data-sac="tin" data-co="nho"><span data-i="clip"></span></span><span class="giua"><b>Ca kiểm tra</b><span class="mo">Nhập mã ca thầy cho để vào làm</span></span><span class="chev"><span data-i="phai"></span></span></button>
    <button class="hang"><span class="oi" data-sac="tim" data-co="nho"><span data-i="chat"></span></span><span class="giua"><b>Hỏi A.I Đỗ Đại Học</b><span class="mo">Chụp đề, hỏi bài, tâm sự</span></span><span class="chev"><span data-i="phai"></span></span></button>
    <button class="hang"><span class="oi" data-sac="sai" data-co="nho"><span data-i="bell"></span></span><span class="giua"><b>Thông báo</b><span class="mo">2 thông báo chưa đọc</span></span><span class="cham" style="position:static">2</span></button>
  </section>
  <h2 class="tieu-nho">Cài đặt</h2>
  <section class="kinh ds">
    <button class="hang" role="switch" aria-checked="true"><span class="oi" data-sac="hs" data-co="nho"><span data-i="loa"></span></span><span class="giua"><b>Âm thanh</b></span><span class="cong" aria-hidden="true"></span></button>
    <button class="hang" role="switch" aria-checked="false"><span class="oi" data-sac="hs" data-co="nho"><span data-i="rung"></span></span><span class="giua"><b>Rung</b></span><span class="cong" data-tat aria-hidden="true"></span></button>
    <button class="hang"><span class="oi" data-sac="dung" data-co="nho"><span data-i="tai"></span></span><span class="giua"><b>Cập nhật bài học</b><span class="mo">Tải bài mới thầy vừa giao</span></span><span class="chev"><span data-i="phai"></span></span></button>
  </section>
  <h2 class="tieu-nho">Của em</h2>
  <section class="kinh ds">
    <button class="hang"><span class="ava" data-hinh="banh" style="width:40px;height:40px"><b style="font-size:13px">AN</b></span><span class="giua"><b>Nguyễn Hoài An</b><span class="mo">Số báo danh 120341 · Lớp 12A3</span></span></button>
    <button class="hang"><span class="oi" data-sac="chu-y" data-co="nho"><span data-i="pen"></span></span><span class="giua"><b>Bài gia đình giao</b></span><span class="chev"><span data-i="phai"></span></span></button>
    <button class="hang"><span class="oi" data-sac="sao" data-co="nho"><span data-i="users"></span></span><span class="giua"><b>Thông tin từ gia đình</b></span><span class="chev"><span data-i="phai"></span></span></button>
    <button class="hang"><span class="oi" data-sac="xam" data-co="nho"><span data-i="ra"></span></span><span class="giua"><b>Đăng xuất</b></span></button>
  </section>
</main>
<div class="thanh"><nav class="kinh" aria-label="Điều hướng học sinh"><a href="#"><span data-i="sparkles"></span>Hôm nay</a><a href="#"><span data-i="wrench"></span>Luyện tập</a><a href="#"><span data-i="trophy"></span>Thành tích</a><a href="#" aria-current="page"><span data-i="luoi"></span>Thêm<span class="cham">1</span></a></nav><button class="ai kinh" aria-label="Hỏi A.I Đỗ Đại Học"><span data-i="chat"></span></button></div>
<script src="../ve.js"></script><script src="kve.js"></script><script src="binh.js"></script>
</body></html>
