<main class="trang" data-rong-1>

  <section class="kinh ds xh">
    <button class="hang"><span class="h">1</span><span class="ava-n" style="background:var(--tr-sao-nhat);color:var(--tr-sao-chu)">MT</span><span class="giua"><b>Mai Thu</b></span><span class="so-p">512</span></button><button class="hang"><span class="h">2</span><span class="ava-n" style="background:var(--tr-tin-nhat);color:var(--tr-tin-chu)">QH</span><span class="giua"><b>Quang Huy</b></span><span class="so-p">488</span></button><button class="hang"><span class="h">3</span><span class="ava-n" style="background:var(--tr-dung-nhat);color:var(--tr-dung-chu)">LP</span><span class="giua"><b>Lan Phương</b></span><span class="so-p">430</span></button><button class="hang" data-em><span class="h">4</span><span class="ava-n" style="background:var(--tr-hs-nhat);color:var(--tr-hs-chu)">AN</span><span class="giua"><b>Hoài An (em)</b></span><span class="so-p">312</span></button><button class="hang"><span class="h">5</span><span class="ava-n" style="background:var(--tr-chu-y-nhat);color:var(--tr-chu-y-chu)">GB</span><span class="giua"><b>Gia Bảo</b></span><span class="so-p">296</span></button>
    <div class="vung" data-k="len">Vùng lên hạng · 5 bạn</div>
    <button class="hang"><span class="h">6</span><span class="ava-n" style="background:var(--tr-hs-nhat);color:var(--tr-tim-chu)">TN</span><span class="giua"><b>Thảo Nhi</b></span><span class="so-p">270</span></button><button class="hang"><span class="h">7</span><span class="ava-n" style="background:var(--tr-tin-nhat);color:var(--tr-tin-chu)">ĐK</span><span class="giua"><b>Đăng Khoa</b></span><span class="so-p">244</span></button>
    <div class="vung" data-k="xuong">Vùng rơi hạng · 4 bạn</div>
    <button class="hang"><span class="h">17</span><span class="ava-n" style="background:var(--tr-mat-2);color:var(--tr-chu-2)">PL</span><span class="giua"><b>Phương Linh</b></span><span class="so-p">61</span></button>
