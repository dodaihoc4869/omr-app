<!doctype html>
<html lang="vi" data-trong="hs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hôm nay · đang học</title>
<link rel="stylesheet" href="kinh.css">
</head><body>
<div class="rong"><main class="trang" style="padding-bottom:0">
  <header class="dau"><span class="ava" data-hinh="banh"><b>AN</b></span><div class="giua"><span class="mo">Thứ Hai 02/11 · Lớp 12A3</span><h1>Chào An</h1></div><button class="nut-tron kinh" aria-label="Thông báo, 2 chưa đọc"><span data-i="bell"></span><span class="cham">2</span></button></header>
  <section class="kinh hero" aria-label="Mức hôm nay">
    <div><span class="nhan">MỨC HÔM NAY</span><div class="so-to">14<small>/24 câu</small></div><p class="dong">Còn 10 câu nữa là dung dịch đổi màu.</p></div>
    <div class="binh-o" data-binh-dep data-da="14" data-muc="24" data-chang="6,6,6,6"></div>
    <div class="chip-h"><span class="chip" data-k="lua" aria-label="Chuỗi 5 ngày"><span data-i="flame"></span>5 ngày</span><span class="chip" data-k="nt" aria-label="Nguyên tử hôm nay"><span data-i="atom"></span>128</span><span class="chip" data-k="tt" aria-label="Tinh thể"><span data-i="gem"></span>42</span></div>
  </section>
  <div class="mol-noi"><span class="m"><span data-mol="chao"></span></span><p class="kinh">Học tiếp nhé! Còn 10 câu nữa là đủ mức hôm nay.</p></div>
  <button class="nut-lon"><span class="banh-o" data-hinh="banh"><span data-i="sach"></span></span><span class="giua"><b>Học tiếp · Chặng 3</b><span class="phu">Amino acid (P1) · còn 4 câu</span></span><span data-i="phai"></span></button>
</main><aside class="trang" aria-label="Việc hôm nay">
  <section class="kinh viec"><h2>Việc hôm nay <span>3/7 xong</span></h2>
    <button class="hang" data-tt="xong"><span class="tich"><span data-i="check"></span></span><span class="giua"><b>Kiểm tra ôn tập</b><span class="mo">Đã nộp · điểm 8,5/10</span></span><span class="the-loai" data-k="kiem"></span></button>
    <button class="hang" data-tt="xong"><span class="tich"><span data-i="check"></span></span><span class="giua"><b>Chặng 1</b><span class="mo">6 câu</span></span><span class="the-loai" data-k="hoc"></span></button>
    <button class="hang" data-tt="xong"><span class="tich"><span data-i="check"></span></span><span class="giua"><b>Chặng 2</b><span class="mo">6 câu</span></span><span class="the-loai" data-k="hoc"></span></button>
    <button class="hang" data-tt="dang"><span class="tich" data-vong="2/6"></span><span class="giua"><b>Chặng 3</b><span class="mo">Học tiếp · còn 4 câu</span></span><span class="phai">2/6</span></button>
    <button class="hang" data-tt="khoa"><span class="tich"><span data-i="lock"></span></span><span class="giua"><b>Tự sửa lỗi · 3 câu</b><span class="mo">Làm xong các chặng phía trên để mở khoá</span></span><span class="the-loai" data-k="sua"></span></button>
    <button class="hang" data-tt="khoa"><span class="tich"><span data-i="lock"></span></span><span class="giua"><b>Chặng 4</b><span class="mo">Hoàn thành các chặng trước để mở khoá</span></span><span class="the-loai" data-k="hoc"></span></button>
    <button class="hang"><span class="tich"></span><span class="giua"><b>Bài tập về nhà</b><span class="mo">1 bài thầy đang giao</span></span><span class="the-loai" data-k="bt"></span></button>
  </section>
  <section class="kinh hang" style="border-radius:26px;padding:10px 10px 10px 14px" aria-label="Bạn học cùng"><span class="ava" data-hinh="co" style="width:44px;height:44px"><b style="color:var(--tr-sao-chu)">GB</b></span><span class="giua"><b style="font-size:15px">Trần Gia Bảo chưa đủ mức hôm nay</b><span class="mo">Lửa đôi 3 ngày</span></span><button class="chip" style="height:44px;color:var(--tr-hs-chu)"><span data-i="tay"></span>Gõ cửa</button></section>
</aside></div>
