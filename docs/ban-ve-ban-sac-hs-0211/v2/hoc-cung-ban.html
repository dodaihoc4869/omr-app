<!doctype html>
<html lang="vi" data-trong="hs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Học cùng bạn · lửa đôi</title>
<link rel="stylesheet" href="kinh.css">
</head><body>
<main class="trang" data-rong-1>
  <header class="dau-con"><button class="nut-tron kinh" aria-label="Quay lại"><span data-i="trai"></span></button><h1>Học cùng bạn</h1></header>
  <section class="kinh the-p" style="display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">
    <div style="display:flex;align-items:center;gap:6px"><span class="ava" data-hinh="banh" style="width:72px;height:72px"><b style="font-size:20px">AN</b></span><span class="oi" data-sac="sao" data-co="to" style="border-radius:50%"><span data-i="flame"></span></span><span class="ava" data-hinh="co" style="width:72px;height:72px"><b style="font-size:20px;color:var(--tr-sao-chu)">GB</b></span></div>
    <div class="so-lon" style="color:var(--tr-sao-chu);font-size:52px">3<small>ngày lửa đôi</small></div>
    <span class="mo">Hôm nay em đã đủ mức · Gia Bảo chưa học</span>
    <button class="nut" data-l="chinh" data-rong><span data-i="tay"></span>Gõ cửa Gia Bảo</button>
  </section>
  <h2 class="tieu-nho">Bạn học cùng</h2>
  <section class="kinh ds">
    <button class="hang"><span class="ava-n" style="background:var(--tr-tin-nhat);color:var(--tr-tin-chu)">QH</span><span class="giua"><b>Quang Huy</b><span class="mo">Lửa đôi 9 ngày · đã học hôm nay</span></span><span class="chip" data-sac="dung" data-nho>Đã học</span></button>
    <button class="hang"><span class="ava-n" style="background:var(--tr-dung-nhat);color:var(--tr-dung-chu)">LP</span><span class="giua"><b>Lan Phương</b><span class="mo">Mời học cùng</span></span><button class="chip" style="height:44px;padding:0 16px;color:var(--tr-hs-chu)">Mời</button></button>
  </section>
</main>
<div class="thanh"><nav class="kinh" aria-label="Điều hướng học sinh"><a href="#"><span data-i="sparkles"></span>Hôm nay</a><a href="#"><span data-i="wrench"></span>Luyện tập</a><a href="#" aria-current="page"><span data-i="trophy"></span>Thành tích</a><a href="#"><span data-i="luoi"></span>Thêm<span class="cham">1</span></a></nav><button class="ai kinh" aria-label="Hỏi A.I Đỗ Đại Học"><span data-i="chat"></span></button></div>
<script src="../ve.js"></script><script src="kve.js"></script><script src="binh.js"></script>
</body></html>
