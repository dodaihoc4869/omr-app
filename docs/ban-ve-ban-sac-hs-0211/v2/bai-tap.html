<!doctype html>
<html lang="vi" data-trong="hs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bài tập về nhà · danh sách và hạn nộp</title>
<link rel="stylesheet" href="kinh.css">
</head><body>
<main class="trang" data-rong-1>
  <header class="dau-con"><button class="nut-tron kinh" aria-label="Quay lại"><span data-i="trai"></span></button><h1>Bài tập về nhà</h1></header>
  <section class="kinh the-p" style="display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 0 0 2px var(--tr-chu-y-nut),var(--kinh-bong)">
    <div style="display:flex;gap:12px;align-items:center"><span class="oi" data-sac="chu-y" data-co="to"><span data-i="pen"></span></span><div style="flex:1"><b style="font-size:18px;display:block">BTVN Amino acid · đề 2</b><span class="mo">30 câu · thầy giao 01/11</span></div><span class="chip" data-sac="chu-y" data-nho>Hạn 05/11</span></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center"><div class="kinh" style="padding:10px 6px;border-radius:18px;background:var(--kinh-dam)"><b style="display:block;font-size:18px">1/3</b><span class="mo" style="font-size:12.5px">Chặng đang mở</span></div><div class="kinh" style="padding:10px 6px;border-radius:18px;background:var(--kinh-dam)"><b style="display:block;font-size:18px">2</b><span class="mo" style="font-size:12.5px">Chặng sau</span></div><div class="kinh" style="padding:10px 6px;border-radius:18px;background:var(--kinh-dam)"><b style="display:block;font-size:18px">Chưa</b><span class="mo" style="font-size:12.5px">Nộp bài</span></div></div>
    <button class="nut" data-l="chinh" data-rong>Vào làm bài</button>
  </section>
  <h2 class="tieu-nho">Đã nộp</h2>
  <section class="kinh ds">
    <button class="hang"><span class="oi" data-sac="dung" data-co="nho"><span data-i="check"></span></span><span class="giua"><b>BTVN Ester – Lipid</b><span class="mo">Đã nộp 28/10 · 8,0 điểm</span></span><span class="chip" data-sac="dung" data-nho>Xem lại bài</span></button>
    <button class="hang"><span class="oi" data-sac="xam" data-co="nho"><span data-i="refresh"></span></span><span class="giua"><b>BTVN Carbohydrate</b><span class="mo">Đã nộp 22/10 · 6,5 điểm · còn 2/3 lượt làm lại</span></span><span class="chev"><span data-i="phai"></span></span></button>
  </section>
</main>
<div class="thanh"><nav class="kinh" aria-label="Điều hướng học sinh"><a href="#"><span data-i="sparkles"></span>Hôm nay</a><a href="#" aria-current="page"><span data-i="wrench"></span>Luyện tập</a><a href="#"><span data-i="trophy"></span>Thành tích</a><a href="#"><span data-i="luoi"></span>Thêm<span class="cham">1</span></a></nav><button class="ai kinh" aria-label="Hỏi A.I Đỗ Đại Học"><span data-i="chat"></span></button></div>
<script src="../ve.js"></script><script src="kve.js"></script><script src="binh.js"></script>
</body></html>
