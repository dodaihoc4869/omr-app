<!doctype html>
<html lang="vi" data-trong="hs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chữa câu sai · đường tự gỡ từng bước</title>
<link rel="stylesheet" href="kinh.css">
</head><body data-mot-man>
<div class="lam"><header class="lam-tren"><button class="nut-tron kinh" aria-label="Quay lại"><span data-i="trai"></span></button><b style="flex:1;font-size:18px">Sửa câu 12</b><span class="chip" data-sac="sai" data-nho>Sửa từng bước</span></header>
<div class="lam-than" data-hai><div class="cot">
  <section class="kinh the-p"><b style="font-size:15px;color:var(--tr-chu-3)">ĐƯỜNG TỰ GỠ · 1/4 bước</b>
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:12px"><div class="buoc-hd"><span class="so-b"><span data-i="check"></span></span><div class="giua" style="justify-content:center"><b style="">Tìm chỗ vướng</b></div></div><div class="buoc-hd"><span class="so-b">2</span><div class="giua" style="justify-content:center"><b style="color:var(--tr-hs-chu)">Hiểu cách làm</b></div></div><div class="buoc-hd" data-cho><span class="so-b">3</span><div class="giua" style="justify-content:center"><b style="color:var(--tr-chu-3)">Vì sao cách này đúng?</b></div></div><div class="buoc-hd" data-cho><span class="so-b">4</span><div class="giua" style="justify-content:center"><b style="color:var(--tr-chu-3)">Thử điều vừa hiểu với bài mới</b></div></div></div></section>
  <button class="nut" data-l="kinh" style="align-self:flex-start;min-height:44px;font-size:15px"><span data-i="mat"></span>Xem lại đề gốc</button>
</div><div class="cot">
  <section class="kinh the-p" style="display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 0 0 2px var(--tr-hs-day),var(--kinh-bong)"><span class="chip" data-sac="hs" data-nho style="align-self:flex-start">Bước 2 · Hiểu cách làm</span>
    <p style="font-size:17px;font-weight:650;line-height:1.5">Muối của glycine với HCl có công thức nào?</p>
    <div class="pa"><button class="kinh" aria-pressed="false"><span class="ky">A</span><span>H<sub>2</sub>N–CH<sub>2</sub>–COOCl</span></button><button class="kinh" aria-pressed="true"><span class="ky">B</span><span>ClH<sub>3</sub>N–CH<sub>2</sub>–COOH</span></button><button class="kinh" aria-pressed="false"><span class="ky">C</span><span>H<sub>2</sub>N–CH<sub>2</sub>–COONa</span></button></div>
    <p class="mo">Một gợi mở: HCl gắn vào nhóm nào của amino acid?</p></section>
  <div class="chan"><button class="nut" data-l="chinh" data-rong style="min-height:60px">Kiểm tra bước này</button></div>
</div></div></div>

<script src="../ve.js"></script><script src="kve.js"></script><script src="binh.js"></script>
