<html lang="vi" data-trong="hs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tự sửa lỗi · danh sách câu cần sửa</title>
<link rel="stylesheet" href="kinh.css">
</head><body>
<main class="trang" data-rong-1>
  <header class="dau-con"><button class="nut-tron kinh" aria-label="Quay lại"><span data-i="trai"></span></button><h1>Tự sửa lỗi</h1></header>
  <section class="kinh the-p" style="display:grid;grid-template-columns:1fr auto;align-items:end;gap:10px">
    <div><span class="nhan" style="font-size:14px;font-weight:800;color:var(--tr-chu-3)">HÔM NAY CẦN SỬA</span><div class="so-lon" style="color:var(--tr-sai-chu)">3<small>câu</small></div><p class="mo" style="margin-top:6px">Đã tự sửa 12/20 câu · chờ lần gặp lại 5 câu</p></div>
    <span style="width:92px"><span data-mol="nghi"></span></span>
    <div class="vach-t" style="grid-column:1/-1" aria-label="Đã tự sửa 12/20 câu"><i data-d></i><i data-d></i><i data-d></i><i data-d></i><i data-d></i><i data-d></i><i data-d></i><i data-d></i><i data-d></i><i data-d></i><i data-d></i><i data-d></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </section>
  <button class="nut" data-l="sai" data-rong style="min-height:60px">Bắt đầu sửa · 3 câu</button>
  <h2 class="tieu-nho">Cần sửa <span>3 câu</span></h2>
  <section class="kinh ds">
    <button class="hang"><span class="oi" data-sac="sai" data-co="nho"><span data-i="wrench"></span></span><span class="giua"><b>Câu 12 · Amino acid</b><span class="mo">Đang sửa từng bước · bước 2/4</span></span><span class="chip" data-sac="sai" data-nho>Sửa tiếp</span></button>
    <button class="hang"><span class="oi" data-sac="sai" data-co="nho"><span data-i="wrench"></span></span><span class="giua"><b>Câu 7 · Ester – Lipid</b><span class="mo">Chưa bắt đầu</span></span><span class="chev"><span data-i="phai"></span></span></button>
    <button class="hang"><span class="oi" data-sac="sai" data-co="nho"><span data-i="wrench"></span></span><span class="giua"><b>Câu 3 · Amine</b><span class="mo">Chờ chữa trên lớp · em sửa trước được</span></span><span class="chev"><span data-i="phai"></span></span></button>
  </section>
  <h2 class="tieu-nho">Đang chờ lần gặp lại <span>5 câu</span></h2>
  <section class="kinh ds">
    <button class="hang"><span class="oi" data-sac="sao" data-co="nho"><span data-i="dong_ho"></span></span><span class="giua"><b>Câu 9 · Glucose</b><span class="mo">Gặp lại Thứ Tư 04/11</span></span><span class="chip" data-sac="sao" data-nho>Chờ</span></button>
    <button class="hang"><span class="oi" data-sac="dung" data-co="nho"><span data-i="check"></span></span><span class="giua"><b>Câu 5 · Ester – Lipid</b><span class="mo">Đã tự sửa</span></span><span class="chip" data-sac="dung" data-nho>Xong</span></button>
  </section>
</main>
