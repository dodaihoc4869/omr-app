<!doctype html>
<html lang="vi" data-trong="hs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luyện tập · bento</title>
<link rel="stylesheet" href="kinh.css">
</head><body>
<main class="trang" data-rong-1>
  <header class="tieu-trang"><h1>Luyện tập</h1><button class="nut-tron kinh" aria-label="Thông báo, 2 chưa đọc"><span data-i="bell"></span><span class="cham">2</span></button></header>
  <div class="bento">
    <button class="kinh ob" data-to style="box-shadow:inset 0 0 0 2px color-mix(in oklab,var(--tr-sai) 45%,transparent),var(--kinh-bong)"><span class="oi" data-sac="sai" data-co="to"><span data-i="wrench"></span></span><span style="display:flex;flex-direction:column"><b style="font-size:20px">Tự sửa lỗi</b><span class="mo">Câu cần sửa hôm nay · nên làm trước</span></span><span class="so-g" style="color:var(--tr-sai-chu)">3<small>câu</small></span></button>
    <button class="kinh ob"><span class="oi" data-sac="tin"><span data-i="target"></span></span><span class="so-g" style="color:var(--tr-tin-chu)">20<small>câu</small></span><b>Kiểm tra ôn tập</b><span class="mo">Thứ Năm 06/11 · còn 4 ngày</span></button>
    <button class="kinh ob"><span class="oi" data-sac="chu-y"><span data-i="pen"></span></span><span class="so-g" style="color:var(--tr-chu-y-chu)">1<small>bài</small></span><b>Bài tập về nhà</b><span class="mo">Thầy đang giao</span></button>
    <button class="kinh ob"><span class="oi" data-sac="dung"><span data-i="history"></span></span><b>Câu đã làm</b><span class="mo">Lời giải và lịch ôn từng câu</span></button>
    <button class="kinh ob"><span class="oi" data-sac="sao"><span data-i="layers"></span></span><b>Tu luyện</b><span class="mo">Luyện thêm theo chương, dạng, mức</span></button>
    <button class="kinh ob" data-to><span class="oi" data-sac="tim"><span data-i="refresh"></span></span><span style="display:flex;flex-direction:column"><b>Luyện lại từ bài kiểm tra</b><span class="mo">Câu sai trong các bài kiểm tra</span></span><span class="chev"><span data-i="phai"></span></span></button>
  </div>
</main>
<div class="thanh"><nav class="kinh" aria-label="Điều hướng học sinh"><a href="#"><span data-i="sparkles"></span>Hôm nay</a><a href="#" aria-current="page"><span data-i="wrench"></span>Luyện tập</a><a href="#"><span data-i="trophy"></span>Thành tích</a><a href="#"><span data-i="luoi"></span>Thêm<span class="cham">1</span></a></nav><button class="ai kinh" aria-label="Hỏi A.I Đỗ Đại Học"><span data-i="chat"></span></button></div>
<script src="../ve.js"></script><script src="kve.js"></script><script src="binh.js"></script>
</body></html>
