<script>
const q = new URLSearchParams(location.search), CANH = q.get('canh') || 'tran', YEU = q.get('yeu') === '1'
const TOI = matchMedia('(prefers-color-scheme: dark)').matches
document.body.classList.toggle('toi', TOI); document.body.classList.toggle('yeu', YEU); document.body.classList.toggle('doc', innerHeight > innerWidth); document.body.classList.toggle('thap', innerHeight < 500)
const W = innerWidth, H = innerHeight, DOC = H > W
const cs = getComputedStyle(document.documentElement), v0 = (n) => cs.getPropertyValue(n).trim()
const v = (n) => v0(n === '--tr-trang' && TOI ? '--tr-chu' : n)
const CAPM = ['', TOI ? '--tr-chu-3' : '--tr-vien-2', '--tr-dung', '--tr-chu-y', '--tr-hs', '--tr-sao'] // màu 5 cấp súng giữ như v1 (--dn-capm-1…5)
const CHU_NT = v0(TOI ? '--tr-nen' : '--tr-chu') // ký hiệu trên quả cầu sáng: luôn chữ tối // tối: --tr-trang là nền tối ⇒ điểm sáng dùng --tr-chu
// ─── NGUYÊN TỬ: quả cầu bóng màu phe + VÒNG ELECTRON = cấp súng (1–5) + ký hiệu + nhãn tên; máy yếu: hình phẳng, 1 vòng tĩnh
const NT = { Na: 'Natri', O: 'Oxi', N: 'Nitơ', Cl: 'Clo', S: 'Lưu huỳnh', Fe: 'Sắt', Ne: 'Neon' }
function defs() {
  const g = (id, a, b, c) => `<radialGradient id="${id}" cx=".34" cy=".3" r=".78"><stop offset="0" stop-color="${a}"/><stop offset=".42" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></radialGradient>`
  const vang = v('--tr-sao'), p0 = v('--tr-tin'), p1 = v('--tr-sai'), tr = v('--tr-trang')
  return `<defs>${g('c0', tr, p0, v('--tr-tin-day'))}${g('c1', tr, p1, v('--tr-sai-day'))}
    <radialGradient id="z0" cx="0" cy=".5" r=".75"><stop offset="0" stop-color="${p0}" stop-opacity="${TOI ? .32 : .22}"/><stop offset="1" stop-color="${p0}" stop-opacity="0"/></radialGradient>
    <radialGradient id="z1" cx="1" cy=".5" r=".75"><stop offset="0" stop-color="${p1}" stop-opacity="${TOI ? .3 : .2}"/><stop offset="1" stop-color="${p1}" stop-opacity="0"/></radialGradient>
    <linearGradient id="v0" x1="1" x2="0"><stop offset="0" stop-color="${p0}"/><stop offset="1" stop-color="${p0}" stop-opacity="0"/></linearGradient>
    <linearGradient id="v1" x1="1" x2="0"><stop offset="0" stop-color="${p1}"/><stop offset="1" stop-color="${p1}" stop-opacity="0"/></linearGradient>
