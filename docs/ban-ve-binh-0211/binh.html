<!doctype html>
<!-- BẢN VẼ «BÌNH HÔM NAY» SINH ĐỘNG (thầy 02/11 tối: «Cái bình này màu hồng tôi muốn nó vector sinh động, nghiêng máy thì chất lỏng bên trong nghiêng theo,
     khi đổi màu thì tỏa sáng hồng tinh tế đẹp mắt, tải sẵn hiệu ứng cho mọi máy nhé, vẽ vector trc cho tôi xem rồi build»). SVG thuần + màu token app HS.
     ?goc=độ nghiêng máy · ?muc=0..1.3 mức dung dịch · ?du=1 đã đủ (hồng) · ?pha=0..1 khoảnh khắc đổi màu · ?chay=1 tự diễn (quay video). -->
<html lang="vi" data-trong="hs">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../src/styles/tokens.css"><link rel="stylesheet" href="../../src/styles/trong-hs-mau.css">
<style>
@font-face { font-family: 'DDH Rounded'; font-weight: 550 1000; src: url('../../src/styles/phong-ddh/ddh-rounded-dam-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
@font-face { font-family: 'DDH Rounded'; font-weight: 550 1000; src: url('../../src/styles/phong-ddh/ddh-rounded-dam-latin.woff2') format('woff2'); }
@font-face { font-family: 'DDH Rounded'; font-weight: 100 549; src: url('../../src/styles/phong-ddh/ddh-rounded-de-latin.woff2') format('woff2'); }
@font-face { font-family: 'DDH Rounded'; font-weight: 100 549; src: url('../../src/styles/phong-ddh/ddh-rounded-de-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
* { box-sizing: border-box; } html, body { margin: 0; height: 100%; }
body { font-family: 'DDH Rounded', sans-serif; background: var(--tr-nen) var(--kinh-loang); color: var(--tr-chu); display: grid; place-items: center; overflow: hidden; }
.the { width: 380px; padding: 22px 18px 18px 22px; border-radius: 30px; display: grid; grid-template-columns: 1fr 150px; align-items: end; gap: 8px;
  background: color-mix(in oklab, var(--tr-mat) 66%, transparent); box-shadow: inset 0 1px 0 color-mix(in oklab, var(--tr-mat) 90%, transparent), 0 18px 40px -26px var(--tr-phu); }
.the small { font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--tr-chu-3); }
.du .the small { color: var(--tr-tim-chu); }
.the b { display: block; font-size: 64px; line-height: 1; font-weight: 900; letter-spacing: -.03em; color: var(--tr-hs-day); }
.du .the b { color: var(--tr-tim); }
.the span { font-size: 26px; font-weight: 800; color: var(--tr-chu-3); }
.the p { margin: 10px 0 0; font-size: 14px; font-weight: 600; color: var(--tr-chu-2); line-height: 1.35; }
svg.binh { width: 150px; height: auto; overflow: visible; }
/* ── màu dung dịch: chàm (đang làm) → hồng (đủ) ── */
.binh { --pha: var(--tr-mat); --dd0: color-mix(in oklab, var(--tr-hs) 50%, var(--pha)); --dd1: var(--tr-hs); --sang: var(--tr-hs); }
.du .binh { --dd0: color-mix(in oklab, var(--tr-tim) 55%, var(--pha)); --dd1: var(--tr-tim); --sang: var(--tr-tim); }
@media (prefers-color-scheme: dark) { .binh { --pha: var(--tr-chu); } .du .binh { --dd0: color-mix(in oklab, var(--tr-tim) 72%, var(--pha)); } }
.binh .l0 { stop-color: var(--dd0); } .binh .l1 { stop-color: var(--dd1); }
.binh .g0 { stop-color: var(--tr-mat); stop-opacity: .7; } .binh .g1 { stop-color: var(--tr-mat); stop-opacity: .08; } .binh .g2 { stop-color: var(--tr-mat); stop-opacity: .45; }
.binh .vo { fill: none; stroke: color-mix(in oklab, var(--tr-chu) 55%, transparent); stroke-width: 3; stroke-linejoin: round; }
.binh .vo2 { fill: none; stroke: color-mix(in oklab, var(--tr-mat) 85%, transparent); stroke-width: 1.4; stroke-linejoin: round; opacity: .8; }
.binh .mieng { fill: color-mix(in oklab, var(--tr-mat) 80%, transparent); stroke: color-mix(in oklab, var(--tr-chu) 55%, transparent); stroke-width: 2.6; }
.binh .loe { fill: none; stroke: var(--tr-mat); stroke-linecap: round; }
.binh .khum { fill: color-mix(in oklab, var(--dd0) 70%, var(--tr-mat)); }
.binh .song { fill: none; stroke: color-mix(in oklab, var(--tr-mat) 80%, transparent); stroke-width: 1.6; stroke-linecap: round; opacity: .8; }
.binh .vach { stroke: color-mix(in oklab, var(--tr-chu) 40%, transparent); stroke-width: 2; stroke-linecap: round; }
.binh .muc { stroke: var(--tr-tim-chu); stroke-width: 2.2; stroke-dasharray: 5 5; stroke-linecap: round; }
.binh .bot { fill: var(--pha); opacity: .6; }
.binh .bong { fill: var(--tr-phu); opacity: .3; }
.binh .quang { stop-color: var(--sang); }
.binh .tia { stroke: var(--tr-tim); stroke-linecap: round; }
</style></head>
<body>
<div class="the"><div><small id="nhan">Tổng câu hôm nay</small><b id="so">34<span>/63 câu</span></b><p id="phu">Còn 29 câu nữa là dung dịch đổi màu.</p></div>
<svg class="binh" viewBox="-30 -20 260 270" aria-hidden="true">
  <defs>
    <clipPath id="trong"><path id="voP" d="M86 22V76L30 190Q22 208 38 214Q46 217 56 217H144Q154 217 162 214Q178 208 170 190L114 76V22Z"/></clipPath>
    <linearGradient id="kinh" x1="0" x2="1"><stop offset="0" class="g0"/><stop offset=".45" class="g1"/><stop offset="1" class="g2"/></linearGradient>
    <linearGradient id="ddl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="l0"/><stop offset="1" class="l1"/></linearGradient>
    <radialGradient id="qg" cx=".5" cy=".62" r=".5"><stop offset="0" class="quang" stop-opacity=".55"/><stop offset=".55" class="quang" stop-opacity=".18"/><stop offset="1" class="quang" stop-opacity="0"/></radialGradient>
    <linearGradient id="phan" x1="0" x2="1"><stop offset="0" stop-color="white" stop-opacity="0"/><stop offset=".5" stop-color="white" stop-opacity=".55"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
  </defs>
  <ellipse id="quangNen" cx="100" cy="160" rx="128" ry="110" fill="url(#qg)" opacity="0"/>
  <ellipse class="bong" cx="100" cy="228" rx="76" ry="7"/>
  <use href="#voP" fill="url(#kinh)"/>
  <g clip-path="url(#trong)">
    <g id="dd"><rect id="ddR" x="-120" y="140" width="440" height="260" fill="url(#ddl)"/><path id="khum" class="khum"/><path id="songP" class="song"/></g>
    <g id="bots"></g>
    <rect id="phanQ" x="-60" y="0" width="60" height="240" fill="url(#phan)" opacity="0" transform="skewX(-18)"/>
  </g>
  <g id="vachs"></g>
  <line class="muc" x1="74" x2="126" y1="100" y2="100"/>
  <use href="#voP" class="vo"/>
  <path class="vo2" d="M91 26V78L38 188"/>
  <rect class="mieng" x="79" y="12" width="42" height="11" rx="5.5"/>
  <path class="loe" stroke-width="5" opacity=".85" d="M93 30V78M78 104L50 162"/>
  <path class="loe" stroke-width="3" opacity=".6" d="M44 176L40 186"/>
  <g id="tias" opacity="0"></g>
</svg></div>
<script>
const q = new URLSearchParams(location.search)
const S = { goc: +(q.get('goc') ?? 0), muc: +(q.get('muc') ?? .54), du: q.get('du') === '1', pha: q.get('pha') === null ? -1 : +q.get('pha') }
const DAY = 214, MUC = 100, f = (n) => n.toFixed(2)
const xP = (v) => 114 + Math.max(0, v - 76) * (56 / 114), xT = (v) => 86 - Math.max(0, v - 76) * (56 / 114)
// vạch chia
document.getElementById('vachs').innerHTML = [0.2, 0.4, 0.6, 0.8].map((k) => { const v = DAY - k * (DAY - MUC); return `<line class="vach" x1="${f(xP(v) - 16)}" x2="${f(xP(v) - 4)}" y1="${f(v)}" y2="${f(v)}"/>` }).join('')
const BOT = [[70, 6, 0], [118, 4, .35], [138, 5, .7], [96, 3, .2], [108, 2.5, .55], [150, 2.5, .85], [84, 3.5, .45]]
let gocNgang = S.goc, vGoc = 0, t0 = performance.now()
function ve(t, goc, muc, du, pha) {
  document.body.classList.toggle('du', du)
  const y = DAY - Math.min(muc, 1.3) * (DAY - MUC), cx = 100
  // DUNG DỊCH LUÔN NẰM NGANG THEO TRỌNG LỰC: máy nghiêng góc g ⇒ mặt nước trong bình xoay −g quanh tâm mặt nước (thể tích gần như giữ nguyên)
  const a = -goc, rad = a * Math.PI / 180
  document.getElementById('dd').setAttribute('transform', `rotate(${f(a)} ${cx} ${f(y)})`)
  document.getElementById('ddR').setAttribute('y', f(y))
  const w = 160, A = 1.6 + Math.min(4, Math.abs(vGoc) * .08)
  let d = `M${cx - w} ${f(y)}`
  for (let x = -w; x <= w; x += 8) d += `L${cx + x} ${f(y + Math.sin(x / 16 + t / 520) * A)}`
  document.getElementById('songP').setAttribute('d', d)
  document.getElementById('khum').setAttribute('d', d + `L${cx + w} ${f(y + 9)}L${cx - w} ${f(y + 9)}Z`)
  document.getElementById('bots').innerHTML = BOT.map(([bx, r, p]) => { const k = ((t / 4200 + p) % 1), by = DAY - 6 - k * (DAY - y - 10); return by > y + 6 ? `<circle class="bot" cx="${f(bx + Math.sin(t / 700 + p * 9) * 2.5)}" cy="${f(by)}" r="${r * (0.7 + k * .5)}"/>` : '' }).join('')
  // ĐỔI MÀU: quầng hồng nở một lần (pha 0→1) rồi giữ sáng dịu; vệt sáng quét qua bình; 8 tia nhỏ
  const qn = document.getElementById('quangNen'), ph = document.getElementById('phanQ'), tias = document.getElementById('tias')
  if (pha >= 0) {
    const e = Math.sin(Math.min(1, pha) * Math.PI)
    qn.setAttribute('opacity', f(.35 + e * .65)); qn.setAttribute('transform', `translate(100 160) scale(${f(.8 + e * .35)}) translate(-100 -160)`)
    ph.setAttribute('opacity', f(e)); ph.setAttribute('x', f(-60 + pha * 260))
    tias.setAttribute('opacity', f(e))
    tias.innerHTML = Array.from({ length: 8 }, (_, i) => { const g = i * Math.PI / 4 + .3, r0 = 96 + pha * 26, r1 = r0 + 10 * e; return `<line class="tia" stroke-width="2.4" x1="${f(100 + Math.cos(g) * r0)}" y1="${f(150 + Math.sin(g) * r0 * .9)}" x2="${f(100 + Math.cos(g) * r1)}" y2="${f(150 + Math.sin(g) * r1 * .9)}"/>` }).join('')
  } else { qn.setAttribute('opacity', du ? '.35' : '0'); qn.removeAttribute('transform'); ph.setAttribute('opacity', '0'); tias.setAttribute('opacity', '0') }
  const so = Math.round(muc * 63)
  document.getElementById('so').innerHTML = `${Math.min(so, 63)}<span>/63 câu</span>`
  document.getElementById('nhan').textContent = du ? 'Xong hết hôm nay' : 'Tổng câu hôm nay'
  document.getElementById('phu').textContent = du ? 'Tới điểm tương đương — dung dịch đã hồng!' : `Còn ${63 - Math.min(so, 63)} câu nữa là dung dịch đổi màu.`
}
if (q.get('chay') === '1') {
  // tự diễn 9 giây: nghiêng trái ↔ phải (lò xo, sóng sánh tắt dần), dâng tới mức, đổi màu hồng toả sáng
  const lap = (now) => {
    const t = (now - t0) / 1000
    const dich = t < 4 ? Math.sin(t * 1.6) * 20 : t < 5 ? 0 : 0
    vGoc += ((dich - gocNgang) * 40 - vGoc * 7) / 60; gocNgang += vGoc / 60
    const muc = t < 4 ? .55 : Math.min(1, .55 + (t - 4) * .45)
    const du = muc >= 1, pha = du ? Math.min(1, (t - 5.05) / 1.4) : -1
    ve(now - t0, gocNgang, muc, du, du ? pha : -1)
    requestAnimationFrame(lap)
  }
  requestAnimationFrame(lap)
} else ve(1200, S.goc, S.muc, S.du, S.pha)
</script>
</body></html>
