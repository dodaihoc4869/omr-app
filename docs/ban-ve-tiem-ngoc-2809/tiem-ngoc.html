<title>Tiệm Ngọc Lưu Ly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@1,600;1,700&display=swap">
<style>
/* Bản vẽ GĐ0 · gam "Lưu Ly buổi sáng": ngọc trai hồng, oải hương, trời xanh, ánh cầu vồng. Cố ý một bản sáng duy nhất. */
:root{
  color-scheme:light;
  --chu:#2E1A4F;--chu-2:#5A4680;--chu-3:#72619A;
  --kinh:rgba(255,255,255,.66);--kinh-2:rgba(255,255,255,.86);--vien:rgba(255,255,255,.95);--vien-mo:rgba(150,110,210,.2);--vien-2:rgba(150,110,210,.38);
  --bong:0 10px 30px rgba(150,90,210,.16),0 2px 6px rgba(150,90,210,.1);
  --hong:#E8408C;--hong-nhat:#FFE3F0;--tim:#8E45E6;--tim-nhat:#F1E7FF;--lam:#3FA9F5;
  --vang-1:#FFD66E;--vang-2:#F5A93B;--vang-dam:#8A5A00;
  --holo:linear-gradient(115deg,#FF7EB6 0%,#C08CFF 28%,#79C8FF 52%,#7EF0D0 74%,#FFE08A 90%,#FF7EB6 100%);
  --nut-1:#EE4A94;--nut-2:#9A4BEA;--nut-bo:#7A2D9C;
  --la-1:#5BE6B0;--la-2:#1FB985;--la-bo:#11805B;--la-chu:#053B27;
  --dung:#0B8F60;--sai:#D23C6E;
  --tron:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;
  --sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --khac:'Cormorant Garamond','Iowan Old Style',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;color:var(--chu);font-family:var(--sans);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:10px;-webkit-font-smoothing:antialiased;
  background:radial-gradient(50% 40% at 10% 0%,#FFD9EC,transparent 70%),radial-gradient(45% 40% at 95% 10%,#E3D6FF,transparent 70%),radial-gradient(60% 50% at 70% 100%,#D6F0FF,transparent 70%),#FBF6FF}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--tim);outline-offset:2px}
sub,sup{font-size:.72em;line-height:0}
h2,h3{text-wrap:balance}
.chu-holo{background:linear-gradient(100deg,#E8408C,#9A4BEA 55%,#3FA9F5);-webkit-background-clip:text;background-clip:text;color:transparent}

/* Thanh bản vẽ (ngoài game) */
.banve{height:100%;display:flex;flex-direction:column;gap:10px;max-width:1440px;margin-inline:auto}
.thanh-bv{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.bv-ten{display:flex;flex-direction:column;min-width:0;flex:1 1 240px}
.bv-ten b{font-family:var(--tron);font-weight:800;font-size:17px}
.bv-ten span{font-size:12.5px;color:var(--chu-3)}
.bv-khung{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--kinh);border:1px solid var(--vien);box-shadow:var(--bong)}
.bv-khung button{border:0;background:transparent;padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--chu-2);min-height:40px}
.bv-khung button[aria-pressed="true"]{background:linear-gradient(135deg,var(--nut-1),var(--nut-2));color:#FFFFFF}
.bv-nut{border:1px solid var(--vien-2);background:var(--kinh-2);border-radius:12px;padding:8px 14px;font-size:13px;font-weight:600;min-height:40px}
.san{position:relative;flex:1;min-height:0}
.khung{position:absolute;top:0;left:0;transform-origin:0 0;border-radius:30px;box-shadow:0 30px 80px rgba(150,90,210,.28),0 0 0 1px rgba(255,255,255,.95);overflow:hidden;background:#FFF6FB}
.khung.day{border-radius:20px}
@media (max-width:719px){.bv-khung{display:none}}

/* Khung app */
.app{position:relative;width:100%;height:100%;overflow:hidden;display:grid;container-type:size;border-radius:inherit;
  background:radial-gradient(60% 40% at 12% 6%,rgba(255,182,219,.8),transparent 70%),radial-gradient(55% 40% at 92% 16%,rgba(196,176,255,.75),transparent 70%),radial-gradient(60% 45% at 85% 96%,rgba(160,225,255,.7),transparent 70%),radial-gradient(50% 40% at 6% 92%,rgba(170,245,222,.6),transparent 70%),linear-gradient(180deg,#FFF6FB,#F6F0FF 50%,#EEF8FF)}
.lung-linh{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.lung-linh i{position:absolute;display:block;background:var(--c);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);opacity:0;animation:nhap var(--t) ease-in-out var(--tre) infinite}
@keyframes nhap{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:.95;transform:scale(1) rotate(45deg)}}
.app > .dau,.app > .dieu-huong,.app > .than,.app > .cot-phai{position:relative;z-index:1}
.app[data-bo="doc"]{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"dau" "than" "nav"}
.app[data-bo="ngang"]{grid-template-columns:80px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"nav dau" "nav than"}
.app[data-bo="may"]{grid-template-columns:100px minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"nav dau dau" "nav than phai"}
.dau{grid-area:dau;display:flex;align-items:center;gap:8px;padding:12px 16px 8px}
.bien{display:flex;flex-direction:column;min-width:0;flex:1}
.bien-nho{font-family:var(--tron);font-weight:800;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase}
.bien-ten{font-family:var(--khac);font-style:italic;font-weight:700;font-size:27px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--chu)}
.bien-ten small{font-family:var(--sans);font-style:normal;font-weight:500;font-size:13px;color:var(--chu-2);margin-right:4px}
.bien-ten em{font-style:italic}
.nut-tron{width:44px;height:44px;border-radius:50%;border:1px solid var(--vien);background:var(--kinh-2);display:grid;place-items:center;flex:none;padding:0;box-shadow:var(--bong);color:var(--chu-3)}
.nut-tron svg{width:20px;height:20px}
.nut-tron[aria-pressed="true"]{color:var(--hong);border-color:#FFC2DD}
.dieu-huong{grid-area:nav;display:flex;background:rgba(255,255,255,.74);border-top:1px solid var(--vien);box-shadow:0 -8px 24px rgba(150,90,210,.08);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.dieu-huong button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;min-height:62px;padding:6px 4px 8px;font-size:12px;font-weight:600;color:var(--chu-3);position:relative}
.dieu-huong svg{width:24px;height:24px}
.dieu-huong button[aria-current="page"]{color:var(--tim)}
.dieu-huong button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--holo)}
.dieu-huong em{font-style:normal;font-size:10px;font-weight:700;line-height:1.5;color:#6B3FC2;background:var(--tim-nhat);border-radius:6px;padding:0 5px}
.app:not([data-bo="doc"]) .dieu-huong{flex-direction:column;justify-content:flex-start;gap:6px;padding:14px 6px;border-top:0;border-right:1px solid var(--vien)}
.app:not([data-bo="doc"]) .dieu-huong button{flex:none;min-height:68px;border-radius:14px}
.app:not([data-bo="doc"]) .dieu-huong button[aria-current="page"]{background:var(--tim-nhat)}
.app:not([data-bo="doc"]) .dieu-huong button[aria-current="page"]::before{top:18%;bottom:18%;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
.than{grid-area:than;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:4px 16px 24px;min-height:0}
.cot-phai{grid-area:phai;display:none;flex-direction:column;gap:12px;padding:4px 16px 24px 4px;overflow-y:auto;min-height:0}
.app[data-bo="may"] .cot-phai{display:flex}

/* Nút */
.nut-vang,.nut-la{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:18px;min-height:54px;padding:10px 20px;font-family:var(--tron);font-weight:800;font-size:19px;transition:transform .08s,box-shadow .08s}
.nut-vang{color:#FFFFFF;text-shadow:0 1px 0 rgba(90,20,90,.35);background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 52%),linear-gradient(120deg,var(--nut-1),#C84ACB 50%,var(--nut-2));box-shadow:0 5px 0 var(--nut-bo),0 14px 30px rgba(200,70,180,.34)}
.nut-vang::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));transform:skewX(-20deg);animation:loe 3.6s ease-in-out infinite}
@keyframes loe{0%,55%{left:-60%}85%,100%{left:130%}}
.nut-la{color:var(--la-chu);background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 52%),linear-gradient(120deg,var(--la-1),var(--la-2));box-shadow:0 5px 0 var(--la-bo),0 12px 26px rgba(31,185,133,.3)}
.nut-vang:active:not(:disabled),.nut-la:active{transform:translateY(3px);box-shadow:0 2px 0 var(--nut-bo)}
.nut-vang:disabled{filter:grayscale(.55);opacity:.5}
.nut-vang:disabled::after{display:none}
.nut-phu{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:8px 18px;border-radius:16px;border:1px solid var(--vien-2);background:var(--kinh-2);font-weight:700;font-size:15px;color:var(--chu);box-shadow:var(--bong)}
.nut-chu{border:0;background:transparent;color:#B0307E;font-weight:700;min-height:44px;padding:6px 8px;border-radius:10px}
.rong{width:100%}
.hang-nut{display:flex;flex-wrap:wrap;gap:10px}
.hang-nut > *{flex:1 1 140px}

/* Chữ, thẻ kính, chip */
.man{display:flex;flex-direction:column;gap:14px;max-width:640px;margin-inline:auto}
.app[data-bo="may"] .man{max-width:820px}
.ghi{font-size:13.5px;color:var(--chu-2);margin:0;line-height:1.5}
.tieu-nho{font-family:var(--tron);font-size:17px;font-weight:800;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tieu-nho span{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--chu-2)}
.the{position:relative;background:var(--kinh);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--vien);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--bong)}
.holo::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.6px;background:var(--holo);background-size:200% 100%;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;animation:holo 6s linear infinite}
@keyframes holo{to{background-position:200% 0}}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.78);border:1px solid var(--vien-mo);color:var(--chu-2);white-space:nowrap}
.chip.vang{color:var(--vang-dam);border-color:#F5D27A;background:#FFF3D1}
.chip.hong{color:#A8205E;border-color:#FFB6D6;background:var(--hong-nhat);white-space:normal}
.chip.tim{color:#6B3FC2;border-color:#D2BDFF;background:var(--tim-nhat)}
.hang-chip-nho{display:flex;flex-wrap:wrap;gap:6px}
.thanh-tien{height:9px;border-radius:9px;background:rgba(150,110,210,.16);overflow:hidden}
.thanh-tien i{display:block;height:100%;width:var(--w);background:var(--holo);background-size:200% 100%;border-radius:inherit;transition:width .25s linear;animation:holo 5s linear infinite}
.so-lieu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.so-lieu div{display:flex;flex-direction:column;min-width:0}
.so-lieu b{font-family:var(--tron);font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;color:var(--chu)}
.so-lieu span{font-size:12px;color:var(--chu-2);line-height:1.3}
.dong-tran{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;color:var(--chu-2)}
.dong-tran b{font-family:var(--tron);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.khay-dau{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.khay-dau h2{font-family:var(--tron);font-size:22px;font-weight:800;margin:0;flex:1;min-width:0}

/* Màn Tiệm */
.man-tiem .cot-canh,.man-tiem .cot-viec{display:flex;flex-direction:column;gap:10px;min-width:0}
.app:not([data-bo="doc"]) .man-tiem{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start;max-width:none}
.canh{position:relative;aspect-ratio:400/250;border-radius:24px;overflow:hidden;border:2px solid #FFFFFF;box-shadow:0 18px 40px rgba(170,100,210,.28),0 0 0 1px rgba(200,160,240,.4)}
.canh > svg{position:absolute;inset:0;width:100%;height:100%}
.canh .den{animation:den 3.2s ease-in-out infinite}
@keyframes den{50%{opacity:.35}}
.canh .cau-vong{animation:cvong 6s ease-in-out infinite}
@keyframes cvong{50%{opacity:.18}}
.canh .dung-dua{animation:dua 4s ease-in-out infinite;transform-box:view-box}
@keyframes dua{0%,100%{rotate:-5deg}50%{rotate:5deg}}
.canh .thu{position:absolute;right:4%;bottom:42%;width:27%;height:auto;filter:drop-shadow(0 8px 8px rgba(140,80,160,.35));animation:tho 3.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes tho{50%{transform:translateY(-3%) scale(1.012)}}
.tu{position:absolute;left:3.5%;right:3.5%;bottom:5%;height:33%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:5px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.35));border:1.5px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #FFFFFF,0 4px 12px rgba(170,110,210,.2)}
.o-tu{position:relative;border:0;border-radius:9px;background:radial-gradient(80% 90% at 50% 100%,#F9C9E1,#E6D2FB);display:grid;place-items:center;padding:0;min-height:0;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}
.o-tu > svg{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px)}
.o-tu .trong{font-size:11px;font-weight:600;color:#8A6FB4}
.chu-tu{font-size:12.5px;color:var(--chu-3);margin:0;text-align:center}

/* Khay đá */
.khay{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px;border-radius:26px;background:radial-gradient(120% 90% at 50% 0%,#FFE6F3,#EADBFF 72%);box-shadow:inset 0 2px 16px rgba(190,120,200,.3),0 0 0 2px #FFFFFF,0 12px 30px rgba(170,110,210,.2)}
.app[data-bo="ngang"] .khay{grid-template-columns:repeat(6,minmax(0,1fr))}
.da{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;padding:6px 2px 8px;border-radius:18px;text-align:center;min-width:0;color:var(--chu)}
button.da{transition:transform .15s}
button.da:hover{background:rgba(255,255,255,.55);transform:translateY(-2px)}
.da-hinh{width:88px;max-width:100%;height:88px;display:grid;place-items:center}
.da-hinh svg{width:calc(88px * var(--co,1));max-width:100%;height:auto;overflow:visible}
.da-dang{font-size:12.5px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.da-muc{font-size:11.5px;color:var(--chu-2);line-height:1.3}
.da-nhan{font-size:11px;font-weight:700;border-radius:8px;padding:1px 7px}
.da-nhan.nut{color:var(--vang-dam);background:#FFF0C4}
.da-nhan.me{color:#6B3FC2;background:#EADDFF}
.da.cat .da-dang{color:var(--chu-3)}
.da-svg .hao,.ngoc.dong .hao{animation:hao 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes hao{50%{opacity:.55;transform:scale(1.06)}}

/* Tấm phủ: câu hỏi, Sổ, thẻ ảnh */
.phu{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end}
.phu-nen{position:absolute;inset:0;background:rgba(90,50,130,.32);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.tam{position:relative;width:100%;max-height:92%;display:flex;flex-direction:column;background:linear-gradient(180deg,#FFFFFF,#FBF5FF);border-radius:28px 28px 0 0;box-shadow:0 -20px 60px rgba(120,60,170,.28);animation:len .28s cubic-bezier(.2,.8,.2,1)}
.tam::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;border-radius:28px 28px 0 0;background:var(--holo)}
@keyframes len{from{transform:translateY(40px);opacity:0}}
.app:not([data-bo="doc"]) .phu{justify-content:flex-end;align-items:stretch}
.app:not([data-bo="doc"]) .tam{width:min(560px,58%);max-height:100%;border-radius:28px 0 0 28px;animation-name:sang-trai}
.app:not([data-bo="doc"]) .tam::before{border-radius:28px 0 0 0}
@keyframes sang-trai{from{transform:translateX(40px);opacity:0}}
.tam-dau{padding:18px 18px 10px;display:flex;flex-direction:column;gap:8px}
.tieu-tam{font-family:var(--tron);font-size:19px;font-weight:800;margin:0;line-height:1.3}
.tam-than{padding:4px 18px 16px;overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0}
.tam-chan{padding:12px 18px 16px;border-top:1px solid var(--vien-mo);display:flex;gap:10px}
.gio{display:flex;align-items:center;gap:10px}
.gio .thanh-tien{flex:1}
.gio b{font-family:var(--tron);font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.gio.gap b{color:var(--hong)}
.de{font-size:16px;line-height:1.6;margin:0 0 14px}
.goi-y{font-size:13px;color:#7A5200;background:#FFF6DC;border:1px dashed #F2C45A;border-radius:12px;padding:8px 12px;margin:0 0 12px}
.pa{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:1.5px solid #EADFF8;background:#FFFFFF;border-radius:16px;padding:11px 14px;min-height:52px;margin-bottom:8px;font-size:15.5px;line-height:1.45;color:var(--chu);box-shadow:0 2px 8px rgba(150,90,210,.08)}
.pa .chu-cai{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--tron);font-weight:800;background:var(--tim-nhat);color:#6B3FC2}
.pa[aria-pressed="true"]{border-color:#F08CC0;background:#FFF1F8;box-shadow:0 0 0 3px rgba(238,74,148,.14)}
.pa[aria-pressed="true"] .chu-cai{background:linear-gradient(135deg,var(--nut-1),var(--nut-2));color:#FFFFFF}
.pa.gach{text-decoration:line-through;opacity:.4}
.y{border:1.5px solid #EADFF8;background:#FFFFFF;border-radius:16px;padding:10px 12px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px}
.y p{margin:0;font-size:15px}
.y-chon{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.y-chon button{min-height:44px;border-radius:12px;border:1.5px solid #E2D5F5;background:#FBF8FF;font-weight:700;color:var(--chu-2)}
.y-chon .d[aria-pressed="true"]{background:#DDF8EE;border-color:#3FCB96;color:#0B7A52}
.y-chon .s[aria-pressed="true"]{background:#FFE4EE;border-color:#F06A9A;color:#B8235A}
.o-nhap{display:flex;flex-direction:column;gap:6px}
.o-nhap label{font-weight:600;font-size:14px}
.o-nhap input{font-family:var(--tron);font-size:24px;font-weight:700;padding:10px 14px;border-radius:16px;border:1.5px solid #DCCBF5;background:#FFFFFF;color:var(--chu);min-height:56px;width:100%}

/* Mở đá */
.phu-mo{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;background:radial-gradient(60% 42% at 50% 32%,#FFFFFF 0%,#FFE8F4 38%,#ECE0FF 72%,#DFF0FF 100%)}
.app:not([data-bo="doc"]) .phu-mo{flex-direction:row}
.mo-san{position:relative;flex:1 1 50%;min-height:0;display:grid;place-items:center;cursor:pointer;overflow:hidden}
.mo-san canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.mo-da,.mo-ngoc,.tia,.vong-cv{grid-area:1/1}
.mo-da,.mo-ngoc{display:grid;place-items:center;z-index:2}
.mo-da svg{width:calc(min(44cqmin,230px) * var(--co,1));height:auto;overflow:visible}
.mo-ngoc svg{width:min(50cqmin,260px);height:auto;overflow:visible}
.tia{width:min(110cqmin,640px);aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,0) 0deg 8deg,rgba(255,255,255,.95) 11deg,rgba(255,255,255,0) 14deg 22deg);-webkit-mask:radial-gradient(circle,#000 12%,transparent 66%);mask:radial-gradient(circle,#000 12%,transparent 66%);opacity:0;scale:.5}
.vong-cv{width:min(64cqmin,330px);aspect-ratio:1;border-radius:50%;background:conic-gradient(#FF7EB6,#FFD66E,#7EF0D0,#79C8FF,#C08CFF,#FF7EB6);-webkit-mask:radial-gradient(circle,transparent 60%,#000 61%,#000 66%,transparent 67%);mask:radial-gradient(circle,transparent 60%,#000 61%,#000 66%,transparent 67%);opacity:0;filter:blur(1.5px)}
.phu-mo.tach .tia{opacity:.85;scale:1;transition:opacity .6s,scale .9s cubic-bezier(.2,.9,.25,1);animation:xoay 30s linear infinite}
.phu-mo.tach .vong-cv{opacity:.75;transition:opacity .8s .2s;animation:xoay 9s linear infinite reverse}
@keyframes xoay{to{rotate:360deg}}
.thu-mo{position:absolute;left:4%;bottom:6%;width:min(22cqmin,110px);height:auto;filter:drop-shadow(0 8px 8px rgba(140,80,160,.35));z-index:2}
.thu-mo.nhay{animation:nhay .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes nhay{40%{transform:translateY(-22%) rotate(-5deg)}}
.mo-bo-qua{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:13px;color:var(--chu-3);margin:0;z-index:4}
.mo-the{position:relative;flex:0 1 auto;max-height:60%;overflow-y:auto;overscroll-behavior:contain;margin:0 12px 12px;padding:18px 16px 16px;border-radius:24px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 16px 40px rgba(150,90,210,.25);animation:len .3s;display:flex;flex-direction:column;gap:10px}
.app:not([data-bo="doc"]) .mo-the{flex:0 0 min(460px,48%);max-height:none;margin:12px 12px 12px 0}
.mo-nhan{font-family:var(--tron);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#C0368A;margin:0}
.mo-nhan.sai{color:var(--sai)}
.ten-ngoc{font-family:var(--khac);font-style:italic;font-weight:700;font-size:36px;line-height:1.08;margin:0;background:linear-gradient(100deg,#E8408C,#9A4BEA 60%,#3FA9F5);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:2px}
.ten-ngoc.xam{background:none;color:#8C7FA6}
.ghi-cv{margin:0;font-size:14px;color:#8A5A00;font-weight:600}
.tt-ngoc{display:grid;gap:8px;margin:0}
.tt-ngoc div{display:grid;grid-template-columns:minmax(96px,auto) 1fr;gap:10px;align-items:baseline}
.tt-ngoc dt{font-size:12.5px;color:var(--chu-3);font-weight:600}
.tt-ngoc dd{margin:0;font-size:15px}
.kq{display:flex;flex-direction:column}
.pa-kq{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;padding:6px 0;border-bottom:1px dashed rgba(150,110,210,.2)}
.pa-kq .dau-kq{flex:none;width:18px;font-weight:800}
.pa-kq em{font-style:normal;color:var(--chu-3);font-size:13px}
.pa-kq.dung .dau-kq{color:var(--dung)}
.pa-kq.sai .dau-kq{color:var(--sai)}
.lg{padding:12px 14px;border-radius:16px;background:#F7F1FF;border:1px solid #E6D9FA}
.lg h4{margin:0 0 6px;font-family:var(--tron);font-size:12.5px;letter-spacing:.1em;color:#B0307E}
.lg p{margin:0;font-size:14.5px}
details.lg-gap summary{cursor:pointer;color:#B0307E;font-weight:700;min-height:44px;display:flex;align-items:center}
details.lg-gap[open]{display:flex;flex-direction:column;gap:8px}

/* Hoạt ảnh đá và ngọc */
.phu-mo.rung .mo-da{animation:rung .5s ease-in-out}
.phu-mo.rung-nhe .mo-da{animation:rung .35s ease-in-out}
@keyframes rung{0%,100%{transform:none}15%{transform:translateX(-5px) rotate(-3deg)}35%{transform:translateX(5px) rotate(3deg)}55%{transform:translateX(-4px) rotate(-2deg)}75%{transform:translateX(3px) rotate(1deg)}}
.vet-sang{stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
.phu-mo.nut .vet-sang{opacity:1;stroke-dashoffset:0;transition:stroke-dashoffset .35s ease-out,opacity .1s}
.phu-mo .nua{transition:transform .55s cubic-bezier(.2,.7,.3,1),opacity .55s ease-in}
.phu-mo.tach .nua.trai{transform:translate(-.6px,.25px) rotate(-16deg);opacity:0}
.phu-mo.tach .nua.phai{transform:translate(.6px,.25px) rotate(16deg);opacity:0}
.phu-mo.tach .vet-sang{opacity:0;transition:opacity .3s}
.phu-mo.tach .da-svg .hao{opacity:0}
.mo-ngoc{opacity:0;transform:scale(.3) rotateY(160deg)}
.phu-mo.tach .mo-ngoc{opacity:1;transform:none;transition:transform .8s cubic-bezier(.2,.9,.25,1.15),opacity .3s}
.phu-mo.ra .mo-da{animation:ra .7s ease-in forwards}
@keyframes ra{to{transform:translateY(34px) scale(.85);opacity:0}}
.ngoc .lo{opacity:0}
.ngoc.dong .lo{animation:lo 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes lo{0%,65%,100%{opacity:0;transform:scale(.2) rotate(0)}80%{opacity:1;transform:scale(1) rotate(45deg)}}
.ngoc.dong .quet{animation:quet 4s ease-in-out infinite}
@keyframes quet{0%{transform:translateX(0)}55%,100%{transform:translateX(6.4px)}}
.ngoc.dong .lua{animation:lua 2s ease-in-out infinite}
@keyframes lua{50%{opacity:.05}}
.ngoc.dong .opal-mau{animation:opal 8s linear infinite}
@keyframes opal{to{filter:hue-rotate(360deg)}}
.bat-goc .ngoc .goc{animation:goc .55s ease-out both}
.bat-goc .ngoc .goc-0{animation-delay:.35s}.bat-goc .ngoc .goc-1{animation-delay:.55s}.bat-goc .ngoc .goc-2{animation-delay:.75s}.bat-goc .ngoc .goc-3{animation-delay:.95s}
@keyframes goc{0%{opacity:0}35%{opacity:.9}100%{opacity:0}}
.cho-han .nut-vang-duong{stroke-dashoffset:1}
.dang-han .nut-vang-duong{stroke-dashoffset:0;transition:stroke-dashoffset 1.5s cubic-bezier(.4,0,.2,1)}

/* Chế tác */
.khuon-chon{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.khuon-chon button{border:1.5px solid #EADFF8;background:var(--kinh-2);border-radius:16px;padding:8px 4px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;box-shadow:0 2px 8px rgba(150,90,210,.08)}
.khuon-chon b{font-size:14px}
.khuon-chon span{font-size:11px;color:var(--chu-2);line-height:1.25}
.khuon-chon button[aria-pressed="true"]{border-color:#F08CC0;background:#FFF1F8;box-shadow:0 0 0 3px rgba(238,74,148,.14)}
.ban-nhung{border-radius:24px;background:radial-gradient(90% 80% at 50% 28%,#FFFFFF 0%,#FDE6F2 45%,#EAD8FB 100%);border:2px solid #FFFFFF;box-shadow:0 14px 34px rgba(170,110,210,.22);aspect-ratio:300/240;overflow:hidden}
.ban-nhung > svg{width:100%;height:100%;display:block}
.o-gan{display:flex;flex-wrap:wrap;gap:6px}
.chip-gan{border:1.5px solid #E2D5F5;background:#FFFFFF;border-radius:999px;padding:4px 12px;min-height:40px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip-gan span{color:var(--chu-3)}
.luat{margin:0;font-size:13.5px;color:var(--chu-2)}
.luat b{color:var(--sai);font-weight:700}
.hop{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.app[data-bo="may"] .man-chetac .khoi-hop{display:none}
.vien-ngoc{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid #FFFFFF;background:var(--kinh-2);border-radius:16px;padding:8px 4px;min-width:0;text-align:center;box-shadow:0 4px 12px rgba(150,90,210,.12)}
.vien-ngoc svg{width:50px;height:50px}
.vien-ngoc .t{font-size:12.5px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vien-ngoc .c{font-size:11px;color:var(--chu-2);line-height:1.3}
.vien-ngoc .sl{font-family:var(--tron);font-weight:800;font-size:12px;color:#B0307E}
.vien-ngoc:disabled{opacity:.38}
.ten-mon{display:flex;flex-direction:column;gap:8px}
.ten-mon h3{margin:0;font-size:14px;font-weight:600;color:var(--chu-2)}
.ten-mon h3 b{font-family:var(--khac);font-style:italic;font-size:24px;font-weight:700}
.hang-chip{display:flex;flex-wrap:wrap;gap:6px}
.hang-chip button{border:1.5px solid #E2D5F5;background:#FFFFFF;border-radius:999px;padding:6px 14px;min-height:44px;font-size:14px}
.hang-chip button[aria-pressed="true"]{border-color:#FF7EB6;background:var(--hong-nhat);color:#A8205E;font-weight:700}

/* Sổ Ngọc */
.ho{display:flex;flex-direction:column;gap:8px}
.ho h3{margin:6px 0 0;font-family:var(--tron);font-size:16px;font-weight:800}
.ho h3 small{font-family:var(--sans);font-weight:500;font-size:12.5px;color:var(--chu-3);margin-left:6px}
.luoi-so{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.app:not([data-bo="doc"]) .luoi-so{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.the-loai{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:18px;border:1.5px solid #FFFFFF;background:var(--kinh-2);text-align:center;min-width:0;box-shadow:0 4px 14px rgba(150,90,210,.12)}
.the-loai .hinh{width:64px;height:64px;display:grid;place-items:center;position:relative}
.the-loai .hinh svg{width:100%;height:100%}
.the-loai.an{background:rgba(255,255,255,.45)}
.the-loai.an .hinh svg,.so-hinh.an svg{filter:brightness(0) opacity(.16)}
.the-loai .hoi{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--tron);font-weight:800;font-size:17px;color:#8E6FC4}
.the-loai .ten{font-family:var(--khac);font-style:italic;font-weight:700;font-size:18px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.the-loai.an .ten{color:var(--chu-3)}
.o4{display:inline-flex;gap:5px;align-items:center;vertical-align:middle}
.o4 i{display:inline-block;border-radius:50%;background:rgba(150,110,210,.12);box-shadow:inset 0 0 0 1px rgba(150,110,210,.4)}
.o4 i.o1{width:6px;height:6px}.o4 i.o2{width:8px;height:8px}.o4 i.o3{width:10px;height:10px}
.o4 i.cv{width:8px;height:8px;border-radius:2px;transform:rotate(45deg);margin-left:2px}
.o4 i.co{background:var(--mau-ngoc,var(--tim));box-shadow:0 0 6px var(--mau-ngoc,var(--tim))}
.o4 i.cv.co{background:linear-gradient(135deg,var(--vang-1),var(--vang-2));box-shadow:0 0 6px var(--vang-1)}
.chu-giai{gap:4px;font-size:12.5px;color:var(--chu-2)}
.chu-giai i{--mau-ngoc:#B98CFF}
.so-hinh{width:160px;height:160px;margin:6px auto 0}
.so-hinh > svg{width:100%;height:100%}
.o-co{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:10px}
.o-co span{font-size:13px;padding:6px 10px;border-radius:12px;background:#FBF8FF;border:1px solid #E6D9FA}
.o-co span.co{border-color:#F5D27A;background:#FFF3D1;color:var(--vang-dam);font-weight:600}
.tam-so{display:flex;flex-direction:column;gap:8px;padding-top:12px}

/* Phố Ngọc, thẻ ảnh */
.pho{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.app:not([data-bo="doc"]) .pho{grid-template-columns:repeat(4,minmax(0,1fr))}
.tiem-ban{border-radius:18px;overflow:hidden;border:2px solid #FFFFFF;background:var(--kinh-2);box-shadow:0 6px 18px rgba(150,90,210,.14)}
.tiem-ban > svg{width:100%;height:auto;display:block}
.tiem-ban p{margin:0;padding:8px 10px;font-size:13px;font-weight:700}
.luat-pho{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--chu-2)}
.khung-anh canvas{display:block;margin:0 auto 10px;height:min(52cqh,560px);width:auto;max-width:100%;aspect-ratio:1080/1350;border-radius:16px;box-shadow:0 12px 30px rgba(150,90,210,.3)}
.phu-anh{z-index:35}

/* ---------- Tiện ích vẽ ---------- */
let SEQ=0;
const XMLNS='xmlns="http://www.w3.org/2000/svg"';
const kep=l=>Math.max(4,Math.min(98,l));
function mau(h,s,l,a=1){return `hsla(${Math.round(h)},${Math.round(s)}%,${kep(l).toFixed(1)}%,${a})`;}
function poly(pts){return pts.map(p=>p[0].toFixed(3)+','+p[1].toFixed(3)).join(' ');}
function P(r,deg){const a=deg*Math.PI/180;return [r*Math.cos(a),r*Math.sin(a)];}
function trongTam(pts){let x=0,y=0;pts.forEach(p=>{x+=p[0];y+=p[1];});return [x/pts.length,y/pts.length];}
function uon([x,y]){if(y<0){const t=Math.min(1,-y);x=x*(1-.8*Math.pow(t,1.7));y=y*1.28;}return [x*.92,y+.14];}
const khoa=o=>[o.loai,o.co,o.cat,o.cv?1:0,o.tam?1:0].join('|');
function tach(k){const a=k.split('|');return {loai:a[0],co:+a[1],cat:a[2],cv:a[3]==='1',tam:a[4]==='1'};}
function hslRgb(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return [f(0),f(8),f(4)].map(v=>Math.round(v*255)).join(',');}
const SUB={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻'};
function uni(html){return html.replace(/<sub>(.*?)<\/sub>/g,(m,a)=>[...a].map(c=>SUB[c]||c).join('')).replace(/<sup>(.*?)<\/sup>/g,(m,a)=>[...a].map(c=>SUP[c]||c).join('')).replace(/<[^>]+>/g,'');}

/* Giác cắt tròn (brilliant nhìn từ trên) */
function matTron(){
  const T=[],S=[],G=[];
  for(let i=0;i<8;i++){T.push(P(.5,i*45+22.5));S.push(P(.8,i*45));}
  for(let j=0;j<16;j++)G.push(P(1,j*22.5));
  const f=[{p:T,k:'mat'}];
  for(let i=0;i<8;i++){
    f.push({p:[T[(i+7)%8],T[i],S[i]],k:'sao'});
    f.push({p:[S[i],T[i],S[(i+1)%8],G[2*i+1]],k:'dieu'});
    f.push({p:[S[i],G[(2*i+15)%16],G[2*i]],k:'vien'});
    f.push({p:[S[i],G[2*i],G[2*i+1]],k:'vien'});
  }
  return {f,vien:G};
}
/* Giác vuông (princess) — 4 góc ứng với 4 ý a b c d */
function matVuong(){
  const s=.82,T=[[-.5,-.5],[.5,-.5],[.5,.5],[-.5,.5]].map(p=>[p[0]*s,p[1]*s]),O=[[-1,-1],[1,-1],[1,1],[-1,1]].map(p=>[p[0]*s,p[1]*s]);
  const f=[{p:T,k:'mat'}],M=[];
  for(let i=0;i<4;i++){
    const a=T[i],b=T[(i+1)%4],oa=O[i],ob=O[(i+1)%4],m=[(oa[0]+ob[0])/2,(oa[1]+ob[1])/2],p=[m[0]*.78,m[1]*.78];
    M.push(m);
    f.push({p:[a,b,p],k:'sao'});f.push({p:[a,p,m,oa],k:'dieu'});f.push({p:[b,ob,m,p],k:'dieu'});
  }
  return {f,vien:O,goc:[0,1,2,3].map(i=>[T[i],M[(i+3)%4],O[i],M[i]])};
}
function matGiot(){const m=matTron();return {f:m.f.map(f=>({k:f.k,p:f.p.map(uon)})),vien:m.vien.map(uon)};}

function veMat(L,m,r){
  const tp=L.l>80?34:20;let s='';
  m.f.forEach(f=>{
    const c=trongTam(f.p),d=(-c[0]-c[1])*.7071;
    let l=L.l+tp*.6*d+(r()-.5)*tp*.9;
    if(f.k==='mat')l=L.l+(L.l>80?2:9);else if(f.k==='dieu'&&d<0)l-=tp*.45;
    const sat=L.s<30?L.s:Math.min(100,L.s+10);
    s+=`<polygon points="${poly(f.p)}" fill="${mau(L.h,sat,l)}" stroke="rgba(255,255,255,.55)" stroke-width=".012" stroke-linejoin="round"/>`;
  });
  if(L.cauVong)for(let i=0;i<10;i++){const f=m.f[1+Math.floor(r()*(m.f.length-1))];s+=`<polygon class="lua" points="${poly(f.p)}" fill="${mau(Math.floor(r()*360),95,62,.38)}" style="animation-delay:${(r()*2.2).toFixed(2)}s"/>`;}
  s+=`<polygon points="${poly(m.vien)}" fill="none" stroke="${mau(L.h,Math.min(100,L.s+10),L.l-30,.95)}" stroke-width=".032" stroke-linejoin="round"/>`;
  return s;
}
function hinhCabo(cat,attr){
  if(cat==='vuong')return `<rect x="-.86" y="-.86" width="1.72" height="1.72" rx=".36" ${attr}/>`;
  if(cat==='giot')return `<path d="M0,-1.14 C.34,-.62 .92,-.2 .92,.22 A.92,.92 0 0 1 -.92,.22 C-.92,-.2 -.34,-.62 0,-1.14Z" ${attr}/>`;
  return `<ellipse cx="0" cy="0" rx=".96" ry=".9" ${attr}/>`;
}
function vanCabo(L,r){
  let s='';
  if(L.van==='dai')for(let i=0;i<9;i++)s+=`<ellipse cx=".3" cy=".42" rx="${(.16+i*.17).toFixed(2)}" ry="${(.12+i*.13).toFixed(2)}" fill="none" stroke="${mau(L.h,L.s,i%2?L.l-14:L.l+12,.7)}" stroke-width="${(.035+r()*.03).toFixed(3)}"/>`;
  if(L.van==='lam')for(let i=0;i<3;i++){const y=-.5+i*.45+r()*.1;s+=`<path d="M-1.1,${y.toFixed(2)} C-.5,${(y-.3).toFixed(2)} -.2,${(y+.25).toFixed(2)} .3,${(y-.05).toFixed(2)} S.9,${(y+.2).toFixed(2)} 1.2,${(y-.1).toFixed(2)}" fill="none" stroke="hsla(28,35%,30%,.55)" stroke-width=".03"/>`;}
  if(L.van==='bot'){s+=`<ellipse cx=".05" cy=".1" rx=".6" ry=".5" fill="${mau(L.h,L.s,L.l+22,.35)}"/>`;for(let i=0;i<6;i++)s+=`<circle cx="${((r()-.5)*1.2).toFixed(2)}" cy="${((r()-.5)*1.1).toFixed(2)}" r="${(.03+r()*.05).toFixed(3)}" fill="${mau(L.h,L.s,L.l+30,.3)}" stroke="${mau(L.h,80,88,.55)}" stroke-width=".01"/>`;}
  return s;
}
function veBatDien(L){
  const bat=(dx,dy,k)=>{const Q=p=>[dx+p[0]*k,dy+p[1]*k];const T=Q([0,-1]),B=Q([0,1]),Lp=Q([-.82,.06]),R=Q([.82,-.06]),F=Q([.14,.2]);
    return [[T,Lp,F,96],[T,F,R,84],[B,F,Lp,70],[B,R,F,60]].map(([a,b,c,l])=>`<polygon points="${poly([a,b,c])}" fill="${mau(L.h,L.s,l,.9)}" stroke="${mau(L.h,35,52,.75)}" stroke-width=".018" stroke-linejoin="round"/>`).join('');};
  return bat(.55,.5,.42)+bat(-.12,-.02,.95);
}
function veLangTru(L){
  return [[-.2,-.66,.46,1.34,-.08,.26],[-.66,-.14,.48,1,-.1,.26],[.28,-.02,.44,.9,.1,.24]].map(([x,y,w,h,sk,d])=>{
    const A=[x,y],B=[x+w,y+sk],C=[x+w,y+sk+h],D=[x,y+h],A2=[x+d,y-d*.6],B2=[x+w+d,y+sk-d*.6],C2=[x+w+d,y+sk-d*.6+h];
    return `<polygon points="${poly([A,B,C,D])}" fill="${mau(L.h,L.s,L.l)}"/><polygon points="${poly([A,A2,B2,B])}" fill="${mau(L.h,L.s,L.l+22)}"/><polygon points="${poly([B,B2,C2,C])}" fill="${mau(L.h,L.s,L.l-15)}"/><path d="M${(x+w*.25).toFixed(2)},${(y+.08).toFixed(2)} L${(x+w*.25).toFixed(2)},${(y+h-.1).toFixed(2)}" stroke="#FFFFFF" stroke-opacity=".35" stroke-width=".03"/><polygon points="${poly([A,A2,B2,C2,C,D])}" fill="none" stroke="${mau(L.h,L.s,L.l-30,.6)}" stroke-width=".02" stroke-linejoin="round"/>`;
  }).join('');
}
function vePhien(L){
  const la=(rot,dx,dy,len,w)=>{const Q=[[0,-len],[w,-len+w*1.6],[w,len-w],[0,len],[-w,len-w],[-w,-len+w*1.6]];
    return `<g transform="translate(${dx} ${dy}) rotate(${rot})"><polygon points="${poly([Q[0],Q[3],Q[4],Q[5]])}" fill="${mau(L.h,L.s,94,.85)}"/><polygon points="${poly([Q[0],Q[1],Q[2],Q[3]])}" fill="${mau(L.h,L.s,77,.85)}"/><polygon points="${poly(Q)}" fill="none" stroke="${mau(L.h,30,55,.75)}" stroke-width=".02"/></g>`;};
  return la(-22,-.3,.12,.92,.16)+la(20,.3,.14,.88,.15)+la(0,0,-.04,1.06,.19);
}
function vetNut(seed){
  const r=rng(seed),a=[[-.8,-.5+r()*.2]];
  for(let i=1;i<=5;i++){const t=i/5;a.push([-.8+1.6*t+(r()-.5)*.22,-.5+1.05*t+(r()-.5)*.3]);}
  const g=a[2],b=[g,[g[0]+.3+r()*.15,g[1]-.35-r()*.1],[g[0]+.55+r()*.1,g[1]-.62]];
  const d=p=>'M'+p.map(q=>q[0].toFixed(3)+','+q[1].toFixed(3)).join(' L');
  return [d(a),d(b)];
}
function veLo(r,n){let s='';for(let i=0;i<n;i++){const x=(r()-.5)*1.1,y=(r()-.5)*1.1,a=.13+r()*.1;s+=`<path class="lo" d="M${x.toFixed(3)},${(y-a).toFixed(3)} L${(x+a*.2).toFixed(3)},${(y-a*.2).toFixed(3)} L${(x+a).toFixed(3)},${y.toFixed(3)} L${(x+a*.2).toFixed(3)},${(y+a*.2).toFixed(3)} L${x.toFixed(3)},${(y+a).toFixed(3)} L${(x-a*.2).toFixed(3)},${(y+a*.2).toFixed(3)} L${(x-a).toFixed(3)},${y.toFixed(3)} L${(x-a*.2).toFixed(3)},${(y-a*.2).toFixed(3)}Z" fill="#FFFFFF" style="animation-delay:${(r()*2.4).toFixed(2)}s"/>`;}return s;}

/* Viên ngọc: o = {cat, co, cv, tam, dong, goc, x, y, w} */
function ngocSVG(L,o={}){
  const id=++SEQ,cat=L.kieu==='trai'?'tron':(o.cat||'tron'),k=CO_K[o.co||3],r=rng(hash(L.id+cat));
  let defs='',than='',clip='';
  if(L.kieu==='giac'){
    const m=cat==='vuong'?matVuong():cat==='giot'?matGiot():matTron();
    clip=`<polygon points="${poly(m.vien)}"/>`;
    defs+=`<radialGradient id="w${id}" cx=".38" cy=".32" r=".62"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".62"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>`;
    than=veMat(L,m,r)+`<polygon points="${poly(m.vien)}" fill="url(#w${id})"/>`;
    if(m.goc&&o.goc)than+=m.goc.map((g,i)=>`<polygon class="goc goc-${i}" points="${poly(g)}" fill="#FFFFFF" opacity="0"/>`).join('');
  }else if(L.kieu==='cabo'||L.kieu==='opal'){
    clip=hinhCabo(cat,'');
    const l0=L.kieu==='opal'?L.l:L.l;
    defs+=`<radialGradient id="g${id}" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="${mau(L.h,L.s,l0+24)}"/><stop offset=".55" stop-color="${mau(L.h,L.s,l0)}"/><stop offset="1" stop-color="${mau(L.h,L.s,l0-20)}"/></radialGradient>`;
    than=hinhCabo(cat,`fill="url(#g${id})"`);
    if(L.kieu==='opal'){
      defs+=`<filter id="m${id}" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".08"/></filter>`;
      let b='';for(let i=0;i<16;i++)b+=`<circle cx="${((r()-.5)*1.8).toFixed(2)}" cy="${((r()-.5)*1.8).toFixed(2)}" r="${(.14+r()*.16).toFixed(2)}" fill="${mau(Math.floor(r()*360),95,60,.6)}"/>`;
      than+=`<g clip-path="url(#k${id})"><g class="opal-mau"><g filter="url(#m${id})">${b}</g></g></g>`;
    }else than+=`<g clip-path="url(#k${id})">${vanCabo(L,r)}</g>`;
    than+=`<ellipse cx="-.32" cy="-.46" rx=".36" ry=".16" transform="rotate(-28 -.32 -.46)" fill="#FFFFFF" opacity="${L.l<20?.6:.62}"/><circle cx=".42" cy=".44" r=".06" fill="#FFFFFF" opacity=".22"/>`;
    than+=hinhCabo(cat,`fill="none" stroke="${mau(L.h,L.s,L.l-28,.85)}" stroke-width=".035"`);
  }else if(L.kieu==='trai'){
    clip=`<circle r=".9"/>`;
    defs+=`<radialGradient id="g${id}" cx=".38" cy=".32" r=".82"><stop offset="0" stop-color="${mau(40,60,98)}"/><stop offset=".5" stop-color="${mau(32,38,88)}"/><stop offset=".85" stop-color="${mau(26,26,74)}"/><stop offset="1" stop-color="${mau(20,22,60)}"/></radialGradient><radialGradient id="p${id}" cx=".75" cy=".3" r=".6"><stop offset="0" stop-color="hsla(330,80%,82%,.45)"/><stop offset="1" stop-color="hsla(330,80%,82%,0)"/></radialGradient><radialGradient id="q${id}" cx=".28" cy=".78" r=".6"><stop offset="0" stop-color="hsla(160,60%,75%,.3)"/><stop offset="1" stop-color="hsla(160,60%,75%,0)"/></radialGradient>`;
    than=`<circle r=".9" fill="url(#g${id})"/><circle r=".9" fill="url(#p${id})"/><circle r=".9" fill="url(#q${id})"/><ellipse cx="-.3" cy="-.42" rx=".3" ry=".15" transform="rotate(-30 -.3 -.42)" fill="#FFFFFF" opacity=".75"/><circle r=".9" fill="none" stroke="${mau(28,20,55,.6)}" stroke-width=".03"/>`;
  }else{
    clip=`<circle r="1"/>`;
    than=L.kieu==='bat-dien'?veBatDien(L):L.kieu==='lang-tru'?veLangTru(L):vePhien(L);
  }
  defs+=`<clipPath id="k${id}">${clip}</clipPath>`;
  let hao='',vang='',lo='',quet='',aura='';
  if(o.sang!==false){const cA=L.s<30?[272,80,82]:[L.h,Math.min(100,L.s+10),Math.max(62,Math.min(78,L.l+14))];
    defs+=`<radialGradient id="a${id}"><stop offset=".3" stop-color="${mau(cA[0],cA[1],cA[2],.5)}"/><stop offset="1" stop-color="${mau(cA[0],cA[1],cA[2],0)}"/></radialGradient>`;
    aura=`<circle r="1.24" fill="url(#a${id})"/>`;}
  if(o.tam){defs+=`<radialGradient id="h${id}"><stop offset=".45" stop-color="${mau(L.h,Math.max(40,L.s),Math.max(60,Math.min(78,L.l)),.6)}"/><stop offset="1" stop-color="${mau(L.h,Math.max(40,L.s),70,0)}"/></radialGradient>`;hao=`<circle class="hao" r="1.23" fill="url(#h${id})"/>`;}

/* ---------- Âm thanh Web Audio tự sinh (không tệp) ---------- */
const AM=(()=>{
  let ctx=null,bus=null,tat=kho.get('game-battle-muted')==='1',nhacBat=false,hen=null,buoc=0,tN=0;
  const GIAI=[659.25,783.99,880,783.99,1046.5,880,783.99,659.25,587.33,659.25,783.99,880,783.99,0,659.25,0,659.25,783.99,880,1046.5,1174.66,1046.5,880,783.99,880,783.99,659.25,587.33,523.25,0,0,0];
  const BE=[261.63,220,293.66,196];
  function khoi(){
    if(tat)return null;
    if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
      try{ctx=new C();}catch(e){return null;}
      const tong=ctx.createGain();tong.gain.value=.9;tong.connect(ctx.destination);
      bus=ctx.createGain();bus.connect(tong);
      const n=Math.floor(ctx.sampleRate*1.6),b=ctx.createBuffer(2,n,ctx.sampleRate);
      for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6);}
      const vang=ctx.createConvolver();vang.buffer=b;const uot=ctx.createGain();uot.gain.value=.26;bus.connect(vang);vang.connect(uot);uot.connect(tong);}
    if(ctx.state==='suspended')ctx.resume();
    return ctx;
  }
  function not(f,t,dai,loai='sine',am=.2,pan=0){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=loai;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(am,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dai);
    if(pan&&ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=pan;g.connect(p);p.connect(bus);}else g.connect(bus);
    o.connect(g);o.start(t);o.stop(t+dai+.05);
  }
  function nhieu(t,dai,{loc='bandpass',f=2000,f2=null,q=1,am=.2}={}){
    const n=Math.max(1,Math.floor(ctx.sampleRate*dai)),b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const s=ctx.createBufferSource();s.buffer=b;const fl=ctx.createBiquadFilter();fl.type=loc;fl.frequency.setValueAtTime(f,t);
    if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dai);fl.Q.value=q;
    const g=ctx.createGain();g.gain.setValueAtTime(am,t);g.gain.exponentialRampToValueAtTime(.0001,t+dai);
    s.connect(fl);fl.connect(g);g.connect(bus);s.start(t);s.stop(t+dai);
  }
  function chuong(f,am=.16,tre=0){if(!khoi())return;const t=ctx.currentTime+tre;[[1,1,1.8],[2.76,.42,1.1],[5.4,.2,.6],[8.93,.08,.35]].forEach(([k,a,d])=>not(f*k,t,d,'sine',am*a));}
  function hop(f,t,am=.045){not(f,t,1.5,'sine',am);not(f*2,t,.5,'sine',am*.25);not(f*3.01,t,.25,'sine',am*.1);}
  function lich(){if(!ctx||!nhacBat)return;while(tN<ctx.currentTime+.15){const f=GIAI[buoc%GIAI.length];if(f)hop(f,tN);if(buoc%8===0)hop(BE[(buoc/8|0)%BE.length],tN,.03);buoc++;tN+=.34;}}
  function dungNhac(){nhacBat=false;clearInterval(hen);hen=null;}
  return {
    get tat(){return tat;},get nhac(){return nhacBat;},
    datTat(v){tat=v;kho.set('game-battle-muted',v?'1':'0');if(v)dungNhac();},
    batNhac(){if(!khoi())return false;nhacBat=true;buoc=0;tN=ctx.currentTime+.1;hen=setInterval(lich,40);return true;},
    dungNhac,
    cham(){if(khoi())not(880,ctx.currentTime,.05,'sine',.05);},
    moCau(){chuong(660,.07);},
    moMe(){[523.25,659.25,783.99].forEach((f,i)=>chuong(f,.07,i*.08));},
    goDa(){if(!khoi())return;const t=ctx.currentTime;[0,.16,.32].forEach(d=>{not(110,t+d,.12,'sine',.18);nhieu(t+d,.06,{loc:'lowpass',f:900,am:.12});});},
    nut(){if(!khoi())return;const t=ctx.currentTime;nhieu(t,.14,{f:3200,q:.9,am:.35});nhieu(t+.05,.1,{f:5200,q:1.2,am:.18});not(90,t,.18,'sine',.25);},
    ngoc(L){const f=520+(L.h%120)*4;chuong(f,.18);chuong(f*1.5,.08,.09);},
    lapLanh(){if(!khoi())return;const t=ctx.currentTime;for(let i=0;i<7;i++)not(2600+Math.random()*2600,t+.05+i*.05,.14,'sine',.05,Math.random()*1.4-.7);},
    rotVang(){if(!khoi())return;const t=ctx.currentTime;nhieu(t,1.4,{f:700,f2:3200,q:2,am:.09});[1046.5,1318.5,1568,2093].forEach((f,i)=>not(f,t+.9+i*.09,.9,'sine',.06));},
    cat(){if(!khoi())return;const t=ctx.currentTime;nhieu(t,.9,{loc:'lowpass',f:1400,f2:300,q:.5,am:.2});not(196,t,.35,'triangle',.07);not(146.8,t+.18,.45,'triangle',.07);},
    loi(){if(khoi())not(330,ctx.currentTime,.12,'triangle',.05);},
    dat(){if(!khoi())return;not(1400,ctx.currentTime,.05,'sine',.06);chuong(1760,.05,.03);},
    xong(){[1046.5,1174.66,1318.5,1568,1760,2093].forEach((f,i)=>chuong(f,.07,i*.085));},
    tick(){if(khoi())not(1200,ctx.currentTime,.03,'sine',.035);},
  };
})();

/* ---------- Hạt lấp lánh và cát ---------- */
const HAT={cv:null,x:null,ds:[],chay:false,t:0,w:0,h:0,d:1,
  gan(cv){this.cv=cv;this.x=cv.getContext('2d');this.ds=[];},
  co(){const c=this.cv;this.w=c.offsetWidth;this.h=c.offsetHeight;this.d=Math.min(2,window.devicePixelRatio||1);c.width=Math.round(this.w*this.d);c.height=Math.round(this.h*this.d);},
  no(L){if(giamDong()||!this.cv)return;this.co();const cx=this.w/2,cy=this.h/2,m=hslRgb(L.h,Math.max(40,L.s),Math.min(85,Math.max(60,L.l+20)));
    for(let i=0;i<50;i++){const a=Math.random()*Math.PI*2,v=120+Math.random()*300;this.ds.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,g:160,song:0,tho:.7+Math.random()*.6,s:2+Math.random()*3.5,mau:['255,196,80','255,120,180','170,120,255','90,190,255',m,m][Math.floor(Math.random()*6)],sao:true});}
    this.bat();},
  cat(){if(giamDong()||!this.cv)return;this.co();const cx=this.w/2,cy=this.h/2,R=Math.min(this.w,this.h)*.18,ms=['196,178,214','170,152,196','214,200,228','150,132,178'];
    for(let i=0;i<120;i++)this.ds.push({x:cx+(Math.random()-.5)*R*1.6,y:cy+(Math.random()-.5)*R*1.2,vx:(Math.random()-.5)*60,vy:-Math.random()*40,g:520,song:0,tho:1+Math.random()*.5,s:1.4+Math.random()*2.2,mau:ms[i%4],sao:false});
    this.bat();},
  bat(){if(this.chay)return;this.chay=true;this.t=performance.now();requestAnimationFrame(buocHat);}
};
function veSao(x,cx,cy,r){x.beginPath();x.moveTo(cx,cy-r*1.6);x.lineTo(cx+r*.35,cy-r*.35);x.lineTo(cx+r*1.6,cy);x.lineTo(cx+r*.35,cy+r*.35);x.lineTo(cx,cy+r*1.6);x.lineTo(cx-r*.35,cy+r*.35);x.lineTo(cx-r*1.6,cy);x.lineTo(cx-r*.35,cy-r*.35);x.closePath();x.fill();}
function buocHat(now){
  const H=HAT;if(!H.cv||!H.cv.isConnected){H.chay=false;H.ds=[];return;}
  const dt=Math.min(.05,(now-H.t)/1000),x=H.x;H.t=now;x.setTransform(H.d,0,0,H.d,0,0);x.clearRect(0,0,H.w,H.h);
  H.ds=H.ds.filter(p=>{p.song+=dt;if(p.song>p.tho)return false;p.vy+=p.g*dt;p.vx*=.985;p.x+=p.vx*dt;p.y+=p.vy*dt;const a=1-p.song/p.tho;x.fillStyle=`rgba(${p.mau},${a.toFixed(3)})`;if(p.sao)veSao(x,p.x,p.y,p.s*(.6+a*.6));else x.fillRect(p.x,p.y,p.s,p.s);return true;});
  if(H.ds.length)requestAnimationFrame(buocHat);else{H.chay=false;x.clearRect(0,0,H.w,H.h);}
}

}
function veTiem(){

    <div class="cot-viec">

        <div class="thanh-tien"><i style="--w:${(con/tong*100).toFixed(1)}%"></i></div>

    </div></section>`;
}

/* ---------- Mẻ đá ---------- */
function moMe(){
  if(S.me&&!S.me.xong){S.man='khay';ve();return;}
  if(S.tran.con<=0)return;
  const n=Math.min(6,S.tran.con),thuong=CAU.filter(q=>!q.me),me=CAU.find(q=>q.me);
  const ds=thuong.slice(0,n-1).concat([me]);
  const lan=S.lanMe;
  S.me={da:ds.map(q=>({q:Object.assign({},q,{vai:lan===0?q.vai:(SAI_TRUOC.has(q.id)?'on_lai':'moi')}),tt:'chua'})),xong:false,lan:lan+1};
  S.lanMe=lan+1;S.tran.con-=ds.length;S.man='khay';AM.moMe();ve();
}
function daHTML(da,i){
  const q=da.q,co=COQ[q.muc];
  const nhan=q.me?'<span class="da-nhan me">Đá Mẹ</span>':(q.vai==='on_lai'?'<span class="da-nhan nut">Câu em từng sai</span>':'');
  if(da.tt==='chua')return `<button class="da" data-i="${i}" aria-label="Đá thô ${i+1}: ${PHAN[q.phan]}, ${MUC[q.muc]}, dạng ${q.dang}${q.me?', Đá Mẹ':''}${q.vai==='on_lai'?', câu em từng sai':''}. Mở câu hỏi"><span class="da-hinh" style="--co:${CO_K[co]}">${daSVG(q)}</span><span class="da-dang">${q.dang}</span><span class="da-muc">${PHAN[q.phan]} · ${MUC[q.muc]}</span>${nhan}</button>`;
  if(da.tt==='dung'){const g=tach(da.ngoc),L=LM[g.loai];return `<div class="da xong"><span class="da-hinh" style="--co:${CO_K[g.co]}">${ngocSVG(L,{cat:g.cat,co:3,cv:g.cv,tam:g.tam,dong:true})}</span><span class="da-dang">${L.ten}</span><span class="da-muc">cỡ ${CO[g.co]}${g.cv?' · Chỉ Vàng':''}${g.tam?' · Ngọc Tâm':''}</span></div>`;}
  return `<div class="da xong cat"><span class="da-hinh">${catSVG()}</span><span class="da-dang">Rã thành cát</span><span class="da-muc">${q.dang} · đã vào lịch ôn</span></div>`;
}
function veKhay(){
  const me=S.me,mo=me.da.filter(d=>d.tt!=='chua').length;
  let ket='';
  if(me.xong){const dung=me.da.filter(d=>d.tt==='dung'),sai=me.da.filter(d=>d.tt==='sai');
    ket=`<div class="the"><h3 class="tieu-nho">Mẻ đá xong</h3>
      <div class="so-lieu"><div><b>${dung.length}/${me.da.length}</b><span>câu đúng</span></div><div><b>${dung.length}</b><span>viên ngọc mới vào Hộp</span></div><div><b>${S.tran.con}/${S.tran.tong}</b><span>câu còn hôm nay cho Bi-a và Tiệm Ngọc</span></div></div>
      <p class="ghi">${sai.length?'Dạng câu sai đã vào lịch ôn: '+sai.map(d=>d.q.dang).join('; ')+'.':'Không có câu sai trong mẻ này.'} EXP, Thể lực và lịch ôn cộng theo lệnh chấm chung, giống Đảo và Đoàn.</p>
      <div class="hang-nut"><button class="nut-vang" data-di="chetac">Chế tác ngay</button><button class="nut-phu" data-di="tiem">Về tiệm</button></div></div>`;}
  return `<section class="man man-khay">
    <div class="khay-dau"><button class="nut-chu" data-di="tiem">‹ Về tiệm</button><h2>Mẻ đá ${me.lan}</h2><span class="chip">Đã mở ${mo}/${me.da.length} viên</span></div>
    ${ket}
    ${me.lan>1?'<p class="ghi">Bản vẽ chỉ có 6 câu mẫu nên dùng lại. Câu em vừa sai quay lại ngay thành đá nứt để thầy xem; app thật để sang ngày sau.</p>':''}
    <div class="khay">${me.da.map(daHTML).join('')}</div>
    <p class="ghi">Dáng đá cho biết loại câu: tròn là Trắc nghiệm, vuông là Đúng–sai, giọt nước là Trả lời ngắn. Đá to hơn là câu khó hơn: Nhỏ là Nhận biết, Vừa là Thông hiểu, Lớn là Vận dụng. Đá Mẹ ở cuối mẻ mở ra Ngọc Tâm, viên phải có để làm vòng cổ.</p>
  </section>`;

/* ---------- Tấm câu hỏi ---------- */
let CAU_DANG=null;
function moCau(i){
  const da=S.me&&S.me.da[i];if(!da||da.tt!=='chua')return;
  const q=da.q,tg=THOI[q.phan],goiY=q.vai==='on_lai'&&q.goiY;
  AM.moCau();
  CAU_DANG={i,da,tl:q.phan===2?[null,null,null,null]:(q.phan===1?null:''),han:performance.now()+tg*1000,tong:tg,con:tg,hen:null};
  let than='';
  if(q.phan===1)than=q.pa.map((p,j)=>{const g=goiY&&q.goiY.includes(j);return `<button class="pa${g?' gach':''}" data-pa="${j}" aria-pressed="false"${g?' disabled':''}><span class="chu-cai">${'ABCD'[j]}</span><span>${p}</span></button>`;}).join('');
  if(q.phan===2)than=q.y.map((y,j)=>`<div class="y"><p><b>${'abcd'[j]})</b> ${y.t}</p><div class="y-chon" role="group" aria-label="Ý ${'abcd'[j]}"><button class="d" data-yi="${j}" data-v="1" aria-pressed="false">Đúng</button><button class="s" data-yi="${j}" data-v="0" aria-pressed="false">Sai</button></div></div>`).join('');
  if(q.phan===3)than=`<div class="o-nhap"><label for="dapSo">Đáp số · ${q.dv}</label><input id="dapSo" inputmode="decimal" autocomplete="off" placeholder="Ví dụ: 12,5"><p class="ghi">Viết số, dùng dấu phẩy cho phần thập phân.</p></div>`;
  const phu=$('#phuCau');
  phu.innerHTML=`<div class="phu-nen"></div><div class="tam" role="dialog" aria-modal="true" aria-labelledby="cauDang">
    <div class="tam-dau"><div class="hang-chip-nho"><span class="chip">${PHAN[q.phan]} · ${MUC[q.muc]}</span>${q.me?'<span class="chip tim">Đá Mẹ</span>':''}${q.vai==='on_lai'?'<span class="chip vang">Câu em từng sai</span>':''}</div>
      <h3 class="tieu-tam" id="cauDang">${q.dang}</h3>
      <div class="gio" id="gio"><div class="thanh-tien"><i id="gioThanh" style="--w:100%"></i></div><b id="gioChu">Còn ${mmss(tg)}</b></div></div>
    <div class="tam-than"><p class="de">${q.de}</p>${goiY?'<p class="goi-y">Gợi ý: đã gạch 2 phương án sai, vì câu này em đã sai 2 lần.</p>':''}${than}</div>
    <div class="tam-chan"><button class="nut-vang rong" id="chot" disabled>Chốt đáp án</button></div></div>`;
  phu.hidden=false;
  CAU_DANG.hen=setInterval(demGio,250);
  const f=phu.querySelector('.pa:not(:disabled),.y-chon button,#dapSo');if(f)f.focus({preventScroll:true});
}
function demGio(){
  const c=CAU_DANG;if(!c)return;
  const con=Math.max(0,Math.ceil((c.han-performance.now())/1000));
  if(con!==c.con){c.con=con;if(con<=10&&con>0)AM.tick();}
  const t=$('#gioThanh');if(t)t.style.setProperty('--w',(con/c.tong*100)+'%');
  const b=$('#gioChu');if(b)b.textContent='Còn '+mmss(con);
  const g=$('#gio');if(g)g.classList.toggle('gap',con<=10);
  if(con<=0)chot(true);
}
function chonPa(j){const c=CAU_DANG;if(!c)return;c.tl=j;$$('#phuCau .pa').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.pa===j)));$('#chot').disabled=false;AM.cham();}
function chonY(j,v){const c=CAU_DANG;if(!c)return;c.tl[j]=v;$$(`#phuCau [data-yi="${j}"]`).forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.v==='1')===v)));$('#chot').disabled=c.tl.some(x=>x===null);AM.cham();}
function chot(hetGio){
  const c=CAU_DANG;if(!c)return;clearInterval(c.hen);CAU_DANG=null;
  const q=c.da.q;let dung=false,soY=0;
  if(!hetGio){
    if(q.phan===1)dung=c.tl===q.dung;
    if(q.phan===2){soY=c.tl.filter((v,j)=>v===q.y[j].d).length;dung=soY===4;}
    if(q.phan===3){const v=parseFloat(String(c.tl).replace(',','.').trim());dung=Math.abs(v-q.dap)<1e-6;}
  }else if(q.phan===2)soY=c.tl.filter((v,j)=>v===q.y[j].d).length;
  Object.assign(c.da,{tt:dung?'dung':'sai',tl:c.tl,hetGio,soY});
  if(dung){SAI_TRUOC.delete(q.id);capNgoc(c.da);}else SAI_TRUOC.add(q.id);

function capNgoc(da){
  const q=da.q,g={loai:q.loai,co:COQ[q.muc],cat:CAT[q.phan],cv:q.vai==='on_lai',tam:!!q.me},k=khoa(g);
  S.kho[k]=(S.kho[k]||0)+1;
  const o=[`${g.loai}|${g.co}`];if(g.cv)o.push(`${g.loai}|cv`);
  da.moi=o.filter(x=>!S.so.has(x)).map(x=>x.split('|')[1]);
  da.laiMoi=![1,2,3,'cv'].some(x=>S.so.has(`${g.loai}|${x}`));
  o.forEach(x=>S.so.add(x));da.ngoc=k;
}

}

      <p class="ghi">Tên chọn từ danh sách có sẵn, không gõ tự do, vì bạn cùng lớp sẽ thấy tên này ở Phố Ngọc.</p></div>

}
function baoLuat(t){S.ct.tb=t;AM.loi();ve();}
function datNgoc(k){
  const ct=S.ct,K=KHUON[ct.khuon],g=tach(k);
  if((S.kho[k]||0)-daGan(k)<=0)return baoLuat('Viên này đã gắn hết.');

    if(g.tam){if(ct.o[0])return baoLuat('Ô giữa đã có Ngọc Tâm.');ct.o[0]=k;}
    else{const i=ct.o.findIndex((v,j)=>j>0&&!v);if(i<0)return baoLuat('Bốn ô bên đã đủ.');ct.o[i]=k;}
  }else{
    const i=ct.o.findIndex(v=>!v);if(i<0)return baoLuat(`${K.ten} đã đủ ${K.so} viên.`);
    if(ct.khuon==='khuyen'){const c=ct.o.find(Boolean);if(c&&tach(c).loai!==g.loai)return baoLuat('Khuyên tai cần 2 viên cùng loại.');}
    ct.o[i]=k;
  }
  ct.tb='';AM.dat();ve();
}
function xongMon(){
  const ct=S.ct;if(ct.o.some(v=>!v))return;
  const mon={khuon:ct.khuon,ngoc:ct.o.slice(),ten:`${T1[ct.t1]} ${T2[ct.t2]}`};

/* ---------- Thẻ ảnh ---------- */
function taiAnh(svg){return new Promise((ok,loi)=>{const u=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})),im=new Image();im.onload=()=>{ok(im);URL.revokeObjectURL(u);};im.onerror=loi;im.src=u;});}
function veDong(x,t,cx,y,maxW,lh,maxL=2){
  const tu=t.split(' '),dong=[];let d='';
  tu.forEach(w=>{const th=d?d+' '+w:w;if(x.measureText(th).width>maxW&&d){dong.push(d);d=w;}else d=th;});if(d)dong.push(d);
  dong.slice(0,maxL).forEach((l,i)=>{let s=l;if(i===maxL-1&&dong.length>maxL){while(x.measureText(s+'…').width>maxW&&s.length)s=s.slice(0,-1);s+='…';}x.fillText(s,cx,y+i*lh);});
}
function hoa(x,cx,cy,r){x.save();x.translate(cx,cy);x.fillStyle='#FF9DC4';for(let i=0;i<5;i++){x.rotate(Math.PI*2/5);x.beginPath();x.ellipse(0,-r*.62,r*.36,r*.6,0,0,Math.PI*2);x.fill();}x.fillStyle='#FFDA7A';x.beginPath();x.arc(0,0,r*.28,0,Math.PI*2);x.fill();x.restore();}
let LUOT_ANH=0;
async function veTheAnh(cv,mon,khung){
  const luot=++LUOT_ANH,W=1080,H=1350,x=cv.getContext('2d');
  try{await Promise.all([document.fonts.load("italic 700 80px 'Cormorant Garamond'"),document.fonts.load("600 30px 'Be Vietnam Pro'"),document.fonts.load("800 46px 'Baloo 2'")]);}catch(e){}
  let img=null;try{img=await taiAnh(monSVG(mon.khuon,mon.ngoc,{oTrong:false,rong:900,cao:720}));}catch(e){}
  if(luot!==LUOT_ANH)return;
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#FFEAF5');g.addColorStop(.5,'#F1E7FF');g.addColorStop(1,'#E3F3FF');x.fillStyle=g;x.fillRect(0,0,W,H);
  const r=x.createRadialGradient(W/2,560,40,W/2,560,620);r.addColorStop(0,'rgba(255,255,255,.95)');r.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=r;x.fillRect(0,0,W,H);
  const rs=rng(11);['#FFB6D6','#D9C2FF','#A9DDFF','#FFE08A','#A8F0D8'].forEach((c,i)=>{for(let j=0;j<7;j++){x.fillStyle=c;veSao(x,80+rs()*920,90+rs()*1170,4+rs()*7);}});
  const top=khung==='2010'?200:150;
  if(khung==='2010'){x.strokeStyle='#FF7EB6';x.lineWidth=6;x.strokeRect(40,40,W-80,H-80);x.strokeStyle='#FFDA7A';x.lineWidth=2;x.strokeRect(58,58,W-116,H-116);
    [[70,70],[W-70,70],[70,H-70],[W-70,H-70]].forEach(([a,b])=>hoa(x,a,b,34));
    x.textAlign='center';x.fillStyle='#E0529C';x.font="800 50px 'Baloo 2', sans-serif";x.fillText('Mừng 20/10',W/2,140);}
  else{const hg=x.createLinearGradient(0,0,W,H);['#FF7EB6','#C08CFF','#79C8FF','#7EF0D0','#FFE08A'].forEach((c,i)=>hg.addColorStop(i/4,c));x.strokeStyle=hg;x.lineWidth=7;x.strokeRect(44,44,W-88,H-88);x.fillStyle='#F5B640';[[44,44],[W-44,44],[44,H-44],[W-44,H-44]].forEach(([a,b])=>{x.save();x.translate(a,b);x.rotate(Math.PI/4);x.fillRect(-10,-10,20,20);x.restore();});}
  if(img)x.drawImage(img,90,top,900,720);
  x.textAlign='center';const tg=x.createLinearGradient(200,0,W-200,0);tg.addColorStop(0,'#E8408C');tg.addColorStop(1,'#8E45E6');x.fillStyle=tg;x.font="italic 700 84px 'Cormorant Garamond', Georgia, serif";x.fillText(tenMon(mon),W/2,top+830);
  const dem={};mon.ngoc.forEach(k=>{const t=LM[tach(k).loai].ten;dem[t]=(dem[t]||0)+1;});
  x.font="600 30px 'Be Vietnam Pro', sans-serif";x.fillStyle='#3B2A5C';veDong(x,Object.entries(dem).map(([t,n])=>n>1?`${t} ×${n}`:t).join(' · '),W/2,top+892,900,42);
  x.font="500 26px 'Be Vietnam Pro', sans-serif";x.fillStyle='#6E5A8E';veDong(x,[...new Set(mon.ngoc.map(k=>uni(LM[tach(k).loai].ct)))].join(' · '),W/2,top+980,920,38);
  x.font="600 26px 'Be Vietnam Pro', sans-serif";x.fillStyle='#7A6898';x.fillText('Tiệm của em: Sương Mai · Tiệm Ngọc Lưu Ly',W/2,H-78);
}
function moTheAnh(mon,moi){
  const phu=$('#phuAnh');
  phu.innerHTML=`<div class="phu-nen" data-dong></div><div class="tam" role="dialog" aria-modal="true" aria-labelledby="anhTen">
    <div class="tam-dau"><h3 class="tieu-tam" id="anhTen">${moi?'Món mới đã vào '+(mon.oTu?'Tủ trưng bày':'kho món'):'Thẻ ảnh'}</h3><p class="ghi">${tenMon(mon)}</p></div>
    <div class="tam-than"><div class="khung-anh"><canvas id="cvAnh" width="1080" height="1350" role="img" aria-label="Thẻ ảnh ${tenMon(mon)}"></canvas></div>
      <div class="hang-chip" role="group" aria-label="Khung ảnh"><button data-khung-anh="thuong" aria-pressed="true">Khung thường</button><button data-khung-anh="2010" aria-pressed="false">Khung Mừng 20/10</button></div>
      <p class="ghi" style="margin-top:8px">Ảnh 1080 × 1350, không có tên thật, lớp hay điểm. App thật có nút Lưu ảnh; bản vẽ này chỉ xem trước.</p></div>
    <div class="tam-chan"><button class="nut-vang rong" data-dong>${moi?'Làm món khác':'Đóng'}</button></div></div>`;
  phu.hidden=false;phu._mon=mon;veTheAnh($('#cvAnh'),mon,'thuong');
}

/* ---------- Vẽ chung ---------- */
function veCotPhai(){
  $('#cotPhai').innerHTML=`<div class="the"><h3 class="tieu-nho">Hộp ngọc <span>${soVien()} viên</span></h3><div class="hop">${hopHTML()}</div><p class="ghi">${S.man==='chetac'?'Chạm một viên để gắn vào món.':'Chạm một viên để xem trong Sổ Ngọc.'}</p></div>`;
}
function ve(){
  const than=$('#than'),doi=than.dataset.man!==S.man;than.dataset.man=S.man;
  if(S.man==='khay'&&!S.me)S.man='tiem';
  than.innerHTML=S.man==='khay'?veKhay():S.man==='chetac'?veCheTac():S.man==='so'?veSo():S.man==='pho'?vePho():veTiem();
  if(doi)than.scrollTop=0;
  const cur=S.man==='khay'?'tiem':S.man;
  $$('.dieu-huong [data-man]').forEach(b=>{if(b.dataset.man===cur)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  if($('#app').dataset.bo==='may')veCotPhai();
}
function dongPhu(el){if(!el)return;el.hidden=true;el.innerHTML='';}
function veNutAm(){
  const a=$('#nutAm'),n=$('#nutNhac');
  a.innerHTML=AM.tat?IC.amTat:IC.am;a.setAttribute('aria-pressed',String(!AM.tat));a.setAttribute('aria-label','Âm thanh: '+(AM.tat?'đang tắt':'đang bật'));
  n.innerHTML=IC.nhac;n.setAttribute('aria-pressed',String(AM.nhac));n.setAttribute('aria-label','Nhạc hộp nhạc: '+(AM.nhac?'đang bật':'đang tắt'));n.disabled=AM.tat;
}

/* ---------- Sự kiện ---------- */
const app=$('#app');
app.addEventListener('click',e=>{
  if(MO&&!MO.xong&&e.target.closest('#phuMo')){boQua();return;}
  const b=e.target.closest('button');
  if(!b){const d=e.target.closest('[data-dong]');if(d)dongPhu(d.closest('.phu'));return;}
  const d=b.dataset;
  if(d.man){AM.cham();S.man=d.man;ve();return;}
  if(b.id==='nutMe'){moMe();return;}
  if(b.classList.contains('da')&&d.i!=null){moCau(+d.i);return;}
  if(d.di){S.man=d.di;ve();return;}
  if(d.khuon){S.ct.khuon=d.khuon;S.ct.o=Array(KHUON[d.khuon].so).fill(null);S.ct.tb='';AM.cham();ve();return;}
  if(d.khoa){if(S.man==='chetac')datNgoc(d.khoa);else moChiTiet(tach(d.khoa).loai);return;}
  if(b.classList.contains('chip-gan')){S.ct.o[+d.o]=null;S.ct.tb='';AM.cham();ve();return;}
  if(d.t1!=null||d.t2!=null){
    if(d.t1!=null)S.ct.t1=+d.t1;else S.ct.t2=+d.t2;
    $$('[data-t1]').forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.t1===S.ct.t1)));
    $$('[data-t2]').forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.t2===S.ct.t2)));
    $('#tenMon').textContent=`${KHUON[S.ct.khuon].ten} ${T1[S.ct.t1]} ${T2[S.ct.t2]}`;AM.cham();return;}
  if(b.id==='xongMon'){xongMon();return;}
  if(d.loai){moChiTiet(d.loai);return;}
  if(d.tu!=null){moTheAnh(S.tu[+d.tu],false);return;}
  if(b.id==='nutAm'){AM.datTat(!AM.tat);if(!AM.tat)AM.cham();veNutAm();return;}
  if(b.id==='nutNhac'){if(AM.nhac)AM.dungNhac();else AM.batNhac();veNutAm();return;}
  if(d.pa!=null){chonPa(+d.pa);return;}
  if(d.yi!=null){chonY(+d.yi,d.v==='1');return;}
  if(b.id==='chot'){chot(false);return;}
  if(b.id==='catNgoc'||b.id==='daDoc'){dongMo();return;}
  if(d.khungAnh){$$('[data-khung-anh]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const p=$('#phuAnh');veTheAnh($('#cvAnh'),p._mon,d.khungAnh);return;}
  if(d.dong!=null){dongPhu(b.closest('.phu'));return;}
});
app.addEventListener('input',e=>{if(e.target.id==='dapSo'&&CAU_DANG){CAU_DANG.tl=e.target.value;$('#chot').disabled=!/^\s*-?\d+([.,]\d+)?\s*$/.test(e.target.value);}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='dapSo'&&!$('#chot').disabled){e.preventDefault();chot(false);}});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(!$('#phuAnh').hidden)dongPhu($('#phuAnh'));else if(!$('#phuSo').hidden)dongPhu($('#phuSo'));else if(MO&&!MO.xong)boQua();
});

/* ---------- Khung xem thử ---------- */
const KHUNG={doc:[390,844],ngang:[844,390],may:[1280,780]};
let khungChon=kho.get('tiem-ngoc-khung');if(!KHUNG[khungChon])khungChon='doc';
function datKhung(){
  const san=$('#san'),kh=$('#khung'),W=san.clientWidth,H=san.clientHeight;
  let w,h,k=1;const day=window.innerWidth<720||window.innerHeight<500;
  if(day){w=W;h=H;}else{[w,h]=KHUNG[khungChon];k=Math.min(1,W/w,H/h);}
  kh.style.width=w+'px';kh.style.height=h+'px';kh.style.transform=`scale(${k})`;
  kh.style.left=Math.max(0,(W-w*k)/2)+'px';kh.style.top=Math.max(0,(H-h*k)/2)+'px';
  kh.classList.toggle('day',day);
  const bo=w<600?(h>=w?'doc':'ngang'):(h<520?'ngang':(w>=980?'may':'doc'));
  const cu=app.dataset.bo;app.dataset.bo=bo;
  $$('.bv-khung button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.khung===khungChon)));
  if(cu!==bo)ve();
}
$$('.bv-khung button').forEach(b=>b.addEventListener('click',()=>{khungChon=b.dataset.khung;kho.set('tiem-ngoc-khung',khungChon);datKhung();}));
$('#bvLai').addEventListener('click',()=>{
  if(CAU_DANG){clearInterval(CAU_DANG.hen);CAU_DANG=null;}
  if(MO){MO.hen.forEach(clearTimeout);MO=null;}
  ['#phuCau','#phuSo','#phuAnh','#phuMo'].forEach(s=>dongPhu($(s)));
  S=S0();SAI_TRUOC.clear();ve();
});
window.addEventListener('resize',datKhung);

/* ---------- Khởi động ---------- */
$$('[data-ic]').forEach(s=>{s.outerHTML=IC[s.dataset.ic];});
(()=>{const r=rng(99),m=['#FFFFFF','#FFB6D6','#D9C2FF','#A9DDFF','#FFE08A'];let h='';for(let i=0;i<22;i++){const w=(6+r()*10).toFixed(0);h+=`<i style="left:${(r()*96).toFixed(1)}%;top:${(r()*96).toFixed(1)}%;width:${w}px;height:${w}px;--c:${m[i%5]};--t:${(2.4+r()*2.6).toFixed(2)}s;--tre:${(r()*4).toFixed(2)}s"></i>`;}$('#lungLinh').innerHTML=h;})();
veNutAm();ve();datKhung();

})();
</script>
