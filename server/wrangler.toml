# Lệnh thầy chạy MỘT LẦN để dựng (xem MAY-CHU-MOI.md mục 10):
#
#   npm i -D wrangler
#   npx wrangler login
#   npx wrangler d1 create omr
#       → chép database_id máy in ra, dán vào dưới
#   npx wrangler r2 bucket create omr-de
#   npx wrangler d1 execute omr --file=server/schema.sql --remote
#   npx wrangler secret put MA_BI_MAT        # gõ đúng mã bí mật Apps Script
#   npx wrangler deploy
#
# MA_BI_MAT KHÔNG bao giờ nằm trong file này. `wrangler secret` giữ nó ở
# Cloudflare, không vào git.

name = "omr"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Giữ tên miền workers.dev đang chạy. PHẢI đứng ở phần gốc — đặt sau một
# header [[...]] là TOML hiểu nó thuộc bảng đó và wrangler cảnh báo
# "Unexpected fields found in r2_buckets[0]".
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "omr"
database_id = "d2e6d322-374a-45d7-83a3-9fac486b23f1"

[[r2_buckets]]
binding = "DE"
bucket_name = "omr-de"

