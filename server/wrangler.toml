# Lệnh thầy chạy MỘT LẦN để dựng (xem MAY-CHU-MOI.md mục 10):
#
#   npx wrangler login
#   npx wrangler d1 create omr
#   npx wrangler r2 bucket create omr-de
#   npx wrangler d1 execute omr --file=server/schema.sql --remote
#   npx wrangler secret put MA_BI_MAT        # gõ đúng mã bí mật Apps Script
#   npx wrangler deploy
#
# MA_BI_MAT KHÔNG bao giờ nằm trong file này. `wrangler secret` giữ nó ở
# Cloudflare, không vào git.
#
# FILE NÀY PHẢI KHỚP CẤU HÌNH ĐANG CHẠY TRÊN DASHBOARD.
# `wrangler deploy` GHI ĐÈ cấu hình trên máy chủ bằng file này — thiếu một khoá
# là lặng lẽ tắt mất thứ đang bật. Ngày 11/09 suýt tắt Workers Logs đúng chiều
# ca thi đầu tiên vì file thiếu khối `observability`.

name = "omr"
main = "src/index.ts"
compatibility_date = "2026-09-11"

# Giữ tên miền workers.dev đang chạy. PHẢI đứng ở phần gốc — đặt sau một header
# [[...]] là TOML hiểu nó thuộc bảng đó ("Unexpected fields found in
# r2_buckets[0]").
workers_dev = true

# Không mở thêm địa chỉ công khai nào cho máy chủ thi.
preview_urls = false

# VỊ TRÍ CHẠY (Boss 22/09, tốc độ tối đa): `wrangler d1 info omr` cho biết D1 đang chạy ở "APAC" (colo Hong Kong —
# khớp ghi chú cũ trong kho). "smart" để Cloudflare TỰ chọn colo gần D1 nhất cho MỖI yêu cầu (không phải cố định một
# vùng) — an toàn với học sinh gọi từ nhiều nơi trong nước, không phải chọn tay một vùng cụ thể (wrangler.toml không
# có tuỳ chọn "gợi ý vùng" riêng, chỉ có mode). CHƯA có hiệu lực tới khi `wrangler deploy` (cần lời thầy mỗi lượt).
[placement]
mode = "smart"

# Workers AI (27/10, thầy: «soạn luôn bằng mọi cách ko chờ gemini»): máy soạn lời giải sơ đồ dùng khi Gemini hết hạn mức (server/src/soan-so-do.ts).
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "omr"
database_id = "d2e6d322-374a-45d7-83a3-9fac486b23f1"

# Bi-a Phản Ứng GĐ2: phòng đấu online — mỗi bàn một Durable Object lớp SQLite (gói miễn phí dùng được), WebSocket Hibernation.
[[durable_objects.bindings]]
name = "BAN_BIA"
class_name = "BanBiA"

# Trạm gọi Gemini (14/10, server/src/tram-gemini.ts): Durable Object ghim châu Đại Dương (locationHint "oc") — chỉ dùng khi Google
# chặn vị trí trạm Worker đang chạy (placement "smart" kéo Worker về sát D1 ở Hồng Kông, Gemini không phục vụ Hồng Kông).
[[durable_objects.bindings]]
name = "TRAM_GEMINI"
class_name = "TramGemini"

# Ngăn riêng từng học sinh (30/10, server/src/ngan-hoc-sinh.ts): mọi lệnh app học sinh của một em vào CÙNG một Durable Object (idFromName(sbd)) ⇒
# đệm của em luôn ấm, D1 chỉ còn phần thật sự đổi (30/10 21:40: lệnh rải ≥ 200 isolate, đệm gần như không trúng ⇒ D1 nghẽn).
[[durable_objects.bindings]]
name = "NGAN_HS"
class_name = "NganHocSinh"

# Đấu Nguyên Tử (30/10, server/src/phong-dau-ion.ts): phòng đấu bắn nhau của phòng chờ thi — MỘT Durable Object mỗi ca (idFromName `dau-ion:<mã ca>`),
# WebSocket Hibernation, lớp SQLite (gói nào cũng dùng được), 0 lệnh D1. Tắt nhanh: biến/secret `TAT_DAU_ION` (xem docs/dac-ta-game-ban-sung-3010.md).
[[durable_objects.bindings]]
name = "PHONG_DAU_ION"
class_name = "PhongDauIon"

# Ngăn gom D1 liên isolate (31/10, server/src/gom-lien-ngan.ts): gộp lô của nhiều isolate thành MỘT lượt gửi D1 (trần D1 là số lượt gửi).
# Chỉ dùng khi biến BAT_GOM_LIEN_NGAN bật; không lưu gì.
[[durable_objects.bindings]]
name = "GOM_D1"
class_name = "NganGomD1"

[[migrations]]
tag = "bia-v1"
new_sqlite_classes = ["BanBiA"]

[[migrations]]
tag = "tram-gemini-v1"
new_sqlite_classes = ["TramGemini"]

[[migrations]]
tag = "ngan-hs-v1"
new_sqlite_classes = ["NganHocSinh"]

[[migrations]]
tag = "dau-ion-v1"
new_sqlite_classes = ["PhongDauIon"]

[[migrations]]
tag = "gom-d1-v1"
new_sqlite_classes = ["NganGomD1"]

[[r2_buckets]]
binding = "DE"
bucket_name = "omr-de"

# NHẬT KÝ MÁY CHỦ — đang BẬT trên dashboard, giữ nguyên. Đây là nhật ký lượt gọi
# phía máy chủ để thầy soi khi có sự cố, KHÔNG phải đo đạc hành vi học sinh.
[observability]
enabled = true

[observability.logs]
enabled = true

# Bảng tin phụ huynh: 00:01 giờ Việt Nam hằng ngày.
[triggers]
crons = ["1 17 * * *", "* * * * *"]
